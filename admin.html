<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel – BloxVerse</title>
  <link rel="icon" type="image/svg+xml" href="/bloxverse/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #111;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #1c1c1c;
      border-bottom: 1px solid #2a2a2a;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    header .badge {
      background: #c0392b;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    header .back { margin-left: auto; color: #888; font-size: 13px; text-decoration: none; }
    header .back:hover { color: #fff; }
    main {
      max-width: 860px;
      width: 100%;
      margin: 32px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .panel {
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 22px 24px;
    }
    .panel h2 { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
    input[type=text], input[type=search], select, textarea {
      width: 100%;
      background: #151515;
      border: 1px solid #333;
      border-radius: 5px;
      color: #e0e0e0;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: #555; }
    textarea { resize: vertical; min-height: 64px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 160px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 5px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-red   { background: #c0392b; color: #fff; }
    .btn-green { background: #27ae60; color: #fff; }
    .btn-blue  { background: #2980b9; color: #fff; }
    .btn-gray  { background: #333; color: #ccc; }
    .status {
      margin-top: 12px; padding: 10px 12px; border-radius: 5px;
      font-size: 13px; display: none;
    }
    .status.ok  { background: rgba(39,174,96,.2); color: #2ecc71; display: block; }
    .status.err { background: rgba(192,57,43,.2); color: #e74c3c; display: block; }
    .divider { border: none; border-top: 1px solid #2a2a2a; margin: 16px 0; }
    .tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 4px; font-size: 12px; font-weight: 600;
    }
    .tag.admin     { background: rgba(231,76,60,.18); color: #e74c3c; }
    .tag.mod       { background: rgba(52,152,219,.18); color: #3498db; }
    .tag.developer { background: rgba(155,89,182,.18); color: #9b59b6; }
    #loading { text-align:center; color:#555; padding: 48px; font-size:14px; }
  </style>
  <script type="module" crossorigin src="/bloxverse/assets/admin-D_mV5Cbd.js"></script>
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/modulepreload-polyfill-Ke7zwH0v.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/firebase-HvCPFqZQ.js">
</head>
<body>

<div id="loading">Checking access…</div>

<div id="adminRoot" style="display:none; flex-direction:column; height:100vh;">

  <header>
    <h1>BloxVerse Admin Panel</h1>
    <span class="badge">Admin Only</span>
    <a href="/bloxverse/" class="back">← Home</a>
  </header>

  <main>

    <!-- ── LOOKUP USER ──────────────────────────────────────────── -->
    <div class="panel">
      <h2>🔍 Look Up User</h2>
      <label>Username or User ID</label>
      <div class="row" style="align-items:flex-end;">
        <input type="search" id="lookupInput" placeholder="e.g. kasug  or  uid123abc" />
        <div style="flex:0;">
          <button class="btn btn-blue" id="btnLookup">Search</button>
        </div>
      </div>
      <div id="userCard" style="display:none; margin-top:16px; padding:14px; background:#151515; border-radius:6px; border:1px solid #2a2a2a;">
        <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap;">
          <div style="font-size:13px;">
            <div style="font-weight:700; font-size:15px; color:#fff;" id="ucName">—</div>
            <div style="color:#666; font-size:11px; margin-top:2px;" id="ucId">—</div>
          </div>
          <div id="ucRole" style="margin-left:auto;"></div>
          <div id="ucBanBadge"></div>
        </div>
      </div>
      <div class="status" id="lookupStatus"></div>
    </div>

    <!-- ── BAN / UNBAN ───────────────────────────────────────────── -->
    <div class="panel">
      <h2>🔨 Ban / Unban</h2>
      <p style="font-size:12px;color:#666;margin-bottom:14px;">Fill in the target user first using the lookup above, or paste a UID directly.</p>

      <label>Target User ID</label>
      <input type="text" id="banUid" placeholder="Paste UID here (auto-filled from lookup)" />

      <hr class="divider" />

      <div class="row">
        <div>
          <label>Reason</label>
          <!-- ── Easy preset reasons ── -->
          <select id="banReasonPreset">
            <option value="">— Choose preset —</option>
            <option value="Exploiting">Exploiting</option>
            <option value="Harassment">Harassment</option>
            <option value="Inappropriate Content">Inappropriate Content</option>
            <option value="Spamming">Spamming</option>
            <option value="Account Sharing / Compromised">Account Sharing / Compromised</option>
            <option value="Ban Evasion">Ban Evasion</option>
            <option value="Terms of Service Violation">Terms of Service Violation</option>
            <option value="Custom…">Custom…</option>
          </select>
          <input type="text" id="banReasonCustom" placeholder="Custom reason…" style="margin-top:6px; display:none;" />
        </div>
        <div>
          <label>Duration</label>
          <select id="banDuration">
            <option value="permanent">Permanent</option>
            <option value="1h">1 Hour</option>
            <option value="6h">6 Hours</option>
            <option value="1d">1 Day</option>
            <option value="3d">3 Days</option>
            <option value="7d">7 Days</option>
            <option value="30d">30 Days</option>
          </select>
        </div>
      </div>

      <div style="margin-top:12px;">
        <label>Extra Detail (optional)</label>
        <input type="text" id="banDetail" placeholder="e.g. Script name: SpeedHack v2" />
      </div>
      <div style="margin-top:12px;">
        <label>Moderator Note (optional — overrides default message)</label>
        <input type="text" id="banNote" placeholder="Leave blank to use default" />
      </div>

      <div class="row" style="margin-top:16px;">
        <button class="btn btn-red" id="btnBan">Ban User</button>
        <button class="btn btn-green" id="btnUnban">Unban User</button>
      </div>
      <div class="status" id="banStatus"></div>
    </div>

    <!-- ── ROLE MANAGEMENT ───────────────────────────────────────── -->
    <div class="panel">
      <h2>🛡️ Role Management</h2>
      <p style="font-size:12px;color:#666;margin-bottom:14px;">Grant or revoke staff roles. These appear as badges on profiles and the in-game leaderboard.</p>

      <label>Target User ID</label>
      <input type="text" id="roleUid" placeholder="Paste UID or auto-fill from lookup" />

      <div class="row" style="margin-top:12px; align-items:flex-end;">
        <div>
          <label>Role</label>
          <select id="roleSelect">
            <option value="developer">Developer</option>
            <option value="admin">Admin</option>
            <option value="mod">Moderator</option>
          </select>
        </div>
        <button class="btn btn-blue" id="btnGrantRole" style="flex:0; white-space:nowrap;">Grant Role</button>
        <button class="btn btn-gray" id="btnRevokeRole" style="flex:0; white-space:nowrap;">Revoke Role</button>
      </div>
      <div class="status" id="roleStatus"></div>
    </div>

  </main>
</div><!-- /adminRoot -->

</body>
</html>
