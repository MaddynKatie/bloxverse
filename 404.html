<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting…</title>
  <script>
    (function () {
      var base = '/bloxverse';
      var path = location.pathname;
      if (!path.startsWith(base)) {
        location.replace(base + '/' + location.search + location.hash);
        return;
      }
      var rest = path.slice(base.length).replace(/^\/+/, '').replace(/\/+$/, '');
      // Strip .html if someone navigated to a .html URL directly
      rest = rest.replace(/\.html$/, '');
      if (!rest || rest === 'index') {
        location.replace(base + '/' + location.search + location.hash);
        return;
      }
      if (!rest.includes('.')) {
        location.replace(base + '/' + rest + location.search + location.hash);
        return;
      }
      location.replace(base + '/' + location.search + location.hash);
    })();
  </script>

  <link rel="stylesheet" href="src/theme.css" />
  <script type="module" src="src/theme.js"></script>
</head>
<body></body>
</html>
