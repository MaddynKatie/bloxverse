<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse</title>
  <link rel="stylesheet" href="/src/main.css" />
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.reload()">
        <div class="logo-icon"></div>
        <span class="logo-text">BloxVerse</span>
      </div>
    </div>
    <div class="nav-center" id="navCenter"></div>
    <div class="nav-right" id="navRight">
      <button class="login-btn" onclick="window.location.href='./auth.html'">Login / Sign Up</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Friends Section (only when logged in) -->
    <section class="game-section" id="friendsSection" style="display:none;">
      <h2>Friends</h2>
      <div id="friendRequests"></div>
      <div class="friends-grid" id="friendsGrid"></div>
    </section>

    <!-- Games Section -->
    <section class="game-section">
      <h2>Games</h2>
      <div class="game-grid" id="gameGrid"></div>
    </section>
  </main>

  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-content">
      <div class="logo-large"></div>
      <h2 id="loadingTitle">Loading...</h2>
      <div class="loading-bar">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { games } from './src/games.js';
    import { auth, db, trackPresence, listenBux, getBux } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc, collection, getDocs, query, where } from 'firebase/firestore';
    import { searchUsers, sendFriendRequest, acceptFriendRequest, declineFriendRequest, removeFriend, getFriendRequests, getFriends } from './src/friends.js';

    const navCenter = document.getElementById('navCenter');
    const navRight = document.getElementById('navRight');
    const grid = document.getElementById('gameGrid');
    const friendsSection = document.getElementById('friendsSection');
    const friendsGrid = document.getElementById('friendsGrid');
    const friendRequestsEl = document.getElementById('friendRequests');

    function renderGame(game) {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.onclick = () => launchGame(game.id);
      card.innerHTML = `
        <div class="game-thumbnail">
          <img src="${game.icon}" alt="${game.name}" />
          <div class="play-overlay">
            <div class="play-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </div>
          </div>
        </div>
        <div class="game-info">
          <h3>${game.name}</h3>
        </div>
      `;
      grid.appendChild(card);
    }

    games.forEach(renderGame);

    function launchGame(gameId) {
      const loadingScreen = document.getElementById('loadingScreen');
      const loadingBar = document.getElementById('loadingBarFill');
      const loadingTitle = document.getElementById('loadingTitle');

      const game = games.find(g => g.id === gameId);
      loadingTitle.textContent = 'Loading ' + (game?.name || 'experience') + '...';
      loadingScreen.style.display = 'flex';

      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          window.location.href = './game.html?game=' + gameId;
        }
        loadingBar.style.width = progress + '%';
      }, 200);
    }

    window.launchGame = launchGame;

    let currentUserId = null;
    let sentRequests = new Set();
    let buxUnsub = null;
    let presence = null;
    let activeDropdown = null;

    function renderFriendSearch() {
      return `
        <div class="friend-search-wrapper">
          <div class="friend-search-bar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input type="text" id="friendSearchInput" placeholder="Search players" autocomplete="off" />
          </div>
        </div>
      `;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement?.id !== 'friendSearchInput') {
        e.preventDefault();
        document.getElementById('friendSearchInput')?.focus();
      }
      if (e.key === 'Enter' && document.activeElement?.id === 'friendSearchInput') {
        const val = document.getElementById('friendSearchInput').value.trim();
        if (val.length >= 3) {
          window.location.href = `/search.html?q=${encodeURIComponent(val)}`;
        }
      }
    });

    async function onFriendSearch(e) {
      const val = e.target.value.trim();
      const resultsEl = document.getElementById('friendSearchResults');
      if (val.length < 3) { resultsEl.classList.remove('visible'); return; }

      const users = await searchUsers(val);
      if (users.length === 0) {
        resultsEl.innerHTML = '<div style="padding:12px;color:#8a8c8e;font-size:13px;">No players found</div>';
      } else {
        resultsEl.innerHTML = users.map(u => `
          <div class="search-result-item">
            <div class="search-user-info">
              <div class="search-avatar">${u.username.charAt(0).toUpperCase()}</div>
              <span class="search-username">${u.username}</span>
            </div>
            ${u.id === currentUserId ? '' : (sentRequests.has(u.id) ? '<span class="add-friend-btn sent">Sent</span>' : `<button class="add-friend-btn" onclick="window._addFriend('${u.id}','${u.username}',this)">+ Add</button>`)}
          </div>
        `).join('');
      }
      resultsEl.classList.add('visible');
    }

    async function _addFriend(targetId, targetUsername, btn) {
      try {
        await sendFriendRequest(currentUserId, targetId, targetUsername);
        sentRequests.add(targetId);
        btn.textContent = 'Sent';
        btn.classList.add('sent');
        btn.onclick = null;
      } catch (e) {
        console.error(e);
      }
    }
    window._addFriend = _addFriend;

    async function getUserStatus(userId) {
      try {
        const pDoc = await getDoc(doc(db, 'presence', userId));
        if (pDoc.exists()) {
          const p = pDoc.data();
          if (p.inGame) return 'in-game';
          if (p.online) return 'online';
        }
      } catch {}
      return 'offline';
    }

    async function getFriendsWithStatus(friends) {
      const statuses = await Promise.all(friends.map(f => getUserStatus(f.id)));
      return friends.map((f, i) => ({ ...f, status: statuses[i] }));
    }

    function statusLabel(status) {
      if (status === 'in-game') return 'In Game';
      if (status === 'online') return 'Online';
      return 'Offline';
    }

    function renderFriends(friendsWithStatus) {
      if (friendsWithStatus.length === 0) {
        friendsGrid.innerHTML = '<p style="color:#8a8c8e;font-size:13px;padding:8px 0;">No friends yet. Search players above to add friends!</p>';
        return;
      }
      friendsGrid.innerHTML = friendsWithStatus.map(f => `
                <div class="friend-card" onclick="window.location.href='./profile.html?user=${f.id}'" style="cursor:pointer;">
          <div class="avatar-with-status">
            <div class="friend-avatar">${f.username.charAt(0).toUpperCase()}</div>
            <div class="status-dot ${f.status}"></div>
          </div>
          <div class="friend-info">
            <div class="friend-name">${f.username}</div>
            <div class="friend-status ${f.status}">${statusLabel(f.status)}</div>
          </div>
          <div class="friend-actions" onclick="event.stopPropagation()">
            <button class="friend-action-btn" title="Remove Friend" onclick="window._removeFriend('${f.id}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    async function renderFriendRequestsList(requests) {
      if (requests.length === 0) {
        friendRequestsEl.innerHTML = '';
        return;
      }
      friendRequestsEl.innerHTML = '<div style="font-size:13px;color:#8a8c8e;margin-bottom:8px;">Friend Requests</div><div class="friend-requests">' +
        requests.map(r => `
          <div class="friend-request-card">
            <div class="search-avatar">${r.fromUsername?.charAt(0).toUpperCase() || '?'}</div>
            <span class="search-username">${r.fromUsername || 'Unknown'}</span>
            <div class="request-actions">
              <button class="request-accept-btn" onclick="window._acceptRequest('${r.id}','${r.from}','${r.to}')">Accept</button>
              <button class="request-decline-btn" onclick="window._declineRequest('${r.id}')">Decline</button>
            </div>
          </div>
        `).join('') + '</div>';
    }

    window._acceptRequest = async (reqId, fromId, toId) => {
      await acceptFriendRequest(reqId, fromId, toId);
      refreshFriends();
    };

    window._declineRequest = async (reqId) => {
      await declineFriendRequest(reqId);
      refreshFriends();
    };

    window._removeFriend = async (friendId) => {
      if (confirm('Remove this friend?')) {
        await removeFriend(currentUserId, friendId);
        refreshFriends();
      }
    };

    async function refreshFriends() {
      if (!currentUserId) return;
      const [friends, requests] = await Promise.all([
        getFriends(currentUserId),
        getFriendRequests(currentUserId),
      ]);

      const friendsWithStatus = await getFriendsWithStatus(friends);

      for (const r of requests) {
        try {
          const fromDoc = await getDoc(doc(db, 'users', r.from));
          r.fromUsername = fromDoc.exists() ? fromDoc.data().username : 'Unknown';
        } catch { r.fromUsername = 'Unknown'; }
      }

      renderFriends(friendsWithStatus);
      renderFriendRequestsList(requests);
    }

    function toggleDropdown(dropdown) {
      if (activeDropdown && activeDropdown !== dropdown) {
        activeDropdown.classList.remove('open');
      }
      dropdown.classList.toggle('open');
      activeDropdown = dropdown.classList.contains('open') ? dropdown : null;
    }

    onAuthStateChanged(auth, async (user) => {
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }
      if (presence) { presence.goOffline(); presence = null; }

      if (user) {
        currentUserId = user.uid;
        let username = user.displayName || 'Player';
        let bux = 0;

        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            username = data.username || username;
            bux = data.bux || 0;
          }
        } catch {}

        presence = trackPresence(user.uid);

        const initial = username.charAt(0).toUpperCase();

        navCenter.innerHTML = renderFriendSearch();
        document.getElementById('friendSearchInput').addEventListener('input', onFriendSearch);

        const buxElId = 'buxValue';
        navRight.innerHTML = `
          <div class="user-info">
            <button class="bux-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
              </svg>
              <span id="${buxElId}">${bux.toLocaleString()}</span>
            </button>
            <div class="avatar-dropdown" id="userDropdown">
              <div class="avatar-circle">${initial}</div>
              <div class="dropdown-menu">
                <div class="dropdown-header">
                  <span class="dropdown-name">${username}</span>
                  <span class="dropdown-email">${user.email}</span>
                </div>
                <button class="dropdown-item" onclick="window.location.href='./profile.html'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                  Profile
                </button>
                <button class="dropdown-item" onclick="window._logout()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                  </svg>
                  Log Out
                </button>
              </div>
            </div>
          </div>
        `;

        const avatarCircle = document.querySelector('#userDropdown .avatar-circle');
        const dropdown = document.getElementById('userDropdown');
        avatarCircle.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleDropdown(dropdown);
        });

        // Use a persistent listener for Bux updates, pass username/email to create complete doc if missing
        buxUnsub = listenBux(user.uid, (buxAmount) => {
          const buxEl = document.getElementById(buxElId);
          if (buxEl) {
            buxEl.textContent = buxAmount.toLocaleString();
          }
        }, username, user.email);

        friendsSection.style.display = 'block';
        refreshFriends();
      } else {
        currentUserId = null;
        navCenter.innerHTML = '';
        navRight.innerHTML = `<button class="login-btn" onclick="window.location.href='./auth.html'">Login / Sign Up</button>`;
        friendsSection.style.display = 'none';
        if (activeDropdown) { activeDropdown.classList.remove('open'); activeDropdown = null; }
      }
    });

    window._logout = async () => {
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }
      if (presence) { presence.goOffline(); presence = null; }
      await signOut(auth);
      window.location.href = './index.html';
    };

    document.addEventListener('click', (e) => {
      const results = document.getElementById('friendSearchResults');
      if (results && !e.target.closest('.friend-search-wrapper')) {
        results.classList.remove('visible');
      }
      if (activeDropdown && !activeDropdown.contains(e.target)) {
        activeDropdown.classList.remove('open');
        activeDropdown = null;
      }
    });
  </script>
</body>

</html>
