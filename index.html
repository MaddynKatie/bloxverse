<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

    <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse</title>
  <link rel="stylesheet" href="src/main.css" />
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.reload()">
        
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/create'">Create</button>
      </div>
    </div>
    <div class="nav-center" id="navCenter"></div>
    <div class="nav-right" id="navRight">
      <button class="login-btn" onclick="window.location.href='/bloxverse/auth'">Login / Sign Up</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Friends Section (only when logged in) -->
    <section class="game-section" id="friendsSection" style="display:none;">
      <h2>Friends</h2>
      <div id="friendRequests"></div>
      <div class="friends-grid" id="friendsGrid"></div>
    </section>

    <!-- Trending Section -->
    <section class="game-section">
      <h2>🔥 Trending</h2>
      <div class="game-grid" id="trendingGrid"></div>
    </section>

    <!-- Official Section -->
    <section class="game-section">
      <h2>Official</h2>
      <div class="game-grid" id="officialGrid"></div>
    </section>

    <!-- All Games Section -->
    <section class="game-section">
      <h2>Games</h2>
      <div class="game-grid" id="gameGrid"></div>
    </section>
  </main>

  <!-- Daily Reward Toast -->
  <div id="dailyRewardToast" class="daily-reward-toast">
    <span>+5 BUX</span> Daily Login Reward
  </div>

  <script type="module">
    import { games } from './src/games.js';
    import { auth, db, trackPresence, listenBux, getBux, checkBan, banGuard, claimDailyBux, assignUserIdNum, setBux, updateBux, logTransaction } from './src/firebase.js';
    import { sitePath } from './src/paths.js';

    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc, setDoc, updateDoc, collection, getDocs, query, where, onSnapshot, increment, limit } from 'firebase/firestore';
    import { searchUsers, sendFriendRequest, acceptFriendRequest, declineFriendRequest, removeFriend, getFriendRequests, getFriends } from './src/friends.js';

    const navCenter = document.getElementById('navCenter');
    const navRight = document.getElementById('navRight');
    const grid = document.getElementById('gameGrid');
    const friendsSection = document.getElementById('friendsSection');
    const friendsGrid = document.getElementById('friendsGrid');
    const friendRequestsEl = document.getElementById('friendRequests');

    function createGameCard(game) {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.dataset.gameId = game.id;
      card.onclick = () => window.location.href = '/bloxverse/game-detail?id=' + game.id;
      card.innerHTML = `
        <div class="game-thumbnail">
          <img src="${game.icon}" alt="${game.name}" />
          <div class="play-overlay">
            <div class="play-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z" />
              </svg>
            </div>
          </div>
          <div class="active-players-badge">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>${game.activePlayers || 0}</span>
          </div>
        </div>
        <div class="game-info">
          <h3>${game.name}</h3>
          <div style="font-size:11px;color:#6b6c6e;margin-top:2px;">${(game.visits || 0).toLocaleString()} visits</div>
        </div>
      `;
      return card;
    }

    function shuffleAndTake(arr, n) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy.slice(0, n);
    }

    async function loadGames() {
      const { loadGameStats, getPublishedGames } = await import('./src/games.js');
      await loadGameStats();
      const published = await getPublishedGames();
      const all = [...games, ...published.filter(g => !g.deleted)];
      const official = games.filter(g => g.official);

      const trendingGrid = document.getElementById('trendingGrid');
      const topGames = all.slice().sort((a, b) => (b.visits || 0) - (a.visits || 0));
      for (const g of shuffleAndTake(topGames, Math.min(6, all.length))) {
        trendingGrid.appendChild(createGameCard(g));
      }

      const officialGrid = document.getElementById('officialGrid');
      for (const g of official) {
        officialGrid.appendChild(createGameCard(g));
      }

      // Games: all games combined
      for (const g of all) {
        grid.appendChild(createGameCard(g));
      }

      // Also fetch authoritative visit counts from gameStats and update cards
      getDocs(collection(db, 'gameStats')).then(snap => {
        const stats = {};
        snap.forEach(d => { stats[d.id] = d.data(); });
        document.querySelectorAll('.game-card').forEach(card => {
          const gid = card.dataset.gameId;
          if (stats[gid]) {
            const el = card.querySelector('[style*="font-size:11px"]');
            if (el) el.textContent = (stats[gid].visits || 0).toLocaleString() + ' visits';
          }
        });
      }).catch(() => {});
    }
    loadGames().then(() => {
      // Real-time listener for game changes on all published game cards
      onSnapshot(collection(db, 'publishedGames'), (snap) => {
        snap.docChanges().forEach(change => {
          const data = change.doc.data();
          const gameId = change.doc.id;
          const isDeleted = data.deleted === true;
          document.querySelectorAll('.game-card').forEach(card => {
            if (card.dataset.gameId !== gameId) return;
            if (isDeleted) {
              card.style.opacity = '0.4';
              card.style.pointerEvents = 'none';
              const title = card.querySelector('h3');
              if (title) title.textContent = '[ Content Deleted ]';
              const visits = card.querySelector('[style*="font-size:11px"]');
              if (visits) visits.textContent = '0 visits';
              card.onclick = null;
            } else {
              // Recovered — restore card
              card.style.opacity = '';
              card.style.pointerEvents = '';
              const title = card.querySelector('h3');
              if (title) title.textContent = data.name || 'Untitled';
              const visits = card.querySelector('[style*="font-size:11px"]');
              // Fetch authoritative visit count from gameStats
              getDoc(doc(db, 'gameStats', gameId)).then(snap => {
                const v = snap.exists() ? (snap.data().visits || 0) : 0;
                if (visits) visits.textContent = v.toLocaleString() + ' visits';
              }).catch(() => {
                if (visits) visits.textContent = (data.visits || 0).toLocaleString() + ' visits';
              });
              const img = card.querySelector('.game-thumbnail img');
              if (img) img.src = data.icon || './assets/icons/demo.png';
              card.onclick = () => window.location.href = '/bloxverse/game-detail?id=' + gameId;
            }
          });
        });
      });
    });

    let currentUserId = null;
    let sentRequests = new Set();
    let buxUnsub = null;
    let presence = null;
    let activeDropdown = null;

    function renderFriendSearch() {
      return `
        <div class="friend-search-wrapper">
          <div class="friend-search-bar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input type="text" id="friendSearchInput" placeholder="Search players" autocomplete="off" />
          </div>
          <div id="friendSearchResults" class="friend-search-results"></div>
        </div>
      `;
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement?.id !== 'friendSearchInput') {
        e.preventDefault();
        document.getElementById('friendSearchInput')?.focus();
      }
      if (e.key === 'Enter' && document.activeElement?.id === 'friendSearchInput') {
        const val = document.getElementById('friendSearchInput').value.trim();
        if (val.length >= 3) {
          window.location.href = `/bloxverse/search?q=${encodeURIComponent(val)}`;
        }
      }
    });

    async function onFriendSearch(e) {
      const val = e.target.value.trim();
      const resultsEl = document.getElementById('friendSearchResults');
      if (val.length < 3) { resultsEl.classList.remove('visible'); return; }

      const users = await searchUsers(val);
      if (users.length === 0) {
        resultsEl.innerHTML = '<div style="padding:12px;color:#8a8c8e;font-size:13px;">No players found</div>';
      } else {
        resultsEl.innerHTML = users.map(u => `
          <div class="search-result-item">
            <div class="search-user-info">
              <div class="search-avatar">${u.username.charAt(0).toUpperCase()}</div>
              <span class="search-username">${u.username}</span>
            </div>
            ${u.id === currentUserId ? '' : (sentRequests.has(u.id) ? '<span class="add-friend-btn sent">Sent</span>' : `<button class="add-friend-btn" onclick="window._addFriend('${u.id}','${u.username}',this)">+ Add</button>`)}
          </div>
        `).join('');
      }
      resultsEl.classList.add('visible');
    }

    async function _addFriend(targetId, targetUsername, btn) {
      try {
        await sendFriendRequest(currentUserId, targetId, targetUsername);
        sentRequests.add(targetId);
        btn.textContent = 'Sent';
        btn.classList.add('sent');
        btn.onclick = null;
      } catch (e) {
        console.error(e);
      }
    }
    window._addFriend = _addFriend;

    const friendStatusUnsubs = new Map();

    function listenFriendStatus(friend) {
      if (friendStatusUnsubs.has(friend.id)) {
        friendStatusUnsubs.get(friend.id)();
      }
      const unsub = onSnapshot(doc(db, 'presence', friend.id), (snap) => {
        const idx = _friendsWithStatus.findIndex(f => f.id === friend.id);
        if (idx === -1) return;
        let status = 'offline';
        if (snap.exists()) {
          const p = snap.data();
          const lastSeen = p.lastSeen?.toMillis?.() ?? p.lastSeen;
          const twoMinAgo = Date.now() - 120000;
          if (lastSeen && lastSeen < twoMinAgo) status = 'offline';
          else if (p.inGame) status = 'in-game';
          else if (p.online) status = 'online';
        }
        _friendsWithStatus[idx].status = status;
        renderFriends(_friendsWithStatus);
      }, () => {});
      friendStatusUnsubs.set(friend.id, unsub);
    }

    function getStatusFromDoc(snap) {
      let status = 'offline';
      if (snap.exists()) {
        const p = snap.data();
        const lastSeen = p.lastSeen?.toMillis?.() ?? p.lastSeen;
        const twoMinAgo = Date.now() - 120000;
        if (lastSeen && lastSeen < twoMinAgo) status = 'offline';
        else if (p.inGame) status = 'in-game';
        else if (p.online) status = 'online';
      }
      return status;
    }

    async function getFriendsWithStatus(friends) {
      const statuses = await Promise.all(friends.map(async (f) => {
        try {
          const snap = await getDoc(doc(db, 'presence', f.id));
          return getStatusFromDoc(snap);
        } catch { return 'offline'; }
      }));
      return friends.map((f, i) => ({ ...f, status: statuses[i] }));
    }

    function getProfileLink(f) {
      return `/bloxverse/profile?user=${f.userIdNum}`;
    }

    function statusLabel(status) {
      if (status === 'in-game') return 'In Game';
      if (status === 'online') return 'Online';
      return 'Offline';
    }

    const _cb = Date.now();

    window.__handleBrokenAvatar = async function(imgEl, uid) {
      try {
        const initial = imgEl.getAttribute('data-initial') || 'U';
        const letter = document.createElement('div');
        if (imgEl.className && imgEl.className.includes('avatar-circle-img')) {
          letter.className = 'friend-thumb-avatar';
        } else {
          letter.className = 'friend-thumb-avatar';
        }
        letter.textContent = initial;
        imgEl.replaceWith(letter);
        // If broken avatar belongs to current user, clear so it can regenerate later
        try {
          if (auth && auth.currentUser && auth.currentUser.uid === uid) {
            await setDoc(doc(db, 'users', uid), { avatarPreview: null }, { merge: true });
            console.log('[Avatar] Cleared stale avatarPreview for current user to trigger regeneration');
          }
        } catch (e) { console.warn('Could not clear avatarPreview:', e); }
      } catch (e) { console.warn('Broken avatar handler error:', e); }
    };

    function renderFriends(friendsWithStatus) {
      const addBtn = `
        <div class="friend-thumb" onclick="window.location.href='/bloxverse/friends'" style="cursor:pointer;">
          <div class="friend-thumb-avatar add-friend-circle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          </div>
          <span class="friend-thumb-name" style="color:#00b06f;">Add Friends</span>
        </div>
      `;

      if (friendsWithStatus.length === 0) {
        friendsGrid.innerHTML = addBtn;
        return;
      }
      friendsGrid.innerHTML = addBtn + friendsWithStatus.map(f => `
        <div class="friend-thumb" onclick="window.location.href='${getProfileLink(f)}'" style="cursor:pointer;">
          <div class="avatar-with-status">
            ${f.avatarPreview ? `<div style="width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,0.1);background:#1a1d2e;"><img src="${f.avatarPreview}?_cb=${_cb}" alt="" data-initial="${(f.username || 'U').charAt(0).toUpperCase()}" onerror="window.__handleBrokenAvatar(this, '${f.id}')" style="width:100%;height:100%;object-fit:cover;display:block;"/></div>` : `<div class="friend-thumb-avatar">${(f.username || 'U').charAt(0).toUpperCase()}</div>`}
            <div class="status-dot ${f.status}"></div>
          </div>
          <span class="friend-thumb-name">${f.username}</span>
        </div>
      `).join('');
    }

    async function renderFriendRequestsList(requests) {
      if (requests.length === 0) {
        friendRequestsEl.innerHTML = '';
        return;
      }
      friendRequestsEl.innerHTML = '<div style="font-size:13px;color:#8a8c8e;margin-bottom:8px;">Friend Requests</div><div class="friend-requests">' +
        requests.map(r => `
          <div class="friend-request-card">
            <div class="search-avatar">${r.fromUsername?.charAt(0).toUpperCase() || '?'}</div>
            <span class="search-username">${r.fromUsername || 'Unknown'}</span>
            <div class="request-actions">
              <button class="request-accept-btn" onclick="window._acceptRequest('${r.id}','${r.from}','${r.to}')">Accept</button>
              <button class="request-decline-btn" onclick="window._declineRequest('${r.id}')">Decline</button>
            </div>
          </div>
        `).join('') + '</div>';
    }

    window._acceptRequest = async (reqId, fromId, toId) => {
      await acceptFriendRequest(reqId, fromId, toId);
      refreshFriends();
    };

    window._declineRequest = async (reqId) => {
      await declineFriendRequest(reqId);
      refreshFriends();
    };

    window._removeFriend = async (friendId) => {
      if (confirm('Remove this friend?')) {
        await removeFriend(currentUserId, friendId);
        refreshFriends();
      }
    };

    let _friendsWithStatus = [];

    async function refreshFriends() {
      if (!currentUserId) return;

      for (const unsub of friendStatusUnsubs.values()) unsub();
      friendStatusUnsubs.clear();

      const [friends, requests] = await Promise.all([
        getFriends(currentUserId),
        getFriendRequests(currentUserId),
      ]);

      const friendsWithStatus = await getFriendsWithStatus(friends);
      _friendsWithStatus = friendsWithStatus;

      for (const r of requests) {
        try {
          const fromDoc = await getDoc(doc(db, 'users', r.from));
          r.fromUsername = fromDoc.exists() ? fromDoc.data().username : 'Unknown';
        } catch { r.fromUsername = 'Unknown'; }
      }

      renderFriends(friendsWithStatus);
      renderFriendRequestsList(requests);

      for (const friend of friendsWithStatus) {
        listenFriendStatus(friend);
      }
    }

    function toggleDropdown(dropdown) {
      if (activeDropdown && activeDropdown !== dropdown) {
        activeDropdown.classList.remove('open');
      }
      dropdown.classList.toggle('open');
      activeDropdown = dropdown.classList.contains('open') ? dropdown : null;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = sitePath('auth.html');
        return;
      }
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }
      if (presence) { presence.goOffline(); presence = null; }

      if (user) {
        // ── Ban guard ────────────────────────────────────────────────────────
        if (await banGuard(user.uid)) return;
        // ── Real-time ban listener ────────────────────────────────────────
        onSnapshot(doc(db, 'bans', user.uid), (snap) => {
          if (snap.exists() && snap.data().banned) {
            window.location.href = '/bloxverse/ban';
          }
        });
        // ────────────────────────────────────────────────────────────────────

        currentUserId = user.uid;
        let username = 'Player';
        let bux = 0;
        let userNum = null;

        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            username = data.username || username;
            bux = data.bux || 0;
            userNum = data.userIdNum;
            var ownPreview = data.avatarPreview || null;
          }
        } catch {}
        if (typeof ownPreview === 'undefined') var ownPreview = null;

        // Ensure existing users get a sequential userIdNum
        assignUserIdNum(user.uid).catch(() => {});

        presence = trackPresence(user.uid, null, 'home');

        // ── Daily login reward ────────────────────────────────────────────
        claimDailyBux(user.uid).then(claimed => {
          if (claimed) {
            const toast = document.getElementById('dailyRewardToast');
            if (toast) {
              toast.classList.add('show');
              setTimeout(() => toast.classList.remove('show'), 4000);
            }
          }
        }).catch(() => {});

        const initial = username.charAt(0).toUpperCase();
        const ownProfileLink = userNum ? `/bloxverse/profile?user=${userNum}` : '/bloxverse/profile';

        navCenter.innerHTML = renderFriendSearch();
        document.getElementById('friendSearchInput').addEventListener('input', onFriendSearch);

        const buxElId = 'buxValue';
        navRight.innerHTML = `
          <div class="user-info">
            <div class="bux-wrapper" id="buxWrapper">
              <button class="bux-btn" id="buxBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
                </svg>
                <span id="${buxElId}">${bux.toLocaleString()}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
              </button>
              <div class="bux-dropdown">
                 <div class="bux-dropdown-header">
                   <span class="bux-dropdown-label">Balance</span>
                   <span class="bux-dropdown-balance" id="buxDropdownBalance">${bux.toLocaleString()}</span>
                 </div>
                 <button class="bux-dropdown-item" onclick="window.openSendBuxModal()">

                   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                   Send Bux
                 </button>
                 <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                   <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                   Transactions
                 </button>
               </div>
            </div>
            <button class="settings-nav-btn" onclick="window.location.href='/bloxverse/settings'" title="Settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
            <div class="avatar-dropdown" id="userDropdown">
              ${ownPreview ? `<img src="${ownPreview}?_cb=${_cb}" alt="" class="avatar-circle-img" data-initial="${initial}" onerror="window.__handleBrokenAvatar(this, '${user.uid}')"/>` : `<div class="avatar-circle">${initial}</div>`}
              <div class="dropdown-menu">
                <div class="dropdown-header">
                  <span class="dropdown-name">${username}</span>
                  <span class="dropdown-email">${user.email}</span>
                </div>
                <button class="dropdown-item" onclick="window.location.href='${ownProfileLink}'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                  Profile
                </button>
                <button class="dropdown-item" onclick="window.location.href='/bloxverse/avatar'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                  </svg>
                  Avatar
                </button>
                <button class="dropdown-item" onclick="window._logout()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                  </svg>
                  Log Out
                </button>
              </div>
            </div>
          </div>
        `;

        const avatarCircle = document.querySelector('#userDropdown .avatar-circle, #userDropdown .avatar-circle-img');
        const dropdown = document.getElementById('userDropdown');
        avatarCircle.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleDropdown(dropdown);
        });

        // Bux dropdown toggle
        const buxWrapper = document.getElementById('buxWrapper');
        const buxBtn = document.getElementById('buxBtn');
        buxBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleDropdown(buxWrapper);
        });

        // Use a persistent listener for Bux updates
        buxUnsub = listenBux(user.uid, (buxAmount) => {
          const buxEl = document.getElementById(buxElId);
          if (buxEl) {
            buxEl.textContent = buxAmount.toLocaleString();
          }
          const balEl = document.getElementById('buxDropdownBalance');
          if (balEl) balEl.textContent = buxAmount.toLocaleString();
        }, username, user.email);

        friendsSection.style.display = 'block';
        refreshFriends();
      } else {
        currentUserId = null;
        navCenter.innerHTML = '';
        navRight.innerHTML = `<button class="login-btn" 
onclick="window.location.href='/bloxverse/auth'">Login / Sign Up</button>`;
        friendsSection.style.display = 'none';
        if (activeDropdown) { activeDropdown.classList.remove('open'); activeDropdown = null; }
      }
    });

    window._logout = async () => {
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }
      if (presence) { presence.goOffline(); presence = null; }
      await signOut(auth);
      window.location.href = '/bloxverse/';
    };

    document.addEventListener('click', (e) => {
      const results = document.getElementById('friendSearchResults');
      if (results && !e.target.closest('.friend-search-wrapper')) {
        results.classList.remove('visible');
      }
      if (activeDropdown && !activeDropdown.contains(e.target)) {
        activeDropdown.classList.remove('open');
         activeDropdown = null;
       }
     });

      // ── Send Bux ─────────────────────────────────────────────────────────
      window.openSendBuxModal = () => {
        if (!auth.currentUser) return;
        const bux = Number(String(document.getElementById('buxDropdownBalance')?.textContent || '0').replace(/,/g, '')) || 0;
        let selectedUserId = null;

        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
          <div class="modal-content" style="max-width:500px;">
            <div class="modal-header">
              <h2>Send Bux</h2>
              <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
            </div>
            <div class="modal-body">
              <div class="modal-field">
                <label>Recipient</label>
                <input type="text" id="sendBuxSearch" placeholder="Search username..." autocomplete="off" />
                <div id="sendBuxResults" class="search-list" style="display:none;"></div>
              </div>

              <div id="sendBuxSelected" style="display:none;">
                <div class="modal-field">
                  <label>Selected User</label>
                  <div class="selected-badge">
                    <img id="sendBuxAvatar" src="" class="selected-avatar" />
                    <span id="sendBuxName"></span>
                  </div>
                </div>
              </div>

              <div class="modal-field">
                <label>Amount</label>
                <div class="amount-row">
                  <input type="number" id="sendBuxAmount" placeholder="Enter amount…" min="1" max="${bux}" />
                  <span class="bux-label">BUX</span>
                </div>
              </div>

              <div class="warning-box" style="margin:0;">
                <strong>Warning:</strong> Bux transfers are final and cannot be undone.
              </div>
              <div id="sendBuxErr" class="error-msg" style="display:none;"></div>
            </div>
            <div class="modal-footer">
              <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
              <button class="modal-btn confirm" id="sendBuxSendBtn" disabled>Send</button>
            </div>
          </div>`;

        overlay.querySelector('#sendBuxSendBtn').addEventListener('click', () => {
          const amount = parseInt(overlay.querySelector('#sendBuxAmount').value, 10);
          const username = overlay.querySelector('#sendBuxName').textContent;
          if (!selectedUserId || !amount || amount < 1) return;

          const confirmOverlay = document.createElement('div');
          confirmOverlay.className = 'modal-overlay';
          confirmOverlay.style.cssText = 'z-index:10000;background:rgba(0,0,0,0.8);';
          confirmOverlay.innerHTML = `
            <div class="modal-content" style="max-width:400px;">
              <div class="modal-header">
                <h3 style="font-size:16px;margin:0;">Confirm Transfer</h3>
              </div>
              <div class="modal-body">
                <p style="color:#ccc;font-size:14px;line-height:1.5;margin:0 0 16px;">
                  Are you sure you want to send <strong style="color:#4caf50;">${amount.toLocaleString()} BUX</strong>
                  to <strong style="color:#fff;">${username}</strong>?
                </p>
                <div class="warning-box" style="margin:0;">
                  This transfer is <strong>final</strong>. You will not be able to recover these BUX.
                </div>
              </div>
              <div class="modal-footer">
                <button class="modal-btn cancel" id="confirmCancelBtn">Cancel</button>
                <button class="modal-btn confirm" id="confirmYesBtn" style="background:rgba(244,67,54,0.8);">Yes, Send</button>
              </div>
            </div>`;
          document.body.appendChild(confirmOverlay);

          confirmOverlay.querySelector('#confirmCancelBtn').addEventListener('click', () => confirmOverlay.remove());
          confirmOverlay.querySelector('#confirmYesBtn').addEventListener('click', async () => {
            try {
              await updateDoc(doc(db, 'users', auth.currentUser.uid), { bux: increment(-amount) });
              await updateDoc(doc(db, 'users', selectedUserId), { bux: increment(amount) });

              const _sSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
              const _sData = _sSnap.data();
              const _rSnap = await getDoc(doc(db, 'users', selectedUserId));
              const _rData = _rSnap.data();
              await logTransaction(auth.currentUser.uid, -amount, _sData?.bux || 0, 'SendBux', `Sent ${amount.toLocaleString()} BUX to ${username}`);
              await logTransaction(selectedUserId, amount, _rData?.bux || 0, 'SendBux', `Received ${amount.toLocaleString()} BUX from ${_sData?.username || 'Someone'}`);

              confirmOverlay.remove();
              overlay.remove();
            } catch (err) {
              console.error(err);
              overlay.querySelector('#sendBuxErr').textContent = 'Transfer failed. Try again.';
              overlay.querySelector('#sendBuxErr').style.display = 'block';
              confirmOverlay.remove();
            }
          });
        });

        document.body.appendChild(overlay);

        const searchInput = overlay.querySelector('#sendBuxSearch');
        const resultsEl = overlay.querySelector('#sendBuxResults');
        const selectedEl = overlay.querySelector('#sendBuxSelected');
        const nameEl = overlay.querySelector('#sendBuxName');
        const avatarEl = overlay.querySelector('#sendBuxAvatar');
        const sendBtn = overlay.querySelector('#sendBuxSendBtn');

        let _allUsersCache = null;
        let searchTimer;
        searchInput.addEventListener('input', () => {
          clearTimeout(searchTimer);
          const term = searchInput.value.trim().toLowerCase();
          if (!term) { resultsEl.style.display = 'none'; return; }
          searchTimer = setTimeout(async () => {
            try {
              if (!_allUsersCache) {
                const all = await getDocs(collection(db, 'users'));
                _allUsersCache = all.docs.map(d => ({ id: d.id, ...d.data() }));
              }
              const matches = _allUsersCache.filter(u => (u.username || '').toLowerCase().includes(term));
              if (matches.length === 0) {
                resultsEl.innerHTML = '<div class="empty-state">No users found</div>';
              } else {
                resultsEl.innerHTML = matches.slice(0, 50).map(f => `
                  <div class="search-item" data-uid="${f.id}" data-name="${f.username || 'Unknown'}" data-avatar="${f.avatarPreview || ''}">
                    ${f.avatarPreview ? `<img src="${f.avatarPreview}" alt="" />` : `<div class="init-circle">${(f.username || 'U').charAt(0).toUpperCase()}</div>`}
                    <span>${f.username || 'Unknown'}</span>
                  </div>`).join('');
                resultsEl.querySelectorAll('.search-item').forEach(el => {
                  el.addEventListener('click', () => {
                    selectedUserId = el.dataset.uid;
                    nameEl.textContent = el.dataset.name;
                    avatarEl.src = el.dataset.avatar || '';
                    selectedEl.style.display = 'block';
                    resultsEl.style.display = 'none';
                    searchInput.value = '';
                    sendBtn.disabled = false;
                    overlay.querySelector('#sendBuxErr').style.display = 'none';
                    overlay.querySelector('#sendBuxAmount').focus();
                  });
                });
              }
              resultsEl.style.display = 'block';
            } catch (err) {
              console.error(err);
              resultsEl.innerHTML = '<div class="empty-state">Search error</div>';
            }
          }, 200);
        });

        document.addEventListener('click', (e) => {
          if (overlay.contains(e.target)) return;
          if (resultsEl.style.display === 'block') resultsEl.style.display = 'none';
        }, { once: true });
      };
    </script>
</body>

</html>
