<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Player Search</title>
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="src/search.css" />
  <style>
    .settings-wrapper { position: relative; }
    .settings-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      min-width: 140px;
      z-index: 100;
      overflow: hidden;
      margin-top: 4px;
    }
    .settings-dropdown.open { display: block; }
    .settings-dropdown button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-dropdown button:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  </style>

  <link rel="stylesheet" href="src/theme.css" />
  <script type="module" src="src/theme.js"></script>
  <script src="js/sw-register.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links" id="navLinks">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" data-needs-auth onclick="window.location.href='/bloxverse/avatar'">Avatar</button>
      </div>
    </div>
    </div>
    <div class="nav-center">
      <div class="player-search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input type="text" id="searchInput" placeholder="Search players..." autocomplete="off" />
      </div>
    </div>
    <div class="nav-right" id="navRight">
      <button class="login-btn" onclick="window.location.href='/bloxverse/auth'">Login / Sign Up</button>
    </div>
  </nav>

  <main class="search-main">
    <div class="search-results" id="searchResults">
      <div class="search-empty">
        <h2>Search for players</h2>
        <p>Type at least 3 characters to search</p>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db, getDoc, banGuard, assignUserIdNum } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, onSnapshot } from 'firebase/firestore';
    import { searchUsers } from './src/friends.js';

    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const navRight = document.getElementById('navRight');

    // Handle auth state
    onAuthStateChanged(auth, async (user) => {
      document.querySelectorAll('[data-needs-auth]').forEach(el => { el.style.display = user ? '' : 'none'; });
      if (user) {
        if (await banGuard(user.uid)) return;
        // Ensure existing users get a sequential userIdNum
        assignUserIdNum(user.uid).catch(() => {});
        // ── Real-time ban listener ────────────────────────────────────
        onSnapshot(doc(db, 'bans', user.uid), (snap) => {
          if (snap.exists() && snap.data().banned) {
            window.location.href = '/bloxverse/ban';
          }
        });
        // ──────────────────────────────────────────────────────────────
        let userDocData = {};
        try {
          const d = await getDoc(doc(db, 'users', user.uid));
          if (d.exists()) userDocData = d.data();
        } catch {}
        const username = userDocData.username || 'Player';
        const ownPreview = userDocData.avatarPreviewHead || userDocData.avatarPreview || null;
        const ownNum = userDocData.userIdNum;
        const ownProfileLink = ownNum ? `/bloxverse/profile?user=${ownNum}` : '/bloxverse/profile';
        const ownInitial = username.charAt(0).toUpperCase();
        const ownBux = userDocData.bux || 0;
        const _cb = Date.now();
        navRight.innerHTML = `
          <div class="user-info">
            <div class="bux-wrapper" id="buxWrapper">
              <button class="bux-btn" id="buxBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text></svg>
                <span id="ownBuxVal">${ownBux.toLocaleString()}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
              </button>
              <div class="bux-dropdown">
                <div class="bux-dropdown-header">
                  <span class="bux-dropdown-label">Balance</span>
                  <span class="bux-dropdown-balance" id="buxDropdownBalance">${ownBux.toLocaleString()}</span>
                </div>
                <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                  Transactions
                </button>
              </div>
            </div>
            <div class="settings-wrapper">
              <button class="settings-nav-btn" id="navSettingsBtn" title="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              </button>
              <div class="settings-dropdown" id="navSettingsDropdown">
                <button onclick="window.location.href='/bloxverse/settings'">Settings</button>
                <button onclick="window._logout()">Log Out</button>
              </div>
            </div>
            ${ownPreview
              ? `<img src="${ownPreview}?_cb=${_cb}" alt="" class="avatar-circle-img" onclick="window.location.href='${ownProfileLink}'" data-initial="${ownInitial}" onerror="window.__handleBrokenAvatar(this, '${user.uid}')"/>`
              : `<div class="avatar-circle" onclick="window.location.href='${ownProfileLink}'">${ownInitial}</div>`}
          </div>
        `;

        // Settings dropdown toggle
        const closeSettings = () => {
          document.querySelectorAll('.settings-dropdown').forEach(d => d.classList.remove('open'));
        };
        const navSettingsBtn = document.getElementById('navSettingsBtn');
        if (navSettingsBtn) {
          navSettingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeSettings();
            const dd = document.getElementById('navSettingsDropdown');
            if (dd) dd.classList.toggle('open');
          });
        }
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.settings-wrapper')) {
            closeSettings();
          }
        });

        // Bux dropdown toggle
        const buxWrapper = document.getElementById('buxWrapper');
        const buxBtn = document.getElementById('buxBtn');
        buxBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          buxWrapper.classList.toggle('open');
        });

        window._logout = async () => {
          await signOut(auth);
          window.location.href = '/bloxverse/';
        };
      }
    });

    // Auto-search on input
    let debounceTimer;
    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const val = searchInput.value.trim();
      
      if (val.length < 3) {
        searchResults.innerHTML = `
          <div class="search-empty">
            <h2>Search for players</h2>
            <p>Type at least 3 characters to search</p>
          </div>
        `;
        return;
      }

      debounceTimer = setTimeout(async () => {
        searchResults.innerHTML = `
          <div class="search-loading">
            <div class="loading-spinner"></div>
            <p>Searching...</p>
          </div>
        `;

        const users = await searchUsers(val);
        renderResults(users, val);
      }, 300);
    });

    // Allow Enter key to focus search
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        searchInput.blur();
      }
    });

    // Read query from URL
    const params = new URLSearchParams(window.location.search);
    const query = params.get('q');
    if (query) {
      searchInput.value = query;
      searchInput.dispatchEvent(new Event('input'));
    }

    function renderResults(users, searchTerm) {
      if (users.length === 0) {
        searchResults.innerHTML = `
          <div class="search-empty">
            <h2>No players found</h2>
            <p>No players match "${searchTerm}"</p>
          </div>
        `;
        return;
      }

      searchResults.innerHTML = `
        <div class="results-header">
          <h2>Found ${users.length} player${users.length !== 1 ? 's' : ''}</h2>
        </div>
        <div class="player-grid">
          ${users.map(u => `
            <div class="player-card" onclick="window.location.href='/bloxverse/profile?user=${u.userIdNum}'">
              <div class="player-avatar">${u.avatarPreviewHead || u.avatarPreview ? `<img src="${(u.avatarPreviewHead || u.avatarPreview)}?_cb=${Date.now()}" alt="" class="player-avatar-img" onerror="this.outerHTML='<div class=player-avatar-letter>${(u.username||'?').charAt(0).toUpperCase()}</div>'"/>` : `<div class="player-avatar-letter">${(u.username || '?').charAt(0).toUpperCase()}</div>`}</div>
              <div class="player-info">
                <div class="player-name">${u.username}</div>
                <div class="player-join-date">Joined ${new Date(u.createdAt || Date.now()).toLocaleDateString()}</div>
              </div>
              <div class="player-action">
                ${u.id === auth.currentUser?.uid ? '' : `<button class="add-friend-btn" onclick="event.stopPropagation(); window._addFriend('${u.id}','${u.username}',this)">+ Add Friend</button>`}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    window._addFriend = async (targetId, targetUsername, btn) => {
      if (!auth.currentUser) {
        window.location.href = '/bloxverse/auth';
        return;
      }
      btn.textContent = 'Sending...';
      btn.disabled = true;
      try {
        const { sendFriendRequest } = await import('./src/friends.js');
        await sendFriendRequest(auth.currentUser.uid, targetId, targetUsername);
        btn.textContent = 'Sent';
        btn.classList.add('sent');
      } catch (e) {
        console.error(e);
        btn.textContent = 'Error';
        btn.disabled = false;
      }
    };

    // Hamburger menu toggle
    const _hamburger = document.getElementById('navHamburger');
    const _navLinks = document.getElementById('navLinks');
    if (_hamburger && _navLinks) {
      _hamburger.addEventListener('click', () => {
        _navLinks.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.navbar')) _navLinks.classList.remove('open');
      });
    }

    window.__handleBrokenAvatar = async function(imgEl, uid) {
      try {
        const initial = imgEl.getAttribute('data-initial') || 'U';
        const letter = document.createElement('div');
        letter.className = 'friend-thumb-avatar';
        letter.textContent = initial;
        imgEl.replaceWith(letter);
        try {
          if (auth && auth.currentUser && auth.currentUser.uid === uid) {
            const { setDoc, doc } = await import('https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js');
            await setDoc(doc(db, 'users', uid), { avatarPreview: null, avatarPreviewHead: null }, { merge: true });
          }
        } catch (e) { console.warn('Could not clear avatarPreview:', e); }
      } catch (e) { console.warn('Broken avatar handler error:', e); }
    };
  </script>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        <img src="assets/icons/bloxverseLogo.png" alt="" class="footer-logo-img" />
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="footer-links">
        <a href="/bloxverse/terms">Terms of Service</a>
        <a href="/bloxverse/privacy">Privacy Policy</a>
      </div>
    </div>
  </footer>
</body>
</html>
