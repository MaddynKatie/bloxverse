<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",

    }
  }
  </script>
  <base href="/bloxverse/">

    <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Marketplace</title>
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .mp-page {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      padding-top: 72px;
    }
    .mp-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .mp-header h1 {
      font-size: 28px;
      margin-bottom: 4px;
    }
    .mp-header p {
      color: var(--text-muted);
      font-size: 14px;
    }
    .mp-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .mp-search {
      flex: 1;
      min-width: 200px;
      display: flex;
      align-items: center;
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 0 12px;
      gap: 8px;
    }
    .mp-search input {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-primary);
      padding: 10px 0;
      font-size: 14px;
      outline: none;
    }
    .mp-search input::placeholder { color: var(--text-muted); }
    .mp-search svg { color: var(--text-muted); width: 18px; height: 18px; flex-shrink: 0; }
    .mp-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .mp-filter {
      padding: 7px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mp-filter:hover { border-color: #5865f2; color: var(--text-primary); }
    .mp-filter.active { background: #5865f2; border-color: #5865f2; color: #fff; }
    .mp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .mp-card {
      background: var(--bg-secondary);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
    }
    .mp-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
    .mp-card.equipped { border-color: var(--accent); }
    .mp-card-thumb {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      position: relative;
    }
    .mp-card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .mp-card-thumb .mp-type-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.6);
      color: #fff;
    }
    .mp-owned-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #4a7dff;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .mp-card-body {
      padding: 10px 12px;
    }
    .mp-card-body .mp-name {
      font-size: 13px;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }
    .mp-card-body .mp-price {
      font-size: 12px;
      color: #f2cd37;
      font-weight: 600;
      margin-top: 2px;
    }
    .mp-card-body .mp-price.free { color: #4ade80; }

    /* Modal */
    .mp-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .mp-modal.open { display: flex; }
    .mp-modal-content {
      background: var(--bg-secondary);
      border-radius: 12px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }
    .mp-modal-preview {
      width: 340px;
      min-height: 340px;
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      flex-shrink: 0;
    }
    .mp-modal-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .mp-modal-body {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    @media (max-width: 600px) {
      .mp-modal-content { flex-direction: column; }
      .mp-modal-preview { width: 100%; min-height: auto; aspect-ratio: 1; }
    }
    .mp-modal-body h2 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    .mp-modal-body .mp-modal-type {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .mp-modal-body .mp-modal-price {
      font-size: 22px;
      font-weight: 700;
      margin: 12px 0;
      color: #f2cd37;
    }
    .mp-modal-body .mp-modal-price.free { color: #4ade80; }
    .mp-modal-body .mp-modal-author {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: -4px;
      margin-bottom: 10px;
    }
    .mp-modal-body .mp-modal-author span { color: #5865f2; }
    .mp-modal-body .mp-modal-desc {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    .mp-modal-actions {
      display: flex;
      gap: 10px;
    }
    .mp-modal-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .mp-modal-actions button:hover { opacity: 0.85; }
    .mp-modal-actions .btn-buy {
      background: #5865f2;
      color: #fff;
    }
    .mp-modal-actions .btn-owned {
      background: #1a2a4e;
      color: #4a7dff;
      border: 1px solid #4a7dff;
      cursor: default;
    }
    .mp-modal-dates {
      margin: 12px 0;
      font-size: 13px;
    }
    .mp-date-row {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }
    .mp-date-label {
      color: var(--text-muted);
      min-width: 60px;
    }
    .mp-date-value {
      color: var(--text-secondary);
    }
    .mp-modal-actions .btn-close {
      background: var(--bg-surface);
      color: var(--text-muted);
    }

    .mp-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }
    .mp-empty h3 { font-size: 18px; margin-bottom: 6px; color: var(--text-primary); }

    .bux-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      background: #f2cd37;
      color: #1a1a2e;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
      margin-right: 3px;
      vertical-align: middle;
    }
    .mp-price .bux-icon { width: 14px; height: 14px; font-size: 9px; }
    .mp-modal-price .bux-icon { width: 20px; height: 20px; font-size: 12px; }

    .settings-wrapper {
      position: relative;
    }
    .settings-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      min-width: 140px;
      z-index: 100;
      overflow: hidden;
      margin-top: 4px;
    }
    .settings-dropdown.open { display: block; }
    .settings-dropdown button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-dropdown button:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  </style>

  <link rel="stylesheet" href="src/theme.css" />
  <script type="module" src="src/theme.js"></script>
</head>

    <div class="mp-controls">

      <div class="mp-modal-body">

  <script type="module">
    import { auth, db, listenBux, banGuard, logTransaction, assignUserIdNum, trackPresence } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc, setDoc, arrayUnion, arrayRemove, updateDoc, increment, collection, getDocs, query, where, limit } from 'firebase/firestore';
    import { getAllAccessories, findAccessory } from './src/accessories.js';
    import { getAllClothing, findClothing } from './src/clothing.js';
    import { getAllFaces } from './src/faces.js';
    import { getAllEmotes } from './src/emotes.js';
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { applyAvatarClothing, preloadTexture, removeAvatarClothing, applyAvatarPants, removeAvatarPants } from './src/avatar-clothing.js';

    const STARTING_ITEMS = ['palhair', 'smile', 'blueandblackmotorcycleshirt'];

    const navRight = document.getElementById('navRight');
    const grid = document.getElementById('mpGrid');
    const searchInput = document.getElementById('mpSearch');
    const filterRow = document.getElementById('filterRow');
    const priceFilterBtn = document.getElementById('priceFilter');
    const modal = document.getElementById('mpModal');
    const modalPreview = document.getElementById('modalPreview');
    const modalType = document.getElementById('modalType');
    const modalName = document.getElementById('modalName');
    const modalAuthor = document.getElementById('modalAuthor');
    const modalPrice = document.getElementById('modalPrice');
    const modalDesc = document.getElementById('modalDesc');
    const btnBuy = document.getElementById('btnBuy');
    const btnModalClose = document.getElementById('btnModalClose');

    let buxUnsub = null;
    let allItems = [];
    let activeFilter = 'all';
    let priceMode = 'all';
    let searchQuery = '';
    let ownedItems = [];
    let userBux = 0;
    // 3D preview
    const playerModelUrl = new URL('./assets/models/player.fbx', import.meta.url).href;
    let _p = null;
    let _previewRenderer = null;
    const _clothingPreviewCache = new Map();

    function buildCatalog() {
      const accs = getAllAccessories().map(a => ({ ...a, _type: 'accessory' }));
      const clothes = getAllClothing().map(c => ({ ...c, _type: 'clothing', icon: '👕' }));
      const faces = getAllFaces().map(f => ({ ...f, _type: 'face', icon: '😀' }));
      const emotes = getAllEmotes().map(e => ({ ...e, _type: 'emote', category: 'Emotes' }));
      allItems = [...accs, ...clothes, ...faces, ...emotes];
    }

    function getCategory(item) {
      if (item._type === 'face') return 'Faces';
      if (item._type === 'emote') return 'Emotes';
      return item.category || 'Other';
    }

    function getIcon(item) {
      if (item.icon) return item.icon;
      if (item._type === 'clothing') return '👕';
      if (item._type === 'face') return '😀';
      if (item._type === 'emote') return '💃';
      return '📦';
    }

    function getThumbnail(item) {
      if (_clothingPreviewCache.has(item.id)) return _clothingPreviewCache.get(item.id);
      if (item.texturePath) return item.texturePath;
      if (item._type === 'accessory' && item.textures?.map) return item.textures.map;
      return null;
    }

    function filterItems() {
      return allItems.filter(item => {
        const cat = getCategory(item);
        if (activeFilter !== 'all' && cat !== activeFilter) return false;
        if (priceMode === 'free' && item.price > 0) return false;
        if (priceMode === 'paid' && (!item.price || item.price === 0)) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const name = (item.name || '').toLowerCase();
          const desc = (item.description || '').toLowerCase();
          if (!name.includes(q) && !desc.includes(q)) return false;
        }
        return true;
      });
    }

    function formatPrice(price) {
      return price > 0
        ? `<span class="bux-icon">B</span> ${price}`
        : 'FREE';
    }

    function render() {
      const filtered = filterItems();
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="mp-empty"><h3>No items found</h3><p>Try a different search or filter.</p></div>`;
        return;
      }
      grid.innerHTML = filtered.map(item => {
        const thumb = getThumbnail(item);
        const owned = ownedItems.includes(item.id);
        const priceStr = formatPrice(item.price);
        const priceCls = item.price > 0 ? '' : 'free';
        return `
          <div class="mp-card ${owned ? 'owned' : ''}" data-id="${item.id}" data-type="${item._type}">
            <div class="mp-card-thumb">
              ${thumb ? `<img src="${thumb}" alt="${item.name}" loading="lazy" />` : getIcon(item)}
              <span class="mp-type-badge">${getCategory(item)}</span>
              ${owned ? '<span class="mp-owned-badge">Owned</span>' : ''}
            </div>
            <div class="mp-card-body">
              <div class="mp-name">${escHtml(item.name)}</div>
              <div class="mp-author" style="font-size:11px;color:var(--text-muted);margin-top:1px;">by <a href="#" class="mp-author-link" data-author="${escHtml(item.author || 'BloxVerse')}" onclick="event.stopPropagation(); window.openAuthorProfile(this.dataset.author); return false;" style="color:#5865f2;text-decoration:none;">${escHtml(item.author || 'BloxVerse')}</a></div>
              <div class="mp-price ${priceCls}">${priceStr}</div>
            </div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('.mp-card').forEach(card => {
        card.addEventListener('click', () => {
          const id = card.dataset.id;
          const type = card.dataset.type;
          const item = allItems.find(i => i.id === id && i._type === type);
          if (item) openModal(item);
        });
      });
    }

    function openModal(item) {
      const cat = getCategory(item);
      const owned = ownedItems.includes(item.id);
      modalType.textContent = cat;
      modalName.textContent = item.name;
      modalAuthor.textContent = item.author || 'BloxVerse';
      modalAuthor.onclick = (e) => { e.stopPropagation(); window.openAuthorProfile(modalAuthor.textContent); };
      modalPrice.innerHTML = formatPrice(item.price);
      modalPrice.className = 'mp-modal-price' + (item.price > 0 ? '' : ' free');
      modalDesc.textContent = item.description || '';
      document.getElementById('modalCreated').textContent = item.created || '';
      document.getElementById('modalUpdated').textContent = item.updated || '';
      if (owned) {
        btnBuy.textContent = 'Owned';
        btnBuy.className = 'btn-owned';
        btnBuy.disabled = true;
      } else if (item.price > 0) {
        btnBuy.textContent = `Buy - ${item.price} BUX`;
        btnBuy.className = 'btn-buy';
        btnBuy.disabled = false;
      } else {
        btnBuy.textContent = 'Get Free';
        btnBuy.className = 'btn-buy';
        btnBuy.disabled = false;
      }
      btnBuy.dataset.id = item.id;
      btnBuy.dataset.price = item.price;
      modal.classList.add('open');
      requestAnimationFrame(() => {
        initPreview();
        resizePreview();
        if (_p.avatar) {
          applyPreviewItem(item);
        } else {
          _p.loadCallbacks.push(() => applyPreviewItem(item));
        }
      });
    }

    async function purchaseItem(itemId, price) {
      if (!auth.currentUser) return;
      const uid = auth.currentUser.uid;

      if (ownedItems.includes(itemId)) return;

      if (price > 0) {
        if (userBux < price) {
          alert('Not enough BUX! You need ' + price + ' BUX.');
          return;
        }
        userBux -= price;
      }

      ownedItems.push(itemId);

      await setDoc(doc(db, 'users', uid), {
        ownedItems: ownedItems,
        bux: userBux,
      }, { merge: true });

      const item = allItems.find(i => i.id === itemId);
      if (price > 0) {
        const itemName = item ? item.name : itemId;
        await logTransaction(uid, -price, userBux, 'Marketplace', `Purchased ${itemName}`);
      }

      render();
      if (item) openModal(item);
    }

    function escHtml(s) {
      if (!s) return '';
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── 3D Preview ───────────────────────────────────────────────────
    function initPreview() {
      if (_p) return;
      const container = modalPreview;
      container.innerHTML = '';
      const w = container.clientWidth || 340;
      const h = container.clientHeight || 340;

      const scene = new THREE.Scene();
      scene.background = null;

      const camera = new THREE.PerspectiveCamera(25, w / h, 0.1, 100);
      camera.position.set(5, 3.5, 14);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(w, h);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.LinearToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.2, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 1.5;
      controls.maxDistance = 40;
      controls.maxPolarAngle = Math.PI / 2.1;
      controls.update();

      const hemi = new THREE.HemisphereLight(0xffffff, 0x666666, 0);
      scene.add(hemi);
      const key = new THREE.DirectionalLight(0xffffff, 1.8);
      key.position.set(4, 6, 5);
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.6);
      fill.position.set(-4, 2, -3);
      scene.add(fill);
      const back = new THREE.DirectionalLight(0xffffff, 0.4);
      back.position.set(0, 3, -6);
      scene.add(back);
      const rim = new THREE.DirectionalLight(0xffffff, 0.3);
      rim.position.set(0, -1, 6);
      scene.add(rim);

      _p = {
        scene, camera, renderer, controls,
        avatar: null, faceMesh: null,
        accessories: {}, updaters: new Map(),
        animId: null, clothingId: null, charHeight: 0,
        loadCallbacks: [],
      };

      loadPreviewModel();
    }

    function loadPreviewModel() {
      const loader = new FBXLoader();
      loader.load(playerModelUrl, (fbx) => {
        fbx.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.geometry) {
              for (const key of Object.keys(child.geometry.attributes)) {
                if (key.toLowerCase().includes('color')) child.geometry.deleteAttribute(key);
              }
              if (child.geometry.morphAttributes) {
                for (const key of Object.keys(child.geometry.morphAttributes)) {
                  if (key.toLowerCase().includes('color')) delete child.geometry.morphAttributes[key];
                }
              }
            }
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            for (let i = 0; i < mats.length; i++) {
              const mat = mats[i];
              if (!mat) continue;
              const newMat = new THREE.MeshStandardMaterial({
                color: mat.color ? mat.color.getHex() : 0xcccccc,
                map: mat.map, transparent: false, opacity: 1,
                toneMapped: false, vertexColors: false,
                emissive: 0, emissiveIntensity: 0,
                roughness: 0.8, metalness: 0.1,
              });
              mats[i] = newMat;
            }
          }
        });
        const box = new THREE.Box3().setFromObject(fbx);
        const charHeight = box.max.y - box.min.y;
        fbx.position.y = -box.min.y;
        fbx.updateMatrixWorld(true);

        _p.bones = {};
        _p.rest = {};
        fbx.traverse(child => {
          if (child.isBone || child.type === 'Bone') {
            _p.bones[child.name] = child;
            _p.rest[child.name] = { 
              x: child.rotation.x, y: child.rotation.y, z: child.rotation.z,
              px: child.position.x, py: child.position.y, pz: child.position.z 
            };
          }
        });

        _p.scene.add(fbx);
        _p.avatar = fbx;
        _p.charHeight = charHeight;
        for (const cb of _p.loadCallbacks) cb();
        _p.loadCallbacks = [];
        startPreviewLoop();
        _generateClothingPreviews();
      }, undefined, () => {
        for (const cb of _p.loadCallbacks) cb();
        _p.loadCallbacks = [];
      });
    }

    function _getPreviewRenderer() {
      if (!_previewRenderer) {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        _previewRenderer = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true, alpha: true });
        _previewRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        _previewRenderer.outputColorSpace = THREE.SRGBColorSpace;
        _previewRenderer.setClearColor(0x000000, 0);
      }
      return _previewRenderer;
    }

    function _loadAccessoryMesh(accDef) {
      return new Promise((resolve, reject) => {
        const p = accDef.meshPath.toLowerCase();
        const finish = (modelRoot) => {
          modelRoot.traverse(child => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
          resolve(modelRoot);
        };
        if (p.endsWith('.fbx')) {
          new FBXLoader().load(accDef.meshPath, finish, undefined, () => reject(new Error('FBX load failed')));
        } else if (p.endsWith('.glb') || p.endsWith('.gltf')) {
          new GLTFLoader().load(accDef.meshPath, gltf => finish(gltf.scene), undefined, () => reject(new Error('GLTF load failed')));
        } else {
          reject(new Error('Unsupported format'));
        }
      });
    }

    function _generatePreview(item) {
      if (item._type === 'accessory') {
        const accDef = findAccessory(item.id);
        if (!accDef) return Promise.resolve(null);
        return new Promise(resolve => {
          if (!_p || !_p.avatar) return resolve(null);
          const texPromises = [];
          if (accDef.textures?.map) texPromises.push(preloadTexture(accDef.textures.map));
          if (accDef.textures?.normalMap) texPromises.push(preloadTexture(accDef.textures.normalMap));
          if (accDef.textures?.displacementMap) texPromises.push(preloadTexture(accDef.textures.displacementMap));
          Promise.all(texPromises).then(() => {
            const savedBg = _p.scene.background;
            _p.scene.background = null;
            const savedAccKeys = Object.keys(_p.accessories);
            for (const id of savedAccKeys) { _p.accessories[id].removeFromParent(); delete _p.accessories[id]; }
            const savedColors = [];
            _p.avatar.traverse(child => {
              if (child.isMesh && child.material) {
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                for (const mat of mats) {
                  if (mat.color) { savedColors.push({ mat, color: mat.color.getHex() }); mat.color.set(0xffffff); mat.needsUpdate = true; }
                }
              }
            });
            const hiddenGround = [];
            _p.scene.traverse(child => { if (child.userData?.isGround) { hiddenGround.push(child); child.visible = false; } });
            removeAvatarClothing(_p.avatar);
            _loadAccessoryMesh(accDef).then(modelRoot => {
              const texApplyPromises = [];
              if (accDef.textures?.map) texApplyPromises.push(preloadTexture(accDef.textures.map).then(tex => {
                modelRoot.traverse(child => {
                  if (child.isMesh) {
                    const mats = Array.isArray(child.material) ? child.material : [child.material];
                    for (const mat of mats) { if (mat) { mat.map = tex; tex.colorSpace = THREE.SRGBColorSpace; mat.needsUpdate = true; } }
                  }
                });
              }));
              return Promise.all(texApplyPromises).then(() => {
                const headPt = findPreviewHeadAttachment();
                if (!headPt) { resolve(null); return; }
                const avatarObj = _p.avatar;
                const attachment = headPt.object;
                avatarObj.updateMatrixWorld(true);
                modelRoot.updateMatrixWorld(true);
                modelRoot.position.set(0, 0, 0);
                modelRoot.rotation.set(0, 0, 0);
                const o = accDef.offset || {};
                const s = o.scale !== undefined ? o.scale : 1;
                modelRoot.scale.setScalar(s);
                modelRoot.updateMatrixWorld(true);
                const bbox = new THREE.Box3().setFromObject(modelRoot);
                const c = bbox.getCenter(new THREE.Vector3());
                modelRoot.position.x -= c.x;
                modelRoot.position.y -= bbox.min.y;
                modelRoot.position.z -= c.z;
                const wrapper = new THREE.Group();
                wrapper.add(modelRoot);
                wrapper.userData.isAccessory = true;
                wrapper.traverse(node => { node.userData = node.userData || {}; node.userData.isAccessory = true; });
                const localRot = new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rx || 0, o.ry || 0, o.rz || 0, 'XYZ'));
                _p.scene.add(wrapper);
                const headTopWorld = (headPt.headMesh ? meshTopWorld(headPt.headMesh) : attachTopWorld(attachment)) || attachment.getWorldPosition(new THREE.Vector3());
                const attachmentQuat = attachment.getWorldQuaternion(new THREE.Quaternion());
                const offsetWorld = new THREE.Vector3(o.x || 0, o.y !== undefined ? o.y : 0, o.z || 0).applyQuaternion(attachmentQuat);
                wrapper.position.copy(headTopWorld.clone().add(offsetWorld));
                wrapper.quaternion.copy(attachmentQuat).multiply(localRot);
                const cam = new THREE.PerspectiveCamera(20, 1, 0.1, 100);
                cam.position.set(0, 2.8, 18); cam.lookAt(0, 2.8, 0);
                const renderer = _getPreviewRenderer();
                const W = 256, H = 256;
                const rt = new THREE.WebGLRenderTarget(W, H);
                rt.texture.colorSpace = THREE.SRGBColorSpace;
                renderer.setRenderTarget(rt);
                renderer.render(_p.scene, cam);
                renderer.setRenderTarget(null);
                const pixels = new Uint8Array(W * H * 4);
                renderer.readRenderTargetPixels(rt, 0, 0, W, H, pixels);
                rt.dispose();
                wrapper.removeFromParent();
                for (const { mat, color } of savedColors) { mat.color.setHex(color); mat.needsUpdate = true; }
                _p.scene.background = savedBg;
                for (const m of hiddenGround) m.visible = true;
                const canvas = document.createElement('canvas');
                canvas.width = W; canvas.height = H;
                const ctx = canvas.getContext('2d');
                const id = ctx.createImageData(W, H);
                for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                  const si = (y * W + x) * 4, di = ((H - 1 - y) * W + x) * 4;
                  id.data[di] = pixels[si]; id.data[di + 1] = pixels[si + 1];
                  id.data[di + 2] = pixels[si + 2]; id.data[di + 3] = pixels[si + 3];
                }
                ctx.putImageData(id, 0, 0);
                resolve(canvas.toDataURL('image/png'));
              });
            }).catch(() => resolve(null));
          });
        });
      }
      return new Promise(resolve => {
        if (!_p || !_p.avatar) return resolve(null);
        const clothing = findClothing(item.id);
        if (!clothing || !clothing.texturePath) return resolve(null);
        preloadTexture(clothing.texturePath).then(() => {
          const savedBg = _p.scene.background;
          _p.scene.background = null;
          const savedAccKeys = Object.keys(_p.accessories);
          for (const id of savedAccKeys) { _p.accessories[id].removeFromParent(); delete _p.accessories[id]; }
          const savedColors = [];
          _p.avatar.traverse(child => {
            if (child.isMesh && child.material) {
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              for (const mat of mats) {
                if (mat.color) {
                  savedColors.push({ mat, color: mat.color.getHex() });
                  mat.color.set(0xffffff);
                  mat.needsUpdate = true;
                }
              }
            }
          });
          const hiddenGround = [];
          _p.scene.traverse(child => { if (child.userData?.isGround) { hiddenGround.push(child); child.visible = false; } });
          removeAvatarClothing(_p.avatar);
          removeAvatarPants(_p.avatar);
          if (clothing.category === 'Pants') {
            applyAvatarPants(_p.avatar, item.id);
          } else {
            applyAvatarClothing(_p.avatar, item.id);
          }
          const cam = new THREE.PerspectiveCamera(20, 1, 0.1, 100);
          cam.position.set(0, 2.8, 18); cam.lookAt(0, 2.8, 0);
          const renderer = _getPreviewRenderer();
          const W = 256, H = 256;
          const rt = new THREE.WebGLRenderTarget(W, H);
          rt.texture.colorSpace = THREE.SRGBColorSpace;
          renderer.setRenderTarget(rt);
          renderer.render(_p.scene, cam);
          renderer.setRenderTarget(null);
          const pixels = new Uint8Array(W * H * 4);
          renderer.readRenderTargetPixels(rt, 0, 0, W, H, pixels);
          rt.dispose();
          removeAvatarClothing(_p.avatar);
          removeAvatarPants(_p.avatar);
          for (const { mat, color } of savedColors) {
            mat.color.setHex(color);
            mat.needsUpdate = true;
          }
          _p.scene.background = savedBg;
          for (const m of hiddenGround) m.visible = true;
          const canvas = document.createElement('canvas');
          canvas.width = W; canvas.height = H;
          const ctx = canvas.getContext('2d');
          const id = ctx.createImageData(W, H);
          for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
            const si = (y * W + x) * 4, di = ((H - 1 - y) * W + x) * 4;
            id.data[di] = pixels[si]; id.data[di + 1] = pixels[si + 1];
            id.data[di + 2] = pixels[si + 2]; id.data[di + 3] = pixels[si + 3];
          }
          ctx.putImageData(id, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        });
      });
    }

    async function _generateClothingPreviews() {
      const clothes = getAllClothing().map(c => ({ ...c, _type: 'clothing' }));
      const accs = getAllAccessories().map(a => ({ ...a, _type: 'accessory' }));
      const items = [...clothes, ...accs];
      for (const item of items) {
        if (_clothingPreviewCache.has(item.id)) continue;
        const dataUrl = await _generatePreview(item);
        if (dataUrl) {
          _clothingPreviewCache.set(item.id, dataUrl);
          const img = document.querySelector(`.mp-card[data-id="${CSS.escape(item.id)}"] .mp-card-thumb img`);
          if (img) img.src = dataUrl;
        }
        await new Promise(r => setTimeout(r, 30));
      }
    }

    function startPreviewLoop() {
      if (_p.animId) return;
      let lastTime = performance.now();
      function loop(now) {
        const dt = (now - lastTime) / 1000;
        lastTime = now;
        _p.controls.update();
        if (_p.emote) {
          _updatePreviewEmote(dt);
        }
        for (const updater of _p.updaters.values()) updater();
        _p.renderer.render(_p.scene, _p.camera);
        _p.animId = requestAnimationFrame(loop);
      }
      _p.animId = requestAnimationFrame(loop);
    }

    function resizePreview() {
      if (!_p) return;
      const container = modalPreview;
      const w = container.clientWidth || 340;
      const h = container.clientHeight || 340;
      _p.camera.aspect = w / h;
      _p.camera.updateProjectionMatrix();
      _p.renderer.setSize(w, h);
    }

    function _resetPreviewColors() {
      if (!_p || !_p.avatar) return;
      const cc = _p.savedColors;
      if (cc) {
        _p.avatar.traverse(child => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            for (const mat of mats) {
              if (mat.color) { mat.color.setHex(0xffffff); mat.needsUpdate = true; }
            }
          }
        });
      }
    }

    function cleanupPreviewItem() {
      if (!_p || !_p.avatar) return;
      if (_p.clothingId) {
        removeAvatarClothing(_p.avatar);
        _p.clothingId = null;
      }
      if (_p.pantsId) {
        removeAvatarPants(_p.avatar);
        _p.pantsId = null;
      }
      if (_p.faceMesh) {
        _p.faceMesh.removeFromParent();
        if (_p.faceMesh.material) {
          if (_p.faceMesh.material.map) _p.faceMesh.material.map.dispose();
          _p.faceMesh.material.dispose();
        }
        _p.faceMesh = null;
      }
      for (const id of Object.keys(_p.accessories)) {
        _p.accessories[id].removeFromParent();
        delete _p.accessories[id];
      }
      if (_p.emote) {
        _resetPreviewEmoteBones();
        _p.emote = null;
      }
      _p.updaters.clear();
    }

    function applyPreviewItem(item) {
      if (!_p || !_p.avatar) return;
      cleanupPreviewItem();
      if (!_p.savedColors) {
        _p.savedColors = [];
        _p.avatar.traverse(child => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            for (const mat of mats) { if (mat.color) _p.savedColors.push({ mat, color: mat.color.getHex() }); }
          }
        });
      }
      _p.avatar.traverse(child => {
        if (child.isMesh && child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          for (const mat of mats) { if (mat.color) { mat.color.set(0xffffff); mat.needsUpdate = true; } }
        }
      });
      if (item._type === 'clothing') {
        if (item.category === 'Pants') {
          applyAvatarPants(_p.avatar, item.id);
          _p.pantsId = item.id;
        } else {
          applyAvatarClothing(_p.avatar, item.id);
          _p.clothingId = item.id;
        }
      } else if (item._type === 'face') {
        equipPreviewFace(item);
      } else if (item._type === 'accessory') {
        loadPreviewAccessory(item);
      } else if (item._type === 'emote') {
        _p.emote = { def: item, time: 0 };
      }
    }

    function _resetPreviewEmoteBones() {
      if (!_p || !_p.bones || !_p.rest) return;
      for (const name in _p.bones) {
        const rest = _p.rest[name];
        const bone = _p.bones[name];
        if (rest && bone) {
          bone.rotation.set(rest.x || 0, rest.y || 0, rest.z || 0);
          bone.position.set(rest.px ?? 0, rest.py ?? 0, rest.pz ?? 0);
        }
      }
    }

    function _updatePreviewEmote(dt) {
      if (!_p.emote || !_p.emote.def) return;
      const def = _p.emote.def;
      _p.emote.time += dt;

      if (!def.keyframes || def.keyframes.length === 0) return;

      const kfs = def.keyframes;
      const duration = def.duration || 1;
      const looping = true; // Emotes always loop in preview

      let elapsed = _p.emote.time;
      if (looping) {
          if (elapsed >= duration) elapsed = elapsed % duration;
      } else {
          if (elapsed >= duration) {
              _resetPreviewEmoteBones();
              _p.emote = null;
              return;
          }
      }

      let prevKF = kfs[0];
      let nextKF = kfs[kfs.length - 1];
      if (kfs.length > 1) {
          if (elapsed <= kfs[0].time) {
              prevKF = nextKF = kfs[0];
          } else if (elapsed >= kfs[kfs.length - 1].time) {
              prevKF = nextKF = kfs[kfs.length - 1];
          } else {
              for (let i = 0; i < kfs.length - 1; i++) {
                  if (elapsed >= kfs[i].time && elapsed <= kfs[i + 1].time) {
                      prevKF = kfs[i];
                      nextKF = kfs[i + 1];
                      break;
                  }
              }
          }
      }
      const range = nextKF.time - prevKF.time;
      const t = range === 0 ? 0 : (elapsed - prevKF.time) / range;

      const allBones = new Set();
      const allPosBones = new Set();
      for (const kf of [prevKF, nextKF]) {
          if (kf.bones) for (const b in kf.bones) allBones.add(b);
          if (kf.position) for (const b in kf.position) allPosBones.add(b);
      }

      for (const name in _p.bones) {
          const rest = _p.rest[name];
          const bone = _p.bones[name];
          if (!rest || !bone) continue;
          if (!allBones.has(name)) {
              bone.rotation.x = rest.x || 0;
              bone.rotation.y = rest.y || 0;
              bone.rotation.z = rest.z || 0;
          }
          if (!allPosBones.has(name)) {
              bone.position.x = rest.px ?? 0;
              bone.position.y = rest.py ?? 0;
              bone.position.z = rest.pz ?? 0;
          }
      }

      for (const name of allBones) {
          const bone = _p.bones[name];
          if (!bone) continue;
          const rest = _p.rest[name] || { x: 0, y: 0, z: 0 };
          const prev = prevKF.bones?.[name] || {};
          const next = nextKF.bones?.[name] || {};
          const axes = new Set([...Object.keys(prev), ...Object.keys(next)]);
          for (const axis of axes) {
              const pv = prev[axis] ?? 0;
              const nv = next[axis] ?? 0;
              const offset = pv + (nv - pv) * t;
              bone.rotation[axis] = rest[axis] + offset;
          }
      }

      for (const name of allPosBones) {
          const bone = _p.bones[name];
          if (!bone) continue;
          const rest = _p.rest[name] || { px: 0, py: 0, pz: 0 };
          const prev = prevKF.position?.[name] || {};
          const next = nextKF.position?.[name] || {};
          const axes = new Set([...Object.keys(prev), ...Object.keys(next)]);
          for (const axis of axes) {
              const pv = prev[axis] ?? 0;
              const nv = next[axis] ?? 0;
              const offset = pv + (nv - pv) * t;
              const posAxis = axis[1];
              bone.position[posAxis] = (rest[axis] ?? 0) + offset;
          }
      }
    }

    function equipPreviewFace(item) {
      const headBone = _p.avatar.getObjectByName('Head');
      if (!headBone) return;
      const headSize = _p.charHeight ? Math.min(_p.charHeight * 0.3, 1.2) : 0.6;
      new THREE.TextureLoader().load(item.texturePath, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        const mat = new THREE.MeshStandardMaterial({
          map: tex, transparent: true, alphaTest: 0.05,
          depthWrite: false, color: 0xffffff,
        });
        const faceSize = headSize * 0.85;
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(faceSize, faceSize), mat);
        mesh.position.set(0, headSize * 0.42, headSize * 0.51);
        mesh.renderOrder = 3;
        mesh.userData.isFaceOverlay = true;
        headBone.add(mesh);
        _p.faceMesh = mesh;
      }, undefined, () => {});
    }

    // ── Accessory preview ──
    function findPreviewHeadAttachment() {
      const avatarObj = _p.avatar;
      let headBone = null, headMesh = null;
      avatarObj.traverse(child => {
        if ((child.isBone || child.type === 'Bone') && child.name.toLowerCase().includes('head') && !child.name.toLowerCase().includes('_end')) {
          headBone = child;
        }
        if (child.isMesh && (child.name.toLowerCase().includes('head') || ((Array.isArray(child.material) ? child.material[0] : child.material)?.name || '').toLowerCase().includes('head'))) {
          headMesh = child;
        }
      });
      if (headBone && headMesh) return { object: headBone, headMesh };
      if (headMesh) return { object: headMesh, headMesh };
      if (headBone) return { object: headBone };
      let highest = null, highestY = -Infinity;
      avatarObj.traverse(child => {
        if (child.isBone || child.type === 'Bone') {
          const wp = new THREE.Vector3(); child.getWorldPosition(wp);
          if (wp.y > highestY) { highestY = wp.y; highest = child; }
        }
      });
      if (highest) return { object: highest };
      return { object: avatarObj.getObjectByName('Torso') || avatarObj };
    }

    function meshTopWorld(mesh) {
      if (!mesh?.geometry) return null;
      if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
      const bbox = mesh.geometry.boundingBox;
      const top = new THREE.Vector3((bbox.min.x + bbox.max.x) / 2, bbox.max.y, (bbox.min.z + bbox.max.z) / 2);
      mesh.localToWorld(top);
      return top;
    }

    function attachTopWorld(attachment) {
      if (!attachment) return null;
      if (attachment.isMesh) return meshTopWorld(attachment);
      const own = [];
      attachment.children.forEach(c => { if (c.isMesh && !c.userData?.isFaceOverlay) own.push(c); });
      if (own.length > 0) {
        const bbox = new THREE.Box3();
        own.forEach(m => bbox.expandByObject(m));
        if (!bbox.isEmpty()) return new THREE.Vector3((bbox.min.x + bbox.max.x) / 2, bbox.max.y, (bbox.min.z + bbox.max.z) / 2);
      }
      return attachment.getWorldPosition(new THREE.Vector3());
    }

    function loadPreviewAccessory(item) {
      if (!item.meshPath) return;
      const path = item.meshPath.toLowerCase();
      if (!path.endsWith('.fbx') && !path.endsWith('.glb') && !path.endsWith('.gltf')) return;

      const texLoader = new THREE.TextureLoader();
      const finishSetup = (modelRoot) => {
        const avatarObj = _p.avatar;
        const headPt = findPreviewHeadAttachment();
        const attachment = headPt.object;
        if (!attachment) return;

        avatarObj.updateMatrixWorld(true);
        modelRoot.updateMatrixWorld(true);

        modelRoot.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            for (const mat of mats) {
              if (!mat) continue;
              if (item.textures?.map) {
                const diffuse = texLoader.load(item.textures.map);
                diffuse.colorSpace = THREE.SRGBColorSpace;
                mat.map = diffuse;
              }
              if (item.textures?.normalMap) {
                mat.normalMap = texLoader.load(item.textures.normalMap);
                mat.normalScale = new THREE.Vector2(1, 1);
              }
              if (item.textures?.displacementMap) {
                mat.displacementMap = texLoader.load(item.textures.displacementMap);
                mat.displacementScale = 0.01;
              }
              mat.needsUpdate = true;
            }
          }
        });

        modelRoot.position.set(0, 0, 0);
        modelRoot.rotation.set(0, 0, 0);
        const o = item.offset || {};
        const scale = o.scale !== undefined ? o.scale : 1;
        modelRoot.scale.setScalar(scale);
        modelRoot.updateMatrixWorld(true);

        const bbox = new THREE.Box3().setFromObject(modelRoot);
        const center = bbox.getCenter(new THREE.Vector3());
        modelRoot.position.x -= center.x;
        modelRoot.position.y -= bbox.min.y;
        modelRoot.position.z -= center.z;

        const wrapper = new THREE.Group();
        wrapper.add(modelRoot);
        wrapper.userData.isAccessory = true;
        wrapper.traverse(node => { node.userData = node.userData || {}; node.userData.isAccessory = true; });

        _p.scene.add(wrapper);

        const headTopWorld =
          (headPt.headMesh ? meshTopWorld(headPt.headMesh) : attachTopWorld(attachment))
          || attachment.getWorldPosition(new THREE.Vector3());
        const attachmentQuat = attachment.getWorldQuaternion(new THREE.Quaternion());
        const localRot = new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rx || 0, o.ry || 0, o.rz || 0, 'XYZ'));
        const offsetWorld = new THREE.Vector3(o.x || 0, o.y !== undefined ? o.y : 0, o.z || 0).applyQuaternion(attachmentQuat);
        wrapper.position.copy(headTopWorld.clone().add(offsetWorld));
        wrapper.quaternion.copy(attachmentQuat).multiply(localRot);

        const updater = () => {
          if (!wrapper.parent) return;
          const htw =
            (headPt.headMesh ? meshTopWorld(headPt.headMesh) : attachTopWorld(attachment))
            || attachment.getWorldPosition(new THREE.Vector3());
          const aq = attachment.getWorldQuaternion(new THREE.Quaternion());
          wrapper.position.copy(htw.clone().add(new THREE.Vector3(o.x || 0, o.y !== undefined ? o.y : 0, o.z || 0).applyQuaternion(aq)));
          wrapper.quaternion.copy(aq).multiply(localRot);
        };

        _p.updaters.set(item.id, updater);
        _p.accessories[item.id] = wrapper;
      };

      if (path.endsWith('.fbx')) {
        new FBXLoader().load(item.meshPath, (fbx) => finishSetup(fbx), undefined, () => {});
      } else {
        new GLTFLoader().load(item.meshPath, (gltf) => finishSetup(gltf.scene), undefined, () => {});
      }
    }

    async function loadOwnedItems(uid) {
      try {
        const snap = await getDoc(doc(db, 'users', uid));
        if (snap.exists()) {
          const d = snap.data();
          ownedItems = d.ownedItems || [];
          userBux = d.bux || 0;

          if (!d.ownedItems) {
            ownedItems = [...STARTING_ITEMS];
            await setDoc(doc(db, 'users', uid), { ownedItems }, { merge: true });
          }
        } else {
          ownedItems = [...STARTING_ITEMS];
          await setDoc(doc(db, 'users', uid), { ownedItems }, { merge: true });
        }
      } catch {
        ownedItems = [...STARTING_ITEMS];
      }
      render();
    }

    onAuthStateChanged(auth, async (user) => {
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }

      if (user) {
        if (await banGuard(user.uid)) return;

        assignUserIdNum(user.uid).catch(() => {});
        trackPresence(user.uid, null, 'marketplace');

        let username = 'Player';
        let bux = 0;
        let userNum = null;
        let ownPreview = null;
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            username = data.username || username;
            bux = data.bux || 0;
            userNum = data.userIdNum;
            ownPreview = data.avatarPreview || null;
          }
        } catch {}

        const initial = username.charAt(0).toUpperCase();
        const _cb = Date.now();
        const ownProfileLink = userNum ? `/bloxverse/profile?user=${userNum}` : '/bloxverse/profile';
        navRight.innerHTML = `
          <div class="user-info">
            <div class="bux-wrapper" id="buxWrapper">
              <button class="bux-btn" id="buxBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text></svg>
                <span id="mpBuxVal">${bux.toLocaleString()}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
              </button>
              <div class="bux-dropdown">
                <div class="bux-dropdown-header">
                  <span class="bux-dropdown-label">Balance</span>
                  <span class="bux-dropdown-balance" id="buxDropdownBalance">${bux.toLocaleString()}</span>
                </div>
                <button class="bux-dropdown-item" onclick="window.openSendBuxModal()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-2 8-10V5l-8-3-8 3v7c0 8 8 10 8 10z"/></svg>
                  Send Bux
                </button>
                <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                  Transactions
                </button>
              </div>
            </div>
          <div class="settings-wrapper">
            <button class="settings-nav-btn" id="navSettingsBtn" title="Settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
            <div class="settings-dropdown" id="navSettingsDropdown">
              <button onclick="window.location.href='/bloxverse/settings'">Settings</button>
              <button onclick="window._logout()">Log Out</button>
            </div>
          </div>
          ${ownPreview
            ? `<img src="${ownPreview}?_cb=${_cb}" alt="" class="avatar-circle-img" onclick="window.location.href='${ownProfileLink}'" data-initial="${initial}" onerror="window.__handleBrokenAvatar(this, '${user.uid}')"/>`
            : `<div class="avatar-circle" onclick="window.location.href='${ownProfileLink}'">${initial}</div>`}
          </div>
        `;

        document.getElementById('buxBtn').addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('buxWrapper').classList.toggle('open');
        });
        // Settings dropdown toggle
        const closeSettings = () => {
          document.querySelectorAll('.settings-dropdown').forEach(d => d.classList.remove('open'));
        };
        const navSettingsBtn = document.getElementById('navSettingsBtn');
        if (navSettingsBtn) {
          navSettingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeSettings();
            const dd = document.getElementById('navSettingsDropdown');
            if (dd) dd.classList.toggle('open');
          });
        }

        document.addEventListener('click', (e) => {
          if (!e.target.closest('.settings-wrapper')) {
            closeSettings();
          }
          const bw = document.getElementById('buxWrapper');
          if (bw && !bw.contains(e.target)) bw.classList.remove('open');
        });

        buxUnsub = listenBux(user.uid, (buxAmount) => {
          userBux = buxAmount;
          const el = document.getElementById('mpBuxVal');
          if (el) el.textContent = buxAmount.toLocaleString();
          const balEl = document.getElementById('buxDropdownBalance');
          if (balEl) balEl.textContent = buxAmount.toLocaleString();
        });

        loadOwnedItems(user.uid);
      }
    });

    window.__handleBrokenAvatar = async function(imgEl, uid) {
      try {
        const initial = imgEl.getAttribute('data-initial') || 'U';
        const letter = document.createElement('div');
        letter.className = 'friend-thumb-avatar';
        letter.textContent = initial;
        imgEl.replaceWith(letter);
        try {
          if (auth && auth.currentUser && auth.currentUser.uid === uid) {
            const { setDoc, doc } = await import('https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js');
            await setDoc(doc(db, 'users', uid), { avatarPreview: null }, { merge: true });
          }
        } catch (e) { console.warn('Could not clear avatarPreview:', e); }
      } catch (e) { console.warn('Broken avatar handler error:', e); }
    };

    window._logout = async () => {
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }
      await signOut(auth);
      window.location.href = '/bloxverse/';
    };

    buildCatalog();
    render();
    initPreview();

    filterRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.mp-filter');
      if (!btn) return;
      filterRow.querySelectorAll('.mp-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });

    priceFilterBtn.addEventListener('click', () => {
      const modes = ['all', 'free', 'paid'];
      const cur = modes.indexOf(priceMode);
      priceMode = modes[(cur + 1) % modes.length];
      const labels = { all: 'All Prices', free: 'Free Only', paid: 'Paid Only' };
      priceFilterBtn.textContent = labels[priceMode];
      render();
    });

    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value;
      render();
    });

    btnBuy.addEventListener('click', () => {
      const id = btnBuy.dataset.id;
      const price = parseInt(btnBuy.dataset.price, 10);
      if (id && !btnBuy.disabled) purchaseItem(id, price);
    });

    function closeModal() {
      modal.classList.remove('open');
      cleanupPreviewItem();
    }
    btnModalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    window.openAuthorProfile = async (authorName) => {
      if (!authorName || authorName === 'BloxVerse') return;
      try {
        const q = query(collection(db, 'users'), where('username', '==', authorName));
        const snap = await getDocs(q);
        if (!snap.empty) {
          const data = snap.docs[0].data();
          if (data.userIdNum) {
            window.open('/bloxverse/profile?user=' + data.userIdNum, '_blank');
            return;
          }
        }
      } catch (e) { console.warn('Could not find author:', e); }
    };

    // ── Send Bux ─────────────────────────────────────────────────────────
    window.openSendBuxModal = () => {
      if (!auth.currentUser) return;
      const bux = Number(String(document.getElementById('buxDropdownBalance')?.textContent || '0').replace(/,/g, '')) || 0;
      let selectedUserId = null;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-content" style="max-width:500px;">
          <div class="modal-header">
            <h2>Send Bux</h2>
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
          </div>
          <div class="modal-body">
            <div class="modal-field">
              <label>Recipient</label>
              <input type="text" id="sendBuxSearch" placeholder="Search username..." autocomplete="off" />
              <div id="sendBuxResults" class="search-list" style="display:none;"></div>
            </div>

            <div id="sendBuxSelected" style="display:none;">
              <div class="modal-field">
                <label>Selected User</label>
                <div class="selected-badge">
                  <img id="sendBuxAvatar" src="" class="selected-avatar" />
                  <span id="sendBuxName"></span>
                </div>
              </div>
            </div>

            <div class="modal-field">
              <label>Amount</label>
              <div class="amount-row">
                <input type="number" id="sendBuxAmount" placeholder="Enter amount…" min="1" max="${bux}" />
                <span class="bux-label">BUX</span>
              </div>
            </div>

            <div class="warning-box" style="margin:0;">
              <strong>Warning:</strong> Bux transfers are final and cannot be undone.
            </div>
            <div id="sendBuxErr" class="error-msg" style="display:none;"></div>
          </div>
          <div class="modal-footer">
            <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="modal-btn confirm" id="sendBuxSendBtn" disabled>Send</button>
          </div>
        </div>`;

      overlay.querySelector('#sendBuxSendBtn').addEventListener('click', () => {
        const amount = parseInt(overlay.querySelector('#sendBuxAmount').value, 10);
        const username = overlay.querySelector('#sendBuxName').textContent;
        const errEl = overlay.querySelector('#sendBuxErr');
        if (!selectedUserId) return;
        if (isNaN(amount) || amount < 1) {
          errEl.textContent = 'Enter a valid positive amount.';
          errEl.style.display = 'block';
          return;
        }
        if (amount > bux) {
          errEl.textContent = 'You don\'t have enough BUX to send this amount.';
          errEl.style.display = 'block';
          return;
        }
        errEl.style.display = 'none';

        const confirmOverlay = document.createElement('div');
        confirmOverlay.className = 'modal-overlay';
        confirmOverlay.style.cssText = 'z-index:10000;background:rgba(0,0,0,0.8);';
        confirmOverlay.innerHTML = `
          <div class="modal-content" style="max-width:400px;">
            <div class="modal-header">
              <h3 style="font-size:16px;margin:0;">Confirm Transfer</h3>
            </div>
            <div class="modal-body">
              <p style="color:#ccc;font-size:14px;line-height:1.5;margin:0 0 16px;">
                Are you sure you want to send <strong style="color:#4caf50;">${amount.toLocaleString()} BUX</strong>
                to <strong style="color:#fff;">${username}</strong>?
              </p>
              <div class="warning-box" style="margin:0;">
                This transfer is <strong>final</strong>. You will not be able to recover these BUX.
              </div>
            </div>
            <div class="modal-footer">
              <button class="modal-btn cancel" id="confirmCancelBtn">Cancel</button>
              <button class="modal-btn confirm" id="confirmYesBtn" style="background:rgba(244,67,54,0.8);">Yes, Send</button>
            </div>
          </div>`;
        document.body.appendChild(confirmOverlay);

        confirmOverlay.querySelector('#confirmCancelBtn').addEventListener('click', () => confirmOverlay.remove());
        confirmOverlay.querySelector('#confirmYesBtn').addEventListener('click', async () => {
          try {
            await updateDoc(doc(db, 'users', auth.currentUser.uid), { bux: increment(-amount) });
            await updateDoc(doc(db, 'users', selectedUserId), { bux: increment(amount) });

            const _sSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
            const _sData = _sSnap.data();
            const _rSnap = await getDoc(doc(db, 'users', selectedUserId));
            const _rData = _rSnap.data();
            await logTransaction(auth.currentUser.uid, -amount, _sData?.bux || 0, 'SendBux', `Sent ${amount.toLocaleString()} BUX to ${username}`);
            await logTransaction(selectedUserId, amount, _rData?.bux || 0, 'SendBux', `Received ${amount.toLocaleString()} BUX from ${_sData?.username || 'Someone'}`);

            confirmOverlay.remove();
            overlay.remove();
          } catch (err) {
            console.error(err);
            overlay.querySelector('#sendBuxErr').textContent = 'Transfer failed. Try again.';
            overlay.querySelector('#sendBuxErr').style.display = 'block';
            confirmOverlay.remove();
          }
        });
      });

      document.body.appendChild(overlay);

      const searchInput = overlay.querySelector('#sendBuxSearch');
      const resultsEl = overlay.querySelector('#sendBuxResults');
      const selectedEl = overlay.querySelector('#sendBuxSelected');
      const nameEl = overlay.querySelector('#sendBuxName');
      const avatarEl = overlay.querySelector('#sendBuxAvatar');
      const sendBtn = overlay.querySelector('#sendBuxSendBtn');

      let searchTimer;
      let _allUsersCache = null;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        const term = searchInput.value.trim().toLowerCase();
        if (!term) { resultsEl.style.display = 'none'; return; }
        searchTimer = setTimeout(async () => {
          try {
            // Cache all users on first search
            if (!_allUsersCache) {
              const all = await getDocs(collection(db, 'users'));
              _allUsersCache = all.docs.map(d => ({ id: d.id, ...d.data() }));
            }
            const matches = _allUsersCache.filter(u => (u.username || '').toLowerCase().includes(term));
            if (matches.length === 0) {
              resultsEl.innerHTML = '<div class="empty-state">No users found</div>';
            } else {
              resultsEl.innerHTML = matches.slice(0, 50).map(f => `
                <div class="search-item" data-uid="${f.id}" data-name="${f.username || 'Unknown'}" data-avatar="${f.avatarPreview || ''}">
                  ${f.avatarPreview ? `<img src="${f.avatarPreview}" alt="" />` : `<div class="init-circle">${(f.username || 'U').charAt(0).toUpperCase()}</div>`}
                  <span>${f.username || 'Unknown'}</span>
                </div>`).join('');
              resultsEl.querySelectorAll('.search-item').forEach(el => {
                el.addEventListener('click', () => {
                  selectedUserId = el.dataset.uid;
                  nameEl.textContent = el.dataset.name;
                  avatarEl.src = el.dataset.avatar || '';
                  selectedEl.style.display = 'block';
                  resultsEl.style.display = 'none';
                  searchInput.value = '';
                  sendBtn.disabled = false;
                  overlay.querySelector('#sendBuxErr').style.display = 'none';
                  overlay.querySelector('#sendBuxAmount').focus();
                });
              });
            }
            resultsEl.style.display = 'block';
          } catch (err) {
            console.error(err);
            resultsEl.innerHTML = '<div class="empty-state">Search error</div>';
          }
        }, 200);
      });

      document.addEventListener('click', (e) => {
        if (overlay.contains(e.target)) return;
        if (resultsEl.style.display === 'block') resultsEl.style.display = 'none';
      }, { once: true });
    };
  </script>
</body>
