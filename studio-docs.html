    <script>
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function renderMarkdown(md) {
            const lines = md.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
            let html = '', inCodeBlock = false, codeLang = '', codeContent = '', listType = null;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const isCodeFence = /^\s*```/.test(line);
                if (isCodeFence) {
                    if (inCodeBlock) {
                        html += '<pre><code>' + escapeHtml(codeContent.replace(/\n$/, '')) + '</code></pre>\n';
                        codeContent = ''; inCodeBlock = false;
                    } else { inCodeBlock = true; codeLang = line.replace(/^\s*```/, '').trim(); }
                    continue;
                }
                if (inCodeBlock) { codeContent += line + '\n'; continue; }
                if (line.trim() === '') { if (listType) { html += '</' + listType + '>\n'; listType = null; } continue; }
                const h4Match = line.match(/^#### (.+)/);
                if (h4Match) { if (listType) { html += '</' + listType + '>\n'; listType = null; } html += '<h4>' + inlineFormat(h4Match[1]) + '</h4>\n'; continue; }
                const h3Match = line.match(/^### (.+)/);
                if (h3Match) { if (listType) { html += '</' + listType + '>\n'; listType = null; } html += '<h3>' + inlineFormat(h3Match[1]) + '</h3>\n'; continue; }
                const h2Match = line.match(/^## (.+)/);
                if (h2Match) { if (listType) { html += '</' + listType + '>\n'; listType = null; } html += '<h2>' + inlineFormat(h2Match[1]) + '</h2>\n'; continue; }
                const h1Match = line.match(/^# (.+)/);
                if (h1Match) { if (listType) { html += '</' + listType + '>\n'; listType = null; } html += '<h1>' + inlineFormat(h1Match[1]) + '</h1>\n'; continue; }
                const hrMatch = line.match(/^---$/);
                if (hrMatch) { if (listType) { html += '</' + listType + '>\n'; listType = null; } html += '<hr>\n'; continue; }
                const ulMatch = line.match(/^- (.+)/);
                if (ulMatch) { if (listType !== 'ul') { if (listType) html += '</' + listType + '>\n'; html += '<ul>\n'; listType = 'ul'; } html += '<li>' + inlineFormat(ulMatch[1]) + '</li>\n'; continue; }
                const olMatch = line.match(/^\d+\.\s+(.+)/);
                if (olMatch) { if (listType !== 'ol') { if (listType) html += '</' + listType + '>\n'; html += '<ol>\n'; listType = 'ol'; } html += '<li>' + inlineFormat(olMatch[1]) + '</li>\n'; continue; }
                if (listType) { html += '</' + listType + '>\n'; listType = null; }
                html += '<p>' + inlineFormat(line) + '</p>\n';
            }
            if (inCodeBlock) html += '<pre><code>' + escapeHtml(codeContent.replace(/\n$/, '')) + '</code></pre>\n';
            if (listType) html += '</' + listType + '>\n';
            return html;
        }
        function inlineFormat(text) {
            return text.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2">$1</a>');
        }
        const STUDIO_MD = `# BloxVerse Studio

BloxVerse Studio is the built-in 3D editor for creating and editing game worlds. It works alongside the Script Editor on the Create page.

---

## Getting Started

Open the **Studio** tab on the [Create](/bloxverse/create.html) page. The 3D viewport shows your game world. Use the Explorer on the left to see all parts, and the Properties panel on the right to edit the selected part.

### Default Map

When you open a new project, the world contains:
- **Baseplate** — A large green anchored block
- **Spawn** — A blue anchored block where players appear

---

## Tools

The toolbar at the top of the viewport provides these tools:

| Tool | Icon | Shortcut | Behavior |
|------|------|----------|----------|
| Select | Click (cursor) | **Q** | Click any part to select it |
| Move | Cross-arrows | **W** | Drag arrows to move a part along X/Y/Z |
| Rotate | Circle | **E** | Drag rings to rotate a part |
| Scale | Square with arrows | **R** | Drag handles to resize a part |

When using Move, Rotate, or Scale, click and drag the colored handles on the **gizmo** (the 3D widget) to transform the part. The red/green/blue handles correspond to X/Y/Z axes.

**Note:** In Move/Rotate/Scale mode, clicking on a different part in the viewport will **not** change your selection — you must switch to Select mode (Q) to pick a different part.

---

## Explorer Panel

The Explorer (left sidebar) shows the complete hierarchy of your game:

### Hierarchy Services
- **Workspace** — Container for all physical objects (Parts, Lights, Spawns). Only objects here are visible in the 3D viewport.
- **Lighting** — Container for environmental effects like the **Sky** and **Atmosphere**.
- **ReplicatedStorage** — Used for storing assets (like Parts or Scripts) that should be shared but not necessarily visible in the world.
- **StarterGui** — Container for your 2D user interfaces (**ScreenGui**).
- **Players** — Container for Player instances that join the game.

### Common Objects
- **Folder** — Use these to organize your parts and scripts.
- **Part** — Basic building blocks (Block, Sphere, Cylinder).
- **Sound** — Audio objects. Paste a URL into the **SoundId** property to play music or effects.
- **PointLight** — Localized light sources. Control **Range**, **Brightness**, and **Color**.
- **ScreenGui** / **SurfaceGui** — Containers for 2D UI elements like **Frame**, **TextLabel**, and **TextButton**.
- **IntValue** / **StringValue** / **NumberValue** / **BoolValue** — Value objects for data storage and leaderstats.

### Actions
Right-click any object in the Explorer to:
- **Rename** — Edit the name inline.
- **Delete** — Remove the object.
- **Add Object** — Add a child object (Parts, Scripts, Folders, etc.).

---

## Properties Panel

The Properties panel (right sidebar) dynamically updates based on the selected object:

| Object Type | Key Properties |
|-------------|----------------|
| **Part** | Position, Size, Color, Anchored, CanCollide, Transparency, Shape |
| **Sound** | SoundId, Volume, Playing, Looped |
| **PointLight** | Color, Brightness, Range, Shadows, Enabled |
| **TextLabel** | Text, TextColor, TextTransparency, BackgroundColor, BackgroundTransparency, FontSize, Visible, Position, Size |
| **Frame** | BackgroundColor, BackgroundTransparency, Visible, Position, Size |
| **TextButton** | Text, TextColor, TextTransparency, BackgroundColor, BackgroundTransparency, FontSize, Visible, Position, Size |
| **ScreenGui** | Enabled |
| **SurfaceGui** | Enabled, Face, CanvasSize |
| **Sky** | SkyboxColor, SunColor, Brightness, Sun Position |
| **Atmosphere** | Density, Offset, FogColor |
| **Script** | Source |
| **IntValue** | Value (number) |
| **StringValue** | Value (string) |
| **NumberValue** | Value (number) |
| **BoolValue** | Value (boolean) |
| **Folder** | (name only) |

---

## Undo / Redo

- **Ctrl+Z** — Undo the last action
- **Ctrl+Y** — Redo the last undone action

---

## Keyboard Shortcuts Summary

| Shortcut | Action |
|----------|--------|
| **Q** | Select tool |
| **W** | Move tool |
| **E** | Rotate tool |
| **R** | Scale tool |
| **F** | Frame selected |
| **Enter** | Finish renaming in Explorer |
| **Escape** | Cancel renaming in Explorer |
| **Delete** | Delete selected object |

---

## FAQ & Tips

### FAQ
- **Q: Why can't I see my part in the viewport?**
  - A: Ensure the part is a descendant of **Workspace**. Objects in other services are hidden.
- **Q: How do I play sounds?**
  - A: Add a **Sound** object, paste a valid audio URL into **SoundId**, and check the **Playing** property.
- **Q: How do I make a UI?**
  - A: Add a **ScreenGui** to **StarterGui**, then add **Frames** or **Labels** inside it.
- **Q: How do I make a leaderboard?**
  - A: Create a Folder named \`leaderstats\` inside a Player, then add IntValue/StringValue children. The leaderboard appears automatically.
- **Q: How do I use SurfaceGui?**
  - A: Add a **SurfaceGui** inside a Part, set its **Face** property, and add Frame/TextLabel children. It will render on the part's surface.

### Tips
- Name your objects descriptively to keep your hierarchy organized.
- Use **Folders** to group related parts (e.g., "House", "Forest").
- **Anchored** parts are essential for static structures; uncheck it for physics objects.
- Use **BackgroundTransparency** to create invisible clickable buttons.
- For SurfaceGui, make sure **CanvasSize** is large enough for your content.
- Leaderstats update in real-time — just change the \`Value\` property.
`;
        const html = renderMarkdown(STUDIO_MD);
        document.getElementById('content').innerHTML = '<a href="/bloxverse/create.html" class="back-to-editor">← Back to Studio</a>' + html;
        const headings = document.querySelectorAll('#content h2, #content h3, #content h4');
        const sidebar = document.getElementById('sidebar');
        const tocLinks = [];
        headings.forEach(heading => {
            const level = heading.tagName === 'H2' ? 'toc-h2' : heading.tagName === 'H3' ? 'toc-h3' : 'toc-h4';
            const id = 'section-' + Math.random().toString(36).slice(2, 8);
            heading.id = id;
            const link = document.createElement('a');
            link.href = '#' + id; link.textContent = heading.textContent; link.className = level;
            sidebar.appendChild(link); tocLinks.push(link);
        });
        let lastActiveId = null;
        function updateActiveSection() {
            let currentId = null;
            const scrollPos = window.scrollY + 100;
            headings.forEach(h => { if (h.offsetTop <= scrollPos) currentId = h.id; });
            if (currentId && currentId !== lastActiveId) {
                lastActiveId = currentId;
                tocLinks.forEach(link => link.classList.toggle('active', link.getAttribute('href') === '#' + currentId));
                const activeLink = tocLinks.find(link => link.getAttribute('href') === '#' + currentId);
                if (activeLink) activeLink.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }
        window.addEventListener('scroll', updateActiveSection, { passive: true });
        updateActiveSection();
    </script>
