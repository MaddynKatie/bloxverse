<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

    <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Login</title>
  <link rel="stylesheet" href="src/auth.css" />

  <link rel="stylesheet" href="src/theme.css" />
  <script type="module" src="src/theme.js"></script>
  <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
</head>

<body>
  <div class="auth-container">
    <div class="auth-header">
      <h1>BloxVerse</h1>
      <p id="authSubtitle">Sign in to continue</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Login</button>
      <button class="auth-tab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div class="auth-success" id="authSuccess"></div>

    <!-- Login Form -->
    <form class="auth-form active" id="loginForm">
      <div class="form-group">
        <label for="loginEmail">Username or Email</label>
        <input type="text" id="loginEmail" placeholder="Enter your username or email" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required />
      </div>
      <div style="text-align:right;margin-top:-8px;margin-bottom:12px;">
        <a href="#" class="forgot-link" onclick="showForgotPassword();return false;">Forgot password?</a>
      </div>
      <div class="form-error" id="loginError"></div>
      <button type="submit" class="auth-submit" id="loginBtn">Login</button>
    </form>

    <!-- Forgot Password Form -->
    <form class="auth-form" id="forgotForm">
      <div style="margin-bottom:20px;">
        <p style="color:var(--text-muted);font-size:13px;line-height:1.5;">
          Enter the verified email on your account and we'll send you a reset link.
        </p>
      </div>
      <div class="form-group">
        <label for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <div class="h-captcha" data-sitekey="42382d9c-3d68-424a-a678-f1e46ac4789a" id="forgotCaptchaContainer"></div>
      </div>
      <div class="form-error" id="forgotError"></div>
      <div class="auth-success" id="forgotSuccess" style="display:none;text-align:center;padding:12px;border-radius:8px;margin-bottom:16px;"></div>
      <button type="submit" class="auth-submit" id="forgotBtn">Send Reset Link</button>
      <div style="text-align:center;margin-top:14px;">
        <a href="#" class="forgot-link" onclick="showLogin();return false;">← Back to login</a>
      </div>
    </form>

    <!-- Signup Form -->
    <form class="auth-form" id="signupForm">
      <div class="form-group">
        <label for="signupUsername">Username</label>
        <input type="text" id="signupUsername" placeholder="Choose a username" required minlength="3" maxlength="20" autocomplete="off" />
        <div class="field-error" id="usernameError"></div>
      </div>
      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="Enter your email" required />
        <div class="field-error" id="emailError"></div>
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Create a password" required minlength="6" />
        <div class="password-strength" id="passwordStrength">
          <div class="strength-bar"></div>
          <div class="strength-bar"></div>
          <div class="strength-bar"></div>
          <div class="strength-bar"></div>
        </div>
        <div class="strength-text" id="strengthText"></div>
        <div class="field-error" id="passwordError"></div>
      </div>
      <div class="form-group">
        <label for="signupConfirm">Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Confirm your password" required />
        <div class="field-error" id="confirmError"></div>
      </div>
      <div class="form-group">
        <label for="signupBirthday">Birthday</label>
        <input type="date" id="signupBirthday" required />
        <div class="field-error" id="birthdayError"></div>
      </div>
      <div class="form-group terms-group">
        <label class="terms-label">
          <input type="checkbox" id="signupTerms" required />
          <span>I agree to the <a href="/bloxverse/terms" target="_blank">Terms of Service</a> and <a href="/bloxverse/privacy" target="_blank">Privacy Policy</a></span>
        </label>
        <div class="field-error" id="termsError"></div>
      </div>
      <div class="form-error" id="signupError"></div>
      <button type="submit" class="auth-submit" id="signupBtn">Sign Up</button>
    </form>
  </div>

  <script type="module" src="src/auth.js"></script>
</body>

</html>
