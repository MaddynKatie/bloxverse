<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Avatar Editor</title>
  <link rel="stylesheet" href="src/theme.css" />
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script type="module" src="src/theme.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg-primary); overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    .editor-page {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* ── LEFT PANEL (avatar preview + color swatches) ── */
    .editor-panel {
      width: 320px;
      min-width: 220px;
      background: var(--bg-surface);
      border-right: var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      z-index: 10;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 12px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .back-btn:hover { color: var(--text-primary); }

    .editor-panel h2 {
      color: var(--text-primary);
      font-size: 22px;
      margin: 0 0 2px 0;
      font-weight: 700;
    }
    .editor-panel .subtitle { display: none; }

    /* Avatar 3D viewer lives inside the left panel */
    .viewer-container {
      width: 100%;
      aspect-ratio: 1 / 1.1;
      background: var(--bg-surface);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      margin: 12px 0;
      flex-shrink: 0;
    }
    .viewer-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .viewer-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-muted);
      font-size: 11px;
      user-select: none;
      pointer-events: none;
    }
    .viewer-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px; height: 32px;
      border: none;
      border-radius: 8px;
      background: color-mix(in srgb, var(--text-primary) 10%, transparent);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 5;
      backdrop-filter: blur(4px);
    }
    .viewer-btn:hover { color: var(--text-primary); }
    .viewer-btn.active { color: var(--accent); }

    /* Gender toggle */
    .gender-toggle {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .gender-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .gender-btn.active {
      background: var(--text-primary);
      color: var(--bg-primary);
      border-radius: 6px;
    }

    /* Color swatches grid — 3 per row with labels */
    .color-swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .color-swatch-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .color-swatch-item input[type="color"] {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      padding: 3px;
      background: none;
    }
    .color-swatch-item input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-swatch-item input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }
    .color-swatch-item input[type="color"]:hover { border-color: var(--text-muted); }
    .color-swatch-label {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Hide old color-group layout */
    .color-groups .color-group { display: none; }

    .editor-actions {
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-save {
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: background 0.15s;
    }
    .btn-save:hover { background: var(--accent-hover); }

    .btn-reset {
      padding: 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s;
    }
    .btn-reset:hover { background: var(--bg-tertiary); }

    /* ── RIGHT PANEL (catalog) ── */
    .catalog-panel {
      flex: 1;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tabs along top of catalog */
    .editor-tabs {
      display: flex;
      gap: 0;
      padding: 14px 20px 0;
      border-bottom: 2px solid var(--border);
      background: var(--bg-surface);
    }
    .editor-tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
    }
    .editor-tab.active { color: var(--text-primary); border-bottom-color: var(--text-primary); }
    .editor-tab:hover:not(.active) { color: var(--text-secondary); }

    /* Tab content = scrollable catalog */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      display: none;
      padding: 20px;
    }
    .tab-content.active { display: block; }

    /* Category label like "SHIRTS" */
    .catalog-category-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 0 0 12px 0;
    }

    /* 4-column grid */
    .clothing-grid, .accessories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    /* Cards */
    .clothing-item, .acc-item {
      background: var(--bg-surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .clothing-item:hover, .acc-item:hover { border-color: var(--border-strong); background: var(--bg-secondary); }
    .clothing-item.equipped, .acc-item.equipped { border-color: var(--accent); background: var(--bg-secondary); }

    .clothing-item-preview, .acc-item-icon {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg-tertiary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
      font-size: 28px;
    }
    .clothing-item-preview img, .acc-item-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .clothing-item-name, .acc-item-name {
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .clothing-item-meta, .acc-item-category { display: none; }

    .acc-empty {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 40px 10px;
      grid-column: 1 / -1;
    }

    /* Toast */
    .save-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    .save-toast.show { opacity: 1; }

    /* Scrollbars */
    .editor-panel::-webkit-scrollbar, .tab-content::-webkit-scrollbar { width: 5px; }
    .editor-panel::-webkit-scrollbar-track, .tab-content::-webkit-scrollbar-track { background: transparent; }
    .editor-panel::-webkit-scrollbar-thumb, .tab-content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
    .editor-panel, .tab-content { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }

    /* Resize handle */
    .resize-handle {
      width: 6px;
      cursor: col-resize;
      flex-shrink: 0;
      background: var(--border);
      position: relative;
      z-index: 20;
      user-select: none;
    }
    .resize-handle:hover { background: var(--border-strong); }
  </style>
  <script src="js/sw-register.js" defer></script>
</head>
<body>
  <div class="editor-page">
    <!-- LEFT: avatar preview + color pickers -->
    <div class="editor-panel" id="editorPanel">
      <button class="back-btn" id="backBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Back
      </button>

      <!-- 3D viewer embedded in left panel -->
      <div class="viewer-container" id="viewerContainer">
        <button class="viewer-btn active" id="rotateToggle" title="Toggle auto-rotate">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>

      <!-- Color swatches — populated by JS -->
      <div class="color-swatches" id="colorSwatches"></div>
      <!-- Hidden original color groups (still used by JS internally) -->
      <div style="display:none"><div class="color-groups" id="colorGroups"></div></div>

      <div class="editor-actions">
        <button class="btn-save" id="btnSave">Save</button>
        <button class="btn-reset" id="btnReset">Reset to Defaults</button>
      </div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>

    <!-- RIGHT: catalog tabs + grid -->
    <div class="catalog-panel">
      <div class="editor-tabs">
        <button class="editor-tab active" data-tab="clothing">Clothing</button>
        <button class="editor-tab" data-tab="faces">Faces</button>
        <button class="editor-tab" data-tab="accessories">Accessories</button>
      </div>

      <div class="tab-content active" id="tabClothing">
        <p class="catalog-category-label">Shirts</p>
        <div class="clothing-grid" id="clothingGrid"></div>
        <p class="catalog-category-label">Pants</p>
        <div class="clothing-grid" id="pantsGrid"></div>
      </div>

      <div class="tab-content" id="tabFaces">
        <p class="catalog-category-label">Faces</p>
        <div class="clothing-grid" id="facesGrid"></div>
      </div>

      <div class="tab-content" id="tabAccessories">
        <p class="catalog-category-label">Accessories</p>
        <div class="accessories-grid" id="accGrid"></div>
      </div>
    </div>
  </div>

  <div class="save-toast" id="saveToast">Avatar saved!</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { auth, db, getDoc, doc, setDoc, trackPresence } from './src/firebase.js';
    import { accessories, getAllAccessories, findAccessory } from './src/accessories.js';
    import { applyAvatarClothing, removeAvatarClothing, applyAvatarPants, removeAvatarPants, findClothing, getAllClothing, preloadTexture } from './src/clothing.js';
    import { getAllFaces, findFace } from './src/faces.js';
    const STARTING_ITEMS = ['palhair', 'smile', 'blueandblackmotorcycleshirt'];
    const playerModelUrl = new URL('./assets/models/player.fbx', import.meta.url).href;

    const container = document.getElementById('viewerContainer');
    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(3, 2.5, 9);
    camera.lookAt(0, 1.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.LinearToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    // Ensure layout is done before setting size
    setTimeout(() => onResize(), 100);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enableRotate = true;
    controls.enableZoom = true;
    controls.enablePan = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 2;
    controls.update();

    document.getElementById('rotateToggle').addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      document.getElementById('rotateToggle').classList.toggle('active');
    });

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x666666, 0);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(4, 6, 5);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
    fillLight.position.set(-4, 2, -3);
    scene.add(fillLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.4);
    backLight.position.set(0, 3, -6);
    scene.add(backLight);

    const rimLight = new THREE.DirectionalLight(0xffffff, 0.3);
    rimLight.position.set(0, -1, 6);
    scene.add(rimLight);

    let avatar = null;
    const materialMap = new Map();
    let currentColors = {};
    let _materialList = [];
    let _originalColors = {};
    const _clothingPreviewCache = new Map();
    let _previewRenderer = null;

    function applyColors() {
      for (const [mat, name] of materialMap) {
        if (currentColors[name]) {
          mat.vertexColors = false;
          mat.emissive && mat.emissive.setHex(0);
          mat.emissiveIntensity = 0;
          mat.toneMapped = false;
          mat.transparent = false;
          mat.opacity = 1;
          mat.color.setStyle(currentColors[name], THREE.SRGBColorSpace);
          mat.needsUpdate = true;
        }
      }
    }

    const fbxLoader = new FBXLoader();
    const gltfLoader = new GLTFLoader();

    let _ownedItems = [];
    let _equippedAccessories = {};
    let _loadedAccessories = {};
    const _accessoryUpdaters = new Map();
    let _selectedClothingId = null;
    let _selectedPantsId = null;
    let _equippedFaceId = 'smile';
    let _faceOverlayMesh = null;
    let _charHeight = 0;

    function findHighestBone(obj) {
      let highest = null;
      let highestY = -Infinity;
      obj.traverse(child => {
        if (child.isBone || child.type === 'Bone') {
          const worldPos = new THREE.Vector3();
          child.getWorldPosition(worldPos);
          if (worldPos.y > highestY) {
            highestY = worldPos.y;
            highest = child;
          }
        }
      });
      return highest;
    }

    function findHeadAttachment(avatarObj) {
      let headBone = null;
      let headMesh = null;
      avatarObj.traverse(child => {
        if ((child.isBone || child.type === 'Bone') && child.name.toLowerCase().includes('head') && !child.name.toLowerCase().includes('_end')) {
          headBone = child;
        }
        if (child.isMesh && (child.name.toLowerCase().includes('head') || (child.material && (
          (Array.isArray(child.material) ? child.material[0] : child.material).name || ''
        ).toLowerCase().includes('head')))) {
          headMesh = child;
        }
      });
      if (headBone && headMesh) return { object: headBone, type: 'bone', headMesh };
      if (headMesh) return { object: headMesh, type: 'mesh', headMesh };
      if (headBone) return { object: headBone, type: 'bone' };
      const highestBone = findHighestBone(avatarObj);
      if (highestBone) {
        console.log('[Accessory] Using highest bone:', highestBone.name);
        return { object: highestBone, type: 'bone', fallback: true };
      }
      const torso = findBone(avatarObj, 'Torso');
      if (torso) return { object: torso, type: 'bone', fallback: true };
      return null;
    }

    function findBone(obj, name) {
      let found = null;
      obj.traverse(child => {
        if ((child.isBone || child.type === 'Bone') && child.name === name) {
          found = child;
        }
      });
      return found;
    }

    function isAccessoryNode(obj) {
      return obj?.userData?.isAccessory === true;
    }

    function getHeadTopWorldPosition(avatarObj) {
      let topWorld = null;
      avatarObj.traverse(child => {
        if (isAccessoryNode(child) || child.userData?.isFaceOverlay) return;
        if (child.isMesh) {
          if (!child.geometry.boundingBox) {
            child.geometry.computeBoundingBox();
          }
          const bbox = child.geometry.boundingBox;
          const topLocal = new THREE.Vector3((bbox.min.x + bbox.max.x) / 2, bbox.max.y, (bbox.min.z + bbox.max.z) / 2);
          const worldPos = topLocal.clone();
          child.localToWorld(worldPos);
          if (!topWorld || worldPos.y > topWorld.y) {
            topWorld = worldPos;
          }
        }
      });
      return topWorld;
    }

    function getMeshTopWorldPosition(mesh) {
      if (!mesh || !mesh.geometry) return null;
      if (!mesh.geometry.boundingBox) {
        mesh.geometry.computeBoundingBox();
      }
      const bbox = mesh.geometry.boundingBox;
      const topLocal = new THREE.Vector3((bbox.min.x + bbox.max.x) / 2, bbox.max.y, (bbox.min.z + bbox.max.z) / 2);
      const worldPos = topLocal.clone();
      mesh.localToWorld(worldPos);
      return worldPos;
    }

    function getAttachmentTopWorldPosition(attachment) {
      if (!attachment) return null;
      if (attachment.isMesh) return getMeshTopWorldPosition(attachment);

      const ownMeshes = [];
      attachment.children.forEach(child => {
        if (child.isMesh && !child.userData?.isFaceOverlay) ownMeshes.push(child);
      });

      if (ownMeshes.length > 0) {
        const bbox = new THREE.Box3();
        ownMeshes.forEach(mesh => bbox.expandByObject(mesh));
        if (!bbox.isEmpty()) {
          const topLocal = new THREE.Vector3(
            (bbox.min.x + bbox.max.x) / 2,
            bbox.max.y,
            (bbox.min.z + bbox.max.z) / 2
          );
          return topLocal; // already world space from expandByObject
        }
      }

      return attachment.getWorldPosition(new THREE.Vector3());
    }

    function loadAccessory(accDef, avatarObj) {
      if (!avatarObj) return;

      const texLoader = new THREE.TextureLoader();
      const path = accDef.meshPath.toLowerCase();

      const finishSetup = (modelRoot) => {
        const headPt = findHeadAttachment(avatarObj);
        if (!headPt) {
          console.warn('No head attachment found');
          return;
        }

        avatarObj.updateMatrixWorld(true);
        modelRoot.updateMatrixWorld(true);

        modelRoot.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;

            const mats = Array.isArray(child.material)
              ? child.material
              : [child.material];

            for (const mat of mats) {
              if (!mat) continue;

              if (accDef.textures?.map) {
                const diffuse = texLoader.load(accDef.textures.map);
                diffuse.colorSpace = THREE.SRGBColorSpace;
                mat.map = diffuse;
              }

              if (accDef.textures?.normalMap) {
                mat.normalMap = texLoader.load(accDef.textures.normalMap);
                mat.normalScale = new THREE.Vector2(1, 1);
              }

              if (accDef.textures?.displacementMap) {
                mat.displacementMap = texLoader.load(accDef.textures.displacementMap);
                mat.displacementScale = 0.01;
              }

              mat.needsUpdate = true;
            }
          }
        });

        modelRoot.position.set(0, 0, 0);
        modelRoot.rotation.set(0, 0, 0);

        const o = accDef.offset || {};
        const scale = o.scale !== undefined ? o.scale : 1;

        modelRoot.scale.setScalar(scale);
        modelRoot.updateMatrixWorld(true);

        const bbox = new THREE.Box3().setFromObject(modelRoot);
        const center = bbox.getCenter(new THREE.Vector3());

        modelRoot.position.x -= center.x;
        modelRoot.position.y -= bbox.min.y;
        modelRoot.position.z -= center.z;

        const wrapper = new THREE.Group();
        wrapper.add(modelRoot);

        wrapper.userData.isAccessory = true;

        wrapper.traverse(node => {
          node.userData = node.userData || {};
          node.userData.isAccessory = true;
        });

        const attachment = headPt.object;

        const localRot = new THREE.Quaternion().setFromEuler(
          new THREE.Euler(
            o.rx || 0,
            o.ry || 0,
            o.rz || 0,
            'XYZ'
          )
        );

        scene.add(wrapper);

        const headTopWorld =
          (headPt.headMesh
            ? getMeshTopWorldPosition(headPt.headMesh)
            : getAttachmentTopWorldPosition(attachment))
          || attachment.getWorldPosition(new THREE.Vector3());

        const attachmentQuat =
          attachment.getWorldQuaternion(new THREE.Quaternion());

        const offsetWorld = new THREE.Vector3(
          o.x || 0,
          o.y !== undefined ? o.y : 0,
          o.z || 0
        ).applyQuaternion(attachmentQuat);

        wrapper.position.copy(headTopWorld.clone().add(offsetWorld));

        wrapper.quaternion.copy(attachmentQuat).multiply(localRot);

        const updateId = accDef.id;

        const updater = () => {
          if (!wrapper.parent) return;

          const headTop =
            (headPt.headMesh
              ? getMeshTopWorldPosition(headPt.headMesh)
              : getAttachmentTopWorldPosition(attachment))
            || attachment.getWorldPosition(new THREE.Vector3());

          const attachmentQ =
            attachment.getWorldQuaternion(new THREE.Quaternion());

          const targetWorld = headTop.clone().add(
            new THREE.Vector3(
              o.x || 0,
              o.y !== undefined ? o.y : 0,
              o.z || 0
            ).applyQuaternion(attachmentQ)
          );

          wrapper.position.copy(targetWorld);
          wrapper.quaternion.copy(attachmentQ).multiply(localRot);
        };

        _accessoryUpdaters.set(updateId, updater);
        _loadedAccessories[accDef.id] = wrapper;
      };

      // FBX
      if (path.endsWith('.fbx')) {
        const loader = new FBXLoader();

        loader.load(
          accDef.meshPath,
          (fbx) => finishSetup(fbx),
          undefined,
          (err) => console.error('FBX load failed:', err)
        );
      }

      // GLB / GLTF
      else if (path.endsWith('.glb') || path.endsWith('.gltf')) {
        const loader = new GLTFLoader();

        loader.load(
          accDef.meshPath,
          (gltf) => finishSetup(gltf.scene),
          undefined,
          (err) => console.error('GLTF load failed:', err)
        );
      }

      else {
        console.warn('Unsupported accessory format:', accDef.meshPath);
      }
    }

    function getMatLabel(name) { return name; }

    function buildColorPickers(materials) {
      // Hidden original groups (used for internal id references)
      const container = document.getElementById('colorGroups');
      container.innerHTML = '';
      for (const matName of materials) {
        const div = document.createElement('div');
        div.className = 'color-group';
        div.innerHTML = `<div class="color-input-wrap"><input type="color" id="c_${matName}" value="#888888" /><span class="color-hex" id="h_${matName}">#888888</span></div>`;
        container.appendChild(div);
        const input = div.querySelector('input');
        input.addEventListener('input', () => {
          currentColors[matName] = input.value;
          const hexEl = document.getElementById('h_' + matName);
          if (hexEl) hexEl.textContent = input.value;
          // Sync swatch
          const sw = document.getElementById('sw_' + matName);
          if (sw) sw.value = input.value;
          applyColors();
        });
      }

      // Visible swatch grid
      const swatches = document.getElementById('colorSwatches');
      swatches.innerHTML = '';
      for (const matName of materials) {
        const label = getMatLabel(matName);
        const item = document.createElement('div');
        item.className = 'color-swatch-item';
        item.innerHTML = `<input type="color" id="sw_${matName}" value="#888888" /><span class="color-swatch-label">${label}</span>`;
        swatches.appendChild(item);
        const sw = item.querySelector('input');
        sw.addEventListener('input', () => {
          currentColors[matName] = sw.value;
          const hidden = document.getElementById('c_' + matName);
          if (hidden) hidden.value = sw.value;
          const hexEl = document.getElementById('h_' + matName);
          if (hexEl) hexEl.textContent = sw.value;
          applyColors();
        });
      }
    }

    function updateColorPickersFromSaved(saved) {
      for (const [name, hex] of Object.entries(saved)) {
        currentColors[name] = hex;
        const el = document.getElementById('c_' + name);
        const hexEl = document.getElementById('h_' + name);
        const sw = document.getElementById('sw_' + name);
        if (el) el.value = hex;
        if (hexEl) hexEl.textContent = hex;
        if (sw) sw.value = hex;
      }
      applyColors();
    }

    function loadAvatar() {
      fbxLoader.load(playerModelUrl, (fbx) => {
        if (avatar) {
          scene.remove(avatar);
          avatar = null;
          materialMap.clear();
          _materialList = [];
        }

        const uniqueMats = new Map();

        fbx.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.geometry) {
              for (const key of Object.keys(child.geometry.attributes)) {
                if (key.toLowerCase().includes('color')) {
                  child.geometry.deleteAttribute(key);
                }
              }
              if (child.geometry.morphAttributes) {
                for (const key of Object.keys(child.geometry.morphAttributes)) {
                  if (key.toLowerCase().includes('color')) {
                    delete child.geometry.morphAttributes[key];
                  }
                }
              }
            }
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            for (let i = 0; i < mats.length; i++) {
              const mat = mats[i];
              if (!mat) continue;
              const name = mat.name || child.name || 'Body';
              const originalColor = mat.color ? mat.color.getHex() : 0xcccccc;
              const newMat = new THREE.MeshStandardMaterial({
                color: originalColor,
                map: mat.map,
                transparent: false,
                opacity: 1,
                toneMapped: false,
                vertexColors: false,
                emissive: 0,
                emissiveIntensity: 0,
                roughness: 0.8,
                metalness: 0.1,
              });
              mats[i] = newMat;
              if (!uniqueMats.has(name)) {
                uniqueMats.set(name, newMat);
              }
              materialMap.set(newMat, name);
            }
          }
        });

        const matNameList = Array.from(uniqueMats.keys());
        _materialList = matNameList;
        currentColors = {};
        _originalColors = {};
        const DEFAULT_COLORS = { Body: '#2d8a4e', Legs: '#2a6bb0', Arms: '#d4a017', Head: '#c4a882' };
        for (const name of matNameList) {
          const mat = uniqueMats.get(name);
          const hex = DEFAULT_COLORS[name] || '#cccccc';
          currentColors[name] = hex;
          _originalColors[name] = hex;
          mat.color.setStyle(hex, THREE.SRGBColorSpace);
          mat.needsUpdate = true;
        }

        buildColorPickers(matNameList);
        updateColorPickersFromSaved(currentColors);

        const box = new THREE.Box3().setFromObject(fbx);
        const footOffset = -box.min.y;
        const charHeight = box.max.y - box.min.y;
        fbx.position.y = footOffset;
        fbx.updateMatrixWorld(true);

        controls.target.set(0, charHeight * 0.45, 0);
        controls.update();

        scene.add(fbx);
        avatar = fbx;
        _charHeight = charHeight;

        // load saved colors after setting defaults
        setTimeout(() => {
          loadSavedColors();
          renderClothingGrid();
          renderFacesGrid();
          _generateClothingPreviews();
        }, 100);
      }, undefined, () => {
        if (loadAttempts < maxLoadAttempts) {
          loadAttempts++;
          setTimeout(loadAvatar, 1000);
        }
      });
    }

    function _getPreviewRenderer() {
      if (!_previewRenderer) {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        _previewRenderer = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true, alpha: true });
        _previewRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        _previewRenderer.outputColorSpace = THREE.SRGBColorSpace;
        _previewRenderer.setClearColor(0x000000, 0);
      }
      return _previewRenderer;
    }

    function _loadAccessoryMesh(accDef) {
      return new Promise((resolve, reject) => {
        const p = accDef.meshPath.toLowerCase();
        const finish = (modelRoot) => {
          modelRoot.traverse(child => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          resolve(modelRoot);
        };
        if (p.endsWith('.fbx')) {
          new FBXLoader().load(accDef.meshPath, finish, undefined, () => reject(new Error('FBX load failed')));
        } else if (p.endsWith('.glb') || p.endsWith('.gltf')) {
          new GLTFLoader().load(accDef.meshPath, gltf => finish(gltf.scene), undefined, () => reject(new Error('GLTF load failed')));
        } else {
          reject(new Error('Unsupported format'));
        }
      });
    }

    function _generateAccessoryPreview(accDef) {
      return new Promise(resolve => {
        if (!avatar) return resolve(null);
        const texPromises = [];
        if (accDef.textures?.map) texPromises.push(preloadTexture(accDef.textures.map));
        if (accDef.textures?.normalMap) texPromises.push(preloadTexture(accDef.textures.normalMap));
        if (accDef.textures?.displacementMap) texPromises.push(preloadTexture(accDef.textures.displacementMap));
        Promise.all(texPromises).then(() => {
          const savedOverlay = _selectedClothingId;
          const savedPants = _selectedPantsId;
          const savedColors = {};
          for (const k of Object.keys(currentColors)) savedColors[k] = currentColors[k];
          const faceMesh = _faceOverlayMesh;
          if (faceMesh) faceMesh.removeFromParent();
          const savedAccVis = {};
          for (const [id, w] of Object.entries(_loadedAccessories)) { savedAccVis[id] = w.visible; w.visible = false; }
          const hiddenGround = [];
          scene.traverse(child => { if (child.userData?.isGround) { hiddenGround.push(child); child.visible = false; } });
          removeAvatarClothing(avatar);
          removeAvatarPants(avatar);
          for (const k of Object.keys(currentColors)) currentColors[k] = '#ffffff';
          applyColors();
          _loadAccessoryMesh(accDef).then(modelRoot => {
            const texApplyPromises = [];
            if (accDef.textures?.map) texApplyPromises.push(preloadTexture(accDef.textures.map).then(tex => {
              modelRoot.traverse(child => {
                if (child.isMesh) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  for (const mat of mats) { if (mat) { mat.map = tex; tex.colorSpace = THREE.SRGBColorSpace; mat.needsUpdate = true; } }
                }
              });
            }));
            if (accDef.textures?.normalMap) texApplyPromises.push(preloadTexture(accDef.textures.normalMap).then(tex => {
              modelRoot.traverse(child => {
                if (child.isMesh) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  for (const mat of mats) { if (mat) { mat.normalMap = tex; mat.normalScale = new THREE.Vector2(1, 1); mat.needsUpdate = true; } }
                }
              });
            }));
            if (accDef.textures?.displacementMap) texApplyPromises.push(preloadTexture(accDef.textures.displacementMap).then(tex => {
              modelRoot.traverse(child => {
                if (child.isMesh) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  for (const mat of mats) { if (mat) { mat.displacementMap = tex; mat.displacementScale = 0.01; mat.needsUpdate = true; } }
                }
              });
            }));
            return Promise.all(texApplyPromises).then(() => {
              const headPt = findHeadAttachment(avatar);
              if (!headPt) { resolve(null); return; }
              avatar.updateMatrixWorld(true);
              modelRoot.updateMatrixWorld(true);
              modelRoot.position.set(0, 0, 0);
              modelRoot.rotation.set(0, 0, 0);
              const o = accDef.offset || {};
              const s = o.scale !== undefined ? o.scale : 1;
              modelRoot.scale.setScalar(s);
              modelRoot.updateMatrixWorld(true);
              const bbox = new THREE.Box3().setFromObject(modelRoot);
              const c = bbox.getCenter(new THREE.Vector3());
              modelRoot.position.x -= c.x;
              modelRoot.position.y -= bbox.min.y;
              modelRoot.position.z -= c.z;
              const wrapper = new THREE.Group();
              wrapper.add(modelRoot);
              wrapper.userData.isAccessory = true;
              const attachment = headPt.object;
              const localRot = new THREE.Quaternion().setFromEuler(new THREE.Euler(o.rx || 0, o.ry || 0, o.rz || 0, 'XYZ'));
              scene.add(wrapper);
              const headTopWorld = (headPt.headMesh ? getMeshTopWorldPosition(headPt.headMesh) : getAttachmentTopWorldPosition(attachment)) || attachment.getWorldPosition(new THREE.Vector3());
              const attachmentQuat = attachment.getWorldQuaternion(new THREE.Quaternion());
              const offsetWorld = new THREE.Vector3(o.x || 0, o.y !== undefined ? o.y : 0, o.z || 0).applyQuaternion(attachmentQuat);
              wrapper.position.copy(headTopWorld.clone().add(offsetWorld));
              wrapper.quaternion.copy(attachmentQuat).multiply(localRot);
              const cam = new THREE.PerspectiveCamera(20, 1, 0.1, 100);
              cam.position.set(0, 2.8, 18); cam.lookAt(0, 2.8, 0);
              const renderer = _getPreviewRenderer();
              const W = 256, H = 256;
              const prevBg = scene.background;
              scene.background = null;
              const rt = new THREE.WebGLRenderTarget(W, H);
              rt.texture.colorSpace = THREE.SRGBColorSpace;
              renderer.setRenderTarget(rt);
              renderer.render(scene, cam);
              renderer.setRenderTarget(null);
              const pixels = new Uint8Array(W * H * 4);
              renderer.readRenderTargetPixels(rt, 0, 0, W, H, pixels);
              rt.dispose();
              scene.background = prevBg;
              wrapper.removeFromParent();
              removeAvatarClothing(avatar);
              removeAvatarPants(avatar);
              for (const k of Object.keys(savedColors)) currentColors[k] = savedColors[k];
              applyColors();
              if (savedOverlay) applyAvatarClothing(avatar, savedOverlay);
              if (savedPants) applyAvatarPants(avatar, savedPants);
              for (const [id, vis] of Object.entries(savedAccVis)) {
                const w = _loadedAccessories[id];
                if (w) w.visible = vis;
              }
              if (faceMesh) { const hb = avatar.getObjectByName('Head'); if (hb) hb.add(faceMesh); }
              for (const m of hiddenGround) m.visible = true;
              const canvas = document.createElement('canvas');
              canvas.width = W; canvas.height = H;
              const ctx = canvas.getContext('2d');
              const id = ctx.createImageData(W, H);
              for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                const si = (y * W + x) * 4, di = ((H - 1 - y) * W + x) * 4;
                id.data[di] = pixels[si]; id.data[di + 1] = pixels[si + 1];
                id.data[di + 2] = pixels[si + 2]; id.data[di + 3] = pixels[si + 3];
              }
              ctx.putImageData(id, 0, 0);
              resolve(canvas.toDataURL('image/png'));
            });
          }).catch(() => resolve(null));
        });
      });
    }

          }
          if (faceMesh) { const hb = avatar.getObjectByName('Head'); if (hb) hb.add(faceMesh); }
          for (const m of hiddenGround) m.visible = true;
          const canvas = document.createElement('canvas');
          canvas.width = W; canvas.height = H;
          const ctx = canvas.getContext('2d');
          const id = ctx.createImageData(W, H);
          for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
            const si = (y * W + x) * 4, di = ((H - 1 - y) * W + x) * 4;
            id.data[di] = pixels[si]; id.data[di + 1] = pixels[si + 1];
            id.data[di + 2] = pixels[si + 2]; id.data[di + 3] = pixels[si + 3];
          }
          ctx.putImageData(id, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        });
      });
    }

    async function _generateClothingPreviews() {
      const clothes = getAllClothing().map(c => ({ ...c, _type: 'clothing' }));
      const accs = getAllAccessories().map(a => ({ ...a, _type: 'accessory' }));
      const items = [...clothes, ...accs];
      for (const item of items) {
        if (_clothingPreviewCache.has(item.id)) continue;
        const dataUrl = await _generatePreview(item);
        if (dataUrl) {
          _clothingPreviewCache.set(item.id, dataUrl);
          if (item._type === 'accessory') {
            const img = document.querySelector(`.acc-item[data-id="${CSS.escape(item.id)}"] .acc-item-icon img`);
            if (img) img.src = dataUrl;
            const iconEl = document.querySelector(`.acc-item[data-id="${CSS.escape(item.id)}"] .acc-item-icon`);
            if (iconEl && !iconEl.querySelector('img')) iconEl.innerHTML = `<img src="${dataUrl}" alt="${item.name}" />`;
          } else {
            const img = document.querySelector(`.clothing-item[data-id="${CSS.escape(item.id)}"] .clothing-item-preview img`);
            if (img) img.src = dataUrl;
          }
        }
        await new Promise(r => setTimeout(r, 30));
      }
    }

    async function loadSavedColors() {
      await auth.authStateReady();
      if (!auth.currentUser) return;
      trackPresence(auth.currentUser.uid, null, 'avatar');
      try {
        const snap = await getDoc(doc(db, 'users', auth.currentUser.uid));
        if (snap.exists()) {
          const data = snap.data();
          _ownedItems = data.ownedItems || [];
          if (!data.ownedItems) {
            _ownedItems = [...STARTING_ITEMS];
            await setDoc(doc(db, 'users', auth.currentUser.uid), { ownedItems: _ownedItems }, { merge: true });
          }
          if (data.avatarColors) {
            updateColorPickersFromSaved(data.avatarColors);
          }
          if (data.avatarClothing && avatar && findClothing(data.avatarClothing)) {
            if (_ownedItems.includes(data.avatarClothing)) {
              _selectedClothingId = data.avatarClothing;
              applyAvatarClothing(avatar, data.avatarClothing);
            } else {
              _selectedClothingId = null;
              removeAvatarClothing(avatar);
            }
          } else if (avatar) {
            _selectedClothingId = null;
            removeAvatarClothing(avatar);
          }
          if (data.avatarPants && avatar && findClothing(data.avatarPants)) {
            if (_ownedItems.includes(data.avatarPants)) {
              _selectedPantsId = data.avatarPants;
              applyAvatarPants(avatar, data.avatarPants);
            } else {
              _selectedPantsId = null;
              removeAvatarPants(avatar);
            }
          } else if (avatar) {
            _selectedPantsId = null;
            removeAvatarPants(avatar);
          }
          if (data.avatarAccessories && avatar) {
            _equippedAccessories = {};
            for (const id of data.avatarAccessories) {
              if (findAccessory(id) && _ownedItems.includes(id)) {
                _equippedAccessories[id] = true;
                loadAccessory(findAccessory(id), avatar);
              }
            }
            renderAccGrid();
          }
          if (data.avatarFace && findFace(data.avatarFace) && _ownedItems.includes(data.avatarFace)) {
            equipFace(data.avatarFace);
          } else {
            equipFace('smile');
          }
        } else {
          _ownedItems = [...STARTING_ITEMS];
          await setDoc(doc(db, 'users', auth.currentUser.uid), { ownedItems: _ownedItems }, { merge: true });
          equipFace('smile');
        }
        renderClothingGrid();
        renderPantsGrid();
        renderAccGrid();
      } catch (e) {
        console.error('Error loading avatar data:', e);
      }
    }

    document.getElementById('btnReset').addEventListener('click', () => {
      if (!avatar) return;
      for (const name of _materialList) {
        currentColors[name] = _originalColors[name];
        const el = document.getElementById('c_' + name);
        const hexEl = document.getElementById('h_' + name);
        if (el) el.value = _originalColors[name];
        if (hexEl) hexEl.textContent = _originalColors[name];
      }
      applyColors();
      unequipClothing();
      unequipPants();
      for (const id of Object.keys(_equippedAccessories)) {
        removeAccessory(id);
      }
      _equippedAccessories = {};
      renderAccGrid();
      equipFace('smile');
    });

    document.getElementById('btnSave').addEventListener('click', async () => {
      if (!auth.currentUser) {
        showToast('Please log in first');
        return;
      }
      try {
        await setDoc(doc(db, 'users', auth.currentUser.uid), {
          avatarColors: currentColors,
          avatarClothing: _selectedClothingId,
          avatarPants: _selectedPantsId,
          avatarAccessories: Object.keys(_equippedAccessories),
          avatarFace: _equippedFaceId,
        }, { merge: true });
        showToast('Avatar saved!');

        // Render and upload a thumbnail preview
        try {
          await captureAndUploadThumbnail();
        } catch (e) {
          console.warn('Thumbnail upload failed:', e);
        }
      } catch (e) {
        console.error('Error saving avatar:', e);
        showToast('Failed to save');
      }
    });

    async function captureAndUploadThumbnail() {
      async function captureShot(camPos, camTarget, publicIdSuffix) {
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = 256;
        thumbCanvas.height = 256;
        const thumbRenderer = new THREE.WebGLRenderer({
          canvas: thumbCanvas,
          antialias: true,
          preserveDrawingBuffer: true,
          alpha: true,
        });
        thumbRenderer.setPixelRatio(1);
        thumbRenderer.outputColorSpace = THREE.SRGBColorSpace;
        thumbRenderer.toneMapping = renderer.toneMapping;
        thumbRenderer.toneMappingExposure = renderer.toneMappingExposure;
        thumbRenderer.setClearColor(0x000000, 0);

        const thumbCam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
        thumbCam.position.copy(camPos);
        thumbCam.lookAt(camTarget);

        const hidden = [];
        scene.traverse(child => {
          if (child.userData?.isGround) {
            hidden.push(child);
            child.visible = false;
          }
        });
        const prevBg = scene.background ? scene.background.clone() : null;
        scene.background = null;

        const W = 256, H = 256;
        const rt = new THREE.WebGLRenderTarget(W, H);
        rt.texture.colorSpace = THREE.SRGBColorSpace;
        thumbRenderer.setRenderTarget(rt);
        thumbRenderer.render(scene, thumbCam);
        thumbRenderer.setRenderTarget(null);

        const pixels = new Uint8Array(W * H * 4);
        thumbRenderer.readRenderTargetPixels(rt, 0, 0, W, H, pixels);
        rt.dispose();

        if (prevBg) scene.background = prevBg;
        for (const m of hidden) m.visible = true;
        thumbRenderer.dispose();

        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(W, H);
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const si = (y * W + x) * 4;
            const di = ((H - 1 - y) * W + x) * 4;
            imageData.data[di] = pixels[si];
            imageData.data[di + 1] = pixels[si + 1];
            imageData.data[di + 2] = pixels[si + 2];
            imageData.data[di + 3] = pixels[si + 3];
          }
        }
        ctx.putImageData(imageData, 0, 0);

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob || blob.size < 100) return null;
        return blob;
      }

      const fullBodyPos = new THREE.Vector3(5, 5, 11);
      const fullBodyTarget = new THREE.Vector3(0, 2.8, 0);
      const headPos = new THREE.Vector3(0, 4.2, 4);
      const headTarget = new THREE.Vector3(0, 4.8, 0);

      const [fullBodyBlob, headBlob] = await Promise.all([
        captureShot(fullBodyPos, fullBodyTarget),
        captureShot(headPos, headTarget),
      ]);

      if (!fullBodyBlob && !headBlob) {
        console.warn('[thumbnail] both blobs failed');
        return;
      }

      // Upload to Cloudinary
      const CLOUD_NAME = 'dvkbiobph';
      const UPLOAD_PRESET = 'bloxverse_upload';

      let publicId = 'avatar';
      try {
        const snap = await getDoc(doc(db, 'users', auth.currentUser.uid));
        if (snap.exists() && snap.data().username) {
          publicId = snap.data().username.replace(/[^a-zA-Z0-9_-]/g, '_');
        }
      } catch (e) { /* fallback */ }

      const updateData = {};
      const ts = Date.now();

      if (fullBodyBlob) {
        const fd = new FormData();
        fd.append('file', fullBodyBlob, `${publicId}_full.png`);
        fd.append('upload_preset', UPLOAD_PRESET);
        fd.append('public_id', `${publicId}_avatar_${ts}`);
        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: 'POST', body: fd,
          });
          const data = await res.json();
          if (data.secure_url) updateData.avatarPreview = data.secure_url + '?t=' + ts;
        } catch (e) { console.warn('[thumbnail] full body upload failed:', e); }
      }

      if (headBlob) {
        const fd = new FormData();
        fd.append('file', headBlob, `${publicId}_head.png`);
        fd.append('upload_preset', UPLOAD_PRESET);
        fd.append('public_id', `${publicId}_avatar_head_${ts}`);
        try {
          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
            method: 'POST', body: fd,
          });
          const data = await res.json();
          if (data.secure_url) updateData.avatarPreviewHead = data.secure_url + '?t=' + ts;
        } catch (e) { console.warn('[thumbnail] head shot upload failed:', e); }
      }

      if (Object.keys(updateData).length > 0) {
        await setDoc(doc(db, 'users', auth.currentUser.uid), updateData, { merge: true });
      }
    }

    const toast = document.getElementById('saveToast');
    let toastTimeout = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w === 0 || h === 0) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      for (const updater of _accessoryUpdaters.values()) updater();
      renderer.render(scene, camera);
    }

    renderClothingGrid();
    renderFacesGrid();
    loadAvatar();
    animate();

    // Panel resize
    (function() {
      const panel = document.getElementById('resizeHandle');
      let isDragging = false;
      panel.addEventListener('mousedown', (e) => {
        isDragging = true;
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
      });
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const newWidth = Math.max(240, Math.min(e.clientX, 600));
        document.getElementById('editorPanel').style.width = newWidth + 'px';
        onResize();
      });
      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          document.body.style.userSelect = '';
          document.body.style.cursor = '';
        }
      });
    })();
  </script>
