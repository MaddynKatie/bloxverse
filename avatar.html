<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Avatar Editor</title>
  <link rel="stylesheet" href="src/theme.css" />
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script type="module" src="src/theme.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: var(--bg-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    .editor-page {
      display: flex;
      height: calc(100vh - 48px);
      margin-top: 48px;
      width: 100%;
    }

    .settings-wrapper { position: relative; }
    .settings-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      min-width: 140px;
      z-index: 100;
      overflow: hidden;
      margin-top: 4px;
    }
    .settings-dropdown.open { display: block; }
    .settings-dropdown button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-dropdown button:hover { background: var(--bg-tertiary); color: var(--text-primary); }

    /* ── LEFT PANEL (avatar preview + color swatches) ── */
    .editor-panel {
      width: 320px;
      min-width: 220px;
      background: var(--bg-surface);
      border-right: var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      z-index: 10;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 12px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .back-btn:hover { color: var(--text-primary); }

    .editor-panel h2 {
      color: var(--text-primary);
      font-size: 22px;
      margin: 0 0 2px 0;
      font-weight: 700;
    }
    .editor-panel .subtitle { display: none; }

    /* Avatar 3D viewer lives inside the left panel */
    .viewer-container {
      width: 100%;
      aspect-ratio: 1 / 1.1;
      background: var(--bg-surface);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      margin: 12px 0;
      flex-shrink: 0;
    }
    .viewer-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .viewer-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-muted);
      font-size: 11px;
      user-select: none;
      pointer-events: none;
    }
    .viewer-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px; height: 32px;
      border: none;
      border-radius: 8px;
      background: color-mix(in srgb, var(--text-primary) 10%, transparent);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 5;
      backdrop-filter: blur(4px);
    }
    .viewer-btn:hover { color: var(--text-primary); }
    .viewer-btn.active { color: var(--accent); }

    /* Gender toggle */
    .gender-toggle {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .gender-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .gender-btn.active {
      background: var(--text-primary);
      color: var(--bg-primary);
      border-radius: 6px;
    }

    /* Color swatches grid — 3 per row with labels */
    .color-swatches {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    .color-swatch-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .color-swatch-item input[type="color"] {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      padding: 3px;
      background: none;
    }
    .color-swatch-item input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-swatch-item input[type="color"]::-webkit-color-swatch { border: none; border-radius: 5px; }
    .color-swatch-item input[type="color"]:hover { border-color: var(--text-muted); }
    .color-swatch-label {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Body color slots grid — one compact row of 6 */
    .body-colors-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .body-color-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .body-color-cell .color-swatch {
      width: 100%;
      max-width: 70px;
      aspect-ratio: 1;
      border: 2px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .body-color-cell:hover .color-swatch {
      border-color: var(--text-muted);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .body-color-cell .color-label {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* Hide old color-group layout */
    .color-groups .color-group { display: none; }

    .editor-actions {
      margin-top: auto;
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-save {
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: background 0.15s;
    }
    .btn-save:hover { background: var(--accent-hover); }
    .btn-save:disabled {
      opacity: 0.5;
      cursor: default;
    }
    .btn-save:disabled:hover { background: var(--accent); }

    /* ── RIGHT PANEL (catalog) ── */
    .catalog-panel {
      flex: 1;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Tabs along top of catalog */
    .editor-tabs {
      display: flex;
      gap: 0;
      padding: 14px 20px 0;
      border-bottom: 2px solid var(--border);
      background: var(--bg-surface);
    }
    .editor-tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: all 0.15s;
    }
    .editor-tab.active { color: var(--text-primary); border-bottom-color: var(--text-primary); }
    .editor-tab:hover:not(.active) { color: var(--text-secondary); }

    /* Tab content = scrollable catalog */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      display: none;
      padding: 20px;
    }
    .tab-content.active { display: block; }

    /* Category label like "SHIRTS" */
    .catalog-category-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 0 0 12px 0;
    }

    /* 4-column grid */
    .clothing-grid, .accessories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    /* Cards */
    .clothing-item, .acc-item {
      background: var(--bg-surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .clothing-item:hover, .acc-item:hover { border-color: var(--border-strong); background: var(--bg-secondary); }
    .clothing-item.equipped, .acc-item.equipped { border-color: var(--accent); background: var(--bg-secondary); }

    .clothing-item-preview, .acc-item-icon {
      width: 100%;
      aspect-ratio: 1;
      background: var(--bg-tertiary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      overflow: hidden;
      font-size: 28px;
    }
    .clothing-item-preview img, .acc-item-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .clothing-item-name, .acc-item-name {
      color: var(--text-primary);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .clothing-item-meta, .acc-item-category { display: none; }

    .acc-empty {
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      padding: 40px 10px;
      grid-column: 1 / -1;
    }

    /* Toast */
    .save-toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }
    .save-toast.show { opacity: 1; }

    /* Scrollbars */
    .editor-panel::-webkit-scrollbar, .tab-content::-webkit-scrollbar { width: 5px; }
    .editor-panel::-webkit-scrollbar-track, .tab-content::-webkit-scrollbar-track { background: transparent; }
    .editor-panel::-webkit-scrollbar-thumb, .tab-content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
    .editor-panel, .tab-content { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }

    /* Resize handle */
    .resize-handle {
      width: 6px;
      cursor: col-resize;
      flex-shrink: 0;
      background: var(--border);
      position: relative;
      z-index: 20;
      user-select: none;
    }
    .resize-handle:hover { background: var(--border-strong); }
  </style>
  <script src="js/sw-register.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links" id="navLinks">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse'">Home</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" data-needs-auth onclick="window.location.href='/bloxverse/avatar'">Avatar</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/download'">
          Download
        </button>
      </div>
      <button class="navbar-studio-card" data-open-studio title="Launch BloxVerse Studio">Studio</button>
      <script type="module" src="src/studio.js"></script>
    </div>
    <div class="nav-right" id="navRight">
      <button class="login-btn" onclick="window.location.href='/bloxverse/auth'">Login / Sign Up</button>
    </div>
  </nav>

  <div class="editor-page">
    <!-- LEFT: avatar preview + color pickers -->
    <div class="editor-panel" id="editorPanel">
      <button class="back-btn" id="backBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6" />
        </svg>
        Back
      </button>

      <!-- 3D viewer embedded in left panel -->
      <div class="viewer-container" id="viewerContainer">
        <button class="viewer-btn active" id="rotateToggle" title="Toggle auto-rotate">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>

      <!-- Gender toggle -->
      <div class="gender-toggle">
        <button class="gender-btn active" data-type="male">Male</button>
        <button class="gender-btn" data-type="female">Female</button>
      </div>

      <!-- Body color slots — populated by JS -->
      <div class="body-colors-grid" id="colorSwatches"></div>
      <input type="color" id="bodyColorPicker" style="position:absolute;opacity:0;pointer-events:none;width:0;height:0">
      <!-- Hidden original color groups (still used by JS internally) -->
      <div style="display:none"><div class="color-groups" id="colorGroups"></div></div>

      <div class="editor-actions">
        <button class="btn-save" id="btnSave" disabled>Save</button>
      </div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>

    <!-- RIGHT: catalog tabs + grid -->
    <div class="catalog-panel">
      <div class="editor-tabs">
        <button class="editor-tab active" data-tab="clothing">Clothing</button>
        <button class="editor-tab" data-tab="faces">Faces</button>
        <button class="editor-tab" data-tab="accessories">Accessories</button>
      </div>

      <div class="tab-content active" id="tabClothing">
        <p class="catalog-category-label">Shirts</p>
        <div class="clothing-grid" id="clothingGrid"></div>
        <p class="catalog-category-label">Pants</p>
        <div class="clothing-grid" id="pantsGrid"></div>
      </div>

      <div class="tab-content" id="tabFaces">
        <p class="catalog-category-label">Faces</p>
        <div class="clothing-grid" id="facesGrid"></div>
      </div>

      <div class="tab-content" id="tabAccessories">
        <p class="catalog-category-label">Accessories</p>
        <div class="accessories-grid" id="accGrid"></div>
      </div>
    </div>
  </div>

  <div class="save-toast" id="saveToast">Avatar saved!</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
    import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { auth, db, getDoc, doc, setDoc, trackPresence, banGuard, assignUserIdNum } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { onSnapshot } from 'firebase/firestore';
    import { accessories, getAllAccessories, findAccessory } from './src/accessories.js';
    import { findClothing, getAllClothing, preloadTexture } from './src/clothing.js';
    import { getAllFaces, findFace } from './src/faces.js';
    const STARTING_ITEMS = ['palhair', 'smile', 'blueandblackmotorcycleshirt'];

    // ── Navbar auth state ──────────────────────────────────────────────────────
    const navRight = document.getElementById('navRight');
    onAuthStateChanged(auth, async (user) => {
      document.querySelectorAll('[data-needs-auth]').forEach(el => { el.style.display = user ? '' : 'none'; });
      if (user) {
        if (await banGuard(user.uid)) return;
        assignUserIdNum(user.uid).catch(() => {});
        onSnapshot(doc(db, 'bans', user.uid), (snap) => {
          if (snap.exists() && snap.data().banned) {
            window.location.href = '/bloxverse/ban';
          }
        });
        let userDocData = {};
        try {
          const d = await getDoc(doc(db, 'users', user.uid));
          if (d.exists()) userDocData = d.data();
        } catch {}
        const username = userDocData.username || 'Player';
        const ownPreview = userDocData.avatarPreviewHead || userDocData.avatarPreview || null;
        const ownNum = userDocData.userIdNum;
        const ownProfileLink = ownNum ? `/bloxverse/profile?user=${ownNum}` : '/bloxverse/profile';
        const ownInitial = username.charAt(0).toUpperCase();
        const ownBux = userDocData.bux || 0;
        const _cb = Date.now();
        navRight.innerHTML = `
          <div class="user-info">
            <div class="bux-wrapper" id="buxWrapper">
              <button class="bux-btn" id="buxBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text></svg>
                <span id="ownBuxVal">${ownBux.toLocaleString()}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
              </button>
              <div class="bux-dropdown">
                <div class="bux-dropdown-header">
                  <span class="bux-dropdown-label">Balance</span>
                  <span class="bux-dropdown-balance" id="buxDropdownBalance">${ownBux.toLocaleString()}</span>
                </div>
                <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                  Transactions
                </button>
              </div>
            </div>
            <div class="settings-wrapper">
              <button class="settings-nav-btn" id="navSettingsBtn" title="Settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              </button>
              <div class="settings-dropdown" id="navSettingsDropdown">
                <button onclick="window.location.href='/bloxverse/settings'">Settings</button>
                <button onclick="window._logout()">Log Out</button>
              </div>
            </div>
            ${ownPreview
              ? `<img src="${ownPreview}?_cb=${_cb}" alt="" class="avatar-circle-img" onclick="window.location.href='${ownProfileLink}'" data-initial="${ownInitial}" onerror="window.__handleBrokenAvatar(this, '${user.uid}')"/>`
              : `<div class="avatar-circle" onclick="window.location.href='${ownProfileLink}'">${ownInitial}</div>`}
          </div>
        `;

        const closeSettings = () => {
          document.querySelectorAll('.settings-dropdown').forEach(d => d.classList.remove('open'));
        };
        const navSettingsBtn = document.getElementById('navSettingsBtn');
        if (navSettingsBtn) {
          navSettingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeSettings();
            const dd = document.getElementById('navSettingsDropdown');
            if (dd) dd.classList.toggle('open');
          });
        }
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.settings-wrapper')) {
            closeSettings();
          }
        });

        const buxWrapper = document.getElementById('buxWrapper');
        const buxBtn = document.getElementById('buxBtn');
        buxBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          buxWrapper.classList.toggle('open');
        });

        window._logout = async () => {
          await signOut(auth);
          window.location.href = '/bloxverse/';
        };
      }
    });

    // Hamburger menu toggle
    const _hamburger = document.getElementById('navHamburger');
    const _navLinks = document.getElementById('navLinks');
    if (_hamburger && _navLinks) {
      _hamburger.addEventListener('click', () => {
        _navLinks.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.navbar')) _navLinks.classList.remove('open');
      });
    }

    window.__handleBrokenAvatar = async function(imgEl, uid) {
      try {
        const initial = imgEl.getAttribute('data-initial') || 'U';
        const letter = document.createElement('div');
        letter.className = 'friend-thumb-avatar';
        letter.textContent = initial;
        imgEl.replaceWith(letter);
        try {
          if (auth && auth.currentUser && auth.currentUser.uid === uid) {
            const { setDoc, doc } = await import('https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js');
            await setDoc(doc(db, 'users', uid), { avatarPreview: null, avatarPreviewHead: null }, { merge: true });
          }
        } catch (e) { console.warn('Could not clear avatarPreview:', e); }
      } catch (e) { console.warn('Broken avatar handler error:', e); }
    };

    const SLOT_NAMES = ['Head', 'Torso', 'L Arm', 'R Arm', 'L Leg', 'R Leg'];
    const SLOT_DEFAULTS = { Head: '#ffffff', Torso: '#8350fb', 'L Arm': '#ffffff', 'R Arm': '#ffffff', 'L Leg': '#400eb4', 'R Leg': '#400eb4' };
    const BODY_MAT_SLOT = {
      'Material.002': 0,

    function findHighestBone(obj) {
      let highest = null;
      let highestY = -Infinity;
      obj.traverse(child => {
        if (child.isBone || child.type === 'Bone') {
          const worldPos = new THREE.Vector3();
          child.getWorldPosition(worldPos);
          if (worldPos.y > highestY) {
            highestY = worldPos.y;
            highest = child;
          }
        }
      });
      return highest;
    }

    function findHeadAttachment(avatarObj) {
      let headBone = null;
      let headMesh = null;
      avatarObj.traverse(child => {
        if ((child.isBone || child.type === 'Bone') && child.name.toLowerCase().includes('head') && !child.name.toLowerCase().includes('_end')) {
          headBone = child;
        }
        if (child.isMesh && (child.name.toLowerCase().includes('head') || (child.material && (
          (Array.isArray(child.material) ? child.material[0] : child.material).name || ''
        ).toLowerCase().includes('head')))) {
          headMesh = child;
        }
      });
      if (headBone && headMesh) return { object: headBone, type: 'bone', headMesh };
      if (headMesh) return { object: headMesh, type: 'mesh', headMesh };
      if (headBone) return { object: headBone, type: 'bone' };
      const highestBone = findHighestBone(avatarObj);
      if (highestBone) {
        console.log('[Accessory] Using highest bone:', highestBone.name);
        return { object: highestBone, type: 'bone', fallback: true };
      }
      const torso = findBone(avatarObj, 'Torso');
      if (torso) return { object: torso, type: 'bone', fallback: true };
      return null;
    }

    function findBone(obj, name) {
      let found = null;
      obj.traverse(child => {
        if ((child.isBone || child.type === 'Bone') && child.name === name) {
          found = child;
        }
      });
      return found;
    }

    function isAccessoryNode(obj) {

    function getHeadTopWorldPosition(avatarObj) {
      let topWorld = null;
      avatarObj.traverse(child => {
        if (isAccessoryNode(child) || child.userData?.isFaceOverlay) return;
        if (child.isMesh) {
          if (!child.geometry.boundingBox) {
            child.geometry.computeBoundingBox();
          }
          const bbox = child.geometry.boundingBox;
          const topLocal = new THREE.Vector3((bbox.min.x + bbox.max.x) / 2, bbox.max.y, (bbox.min.z + bbox.max.z) / 2);
          const worldPos = topLocal.clone();
          child.localToWorld(worldPos);
          if (!topWorld || worldPos.y > topWorld.y) {
            topWorld = worldPos;
          }
        }
      });
      return topWorld;
    }

    function getMeshTopWorldPosition(mesh) {
      if (!mesh || !mesh.geometry) return null;
      if (!mesh.geometry.boundingBox) {
        mesh.geometry.computeBoundingBox();
      }
      const bbox = mesh.geometry.boundingBox;
      const topLocal = new THREE.Vector3((bbox.min.x + bbox.max.x) / 2, bbox.max.y, (bbox.min.z + bbox.max.z) / 2);
      const worldPos = topLocal.clone();
      mesh.localToWorld(worldPos);
      return worldPos;
    }

    function getAttachmentTopWorldPosition(attachment) {
      if (!attachment) return null;
      if (attachment.isMesh) return getMeshTopWorldPosition(attachment);

      const ownMeshes = [];
      attachment.children.forEach(child => {
        if (child.isMesh && !child.userData?.isFaceOverlay) ownMeshes.push(child);
      });

      if (ownMeshes.length > 0) {
        const bbox = new THREE.Box3();
        ownMeshes.forEach(mesh => bbox.expandByObject(mesh));
        if (!bbox.isEmpty()) {
          const topLocal = new THREE.Vector3(
            (bbox.min.x + bbox.max.x) / 2,
            bbox.max.y,
            (bbox.min.z + bbox.max.z) / 2
          );
          return topLocal; // already world space from expandByObject
        }
      }

      return attachment.getWorldPosition(new THREE.Vector3());
    }

    function loadAccessory(accDef, avatarObj) {
      if (!avatarObj) return;

      const path = accDef.meshPath.toLowerCase();

      const finishSetup = (modelRoot) => {
        avatarObj.updateMatrixWorld(true);
        modelRoot.updateMatrixWorld(true);

        modelRoot.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        avatarObj.add(modelRoot);
        modelRoot.userData = modelRoot.userData || {};
        modelRoot.userData.isAccessory = true;
        modelRoot.updateMatrixWorld(true);
        _loadedAccessories[accDef.id] = modelRoot;
      };

      // FBX
      if (path.endsWith('.fbx')) {
        const loader = new FBXLoader();

        loader.load(
          accDef.meshPath,
          (fbx) => finishSetup(fbx),
          undefined,
          (err) => console.error('FBX load failed:', err)
        );
      }

      // GLB / GLTF
      else if (path.endsWith('.glb') || path.endsWith('.gltf')) {
        const loader = new GLTFLoader();

        loader.load(
          accDef.meshPath,
          (gltf) => finishSetup(gltf.scene),
          undefined,
          (err) => console.error('GLTF load failed:', err)
        );
      }

      else {
        console.warn('Unsupported accessory format:', accDef.meshPath);
      }
    }

    function loadAvatar(type) {
      if (type) _currentModelType = type;
      const modelType = _currentModelType;

      const handleGltf = (gltf) => {
        _modelCache[modelType] = gltf;
        if (avatar) {
          scene.remove(avatar);
          avatar = null;
          materialMap.clear();
          _materialList = [];
        }

        _headMaterials = [];
        _shirtMaterials = [];
        _pantMaterials = [];

        gltf.scene.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            const isHeadMesh = mats.some(m => m && m.name === 'Material.002');
            if (child.geometry) {
              if (!isHeadMesh) {
                for (const key of Object.keys(child.geometry.attributes)) {
                  if (key.toLowerCase().includes('color')) {
                    child.geometry.deleteAttribute(key);
                  }
                }
                if (child.geometry.morphAttributes) {
                  for (const key of Object.keys(child.geometry.morphAttributes)) {
                    if (key.toLowerCase().includes('color')) {
                      delete child.geometry.morphAttributes[key];
                    }
                  }
                }
              }
            }
            for (let i = 0; i < mats.length; i++) {
              const mat = mats[i];
              if (!mat) continue;
              mat.toneMapped = false;
              mat.emissive && mat.emissive.setHex(0);
              mat.emissiveIntensity = 0;
              const slot = BODY_MAT_SLOT[mat.name];
              if (mat.name === 'Material.002') {
                mat.vertexColors = true;
                mat.transparent = false;
                mat.onBeforeCompile = _headBlendShader;
                mat.needsUpdate = true;
                _headMaterials.push(mat);
                if (child.geometry && !child.geometry.getAttribute('color')) {
                  const posAttr = child.geometry.getAttribute('position');
                  if (posAttr) {
                    const count = posAttr.count;
                    const colors = new Float32Array(count * 3);
                    const pos = posAttr.array;
                    let minZ = Infinity, maxZ = -Infinity;
                    for (let v = 0; v < count; v++) {
                      const z = pos[v * 3 + 2];
                      if (z < minZ) minZ = z;
                      if (z > maxZ) maxZ = z;
                    }
                    const zRange = maxZ - minZ || 1;
                    // The face is authored on the -Z side of the head mesh
                    // (verified against the reference model's real baked
                    // vertex colors, which are white/face-visible at low Z
                    // and black at high Z) -- so low z must map to r=1, not
                    // high z. The previous `t > 0.5 ? 1 : 0` both had this
                    // backwards (painting the mask onto the back of the
                    // head instead of the front) and used a harsh binary
                    // cutoff instead of a soft blend like the reference's
                    // painted gradient. Use a smoothstep feather instead.
                    const feather = 0.35; // fraction of the range used for the soft edge
                    const edgeLow = minZ + zRange * (0.5 - feather / 2);
                    const edgeHigh = minZ + zRange * (0.5 + feather / 2);
                    for (let v = 0; v < count; v++) {
                      const z = pos[v * 3 + 2];
                      let t = (z - edgeLow) / (edgeHigh - edgeLow);
                      t = Math.min(1, Math.max(0, t));
                      const smooth = t * t * (3 - 2 * t);
                      const r = 1.0 - smooth; // low z (front) -> 1, high z (back) -> 0
                      colors[v * 3] = r;
                      colors[v * 3 + 1] = r;
                      colors[v * 3 + 2] = r;
                    }
                    child.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    child.geometry.getAttribute('color').needsUpdate = true;
                  }
                }
                if (slot !== undefined) materialMap.set(mat, slot);
                continue;
              } else {
                mat.vertexColors = false;
                if (SHIRT_MATS.has(mat.name) || PANT_MATS.has(mat.name)) {
                  mat.transparent = false;
                  mat.onBeforeCompile = _clothingBlendShader;
                  if (SHIRT_MATS.has(mat.name)) _shirtMaterials.push(mat);
                  if (PANT_MATS.has(mat.name)) _pantMaterials.push(mat);
                }
              }
              mat.needsUpdate = true;
              if (slot !== undefined) {
                materialMap.set(mat, slot);
              }
            }
          }
        });

        _materialList = SLOT_NAMES.slice();
        const prevColors = { ...currentColors };
        _originalColors = {};
        for (const slotName of SLOT_NAMES) {
          _originalColors[slotName] = SLOT_DEFAULTS[slotName] || '#cccccc';
        }
        if (Object.keys(prevColors).length > 0) {
          currentColors = prevColors;
        } else {
          currentColors = { ..._originalColors };
        }
        applyColors();
        buildBodyColorSlots();
        updateColorPickersFromSaved(currentColors);

        const box = new THREE.Box3().setFromObject(gltf.scene);
        const footOffset = -box.min.y;
        const charHeight = box.max.y - box.min.y;
        gltf.scene.position.y = footOffset;
        // The model's face is authored facing local -Z, but the camera sits
        // at +Z looking toward the origin -- without this flip the character
        // is turned away from the camera and the face is never visible
        // (this is what avatar_viewer.js does via `rotation.y = Math.PI`).
        gltf.scene.rotation.y = Math.PI;
        gltf.scene.updateMatrixWorld(true);

        controls.target.set(0, charHeight * 0.45, 0);
        controls.update();

        scene.add(gltf.scene);
        avatar = gltf.scene;
        _charHeight = charHeight;

        if (_selectedClothingId) applyShirtTexture(_selectedClothingId);
        if (_selectedPantsId) applyPantTexture(_selectedPantsId);

        if (_pendingAccessoryIds) {
          for (const id of _pendingAccessoryIds) _equippedAccessories[id] = true;
          _pendingAccessoryIds = null;
        }
        for (const id of Object.keys(_equippedAccessories)) {
          const def = findAccessory(id);
          if (def) {
            removeAccessory(id);
            loadAccessory(def, avatar);
          }
        }

        renderClothingGrid();
        renderPantsGrid();
        renderAccGrid();
        renderFacesGrid();
        if (_equippedFaceId) {
          equipFace(_equippedFaceId);
        }
        _generateClothingPreviews();

        if (_baselineSignature === null) {
          _baselineSignature = currentSignature();
          updateSaveState();
        }
      };

      const cached = _modelCache[modelType];
      if (cached) {
        handleGltf(cached);
        return;
      }

      const url = new URL(`./assets/models/${modelType}.glb`, import.meta.url).href;
      gltfLoader.load(url, handleGltf, undefined, () => {
        if (loadAttempts < maxLoadAttempts) {
          loadAttempts++;
          setTimeout(() => loadAvatar(), 1000);
        }
      });
    }

    function _getPreviewRenderer() {
      if (!_previewRenderer) {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        _previewRenderer = new THREE.WebGLRenderer({ canvas: c, antialias: true, preserveDrawingBuffer: true, alpha: true });
        _previewRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        _previewRenderer.outputColorSpace = THREE.SRGBColorSpace;
        _previewRenderer.setClearColor(0x000000, 0);
      }
      return _previewRenderer;
    }

    function _loadAccessoryMesh(accDef) {
      return new Promise((resolve, reject) => {
        const p = accDef.meshPath.toLowerCase();
        const finish = (modelRoot) => {
          modelRoot.traverse(child => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          resolve(modelRoot);
        };
        if (p.endsWith('.fbx')) {
          new FBXLoader().load(accDef.meshPath, finish, undefined, () => reject(new Error('FBX load failed')));
        } else if (p.endsWith('.glb') || p.endsWith('.gltf')) {
          new GLTFLoader().load(accDef.meshPath, gltf => finish(gltf.scene), undefined, () => reject(new Error('GLTF load failed')));
        } else {
          reject(new Error('Unsupported format'));
        }
      });
    }

    function _generateAccessoryPreview(accDef) {
      return new Promise(resolve => {
        if (!avatar) return resolve(null);
        const texPromises = [];
        if (accDef.textures?.map) texPromises.push(preloadTexture(accDef.textures.map));
        if (accDef.textures?.normalMap) texPromises.push(preloadTexture(accDef.textures.normalMap));
        if (accDef.textures?.displacementMap) texPromises.push(preloadTexture(accDef.textures.displacementMap));
        Promise.all(texPromises).then(() => {
          _loadAccessoryMesh(accDef).then(modelRoot => {
            const texApplyPromises = [];
            if (accDef.textures?.map) texApplyPromises.push(preloadTexture(accDef.textures.map).then(tex => {
              modelRoot.traverse(child => {
                if (child.isMesh) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  for (const mat of mats) { if (mat) { mat.map = tex; tex.colorSpace = THREE.SRGBColorSpace; mat.needsUpdate = true; } }
                }
              });
            }));
            if (accDef.textures?.normalMap) texApplyPromises.push(preloadTexture(accDef.textures.normalMap).then(tex => {
              modelRoot.traverse(child => {
                if (child.isMesh) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  for (const mat of mats) { if (mat) { mat.normalMap = tex; mat.normalScale = new THREE.Vector2(1, 1); mat.needsUpdate = true; } }
                }
              });
            }));
            if (accDef.textures?.displacementMap) texApplyPromises.push(preloadTexture(accDef.textures.displacementMap).then(tex => {
              modelRoot.traverse(child => {
                if (child.isMesh) {
                  const mats = Array.isArray(child.material) ? child.material : [child.material];
                  for (const mat of mats) { if (mat) { mat.displacementMap = tex; mat.displacementScale = 0.01; mat.needsUpdate = true; } }
                }
              });
            }));
            return Promise.all(texApplyPromises).then(() => {
              // Everything the accessory needs (mesh + textures) is fully
              // loaded and ready now. Only from this point on do we touch
              // the live avatar, and only synchronously through to restore
              // -- no awaits in between -- so the white/faceless preview
              // state is never actually visible on screen.
              const savedOverlay = _selectedClothingId;
              const savedPants = _selectedPantsId;
              const savedColors = {};
              for (const k of Object.keys(currentColors)) savedColors[k] = currentColors[k];
              const savedFaceMap = _headMaterials.length > 0 ? _headMaterials[0].map : null;
              _headMaterials.forEach(m => { m.map = null; m.needsUpdate = true; });
              const savedAccVis = {};
              for (const [id, w] of Object.entries(_loadedAccessories)) { savedAccVis[id] = w.visible; w.visible = false; }
              const hiddenGround = [];
              scene.traverse(child => { if (child.userData?.isGround) { hiddenGround.push(child); child.visible = false; } });
              applyShirtTexture(null);
              applyPantTexture(null);
              for (const k of Object.keys(currentColors)) currentColors[k] = '#ffffff';
              applyColors();

              avatar.updateMatrixWorld(true);
              modelRoot.updateMatrixWorld(true);
              avatar.add(modelRoot);
              modelRoot.userData = modelRoot.userData || {};
              modelRoot.userData.isAccessory = true;
              const cam = new THREE.PerspectiveCamera(20, 1, 0.1, 100);
              cam.position.set(0, 2.8, 18); cam.lookAt(0, 2.8, 0);
              const renderer = _getPreviewRenderer();
              const W = 256, H = 256;
              const prevBg = scene.background;
              scene.background = null;
              const rt = new THREE.WebGLRenderTarget(W, H);
              rt.texture.colorSpace = THREE.SRGBColorSpace;
              renderer.setRenderTarget(rt);
              renderer.render(scene, cam);
              renderer.setRenderTarget(null);
              const pixels = new Uint8Array(W * H * 4);
              renderer.readRenderTargetPixels(rt, 0, 0, W, H, pixels);
              rt.dispose();
              scene.background = prevBg;
              modelRoot.removeFromParent();
              applyShirtTexture(null);
              applyPantTexture(null);
              for (const k of Object.keys(savedColors)) currentColors[k] = savedColors[k];
              applyColors();
              if (savedOverlay) applyShirtTexture(savedOverlay);
              if (savedPants) applyPantTexture(savedPants);
              for (const [id, vis] of Object.entries(savedAccVis)) {
                const w = _loadedAccessories[id];
                if (w) w.visible = vis;
              }
              _headMaterials.forEach(m => { m.map = savedFaceMap; m.needsUpdate = true; });
              for (const m of hiddenGround) m.visible = true;
              const canvas = document.createElement('canvas');
              canvas.width = W; canvas.height = H;
              const ctx = canvas.getContext('2d');
              const id = ctx.createImageData(W, H);
              for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
                const si = (y * W + x) * 4, di = ((H - 1 - y) * W + x) * 4;
                id.data[di] = pixels[si]; id.data[di + 1] = pixels[si + 1];
                id.data[di + 2] = pixels[si + 2]; id.data[di + 3] = pixels[si + 3];
              }
              ctx.putImageData(id, 0, 0);
              resolve(canvas.toDataURL('image/png'));
            });
          }).catch(() => resolve(null));
        });
      });
    }

    function _generatePreview(item) {
      if (item._type === 'accessory') {
        const accDef = findAccessory(item.id);
        return accDef ? _generateAccessoryPreview(accDef) : Promise.resolve(null);
      }
      return new Promise(resolve => {
        if (!avatar) return resolve(null);
        const clothing = findClothing(item.id);
        if (!clothing || !clothing.texturePath) return resolve(null);
        _loadThumbTexture(clothing.texturePath).then(tex => {
          if (!tex) return resolve(null);
          const savedOverlay = _selectedClothingId;
          const savedPants = _selectedPantsId;
          const savedColors = {};
          for (const k of Object.keys(currentColors)) savedColors[k] = currentColors[k];
          const savedFaceMap = _headMaterials.length > 0 ? _headMaterials[0].map : null;
          _headMaterials.forEach(m => { m.map = null; m.needsUpdate = true; });
          const savedAccVis = {};

          const hiddenGround = [];

          applyShirtTexture(null);
          applyPantTexture(null);
          for (const k of Object.keys(currentColors)) currentColors[k] = '#ffffff';
          applyColors();
          if (clothing.category === 'Pants') {
            const mats = _pantMaterials;
            for (const mat of mats) { mat.map = tex; mat.needsUpdate = true; }
          } else {
            const mats = _shirtMaterials;
            for (const mat of mats) { mat.map = tex; mat.needsUpdate = true; }
          }
          const cam = new THREE.PerspectiveCamera(20, 1, 0.1, 100);
          cam.position.set(0, 2.8, 18); cam.lookAt(0, 2.8, 0);
          const renderer = _getPreviewRenderer();
          const W = 256, H = 256;
          const prevBg = scene.background;
          scene.background = null;
          const rt = new THREE.WebGLRenderTarget(W, H);
          rt.texture.colorSpace = THREE.SRGBColorSpace;
          renderer.setRenderTarget(rt);
          renderer.render(scene, cam);
          renderer.setRenderTarget(null);
          const pixels = new Uint8Array(W * H * 4);
          renderer.readRenderTargetPixels(rt, 0, 0, W, H, pixels);
          rt.dispose();
          scene.background = prevBg;
          for (const mat of _shirtMaterials) { mat.map = null; mat.needsUpdate = true; }
          for (const mat of _pantMaterials) { mat.map = null; mat.needsUpdate = true; }
          for (const k of Object.keys(savedColors)) currentColors[k] = savedColors[k];
          applyColors();
          if (savedOverlay) applyShirtTexture(savedOverlay);
          if (savedPants) applyPantTexture(savedPants);
          for (const [id, vis] of Object.entries(savedAccVis)) {
            const w = _loadedAccessories[id];
            if (w) w.visible = vis;
          }
          _headMaterials.forEach(m => { m.map = savedFaceMap; m.needsUpdate = true; });
          for (const m of hiddenGround) m.visible = true;
          const canvas = document.createElement('canvas');
          canvas.width = W; canvas.height = H;
          const ctx = canvas.getContext('2d');
          const id = ctx.createImageData(W, H);
          for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
            const si = (y * W + x) * 4, di = ((H - 1 - y) * W + x) * 4;
            id.data[di] = pixels[si]; id.data[di + 1] = pixels[si + 1];
            id.data[di + 2] = pixels[si + 2]; id.data[di + 3] = pixels[si + 3];
          }
          ctx.putImageData(id, 0, 0);
          resolve(canvas.toDataURL('image/png'));
        });
      });
    }

    async function _generateClothingPreviews() {
      const clothes = getAllClothing().map(c => ({ ...c, _type: 'clothing' }));
      const accs = getAllAccessories().map(a => ({ ...a, _type: 'accessory' }));
      const items = [...clothes, ...accs];
      for (const item of items) {
        if (_clothingPreviewCache.has(item.id)) continue;
        const dataUrl = await _generatePreview(item);
        if (dataUrl) {
          _clothingPreviewCache.set(item.id, dataUrl);
          if (item._type === 'accessory') {
            const img = document.querySelector(`.acc-item[data-id="${CSS.escape(item.id)}"] .acc-item-icon img`);
            if (img) img.src = dataUrl;
            const iconEl = document.querySelector(`.acc-item[data-id="${CSS.escape(item.id)}"] .acc-item-icon`);
            if (iconEl && !iconEl.querySelector('img')) iconEl.innerHTML = `<img src="${dataUrl}" alt="${item.name}" />`;
          } else {
            const img = document.querySelector(`.clothing-item[data-id="${CSS.escape(item.id)}"] .clothing-item-preview img`);
            if (img) img.src = dataUrl;
          }
        }
        await new Promise(r => setTimeout(r, 30));
      }
    }

    async function prefetchSavedData() {
      await auth.authStateReady();
      if (!auth.currentUser) return;
      trackPresence(auth.currentUser.uid, null, 'avatar');
      try {
        const snap = await getDoc(doc(db, 'users', auth.currentUser.uid));
        if (snap.exists()) {
          const data = snap.data();
          _ownedItems = data.ownedItems || [];
          if (!data.ownedItems) {
            _ownedItems = [...STARTING_ITEMS];
            await setDoc(doc(db, 'users', auth.currentUser.uid), { ownedItems: _ownedItems }, { merge: true });
          }
          if (data.avatarBodyColors) {
            currentColors = { ...currentColors, ...data.avatarBodyColors };
          } else if (data.avatarColors) {
            const legacy = {};
            if (data.avatarColors.Head) legacy.Head = data.avatarColors.Head;
            if (data.avatarColors.Body) legacy.Torso = data.avatarColors.Body;
            if (data.avatarColors.Arms) { legacy['L Arm'] = data.avatarColors.Arms; legacy['R Arm'] = data.avatarColors.Arms; }
            if (data.avatarColors.Legs) { legacy['L Leg'] = data.avatarColors.Legs; legacy['R Leg'] = data.avatarColors.Legs; }
            currentColors = { ...currentColors, ...legacy };
          }
          if (data.avatarClothing && findClothing(data.avatarClothing) && _ownedItems.includes(data.avatarClothing)) {
            _selectedClothingId = data.avatarClothing;
          }
          if (data.avatarPants && findClothing(data.avatarPants) && _ownedItems.includes(data.avatarPants)) {
            _selectedPantsId = data.avatarPants;
          }
          if (data.avatarAccessories) {
            _pendingAccessoryIds = data.avatarAccessories.filter(id => findAccessory(id) && _ownedItems.includes(id));
          }
          if (data.avatarFace && findFace(data.avatarFace) && _ownedItems.includes(data.avatarFace)) {
            _equippedFaceId = data.avatarFace;
          } else {
            _equippedFaceId = 'smile';
          }
        } else {
          _ownedItems = [...STARTING_ITEMS];
          await setDoc(doc(db, 'users', auth.currentUser.uid), { ownedItems: _ownedItems }, { merge: true });
          _equippedFaceId = 'smile';
        }
      } catch (e) {
        console.error('Error prefetching avatar data:', e);
      }
    }

    let _baselineSignature = null;

    function currentSignature() {
      return JSON.stringify({
        colors: currentColors,
        clothing: _selectedClothingId,
        pants: _selectedPantsId,
        face: _equippedFaceId,
        accessories: Object.keys(_equippedAccessories).sort(),
        model: _currentModelType,
      });
    }

    // Swap the circular navbar avatar to a freshly generated preview without a
    // page reload, keeping it consistent with the saved avatar right away.
    function refreshNavAvatar(newPreviews) {
      if (!newPreviews) return;
      const src = newPreviews.avatarPreviewHead || newPreviews.avatarPreview;
      if (!src) return;
      const img = navRight && navRight.querySelector('img.avatar-circle-img');
      if (img) {
        img.src = src;
        return;
      }
      const div = navRight && navRight.querySelector('.avatar-circle');
      if (div) {
        const initial = div.textContent.trim().charAt(0).toUpperCase();
        const onclick = div.getAttribute('onclick') || '';
        const uid = auth.currentUser ? auth.currentUser.uid : '';
        const im = document.createElement('img');
        im.src = src;
        im.alt = '';
        im.className = 'avatar-circle-img';
        im.setAttribute('data-initial', initial);
        if (onclick) im.setAttribute('onclick', onclick);
        if (uid) im.setAttribute('onerror', "window.__handleBrokenAvatar(this, '" + uid + "')");
        div.parentNode.replaceChild(im, div);
      }
    }

    function updateSaveState() {
      const s = document.getElementById('btnSave');
      if (!s) return;
      s.disabled = _baselineSignature === null || currentSignature() === _baselineSignature;
    }

    document.getElementById('btnSave').addEventListener('click', async () => {
      if (!auth.currentUser) {
        showToast('Please log in first');
        return;
      }
      try {
        await setDoc(doc(db, 'users', auth.currentUser.uid), {
          avatarBodyColors: currentColors,
          avatarClothing: _selectedClothingId,
          avatarPants: _selectedPantsId,
          avatarAccessories: Object.keys(_equippedAccessories),
          avatarFace: _equippedFaceId,
        }, { merge: true });
        _baselineSignature = currentSignature();
        updateSaveState();
        showToast('Avatar saved!');

        // Render and upload a thumbnail preview
        let newPreviews = null;
        try {
          newPreviews = await captureAndUploadThumbnail();
        } catch (e) {
          console.warn('Thumbnail upload failed:', e);
        }
        refreshNavAvatar(newPreviews);
      } catch (e) {
        console.error('Error saving avatar:', e);
        showToast('Failed to save');
      }
    });

    async function captureAndUploadThumbnail() {
      async function captureShot(camPos, camTarget, publicIdSuffix) {
        const thumbCanvas = document.createElement('canvas');
        thumbCanvas.width = 256;
        thumbCanvas.height = 256;
        const thumbRenderer = new THREE.WebGLRenderer({
          canvas: thumbCanvas,
          antialias: true,
          preserveDrawingBuffer: true,
          alpha: true,
        });
        thumbRenderer.setPixelRatio(1);
        thumbRenderer.outputColorSpace = THREE.SRGBColorSpace;
        thumbRenderer.toneMapping = renderer.toneMapping;
        thumbRenderer.toneMappingExposure = renderer.toneMappingExposure;
        thumbRenderer.setClearColor(0x000000, 0);

        const thumbCam = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
        thumbCam.position.copy(camPos);
        thumbCam.lookAt(camTarget);

        const hidden = [];
        scene.traverse(child => {
          if (child.userData?.isGround) {
            hidden.push(child);
            child.visible = false;
          }
        });
        const prevBg = scene.background ? scene.background.clone() : null;
        scene.background = null;

        const W = 256, H = 256;
        const rt = new THREE.WebGLRenderTarget(W, H);
        rt.texture.colorSpace = THREE.SRGBColorSpace;
        thumbRenderer.setRenderTarget(rt);
        thumbRenderer.render(scene, thumbCam);
        thumbRenderer.setRenderTarget(null);

        const pixels = new Uint8Array(W * H * 4);
        thumbRenderer.readRenderTargetPixels(rt, 0, 0, W, H, pixels);
        rt.dispose();

        if (prevBg) scene.background = prevBg;
        for (const m of hidden) m.visible = true;
        thumbRenderer.dispose();

        const canvas = document.createElement('canvas');
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext('2d');
        const imageData = ctx.createImageData(W, H);
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const si = (y * W + x) * 4;
            const di = ((H - 1 - y) * W + x) * 4;
            imageData.data[di] = pixels[si];
            imageData.data[di + 1] = pixels[si + 1];
            imageData.data[di + 2] = pixels[si + 2];
            imageData.data[di + 3] = pixels[si + 3];
          }
        }
        ctx.putImageData(imageData, 0, 0);

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob || blob.size < 100) return null;
        return blob;
      }

      const fullBodyPos = new THREE.Vector3(5, 5, 11);
      const fullBodyTarget = new THREE.Vector3(0, 2.8, 0);
      const headPos = new THREE.Vector3(0, 4.2, 4);
      const headTarget = new THREE.Vector3(0, 4.8, 0);

      const [fullBodyBlob, headBlob] = await Promise.all([
        captureShot(fullBodyPos, fullBodyTarget),
        captureShot(headPos, headTarget),
      ]);

      if (!fullBodyBlob && !headBlob) {
        console.warn('[thumbnail] both blobs failed');
        return;
      }

      // Upload to Cloudinary WITHOUT a public_id. The preset is unsigned and
      // cannot overwrite (overwrite:true is signed-only), so a fixed id like
      // `u_<uid>` would make every save return `existing:true` with the FIRST
      // uploaded URL forever. Letting Cloudinary assign a fresh id guarantees a
      // new asset + new URL per save (old ones are cleaned by a regen pass).
      const CLOUD_NAME = 'dvkbiobph';
      const UPLOAD_PRESET = 'bloxverse_upload';

      const updateData = {};
      const ts = Date.now();

      async function uploadAvatarBlob(blob, fileName) {
        const fd = new FormData();
        fd.append('file', blob, fileName);
        fd.append('upload_preset', UPLOAD_PRESET);
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
        const data = await res.json();
        if (!data || !data.secure_url) {
          throw new Error((data && data.error && data.error.message) || ('upload failed ' + res.status));
        }
        return data.secure_url;
      }

      if (fullBodyBlob) {
        try {
          const url = await uploadAvatarBlob(fullBodyBlob, 'avatarPreview.png');
          if (url) updateData.avatarPreview = url + '?t=' + ts;
        } catch (e) { console.warn('[thumbnail] full body upload failed:', e); }
      }

      if (headBlob) {
        try {
          const url = await uploadAvatarBlob(headBlob, 'avatarPreviewHead.png');
          if (url) updateData.avatarPreviewHead = url + '?t=' + ts;
        } catch (e) { console.warn('[thumbnail] head shot upload failed:', e); }
      }

      if (Object.keys(updateData).length > 0) {
        await setDoc(doc(db, 'users', auth.currentUser.uid), updateData, { merge: true });
        return updateData;
      }
      return null;
    }

    const toast = document.getElementById('saveToast');
    let toastTimeout = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.getElementById('backBtn').addEventListener('click', () => {
      window.history.back();
    });

    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w === 0 || h === 0) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', onResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      for (const updater of _accessoryUpdaters.values()) updater();
      renderer.render(scene, camera);
    }

    renderClothingGrid();
    renderFacesGrid();
    await prefetchSavedData();
    loadAvatar('male');
    animate();

    document.querySelectorAll('.gender-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const type = btn.dataset.type;
        if (btn.classList.contains('active')) return;
        document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        _currentModelType = type;
        loadAvatar(type);
        updateSaveState();
      });
    });

    // Panel resize
    (function() {
      const panel = document.getElementById('resizeHandle');
      let isDragging = false;
      panel.addEventListener('mousedown', (e) => {
        isDragging = true;
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
      });
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const newWidth = Math.max(240, Math.min(e.clientX, 600));
        document.getElementById('editorPanel').style.width = newWidth + 'px';
        onResize();
      });
      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          document.body.style.userSelect = '';
          document.body.style.cursor = '';
        }
      });
    })();

    </script>
