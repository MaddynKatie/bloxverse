<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {

  }
  </script>

  <link rel="stylesheet" href="src/auth.css" />
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .settings-page {
      max-width: 640px;
      width: 100%;
      padding: 24px;
      padding-top: 76px;
      margin: 0 auto;
    }

    .settings-page h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .settings-section {
      background: var(--bg-secondary);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .settings-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .settings-section-header h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .settings-row:last-child {
      border-bottom: none;
    }

    .settings-row-label {
      font-size: 14px;
      font-weight: 500;
    }

    .settings-row-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .settings-row-value {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .settings-input {
      background: var(--bg-surface);
      border: 1px solid rgba(124,92,252,0.3);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
    }

    .settings-input:focus {
      outline: none;
      border-color: rgba(124,92,252,0.6);
    }

    .settings-btn {
      background: rgba(124,92,252,0.4);
      color: var(--text-primary);
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s;
    }

    .settings-btn:hover {
      background: rgba(124,92,252,0.6);
    }

    .settings-btn.success {
      background: rgba(34,197,94,0.4);
    }

    .settings-btn.danger {
      background: rgba(231,76,60,0.8);
      color: var(--text-primary);
    }

    .settings-btn.danger:hover {
      background: rgba(231,76,60,0.95);
    }

    .settings-btn.danger:disabled {
      background: var(--bg-tertiary);
      color: var(--text-muted);
      cursor: default;
      opacity: 0.8;
    }

    .settings-danger-text {
      color: var(--danger);
    }

    .settings-warning-panel {
      background: rgba(231,76,60,0.08);
      border: 1px solid rgba(231,76,60,0.24);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
      padding: 12px;
    }

    .settings-toggle {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex: 0 0 auto;
    }

    .settings-toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .settings-toggle span {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #555;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .settings-toggle span::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s ease;
    }

    .settings-toggle input:checked + span {
      background: #22c55e;
    }

    .settings-toggle input:checked + span::before {
      transform: translateX(20px);
    }

    .settings-toggle input:disabled + span {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .settings-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .settings-back:hover { color: var(--text-primary); }

    .settings-wrapper {
      position: relative;
    }
    .settings-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      min-width: 140px;
      z-index: 100;
      overflow: hidden;
      margin-top: 4px;
    }
    .settings-dropdown.open { display: block; }
    .settings-dropdown button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-dropdown button:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .settings-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .settings-modal {
      background: var(--bg-secondary);
      border-radius: 12px;
      width: 90%;
      max-width: 420px;
      padding: 24px;
      position: relative;
    }
    .settings-modal h3 {
      margin: 0 0 16px;
      font-size: 18px;
    }
    .settings-modal .field {
      margin-bottom: 14px;
    }
    .settings-modal .field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .settings-modal .field input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }
    .settings-modal .field input:focus {
      outline: none;
      border-color: rgba(124,92,252,0.6);
    }
    .settings-modal .field .error {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 4px;
    }
    .settings-modal .field .success {
      color: #4caf50;
      font-size: 12px;
      margin-top: 4px;
    }
    .settings-modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }
    .settings-modal-actions button {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .settings-modal-actions .cancel {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
    }
    .settings-modal-actions .cancel:hover { background: var(--bg-secondary); }
    .settings-modal-actions .save {
      background: rgba(124,92,252,0.5);
      color: var(--text-primary);
    }
    .settings-modal-actions .save:hover { background: rgba(124,92,252,0.7); }
    .settings-modal-actions .save.danger {
      background: rgba(231,76,60,0.85);
      color: var(--text-primary);
    }
    .settings-modal-actions .save.danger:hover { background: rgba(231,76,60,1); }
    .settings-modal-actions .save:disabled { opacity: 0.5; cursor: default; }
    .settings-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }
    .settings-modal-close:hover { color: var(--text-primary); }
    .settings-modal-actions.full-width button {
      width: 100%;
      justify-content: center;
      padding: 10px 20px;
    }
    @media (max-width: 768px) {
      .settings-page { padding: 16px; padding-top: 64px; }
      .settings-page h1 { font-size: 18px; }
      .settings-section { padding: 12px; }
      .settings-row { flex-wrap: wrap; gap: 6px; }
      .settings-row-desc { font-size: 11px; }
    }
    @media (max-width: 480px) {
      .settings-page { padding: 12px; padding-top: 56px; }
      .settings-row { flex-direction: column; align-items: flex-start; }
    }
  </style>

  <link rel="stylesheet" href="src/theme.css" />
  <script type="module" src="src/theme.js"></script>
  <script src="js/sw-register.js" defer></script>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links" id="navLinks">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" data-needs-auth onclick="window.location.href='/bloxverse/avatar'">Avatar</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/download'" style="display:flex;align-items:center;gap:5px;">
          <i class="fa-solid fa-download" style="font-size:12px;"></i> Download
        </button>
      </div>
    </div>
    <div class="nav-right" id="navRight"></div>
  </nav>

  <div class="settings-page" id="settingsPage"></div>

  <script type="module">
    import { auth, db, calculateAge, logTransaction, assignUserIdNum, trackPresence } from './src/firebase.js';
    import { onAuthStateChanged, signOut, updateEmail, updatePassword, reauthenticateWithCredential, EmailAuthProvider, sendEmailVerification } from 'firebase/auth';
    import { doc, getDoc, setDoc, onSnapshot, updateDoc, increment, collection, getDocs, query, where, limit } from 'firebase/firestore';
    import { isRpcEnabled, setRpcEnabled } from './src/rpc.js';

    const _checkSvg = '<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#22c55e;flex-shrink:0;"><svg viewBox="0 0 16 16" width="9" height="9" fill="none"><path d="M3.5 8.5L6.5 11.5L12.5 4.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
    const _xSvg = '<span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#e74c3c;flex-shrink:0;"><svg viewBox="0 0 16 16" width="8" height="8" fill="none"><path d="M4 4L12 12M12 4L4 12" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></span>';
    const _closeX = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
    const _serverBase = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:8080' : 'https://bloxverse.onrender.com';

    const maskEmail = (email) => {
      if (!email) return email || '';
      const idx = email.indexOf('@');
      if (idx <= 0) return email;
      return email.slice(0, 4) + '***' + email.slice(idx);
    };

    const formatDateTime = (value) => {
      if (!value) return '';
      const date = value.toDate ? value.toDate() : new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      return date.toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    };

    const navRight = document.getElementById('navRight');
    const settingsPage = document.getElementById('settingsPage');

    onAuthStateChanged(auth, async (user) => {
      document.querySelectorAll('[data-needs-auth]').forEach(el => { el.style.display = user ? '' : 'none'; });
      if (!user) {
        window.location.href = '/bloxverse/auth';
        return;
      }

      assignUserIdNum(user.uid).catch(() => {});
      trackPresence(user.uid, null, 'settings');

      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const userData = userDoc.exists() ? userDoc.data() : {};
      let deletionRequested = userData.accountDeletionRequested === true;
      let deletionScheduledFor = userData.accountDeletionScheduledFor || '';
      let birthday = userData.birthday || '';
      const username = userData.username || 'Player';
      const ownBux = userData.bux || 0;
      const ownNum = userData.userIdNum;
      let age = calculateAge(birthday);
      let canUseVoiceChat = age >= 13;
      let voiceChatEnabled = canUseVoiceChat && userData.voiceEnabled === true;
      const ownProfileLink = ownNum ? `/bloxverse/profile?user=${ownNum}` : '/bloxverse/profile';
      const ownInitial = (userData.username || 'P').charAt(0).toUpperCase();
      const ownPreview = userData.avatarPreviewHead || userData.avatarPreview || null;
      const _cb = Date.now();
      try {
        const saved = JSON.parse(localStorage.getItem('bloxverse_settings') || '{}');
        saved.voiceEnabled = voiceChatEnabled;
        localStorage.setItem('bloxverse_settings', JSON.stringify(saved));
      } catch (_) {}
 
      // Check 2FA enrollment from Firestore
      const has2FA = userData.totpEnabled === true;
      const recoveryLeft = Array.isArray(userData.recoveryCodes)
        ? Math.max(0, 10 - (Number(userData.recoveryCodesUsed) || 0))
        : 0;

      settingsPage.innerHTML = `
        <a href="${ownProfileLink}" class="settings-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          Back to Profile
        </a>

        <h1>Settings</h1>

        <div class="settings-section">
          <div class="settings-section-header">
            <h2>Account</h2>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Birthday</div>
              <div class="settings-row-desc">Used to calculate your age for content filtering</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="settings-row-value" id="birthdayDisplay">${birthday ? new Date(+birthday.split('-')[0], +birthday.split('-')[1] - 1, +birthday.split('-')[2]).toLocaleDateString() : 'Not set'}</span>
              <button class="settings-btn" id="editBirthdayBtn">Edit</button>
            </div>
          </div>
          <div class="settings-row">
            <div>
              <div style="display:flex;align-items:center;gap:8px;">
                <div class="settings-row-label" style="margin:0;">Email</div>
                ${user.emailVerified ? _checkSvg : _xSvg}
              </div>
              <div class="settings-row-desc">Your login email address</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="settings-row-value" id="emailDisplay">${maskEmail(user.email)}</span>
              <button class="settings-btn" id="editEmailBtn">Edit</button>
              ${!user.emailVerified ? `<button class="settings-btn" id="verifyEmailBtn" style="background:rgba(231,76,60,0.4);font-size:11px;">Verify</button><span id="verifyEmailStatus" style="font-size:12px;color:var(--text-muted);display:none;"></span>` : ''}
            </div>
          </div>
          ${user.email && !['gmail.com','yahoo.com','outlook.com','hotmail.com','icloud.com','protonmail.com','proton.me'].includes(user.email.split('@')[1]?.toLowerCase()) ? `
          <div class="settings-row" style="border:none;padding-top:0;">
            <span style="color:#e74c3c;font-size:12px;">Only Gmail, Yahoo, Outlook/Hotmail, iCloud, or Proton Mail are supported. Update your email to a supported provider.</span>
          </div>
          ` : ''}
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Password</div>
              <div class="settings-row-desc">Change your account password</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="settings-row-value" id="passwordDisplay">${'•'.repeat(userData.passwordLength || 0) || '••••••••'}</span>
              <button class="settings-btn" id="editPasswordBtn">Edit</button>
            </div>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label settings-danger-text">Delete Account</div>
              <div class="settings-row-desc" id="accountDeletionDesc">${deletionRequested ? `Deletion scheduled for ${formatDateTime(deletionScheduledFor) || '7 days from your request'}` : 'Request permanent deletion of your account and data'}</div>
            </div>
            <button class="settings-btn danger" id="deleteAccountBtn">${deletionRequested ? 'Requested' : 'Delete Account'}</button>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-header">
            <h2>Appearance</h2>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Theme</div>
              <div class="settings-row-desc">Switch between light and dark mode</div>
            </div>
            <select class="settings-input" id="themeSelect">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-header">
            <h2>Communication</h2>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Voice Chat</div>
              <div class="settings-row-desc" id="voiceChatDesc">${canUseVoiceChat ? 'Allow voice chat in experiences that support it' : 'Voice chat is only available for 13+ accounts'}</div>
            </div>
            <label class="settings-toggle" title="${canUseVoiceChat ? 'Voice Chat' : 'Requires a 13+ account'}">
              <input type="checkbox" id="voiceChatToggle" ${voiceChatEnabled ? 'checked' : ''} ${canUseVoiceChat ? '' : 'disabled'} />
              <span></span>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-header">
            <h2>Privacy</h2>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Profile Visibility</div>
              <div class="settings-row-desc">Who can view your profile page</div>
            </div>
            <select class="settings-input" id="privacySelect">
              <option value="public" ${(userData.profilePrivacy || 'public') === 'public' ? 'selected' : ''}>Everyone</option>
              <option value="friends" ${userData.profilePrivacy === 'friends' ? 'selected' : ''}>Friends Only</option>
            </select>
          </div>
          <div class="settings-row" id="rpcRow" style="display:none;">
            <div>
              <div class="settings-row-label">Discord RPC</div>
              <div class="settings-row-desc">Show your BloxVerse activity on Discord (desktop app)</div>
            </div>
            <label class="settings-toggle">
              <input type="checkbox" id="rpcToggle" />
              <span></span>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-header">
            <h2>Security</h2>
          </div>
          <div class="settings-row">
            <div>
              <div style="display:flex;align-items:center;gap:6px;">
                <div class="settings-row-label" style="margin:0;">Two-Factor Authentication</div>
                ${has2FA ? _checkSvg : _xSvg}
              </div>
              <div class="settings-row-desc">${has2FA ? '2FA is enabled on your account' : 'Add an extra layer of security to your account'}</div>
              ${has2FA ? `<div class="settings-row-desc" style="margin-top:2px;font-size:12px;">Unused recovery codes left: <span id="recoveryLeftCount">${recoveryLeft}</span></div>` : ''}
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              ${has2FA ? `<button class="settings-btn" id="generateRecoveryBtn" style="font-size:12px;">Generate New Recovery Codes</button>` : ''}
              <button class="settings-btn" id="${has2FA ? 'disable2FABtn' : 'enable2FABtn'}" style="${has2FA ? 'background:rgba(231,76,60,0.4);' : ''}">${has2FA ? 'Disable' : 'Enable'}</button>
            </div>
          </div>
        </div>
      `;

      // Theme toggle
      const themeSelect = document.getElementById('themeSelect');
      import('./src/theme.js').then(mod => {
        themeSelect.value = mod.getTheme();
        themeSelect.addEventListener('change', () => mod.setTheme(themeSelect.value));
      });

      // Nav bar
      navRight.innerHTML = `
        <div class="user-info">
          <div class="bux-wrapper" id="buxWrapper">
            <button class="bux-btn" id="buxBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
              </svg>
              <span id="ownBuxVal">${ownBux.toLocaleString()}</span>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
            </button>
            <div class="bux-dropdown">
              <div class="bux-dropdown-header">
                <span class="bux-dropdown-label">Balance</span>
                <span class="bux-dropdown-balance" id="buxDropdownBalance">${ownBux.toLocaleString()}</span>
              </div>
              <button class="bux-dropdown-item" onclick="window.openSendBuxModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-2 8-10V5l-8-3-8 3v7c0 8 8 10 8 10z"/></svg>
                Send Bux
              </button>
              <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Transactions
              </button>
            </div>
          </div>
          <div class="settings-wrapper">
            <button class="settings-nav-btn" id="navSettingsBtn" title="Settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
            <div class="settings-dropdown" id="navSettingsDropdown">
              <button onclick="window.location.href='/bloxverse/settings'">Settings</button>
              <button onclick="window._logout()">Log Out</button>
            </div>
          </div>
          ${ownPreview
            ? `<img src="${ownPreview}?_cb=${_cb}" alt="" class="avatar-circle-img" onclick="window.location.href='${ownProfileLink}'" data-initial="${ownInitial}" onerror="window.__handleBrokenAvatar(this, '${user.uid}')"/>`
            : `<div class="avatar-circle" onclick="window.location.href='${ownProfileLink}'">${ownInitial}</div>`}
        </div>
      `;

      // Bux dropdown toggle
      const buxWrapper = document.getElementById('buxWrapper');
      const buxBtn = document.getElementById('buxBtn');
      buxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        buxWrapper.classList.toggle('open');
      });

      // Settings dropdown toggle
      const closeSettings = () => {
        document.querySelectorAll('.settings-dropdown').forEach(d => d.classList.remove('open'));
      };
      const navSettingsBtn = document.getElementById('navSettingsBtn');
      if (navSettingsBtn) {
        navSettingsBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeSettings();
          const dd = document.getElementById('navSettingsDropdown');
          if (dd) dd.classList.toggle('open');
        });
      }

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.settings-wrapper')) {
          closeSettings();
        }
        if (buxWrapper && !buxWrapper.contains(e.target)) {
          buxWrapper.classList.remove('open');
        }
      });

      // Birthday edit
      const editBtn = document.getElementById('editBirthdayBtn');
      if (editBtn) {
        let editingBirthday = false;
        editBtn.addEventListener('click', async () => {
          const display = document.getElementById('birthdayDisplay');
          if (!editingBirthday) {
            display.innerHTML = '<input type="date" id="birthdayInput" value="' + birthday + '" class="settings-input" style="width:140px;">';
            editBtn.textContent = 'Save';
            editingBirthday = true;
            return;
          }

          const input = document.getElementById('birthdayInput');
          if (input) {
            const newVal = document.getElementById('birthdayInput').value;
            if (!newVal) return;
            try {
              await setDoc(doc(db, 'users', user.uid), { birthday: newVal }, { merge: true });
              birthday = newVal;
              age = calculateAge(birthday);
              canUseVoiceChat = age >= 13;
              voiceChatEnabled = canUseVoiceChat && userData.voiceEnabled === true;
              const [py, pm, pd] = newVal.split('-');
              document.getElementById('birthdayDisplay').textContent = new Date(+py, +pm - 1, +pd).toLocaleDateString();
              editBtn.textContent = 'Edit';
              editBtn.classList.add('success');
              setTimeout(() => editBtn.classList.remove('success'), 2000);
              editingBirthday = false;

              const voiceChatToggle = document.getElementById('voiceChatToggle');
              const voiceChatDesc = document.getElementById('voiceChatDesc');
              if (voiceChatToggle) {
                voiceChatToggle.disabled = !canUseVoiceChat;
                voiceChatToggle.checked = canUseVoiceChat && userData.voiceEnabled === true;
              }
              if (!canUseVoiceChat && userData.voiceEnabled === true) {
                userData.voiceEnabled = false;
                await setDoc(doc(db, 'users', user.uid), { voiceEnabled: false }, { merge: true });
              }
              try {
                const saved = JSON.parse(localStorage.getItem('bloxverse_settings') || '{}');
                saved.voiceEnabled = canUseVoiceChat && userData.voiceEnabled === true;
                localStorage.setItem('bloxverse_settings', JSON.stringify(saved));
              } catch (_) {}
              if (voiceChatDesc) {
                voiceChatDesc.textContent = canUseVoiceChat ? 'Allow voice chat in experiences that support it' : 'Voice chat is only available for 13+ accounts';
              }
            } catch (e) {
              console.error('Error saving birthday:', e);
              editBtn.textContent = 'Save';
            }
          }
        });
      }

      // Email edit
      const editEmailBtn = document.getElementById('editEmailBtn');
      if (editEmailBtn) {
        editEmailBtn.addEventListener('click', () => {
          const overlay = document.createElement('div');
          overlay.className = 'settings-modal-overlay';
          overlay.innerHTML = `
            <div class="settings-modal">
              <h3>Change Email</h3>
              <div class="field">
                <label>Current Email</label>
                <input type="email" id="emailCurrentDisplay" value="${user.email || ''}" disabled style="opacity:0.6;" />
              </div>
              <div class="field">
                <label>New Email</label>
                <input type="email" id="emailNewInput" placeholder="Enter new email" autocomplete="off" />
                <div id="emailErr" class="error"></div>
              </div>
              <div class="field">
                <label>Password</label>
                <input type="password" id="emailPasswordInput" placeholder="Enter your password to confirm" autocomplete="current-password" />
              </div>
              <div class="settings-modal-actions">
                <button class="cancel" onclick="this.closest('.settings-modal-overlay').remove()">Cancel</button>
                <button class="save" id="emailSaveBtn">Save</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);
          const saveBtn = overlay.querySelector('#emailSaveBtn');
          const newEmailInput = overlay.querySelector('#emailNewInput');
          const passInput = overlay.querySelector('#emailPasswordInput');
          const errEl = overlay.querySelector('#emailErr');
          saveBtn.addEventListener('click', async () => {
            const newEmail = newEmailInput.value.trim();
            const password = passInput.value;
            if (!newEmail) { errEl.textContent = 'Enter a new email'; return; }
            if (!password) { errEl.textContent = 'Enter your password'; return; }
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            try {
              const credential = EmailAuthProvider.credential(user.email, password);
              await reauthenticateWithCredential(user, credential);
              await updateEmail(user, newEmail);
              document.getElementById('emailDisplay').textContent = maskEmail(newEmail);
              overlay.remove();
            } catch (e) {
              saveBtn.disabled = false;
              saveBtn.textContent = 'Save';
              if (e.code === 'auth/wrong-password') errEl.textContent = 'Incorrect password';
              else if (e.code === 'auth/email-already-in-use') errEl.textContent = 'Email already in use';
              else if (e.code === 'auth/requires-recent-login') errEl.textContent = 'Please log out and log back in, then try again';
              else errEl.textContent = e.message;
            }
          });
        });
      }

      // Send verification email
      const verifyBtn = document.getElementById('verifyEmailBtn');
      if (verifyBtn) {
        verifyBtn.addEventListener('click', async () => {
          const statusEl = document.getElementById('verifyEmailStatus');
          verifyBtn.disabled = true;
          verifyBtn.textContent = 'Sending...';
          statusEl.style.display = 'inline';
          statusEl.textContent = 'Sending...';
          try {
            await sendEmailVerification(auth.currentUser);
            statusEl.textContent = 'Verification email sent! Check your inbox.';
            setTimeout(() => { statusEl.style.display = 'none'; }, 5000);
          } catch (e) {
            statusEl.textContent = 'Failed: ' + e.message;
          }
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Send verification email';
        });
      }

      // Password edit
      const editPasswordBtn = document.getElementById('editPasswordBtn');
      if (editPasswordBtn) {
        editPasswordBtn.addEventListener('click', () => {
          const overlay = document.createElement('div');
          overlay.className = 'settings-modal-overlay';
          overlay.innerHTML = `
            <div class="settings-modal">
              <h3>Change Password</h3>
              <div class="field">
                <label>Current Password</label>
                <input type="password" id="pwCurrentInput" placeholder="Enter current password" autocomplete="current-password" />
              </div>
              <div class="field">
                <label>New Password</label>
                <input type="password" id="pwNewInput" placeholder="Enter new password" autocomplete="new-password" />
              </div>
              <div class="field">
                <label>Confirm New Password</label>
                <input type="password" id="pwConfirmInput" placeholder="Confirm new password" autocomplete="new-password" />
                <div id="pwErr" class="error"></div>
              </div>
              <div class="settings-modal-actions">
                <button class="cancel" onclick="this.closest('.settings-modal-overlay').remove()">Cancel</button>
                <button class="save" id="pwSaveBtn">Update Password</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);
          const saveBtn = overlay.querySelector('#pwSaveBtn');
          const currentInput = overlay.querySelector('#pwCurrentInput');
          const newInput = overlay.querySelector('#pwNewInput');
          const confirmInput = overlay.querySelector('#pwConfirmInput');
          const errEl = overlay.querySelector('#pwErr');
          saveBtn.addEventListener('click', async () => {
            const current = currentInput.value;
            const newPw = newInput.value;
            const confirm = confirmInput.value;
            if (!current) { errEl.textContent = 'Enter current password'; return; }
            if (!newPw) { errEl.textContent = 'Enter new password'; return; }
            if (newPw.length < 6) { errEl.textContent = 'New password must be at least 6 characters'; return; }
            if (newPw !== confirm) { errEl.textContent = 'Passwords do not match'; return; }
            saveBtn.disabled = true;
            saveBtn.textContent = 'Updating...';
            try {
              const credential = EmailAuthProvider.credential(user.email, current);
              await reauthenticateWithCredential(user, credential);
              await updatePassword(user, newPw);
              await setDoc(doc(db, 'users', user.uid), { passwordLength: newPw.length }, { merge: true });
              document.getElementById('passwordDisplay').textContent = '•'.repeat(newPw.length);
              overlay.innerHTML = `
                <div class="settings-modal">
                  <h3 style="color:#4caf50;">Password Updated</h3>
                  <p style="color:var(--text-secondary);font-size:14px;">Your password has been changed successfully.</p>
                  <div class="settings-modal-actions">
                    <button class="save" onclick="this.closest('.settings-modal-overlay').remove()">Done</button>
                  </div>
                </div>
              `;
            } catch (e) {
              saveBtn.disabled = false;
              saveBtn.textContent = 'Update Password';
              if (e.code === 'auth/wrong-password') errEl.textContent = 'Incorrect current password';
              else if (e.code === 'auth/weak-password') errEl.textContent = 'New password is too weak (min 6 characters)';
              else if (e.code === 'auth/requires-recent-login') errEl.textContent = 'Please log out and log back in, then try again';
              else errEl.textContent = e.message;
            }
          });
        });
      }

      // Account deletion request
      const deleteAccountBtn = document.getElementById('deleteAccountBtn');
      if (deleteAccountBtn) {
        deleteAccountBtn.disabled = deletionRequested;
        deleteAccountBtn.addEventListener('click', () => {
          if (deletionRequested) return;

          const overlay = document.createElement('div');
          overlay.className = 'settings-modal-overlay';
          overlay.innerHTML = `
            <div class="settings-modal">
              <button class="settings-modal-close" onclick="this.closest('.settings-modal-overlay').remove()">${_closeX}</button>
              <h3>Delete Account</h3>
              <div class="settings-warning-panel">
                Upon requesting a deletion, your account and its data will be held for 7 days. You can cancel the deletion before that by logging in, but after this time expires, your data will not be recovered.
              </div>
              <div id="deleteAccountErr" class="field" style="display:none;margin:12px 0 0;">
                <div class="error"></div>
              </div>
              <div class="settings-modal-actions">
                <button class="cancel" onclick="this.closest('.settings-modal-overlay').remove()">Cancel</button>
                <button class="save danger" id="confirmDeleteAccountBtn">Request Deletion</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);

          const confirmBtn = overlay.querySelector('#confirmDeleteAccountBtn');
          const errWrap = overlay.querySelector('#deleteAccountErr');
          const errEl = errWrap?.querySelector('.error');

          confirmBtn.addEventListener('click', async () => {
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Requesting...';
            const requestedAt = new Date();
            const scheduledFor = new Date(requestedAt.getTime() + 7 * 24 * 60 * 60 * 1000);
            try {
              await setDoc(doc(db, 'users', user.uid), {
                accountDeletionRequested: true,
                accountDeletionRequestedAt: requestedAt.toISOString(),
                accountDeletionScheduledFor: scheduledFor.toISOString(),
                accountDeletionStatus: 'pending',
              }, { merge: true });

              deletionRequested = true;
              deletionScheduledFor = scheduledFor.toISOString();
              deleteAccountBtn.textContent = 'Requested';
              deleteAccountBtn.disabled = true;
              const desc = document.getElementById('accountDeletionDesc');
              if (desc) desc.textContent = `Deletion scheduled for ${formatDateTime(deletionScheduledFor)}`;

              overlay.innerHTML = `
                <div class="settings-modal">
                  <h3>Deletion Requested</h3>
                  <p style="color:var(--text-secondary);font-size:14px;line-height:1.5;">Your account is scheduled for deletion on ${formatDateTime(deletionScheduledFor)}. Logging in before then will cancel this request.</p>
                  <div class="settings-modal-actions full-width">
                    <button class="save" id="deleteAccountDoneBtn">Done</button>
                  </div>
                </div>
              `;
              overlay.querySelector('#deleteAccountDoneBtn').addEventListener('click', async () => {
                await signOut(auth);
                window.location.href = '/bloxverse/auth';
              });
            } catch (e) {
              confirmBtn.disabled = false;
              confirmBtn.textContent = 'Request Deletion';
              if (errWrap) errWrap.style.display = 'block';
              if (errEl) errEl.textContent = e.message || 'Could not request deletion. Try again.';
            }
          });
        });
      }

      // Privacy select
      const privacySelect = document.getElementById('privacySelect');
      if (privacySelect) {
        privacySelect.addEventListener('change', async () => {
          await setDoc(doc(db, 'users', user.uid), { profilePrivacy: privacySelect.value }, { merge: true });
        });
      }

      // Discord RPC — app only (hidden on the public website)
      const rpcRow = document.getElementById('rpcRow');
      const rpcToggle = document.getElementById('rpcToggle');
      if (rpcRow && rpcToggle) {
        const inApp = !!(window.bloxverseApp && window.bloxverseApp.isApp);
        rpcRow.style.display = inApp ? '' : 'none';
        if (inApp) {
          rpcToggle.checked = isRpcEnabled();
          rpcToggle.addEventListener('change', () => setRpcEnabled(rpcToggle.checked));
        }
      }

      const voiceChatToggle = document.getElementById('voiceChatToggle');
      if (voiceChatToggle) {
        voiceChatToggle.addEventListener('change', async () => {
          if (!canUseVoiceChat) {
            voiceChatToggle.checked = false;
            return;
          }
          const enabled = voiceChatToggle.checked;
          try {
            await setDoc(doc(db, 'users', user.uid), { voiceEnabled: enabled }, { merge: true });
            userData.voiceEnabled = enabled;
            const saved = JSON.parse(localStorage.getItem('bloxverse_settings') || '{}');
            saved.voiceEnabled = enabled;
            localStorage.setItem('bloxverse_settings', JSON.stringify(saved));
          } catch (e) {
            console.error('Error saving voice chat setting:', e);
            voiceChatToggle.checked = !enabled;
          }
        });
      }

      // Enable 2FA
      const enableBtn = document.getElementById('enable2FABtn');
      if (enableBtn) {
        enableBtn.addEventListener('click', () => {
          const overlay = document.createElement('div');
          overlay.className = 'settings-modal-overlay';
          overlay.innerHTML = `
            <div class="settings-modal">
              <button class="settings-modal-close" onclick="this.closest('.settings-modal-overlay').remove()">${_closeX}</button>
              <h3>Two-Factor Authentication</h3>
              <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">Step 1 of 2 — confirm your password to start setup</p>
              <div class="field">
                <label>Current Password</label>
                <input type="password" id="mfaStep1Pass" placeholder="Enter your password" autocomplete="current-password" />
                <div id="mfaStep1Err" class="error"></div>
              </div>
              <div class="settings-modal-actions full-width">
                <button class="save" id="mfaStep1Continue">Continue</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);

          const passInput = overlay.querySelector('#mfaStep1Pass');
          const errEl = overlay.querySelector('#mfaStep1Err');
          const continueBtn = overlay.querySelector('#mfaStep1Continue');

          const doStep1 = async () => {
            const password = passInput.value;
            if (!password) { errEl.textContent = 'Enter your password'; return; }
            continueBtn.disabled = true;
            continueBtn.textContent = 'Verifying...';
            try {
              const res = await fetch(_serverBase + '/api/2fa/setup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user.email, password, username: userData.username }),
              });
              const data = await res.json();
              if (!res.ok) {
                throw new Error(data.error || 'Setup failed');
              }

              // Step 1 passed — show Step 2
              overlay.innerHTML = `
                <div class="settings-modal">
                  <button class="settings-modal-close" onclick="this.closest('.settings-modal-overlay').remove()">${_closeX}</button>
                  <h3>Enable Two-Factor Authentication</h3>
                  <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">Step 2 of 2 — scan this QR code with an authenticator app, then enter the code it shows.</p>
                  <div style="text-align:center;margin:16px 0;">
                    <img src="${data.qr_code}" alt="QR Code" style="width:180px;height:180px;border-radius:8px;background:#fff;padding:8px;" />
                  </div>
                  <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:12px;">Can't scan it? Enter this key manually instead:</p>
                  <div style="background:var(--bg-surface);border-radius:6px;padding:10px 12px;text-align:center;font-family:monospace;font-size:13px;color:var(--text-primary);margin-bottom:16px;word-break:break-all;">${data.secret}</div>
                  <div class="field">
                    <label>6-digit code from your app</label>
                    <input type="text" id="mfaStep2Code" placeholder="Enter code" maxlength="6" autocomplete="off" />
                    <div id="mfaStep2Err" class="error"></div>
                  </div>
                  <div class="settings-modal-actions full-width">
                    <button class="save" id="mfaStep2Confirm">Confirm &amp; Enable</button>
                  </div>
                </div>
              `;

              const codeInput = overlay.querySelector('#mfaStep2Code');
              const step2Err = overlay.querySelector('#mfaStep2Err');
              const confirmBtn = overlay.querySelector('#mfaStep2Confirm');

              // Store secret in Firestore first
              try {
                await setDoc(doc(db, 'users', user.uid), { totpSecret: data.secret }, { merge: true });
              } catch (e) {
                step2Err.textContent = 'Failed to save setup data. Try again.';
                confirmBtn.disabled = false;
                return;
              }

              const doVerify = async () => {
                const code = codeInput.value.trim();
                if (!code || code.length !== 6 || !/^\d{6}$/.test(code)) {
                  step2Err.textContent = 'Enter a valid 6-digit code';
                  return;
                }
                confirmBtn.disabled = true;
                confirmBtn.textContent = 'Enabling...';
                try {
                  const verifyRes = await fetch(_serverBase + '/api/2fa/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: user.email, code, secret: data.secret }),
                  });
                  const verifyData = await verifyRes.json();
                  if (!verifyRes.ok) {
                    throw new Error(verifyData.error || 'Verification failed');
                  }
                  await setDoc(doc(db, 'users', user.uid), { totpEnabled: true }, { merge: true });
                  overlay.innerHTML = `
                    <div class="settings-modal">
                      <h3 style="color:#22c55e;">2FA Enabled</h3>
                      <p style="color:var(--text-secondary);font-size:14px;">Two-factor authentication is now active on your account.</p>
                      <div class="settings-modal-actions full-width">
                        <button class="save" onclick="location.reload()">Done</button>
                      </div>
                    </div>
                  `;
                } catch (e) {
                  confirmBtn.disabled = false;
                  confirmBtn.textContent = 'Confirm & Enable';
                  step2Err.textContent = e.message;
                }
              };

              confirmBtn.addEventListener('click', doVerify);
              codeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doVerify();
              });
              codeInput.focus();
            } catch (e) {
              continueBtn.disabled = false;
              continueBtn.textContent = 'Continue';
              errEl.textContent = e.message;
            }
          };

          continueBtn.addEventListener('click', doStep1);
          passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doStep1();
          });
          passInput.focus();
        });
      }

      // Generate New Recovery Codes
      const generateBtn = document.getElementById('generateRecoveryBtn');
      if (generateBtn) {
        generateBtn.addEventListener('click', () => {
          if (!has2FA) return;
          const storedSecret = userData.totpSecret;
          if (!storedSecret) { return; }
          const overlay = document.createElement('div');
          overlay.className = 'settings-modal-overlay';
          overlay.innerHTML = `
            <div class="settings-modal">
              <button class="settings-modal-close" onclick="this.closest('.settings-modal-overlay').remove()">${_closeX}</button>
              <h3>Generate New Recovery Codes</h3>
              <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">Confirm your password and a code from your authenticator app, or one of your existing recovery codes. This replaces any previously generated set.</p>
              <div class="field">
                <label>Current Password</label>
                <input type="password" id="mfaGenRecPass" placeholder="Enter your password" autocomplete="current-password" />
                <div id="mfaGenRecErr" class="error"></div>
              </div>
              <div class="field">
                <label>Verification or Recovery Code</label>
                <input type="text" id="mfaGenRecCode" placeholder="000000 or XXXXX-XXXXX" maxlength="11" autocomplete="off" style="text-transform:uppercase;" />
              </div>
              <div class="settings-modal-actions full-width">
                <button class="save" id="mfaGenRecBtn">Generate</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);

          const passInput = overlay.querySelector('#mfaGenRecPass');
          const codeInput = overlay.querySelector('#mfaGenRecCode');
          const errEl = overlay.querySelector('#mfaGenRecErr');
          const genBtn = overlay.querySelector('#mfaGenRecBtn');

          const doGenerate = async () => {
            const password = passInput.value;
            const code = codeInput.value.trim().toUpperCase();
            if (!password) { errEl.textContent = 'Enter your password'; return; }
            if (!code || !(/^\d{6}$/.test(code) || /^[A-Z0-9]{5}-[A-Z0-9]{5}$/.test(code))) {
              errEl.textContent = 'Enter a valid verification or recovery code';
              return;
            }
            genBtn.disabled = true;
            genBtn.textContent = 'Generating...';
            try {
              const payload = { email: user.email, password, secret: storedSecret };
              if (/^\d{6}$/.test(code)) {
                payload.code = code;
              } else {
                payload.recoveryCode = code;
                payload.recoveryCodes = Array.isArray(userData.recoveryCodes) ? userData.recoveryCodes : [];
              }
              const res = await fetch(_serverBase + '/api/2fa/generate-recovery', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              });
              const data = await res.json();
              if (!res.ok) {
                throw new Error(data.error || 'Failed to generate recovery codes');
              }

              // Store hashed codes immediately so they are active
              await setDoc(doc(db, 'users', user.uid), { recoveryCodes: data.hashedCodes, recoveryCodesUsed: 0 }, { merge: true });

              const leftCountEl = document.getElementById('recoveryLeftCount');
              if (leftCountEl) leftCountEl.textContent = '10';

              const codesHtml = data.codes.map(c => `
                <div style="background:var(--bg-surface);border-radius:6px;padding:10px 12px;text-align:center;font-family:monospace;font-size:15px;letter-spacing:1px;color:var(--text-primary);border:1px solid var(--bg-tertiary);">${c}</div>
              `).join('');

              overlay.innerHTML = `
                <div class="settings-modal">
                  <button class="settings-modal-close" onclick="this.closest('.settings-modal-overlay').remove()">${_closeX}</button>
                  <h3>Your New Recovery Codes</h3>
                  <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;">
                    <span style="width:8px;height:8px;border-radius:50%;background:${has2FA ? '#22c55e' : '#e74c3c'};"></span>
                    <span style="color:${has2FA ? '#22c55e' : '#e74c3c'};font-size:13px;font-weight:600;">Two-factor authentication ${has2FA ? 'enabled' : 'disabled'}.</span>
                  </div>
                  <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">Save these codes somewhere safe. Each code can only be used once, and they replace any previous set. If you ever lose access to your authenticator app, use one to sign in.</p>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">${codesHtml}</div>
                  <div class="settings-modal-actions full-width">
                    <button class="save" id="copyRecoveryBtn">Copy Codes</button>
                    <button class="cancel" onclick="this.closest('.settings-modal-overlay').remove()">Close</button>
                  </div>
                </div>
              `;

              const copyBtn = overlay.querySelector('#copyRecoveryBtn');
              if (copyBtn) {
                copyBtn.addEventListener('click', async () => {
                  try {
                    await navigator.clipboard.writeText(data.codes.join('\n'));
                    copyBtn.textContent = 'Copied!';
                  } catch (_) {
                    copyBtn.textContent = 'Copy failed';
                  }
                });
              }
            } catch (e) {
              genBtn.disabled = false;
              genBtn.textContent = 'Generate';
              errEl.textContent = e.message;
            }
          };

          genBtn.addEventListener('click', doGenerate);
          codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doGenerate();
          });
          passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') codeInput.focus();
          });
          passInput.focus();
        });
      }

      // Disable 2FA
      const disableBtn = document.getElementById('disable2FABtn');
      if (disableBtn) {
        disableBtn.addEventListener('click', async () => {
          if (!has2FA) return;
          const storedSecret = userData.totpSecret;
          if (!storedSecret) { return; }
          const overlay = document.createElement('div');
          overlay.className = 'settings-modal-overlay';
          overlay.innerHTML = `
            <div class="settings-modal">
              <button class="settings-modal-close" onclick="this.closest('.settings-modal-overlay').remove()">${_closeX}</button>
              <h3>Disable Two-Factor Authentication</h3>
              <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">Confirm your password and a current code from your authenticator app, or one of your recovery codes.</p>
              <div class="field">
                <label>Current Password</label>
                <input type="password" id="mfaDisablePass" placeholder="Enter your password" autocomplete="current-password" />
                <div id="mfaDisableErr" class="error"></div>
              </div>
              <div class="field">
                <label>Verification or Recovery Code</label>
                <input type="text" id="mfaDisableCode" placeholder="000000 or XXXXX-XXXXX" maxlength="11" autocomplete="off" style="text-transform:uppercase;" />
              </div>
              <div class="settings-modal-actions full-width">
                <button class="save" id="mfaDisableBtn" style="background:rgba(231,76,60,0.4);">Disable</button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);

          const passInput = overlay.querySelector('#mfaDisablePass');
          const codeInput = overlay.querySelector('#mfaDisableCode');
          const errEl = overlay.querySelector('#mfaDisableErr');
          const disableConfirmBtn = overlay.querySelector('#mfaDisableBtn');

          const doDisable = async () => {
            const password = passInput.value;
            const code = codeInput.value.trim().toUpperCase();
            if (!password) { errEl.textContent = 'Enter your password'; return; }
            if (!code || !(/^\d{6}$/.test(code) || /^[A-Z0-9]{5}-[A-Z0-9]{5}$/.test(code))) {
              errEl.textContent = 'Enter a valid verification or recovery code';
              return;
            }
            disableConfirmBtn.disabled = true;
            disableConfirmBtn.textContent = 'Disabling...';
            try {
              const payload = { email: user.email, password, secret: storedSecret };
              if (/^\d{6}$/.test(code)) {
                payload.code = code;
              } else {
                payload.recoveryCode = code;
                payload.recoveryCodes = Array.isArray(userData.recoveryCodes) ? userData.recoveryCodes : [];
              }
              const res = await fetch(_serverBase + '/api/2fa/disable', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              });
              const data = await res.json();
              if (!res.ok) {
                throw new Error(data.error || 'Failed to disable 2FA');
              }
              await setDoc(doc(db, 'users', user.uid), { totpSecret: null, totpEnabled: false, recoveryCodes: [], recoveryCodesUsed: 0 }, { merge: true });
              overlay.innerHTML = `
                <div class="settings-modal">
                  <h3 style="color:#22c55e;">2FA Disabled</h3>
                  <p style="color:var(--text-secondary);font-size:14px;">Two-factor authentication has been turned off for your account.</p>
                  <div class="settings-modal-actions full-width">
                    <button class="save" onclick="location.reload()">Done</button>
                  </div>
                </div>
              `;
            } catch (e) {
              disableConfirmBtn.disabled = false;
              disableConfirmBtn.textContent = 'Disable';
              errEl.textContent = e.message;
            }
          };

          disableConfirmBtn.addEventListener('click', doDisable);
          codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doDisable();
          });
          passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') codeInput.focus();
          });
          passInput.focus();
        });
      }

    });

    // Hamburger menu toggle
    const hamburger = document.getElementById('navHamburger');
    const navLinks = document.getElementById('navLinks');
    if (hamburger && navLinks) {
      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.navbar')) navLinks.classList.remove('open');
      });
    }

    window._logout = async () => {
      await signOut(auth);
      window.location.href = '/bloxverse/auth';
    };

    // ── Send Bux ─────────────────────────────────────────────────────────
    window.openSendBuxModal = () => {
      if (!auth.currentUser) return;
      const bux = Number(String(document.getElementById('buxDropdownBalance')?.textContent || '0').replace(/,/g, '')) || 0;
      let selectedUserId = null;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-content" style="max-width:500px;">
          <div class="modal-header">
            <h2>Send Bux</h2>
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
          </div>
          <div class="modal-body">
            <div class="modal-field">
              <label>Recipient</label>
              <input type="text" id="sendBuxSearch" placeholder="Search username..." autocomplete="off" />
              <div id="sendBuxResults" class="search-list" style="display:none;"></div>
            </div>

            <div id="sendBuxSelected" style="display:none;">
              <div class="modal-field">
                <label>Selected User</label>
                <div class="selected-badge">
                  <img id="sendBuxAvatar" src="" class="selected-avatar" />
                  <span id="sendBuxName"></span>
                </div>
              </div>
            </div>

            <div class="modal-field">
              <label>Amount</label>
              <div class="amount-row">
                <input type="number" id="sendBuxAmount" placeholder="Enter amount…" min="1" max="${bux}" />
                <span class="bux-label">BUX</span>
              </div>
            </div>

            <div class="warning-box" style="margin:0;">
              <strong>Warning:</strong> Bux transfers are final and cannot be undone.
            </div>
            <div id="sendBuxErr" class="error-msg" style="display:none;"></div>
          </div>
          <div class="modal-footer">
            <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="modal-btn confirm" id="sendBuxSendBtn" disabled>Send</button>
          </div>
        </div>`;

      overlay.querySelector('#sendBuxSendBtn').addEventListener('click', () => {
        const amount = parseInt(overlay.querySelector('#sendBuxAmount').value, 10);
        const username = overlay.querySelector('#sendBuxName').textContent;
        if (!selectedUserId || !amount || amount < 1) return;

        const confirmOverlay = document.createElement('div');
        confirmOverlay.className = 'modal-overlay';
        confirmOverlay.style.cssText = 'z-index:10000;background:rgba(0,0,0,0.8);';
        confirmOverlay.innerHTML = `
          <div class="modal-content" style="max-width:400px;">
            <div class="modal-header">
              <h3 style="font-size:16px;margin:0;">Confirm Transfer</h3>
            </div>
            <div class="modal-body">
              <p style="color:var(--text-secondary);font-size:14px;line-height:1.5;margin:0 0 16px;">
                Are you sure you want to send <strong style="color:#4caf50;">${amount.toLocaleString()} BUX</strong>
                to <strong style="color:var(--text-primary);">${username}</strong>?
              </p>
              <div class="warning-box" style="margin:0;">
                This transfer is <strong>final</strong>. You will not be able to recover these BUX.
              </div>
            </div>
            <div class="modal-footer">
              <button class="modal-btn cancel" id="confirmCancelBtn">Cancel</button>
              <button class="modal-btn confirm" id="confirmYesBtn" style="background:rgba(244,67,54,0.8);">Yes, Send</button>
            </div>
          </div>`;
        document.body.appendChild(confirmOverlay);

        confirmOverlay.querySelector('#confirmCancelBtn').addEventListener('click', () => confirmOverlay.remove());
        confirmOverlay.querySelector('#confirmYesBtn').addEventListener('click', async () => {
          try {
            await updateDoc(doc(db, 'users', auth.currentUser.uid), { bux: increment(-amount) });
            await updateDoc(doc(db, 'users', selectedUserId), { bux: increment(amount) });

            const _sSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
            const _sData = _sSnap.data();
            const _rSnap = await getDoc(doc(db, 'users', selectedUserId));
            const _rData = _rSnap.data();
            await logTransaction(auth.currentUser.uid, -amount, _sData?.bux || 0, 'SendBux', `Sent ${amount.toLocaleString()} BUX to ${username}`);
            await logTransaction(selectedUserId, amount, _rData?.bux || 0, 'SendBux', `Received ${amount.toLocaleString()} BUX from ${_sData?.username || 'Someone'}`);

            confirmOverlay.remove();
            overlay.remove();
          } catch (err) {
            console.error(err);
            overlay.querySelector('#sendBuxErr').textContent = 'Transfer failed. Try again.';
            overlay.querySelector('#sendBuxErr').style.display = 'block';
            confirmOverlay.remove();
          }
        });
      });

      document.body.appendChild(overlay);

      const searchInput = overlay.querySelector('#sendBuxSearch');
      const resultsEl = overlay.querySelector('#sendBuxResults');
      const selectedEl = overlay.querySelector('#sendBuxSelected');
      const nameEl = overlay.querySelector('#sendBuxName');
      const avatarEl = overlay.querySelector('#sendBuxAvatar');
      const sendBtn = overlay.querySelector('#sendBuxSendBtn');

      let _allUsersCache = null;
      let searchTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        const term = searchInput.value.trim().toLowerCase();
        if (!term) { resultsEl.style.display = 'none'; return; }
        searchTimer = setTimeout(async () => {
          try {
            if (!_allUsersCache) {
              const all = await getDocs(collection(db, 'users'));
              _allUsersCache = all.docs.map(d => ({ id: d.id, ...d.data() }));
            }
            const matches = _allUsersCache.filter(u => (u.username || '').toLowerCase().includes(term));
            if (matches.length === 0) {
              resultsEl.innerHTML = '<div class="empty-state">No users found</div>';
            } else {
              resultsEl.innerHTML = matches.slice(0, 50).map(f => `
                <div class="search-item" data-uid="${f.id}" data-name="${f.username || 'Unknown'}" data-avatar="${f.avatarPreviewHead || f.avatarPreview || ''}">
                  ${f.avatarPreviewHead || f.avatarPreview ? `<img src="${f.avatarPreviewHead || f.avatarPreview}" alt="" />` : `<div class="init-circle">${(f.username || 'U').charAt(0).toUpperCase()}</div>`}
                  <span>${f.username || 'Unknown'}</span>
                </div>`).join('');
              resultsEl.querySelectorAll('.search-item').forEach(el => {
                el.addEventListener('click', () => {
                  selectedUserId = el.dataset.uid;
                  nameEl.textContent = el.dataset.name;
                  avatarEl.src = el.dataset.avatar || '';
                  selectedEl.style.display = 'block';
                  resultsEl.style.display = 'none';
                  searchInput.value = '';
                  sendBtn.disabled = false;
                  overlay.querySelector('#sendBuxErr').style.display = 'none';
                  overlay.querySelector('#sendBuxAmount').focus();
                });
              });
            }
            resultsEl.style.display = 'block';
          } catch (err) {
            console.error(err);
            resultsEl.innerHTML = '<div class="empty-state">Search error</div>';
          }
        }, 200);
      });

      document.addEventListener('click', (e) => {
        if (overlay.contains(e.target)) return;
        if (resultsEl.style.display === 'block') resultsEl.style.display = 'none';
      }, { once: true });
    };

    window.__handleBrokenAvatar = async function(imgEl, uid) {
      try {
        const initial = imgEl.getAttribute('data-initial') || 'U';
        const letter = document.createElement('div');
        letter.className = 'friend-thumb-avatar';
        letter.textContent = initial;
        imgEl.replaceWith(letter);
        try {
          if (auth && auth.currentUser && auth.currentUser.uid === uid) {
            const { setDoc, doc } = await import('https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js');
            await setDoc(doc(db, 'users', uid), { avatarPreview: null, avatarPreviewHead: null }, { merge: true });
          }
        } catch (e) { console.warn('Could not clear avatarPreview:', e); }
      } catch (e) { console.warn('Broken avatar handler error:', e); }
    };
  </script>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        <img src="assets/icons/bloxverseLogo.png" alt="" class="footer-logo-img" />
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="footer-links">
        <a href="/bloxverse/terms">Terms of Service</a>
        <a href="/bloxverse/privacy">Privacy Policy</a>
      </div>
    </div>
  </footer>
</body>

</html>
