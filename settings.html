<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Settings</title>
  <script>
    // Resolve the stored theme before first paint the same way the real pages
    // do (mirrors src/theme.js), so the brief redirect stub here never flashes
    // an unthemed white background -- auth.css paints var(--bg-primary), which
    // only exists once theme.css is loaded, so without this the old /settings
    // links flashed white before bouncing to /bloxverse/account.
    (function () {
      try {
        var NAMES = ['dark', 'light', 'system',
          'valley', 'valley-light', 'valley-system',
          'sky', 'sky-light', 'sky-system',
          'lava', 'lava-light', 'lava-system',
          'solar', 'solar-light', 'solar-system'];
        var ALIASES = { twilight: 'dark', 'twilight-light': 'light', 'twilight-system': 'system' };
        var raw = localStorage.getItem('bloxverse_theme');
        var name = ALIASES[raw] || (NAMES.indexOf(raw) > -1 ? raw : 'dark');
        var mode = (name === 'light' || name.slice(-6) === '-light') ? 'light'
          : (name === 'system' || name.slice(-7) === '-system') ? 'system'
            : 'dark';
        if (mode === 'system') {
          var family = name === 'system' ? 'default' : name.split('-')[0];
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          name = prefersDark ? family : (family === 'default' ? 'light' : family + '-light');
        }
        document.documentElement.setAttribute('data-theme', name);
        document.documentElement.setAttribute(
          'data-ui',
          localStorage.getItem('bloxverse_ui_style') === 'compact' ? 'compact' : 'default'
        );
      } catch (e) { /* storage blocked - fall through to the defaults above */ }
    })();
  </script>
  <link rel="stylesheet" href="src/theme.css" />
  <link rel="stylesheet" href="src/auth.css" />
  <link rel="stylesheet" href="src/main.css" />
  <link rel="canonical" href="/bloxverse/account" />
  <meta http-equiv="refresh" content="0; url=/bloxverse/account" />
</head>

<body>
  <!--
    The settings UI now lives at /bloxverse/account. This page only exists so
    the old /bloxverse/settings links (and anything already shared or cached)
    keep working.
  -->
  <main class="auth-center" aria-busy="true">
    <p class="auth-subtitle">Redirecting to your account&hellip;</p>
    <noscript>
      <p><a href="/bloxverse/account">Continue to your account</a></p>
    </noscript>
  </main>

  <script>
    location.replace('/bloxverse/account');
  </script>
</body>

</html>
