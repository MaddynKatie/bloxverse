<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Settings</title>
  <link rel="stylesheet" href="src/auth.css" />
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .settings-page {
      max-width: 640px;
      width: 100%;
      padding: 24px;
      padding-top: 76px;
      margin: 0 auto;
    }

    .settings-page h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .settings-section {
      background: #2a2b2d;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .settings-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .settings-section-header h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .settings-row:last-child {
      border-bottom: none;
    }

    .settings-row-label {
      font-size: 14px;
      font-weight: 500;
    }

    .settings-row-desc {
      font-size: 12px;
      color: #8a8c8e;
      margin-top: 2px;
    }

    .settings-row-value {
      font-size: 13px;
      color: #babbbe;
    }

    .settings-input {
      background: #1a1d2e;
      border: 1px solid rgba(124,92,252,0.3);
      border-radius: 6px;
      padding: 6px 10px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
    }

    .settings-input:focus {
      outline: none;
      border-color: rgba(124,92,252,0.6);
    }

    .settings-btn {
      background: rgba(124,92,252,0.4);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s;
    }

    .settings-btn:hover {
      background: rgba(124,92,252,0.6);
    }

    .settings-btn.success {
      background: rgba(34,197,94,0.4);
    }

    .settings-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8a8c8e;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .settings-back:hover { color: #fff; }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        <div class="logo-icon"></div>
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/create'">Create</button>
      </div>
    </div>
    <div class="nav-right" id="navRight"></div>
  </nav>

  <div class="settings-page" id="settingsPage"></div>

  <script type="module">
    import { auth, db, calculateAge } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc, setDoc, onSnapshot } from 'firebase/firestore';

    const navRight = document.getElementById('navRight');
    const settingsPage = document.getElementById('settingsPage');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/bloxverse/auth';
        return;
      }

      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const userData = userDoc.exists() ? userDoc.data() : {};
      const birthday = userData.birthday || '';
      const username = userData.username || 'Player';
      const ownBux = userData.bux || 0;
      const ownNum = userData.userIdNum;
      const ownProfileLink = ownNum ? `/bloxverse/profile?user=${ownNum}` : '/bloxverse/profile';
      const ownInitial = (userData.username || 'P').charAt(0).toUpperCase();

      settingsPage.innerHTML = `
        <a href="${ownProfileLink}" class="settings-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          Back to Profile
        </a>

        <h1>Settings</h1>

        <div class="settings-section">
          <div class="settings-section-header">
            <h2>Account</h2>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Birthday</div>
              <div class="settings-row-desc">Used to calculate your age for content filtering</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="settings-row-value" id="birthdayDisplay">${birthday ? new Date(+birthday.split('-')[0], +birthday.split('-')[1] - 1, +birthday.split('-')[2]).toLocaleDateString() : 'Not set'}</span>
              <button class="settings-btn" id="editBirthdayBtn">Edit</button>
            </div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-header">
            <h2>Privacy</h2>
          </div>
          <div class="settings-row">
            <div>
              <div class="settings-row-label">Profile Visibility</div>
              <div class="settings-row-desc">Who can view your profile page</div>
            </div>
            <select class="settings-input" id="privacySelect">
              <option value="public" ${(userData.profilePrivacy || 'public') === 'public' ? 'selected' : ''}>Everyone</option>
              <option value="friends" ${userData.profilePrivacy === 'friends' ? 'selected' : ''}>Friends Only</option>
            </select>
          </div>
        </div>
      `;

      // Nav bar
      navRight.innerHTML = `
        <div class="user-info">
          <div class="bux-wrapper" id="buxWrapper">
            <button class="bux-btn" id="buxBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
              </svg>
              <span id="ownBuxVal">${ownBux.toLocaleString()}</span>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
            </button>
            <div class="bux-dropdown">
              <div class="bux-dropdown-header">
                <span class="bux-dropdown-label">Balance</span>
                <span class="bux-dropdown-balance" id="buxDropdownBalance">${ownBux.toLocaleString()}</span>
              </div>
              <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Transactions
              </button>
            </div>
          </div>
          <div class="avatar-dropdown">
            <div class="avatar-circle">${ownInitial}</div>
            <div class="dropdown-menu">
              <div class="dropdown-header">
                <span class="dropdown-name">${username}</span>
                <span class="dropdown-email">${user.email}</span>
              </div>
              <button class="dropdown-item" onclick="window.location.href='${ownProfileLink}'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                Profile
              </button>
              <button class="dropdown-item" onclick="window.location.href='/bloxverse/avatar'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                Avatar
              </button>
              <button class="dropdown-item" onclick="window._logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Log Out
              </button>
            </div>
          </div>
        </div>
      `;

      // Bux dropdown toggle
      const buxWrapper = document.getElementById('buxWrapper');
      const buxBtn = document.getElementById('buxBtn');
      buxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        buxWrapper.classList.toggle('open');
      });

      // Avatar dropdown toggle
      const avatarCircle = navRight.querySelector('.avatar-circle');
      const dropdown = navRight.querySelector('.avatar-dropdown');
      avatarCircle.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });

      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('open');
        }
        if (buxWrapper && !buxWrapper.contains(e.target)) {
          buxWrapper.classList.remove('open');
        }
      });

      // Birthday edit
      const editBtn = document.getElementById('editBirthdayBtn');
      if (editBtn) {
        editBtn.addEventListener('click', () => {
          const display = document.getElementById('birthdayDisplay');
          const current = userData.birthday || '';
          display.innerHTML = '<input type="date" id="birthdayInput" value="' + current + '" class="settings-input" style="width:140px;">';
          editBtn.textContent = 'Save';
          editBtn.onclick = async () => {
            const newVal = document.getElementById('birthdayInput').value;
            if (!newVal) return;
            try {
              await setDoc(doc(db, 'users', user.uid), { birthday: newVal }, { merge: true });
              const [py, pm, pd] = newVal.split('-');
              document.getElementById('birthdayDisplay').textContent = new Date(+py, +pm - 1, +pd).toLocaleDateString();
              editBtn.textContent = 'Edit';
              editBtn.classList.add('success');
              setTimeout(() => editBtn.classList.remove('success'), 2000);
              editBtn.onclick = null;
            } catch (e) {
              console.error('Error saving birthday:', e);
            }
          };
        });
      }

      // Privacy select
      const privacySelect = document.getElementById('privacySelect');
      if (privacySelect) {
        privacySelect.addEventListener('change', async () => {
          await setDoc(doc(db, 'users', user.uid), { profilePrivacy: privacySelect.value }, { merge: true });
        });
      }
    });

    window._logout = async () => {
      await signOut(auth);
      window.location.href = '/bloxverse/auth';
    };
  </script>
</body>

</html>
