<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

    <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Profile</title>
   <link rel="stylesheet" href="src/auth.css" />
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .profile-page {
      max-width: 640px;
      width: 100%;
      padding: 24px;
      padding-top: 76px;
      margin: 0 auto;
    }

    .profile-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8a8c8e;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .profile-back:hover { color: #fff; }

    /* ── Header card ─────────────────────────────── */
    .profile-header {
      background: linear-gradient(135deg, #0d69ac 0%, #00b06f 100%);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 16px;
      position: relative;
    }

    .profile-avatar-large {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a1c1e, #393b3d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      flex-shrink: 0;
      border: 4px solid rgba(255,255,255,0.35);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .profile-avatar-img {
      object-fit: cover;
    }

    .profile-header-info { flex: 1; min-width: 0; }
    .profile-header-info h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 2px 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .profile-header-info .profile-tagline {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .profile-header-info .profile-tagline .badge-roles {
      display: inline-flex;
      gap: 4px;
    }

    /* ── Stats row ─────────────────────────────── */
    .profile-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .profile-stat-card {
      background: #2a2b2d;
      border-radius: 10px;
      padding: 14px 18px;
      flex: 1;
      min-width: 100px;
      text-align: center;
    }
    .profile-stat-card .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .profile-stat-card .stat-label {
      font-size: 11px;
      color: #8a8c8e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }
    .profile-stat-card.bux .stat-value { color: #f2cd37; }
    .profile-stat-card.joined .stat-value { font-size: 13px; }

    .settings-nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      color: #8a8c8e;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .settings-nav-btn:hover {
      background: rgba(255,255,255,0.08);
      color: #fff;
    }


    /* ── Sections ──────────────────────────────── */
    .profile-section {
      background: #2a2b2d;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .profile-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .profile-section-header h2 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    .profile-section-header .section-count {
      font-size: 13px;
      color: #8a8c8e;
      background: rgba(255,255,255,0.06);
      padding: 2px 10px;
      border-radius: 10px;
    }
    .profile-section .empty {
      color: #8a8c8e;
      font-size: 13px;
      text-align: center;
      padding: 16px;
    }

    /* ── Thumb grid (friends, followers, etc.) ────── */
    .profile-thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 6px;
    }
    .profile-thumb {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 4px;
      border-radius: 10px;
      transition: background 0.15s;
      cursor: pointer;
      text-align: center;
    }
    .profile-thumb:hover {
      background: rgba(255,255,255,0.06);
    }
    .profile-thumb-img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #1a1d2e;
      border: 2px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .profile-thumb-letter {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0d69ac, #00b06f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
    }
    .avatar-circle-img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .avatar-circle-img:hover {
      border-color: rgba(255,255,255,0.3);
    }
    .profile-thumb-name {
      font-size: 11px;
      font-weight: 500;
      color: #babbbe;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 68px;
    }
    .profile-thumb .trust-btn {
      margin-top: 2px;
      font-size: 10px;
      padding: 2px 8px;
    }

    /* ── Trusted friends styles ─────────────────── */
    .trust-hint {
      color: #8a8c8e;
      font-size: 12px;
      font-weight: 400;
    }
    .trust-btn {
      border: none;
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .trust-btn.add {
      background: rgba(34,197,94,0.2);
      color: #22c55e;
    }
    .trust-btn.add:hover { opacity: 0.8; }
    .trust-btn.remove {
      background: rgba(239,68,68,0.2);
      color: #ef4444;
    }
    .trust-btn.remove:hover { opacity: 0.8; }
    details.add-trusted summary {
      cursor: pointer;
      color: #5b9cfc;
      font-size: 12px;
      padding: 4px 0;
    }
    details.add-trusted summary:hover { opacity: 0.8; }

    /* ── Role badges ────────────────────────────── */
    .role-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      opacity: 0.9;
      margin-left: 2px;
    }
    .role-badge.developer { color: #44d9e6; }
    .role-badge.admin     { color: #ff4444; }
    .role-badge.mod       { color: #facc15; }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/create'">Create</button>
      </div>
    </div>
    <div class="nav-right" id="navRight"></div>
  </nav>

  <div class="profile-page" id="profilePage"></div>

  <script type="module">
    import { auth, db, calculateAge, addTrustedFriend, removeTrustedFriend, getRoles, banGuard, resolveProfileUser, assignUserIdNum, logTransaction, trackPresence } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc, setDoc, onSnapshot, updateDoc, increment, collection, getDocs, query, where, limit } from 'firebase/firestore';

    const navRight = document.getElementById('navRight');
    const profilePage = document.getElementById('profilePage');
    const urlParams = new URLSearchParams(window.location.search);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/bloxverse/auth';
        return;
      }
      
      if (await banGuard(user.uid)) return;

      trackPresence(user.uid, null, 'profile');

      // ── Real-time ban listener ────────────────────────────────────
      onSnapshot(doc(db, 'bans', user.uid), (snap) => {
        if (snap.exists() && snap.data().banned) {
          window.location.href = '/bloxverse/ban';
        }
      });
      // ──────────────────────────────────────────────────────────────

      // Resolve profile view target: handle numeric userIdNum or UID
      const rawTarget = urlParams.get('user');
      const resolvedUid = await resolveProfileUser(rawTarget);
      const viewingUserId = resolvedUid || user.uid;
      const isOwnProfile = viewingUserId === user.uid;

      const userDoc = await getDoc(doc(db, 'users', viewingUserId));
      if (!userDoc.exists()) {
        profilePage.innerHTML = '<p style="text-align:center;color:#8a8c8e;padding:48px;">User not found</p>';
        return;
      }

      const userData = userDoc.data();
      const username = userData.username || 'Unknown';
      const email = userData.email || '';
      const bux = userData.bux || 0;
      const friendIds = userData.friends || [];
      const followerIds = userData.followers || [];
      const followingIds = userData.following || [];
      const createdAt = userData.createdAt ? new Date(userData.createdAt).toLocaleDateString() : 'Unknown';
      const birthday = userData.birthday || '';
      const userIdNum = userData.userIdNum;
      const hasUserIdNum = !!userIdNum;

      // Migration for existing users without a userIdNum
      if (isOwnProfile && !hasUserIdNum) {
        assignUserIdNum(user.uid).catch(() => {});
      }

      const initial = username.charAt(0).toUpperCase();
      const age = calculateAge(birthday);
      const isThirteenPlus = age >= 13;
      const trustedFriendIds = userData.trustedFriends || [];


      const _cb = Date.now();

      // Show Cloudinary preview image if available, otherwise initial letter
      window.__handleBrokenAvatar = async function(imgEl, uid) {
        try {
          const initial = imgEl.getAttribute('data-initial') || 'U';
          const letter = document.createElement('div');
          if (imgEl.className.includes('profile-avatar-img')) {
            letter.className = 'profile-avatar-large';
          } else if (imgEl.className.includes('avatar-circle-img')) {
            letter.className = 'avatar-circle';
          } else {
            letter.className = 'profile-thumb-letter';
          }
          letter.textContent = initial;
          imgEl.replaceWith(letter);
          // If the broken avatar belongs to the currently signed-in user, clear avatarPreview so it can regenerate later
          try {
            if (window.auth && window.auth.currentUser && window.auth.currentUser.uid === uid) {
              await setDoc(doc(db, 'users', uid), { avatarPreview: null }, { merge: true });
              console.log('[Avatar] Cleared stale avatarPreview for current user to trigger regeneration');
            }
          } catch (e) {
            console.warn('[Avatar] Could not clear avatarPreview:', e);
          }
        } catch (e) {
          console.warn('[Avatar] error handling broken avatar:', e);
        }
      };

      const renderAvatarThumb = (preview, initial, uid) => {
        if (preview) {
          return `<img src="${preview}?_cb=${_cb}" alt="" class="profile-thumb-img" loading="lazy" data-initial="${initial}" onerror="window.__handleBrokenAvatar(this, '${uid}')"/>`;
        }
        return `<div class="profile-thumb-letter">${initial}</div>`;
      };

      // Fetch all user data in parallel
      const fetchUsers = async (ids) => {
        const results = await Promise.all(ids.slice(0, 12).map(fid =>
          getDoc(doc(db, 'users', fid)).then(fDoc => {
            if (!fDoc.exists()) return null;
            const fData = fDoc.data();
            return { id: fid, num: fData.userIdNum, username: fData.username || 'Unknown', avatarColors: fData.avatarColors || null, avatarFace: fData.avatarFace || null, avatarPreview: fData.avatarPreview || null };
          }).catch(() => null)
        ));
        return results.filter(Boolean);
      };

      const [trustedFriendsList, friendsList, followersList, viewingRoles] = await Promise.all([
        fetchUsers(trustedFriendIds),
        fetchUsers(friendIds),
        fetchUsers(followerIds),
        getRoles(viewingUserId),
      ]);

      const ROLE_BADGE_CONFIG = {
        developer: { icon: 'fa-solid fa-code', color: '#44d9e6', label: 'Developer' },
        admin:     { icon: 'fa-solid fa-shield-halved', color: '#ff4444', label: 'Admin' },
        mod:       { icon: 'fa-solid fa-gavel', color: '#facc15', label: 'Moderator' },
      };
      const roleBadgeHtml = (r) => {
        const cfg = ROLE_BADGE_CONFIG[r];
        if (!cfg) return '';
        return `<span class="role-badge ${r}" title="${cfg.label}"><i class="${cfg.icon}"></i></span>`;
      };
      const badgeHtml = viewingRoles.map(roleBadgeHtml).join(' ');

      profilePage.innerHTML = `
        <a href="/" class="profile-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          ${isOwnProfile ? 'Back to Home' : 'Back'}
        </a>

        <div class="profile-header">
          ${userData.avatarPreview ? `<img src="${userData.avatarPreview}?_cb=${_cb}" alt="" class="profile-avatar-large profile-avatar-img"/>` : `<div class="profile-avatar-large">${initial}</div>`}
          <div class="profile-header-info">
            <h1>${username}${badgeHtml}</h1>
            <div class="profile-tagline">
              ${email && isOwnProfile ? email : ''}
            </div>
          </div>
        </div>

        <div class="profile-stats">
          <div class="profile-stat-card bux">
            <div class="stat-value">${bux.toLocaleString()}</div>
            <div class="stat-label">Bux</div>
          </div>
          <div class="profile-stat-card">
            <div class="stat-value">${friendIds.length}</div>
            <div class="stat-label">Friends</div>
          </div>
          <div class="profile-stat-card">
            <div class="stat-value">${followerIds.length}</div>
            <div class="stat-label">Followers</div>
          </div>
          <div class="profile-stat-card">
            <div class="stat-value">${followingIds.length}</div>
            <div class="stat-label">Following</div>
          </div>
          <div class="profile-stat-card joined">
            <div class="stat-value">${createdAt}</div>
            <div class="stat-label">Joined</div>
          </div>

        </div>

        <div class="profile-section">
          <div class="profile-section-header">
            <h2>Friends</h2>
            <span class="section-count">${friendIds.length}</span>
          </div>
          ${friendsList.length === 0 ? '<div class="empty">No friends yet</div>' : `
            <div class="profile-thumb-grid">
              ${friendsList.map(f => `
                <div class="profile-thumb" onclick="window.location.href='/bloxverse/profile?user=${f.num}'">
                  ${renderAvatarThumb(f.avatarPreview, (f.username || 'U').charAt(0).toUpperCase(), f.id)}
                  <span class="profile-thumb-name">${f.username}</span>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        <div class="profile-section">
          <div class="profile-section-header">
            <h2>Followers</h2>
            <span class="section-count">${followerIds.length}</span>
          </div>
          ${followersList.length === 0 ? '<div class="empty">No followers yet</div>' : `
            <div class="profile-thumb-grid">
              ${followersList.map(f => `
                <div class="profile-thumb" onclick="window.location.href='/bloxverse/profile?user=${f.num}'">
                  ${renderAvatarThumb(f.avatarPreview, (f.username || 'U').charAt(0).toUpperCase(), f.id)}
                  <span class="profile-thumb-name">${f.username}</span>
                </div>
              `).join('')}
            </div>
          `}
        </div>

        ${isOwnProfile && isThirteenPlus ? `
        <div class="profile-section" id="trustedFriendsSection">
          <div class="profile-section-header">
            <h2>Trusted Friends <span class="trust-hint">(mutual, unfiltered chat)</span></h2>
            <span class="section-count">${trustedFriendsList.length}</span>
          </div>
          ${trustedFriendsList.length === 0 ? '<div class="empty">No trusted friends yet. Add trusted friends from your friends list below.</div>' : `
            <div class="profile-thumb-grid">
              ${trustedFriendsList.map(f => `
                <div class="profile-thumb">
                  ${renderAvatarThumb(f.avatarPreview, (f.username || 'U').charAt(0).toUpperCase(), f.id)}
                  <span class="profile-thumb-name">${f.username}</span>
                  <button class="trust-btn remove" data-id="${f.id}" data-username="${f.username}">Remove</button>
                </div>
              `).join('')}
            </div>
          `}
          ${friendsList.filter(f => !trustedFriendIds.includes(f.id)).length > 0 ? `
            <details class="add-trusted" style="margin-top:10px;">
              <summary>Add trusted friend from friends list</summary>
              <div style="margin-top:8px;" class="profile-thumb-grid">
                ${friendsList.filter(f => !trustedFriendIds.includes(f.id)).map(f => `
                  <div class="profile-thumb">
                    ${renderAvatarThumb(f.avatarPreview, (f.username || 'U').charAt(0).toUpperCase(), f.id)}
                    <span class="profile-thumb-name">${f.username}</span>
                    <button class="trust-btn add" data-id="${f.id}" data-username="${f.username}">Trust</button>
                  </div>
                `).join('')}
              </div>
            </details>
          ` : ''}
        </div>
        ` : ''}
      `;

      // Trusted Friends button handlers
      if (isOwnProfile) {
        document.querySelectorAll('.trust-btn.add').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const friendId = btn.dataset.id;
            const friendName = btn.dataset.username;
            try {
              await addTrustedFriend(viewingUserId, friendId);
              btn.textContent = 'Added!';
              btn.style.background = 'rgba(34,197,94,0.4)';
              btn.disabled = true;
            } catch (e) {
              console.error('Error adding trusted friend:', e);
            }
          });
        });
        document.querySelectorAll('.trust-btn.remove').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const friendId = btn.dataset.id;
            try {
              await removeTrustedFriend(viewingUserId, friendId);
              const item = btn.closest('.profile-friend-item');
              if (item) item.style.opacity = '0.3';
              btn.textContent = 'Removed';
              btn.disabled = true;
            } catch (e) {
              console.error('Error removing trusted friend:', e);
            }
          });
        });
      }

      // Nav
      const ownUserData = isOwnProfile ? userData : await getDoc(doc(db, 'users', user.uid)).then(d => d.exists() ? d.data() : {});
      const ownBux = ownUserData.bux || 0;
      const ownNum = ownUserData.userIdNum;
      const ownProfileLink = ownNum ? `/bloxverse/profile?user=${ownNum}` : '/bloxverse/profile';
      const ownInitial = (ownUserData.username || 'P').charAt(0).toUpperCase();
      const ownPreview = ownUserData.avatarPreview || null;

      navRight.innerHTML = `
        <div class="user-info">
          <div class="bux-wrapper" id="buxWrapper">
            <button class="bux-btn" id="buxBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
              </svg>
              <span id="ownBuxVal">${ownBux.toLocaleString()}</span>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
            </button>
            <div class="bux-dropdown">
              <div class="bux-dropdown-header">
                <span class="bux-dropdown-label">Balance</span>
                <span class="bux-dropdown-balance" id="buxDropdownBalance">${ownBux.toLocaleString()}</span>
              </div>
              <button class="bux-dropdown-item" onclick="window.openSendBuxModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-2 8-10V5l-8-3-8 3v7c0 8 8 10 8 10z"/></svg>
                Send Bux
              </button>
              <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Transactions
              </button>
            </div>
          </div>
          <button class="settings-nav-btn" onclick="window.location.href='/bloxverse/settings'" title="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <div class="avatar-dropdown">
            ${ownPreview ? `<img src="${ownPreview}?_cb=${_cb}" alt="" class="avatar-circle-img" data-initial="${ownInitial}" onerror="window.__handleBrokenAvatar(this, '${user.uid}')"/>` : `<div class="avatar-circle">${ownInitial}</div>`}
            <div class="dropdown-menu">
              <div class="dropdown-header">
                <span class="dropdown-name">${ownUserData.username || 'Player'}</span>
                <span class="dropdown-email">${user.email}</span>
              </div>
              <button class="dropdown-item" onclick="window.location.href='${ownProfileLink}'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                Profile
              </button>
              <button class="dropdown-item" onclick="window.location.href='/bloxverse/avatar'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                Avatar
              </button>
              <button class="dropdown-item" onclick="window._logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Log Out
              </button>
            </div>
          </div>
        </div>
      `;

      // Bux dropdown toggle
      const buxWrapper = document.getElementById('buxWrapper');
      const buxBtn = document.getElementById('buxBtn');
      buxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        buxWrapper.classList.toggle('open');
      });

      // Make avatar dropdown clickable
      const avatarCircle = navRight.querySelector('.avatar-circle, .avatar-circle-img');
      const dropdown = navRight.querySelector('.avatar-dropdown');
      avatarCircle.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });

      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('open');
        }
        if (buxWrapper && !buxWrapper.contains(e.target)) {
          buxWrapper.classList.remove('open');
        }
      });
    });

    window._logout = async () => {
      await signOut(auth);
        window.location.href = '/bloxverse/auth';
    };

    // ── Send Bux ─────────────────────────────────────────────────────────
    window.openSendBuxModal = () => {
      if (!auth.currentUser) return;
      const bux = Number(String(document.getElementById('buxDropdownBalance')?.textContent || '0').replace(/,/g, '')) || 0;
      let selectedUserId = null;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-content" style="max-width:500px;">
          <div class="modal-header">
            <h2>Send Bux</h2>
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
          </div>
          <div class="modal-body">
            <div class="modal-field">
              <label>Recipient</label>
              <input type="text" id="sendBuxSearch" placeholder="Search username..." autocomplete="off" />
              <div id="sendBuxResults" class="search-list" style="display:none;"></div>
            </div>

            <div id="sendBuxSelected" style="display:none;">
              <div class="modal-field">
                <label>Selected User</label>
                <div class="selected-badge">
                  <img id="sendBuxAvatar" src="" class="selected-avatar" />
                  <span id="sendBuxName"></span>
                </div>
              </div>
            </div>

            <div class="modal-field">
              <label>Amount</label>
              <div class="amount-row">
                <input type="number" id="sendBuxAmount" placeholder="Enter amount…" min="1" max="${bux}" />
                <span class="bux-label">BUX</span>
              </div>
            </div>

            <div class="warning-box" style="margin:0;">
              <strong>Warning:</strong> Bux transfers are final and cannot be undone.
            </div>
            <div id="sendBuxErr" class="error-msg" style="display:none;"></div>
          </div>
          <div class="modal-footer">
            <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="modal-btn confirm" id="sendBuxSendBtn" disabled>Send</button>
          </div>
        </div>`;

      overlay.querySelector('#sendBuxSendBtn').addEventListener('click', () => {
        const amount = parseInt(overlay.querySelector('#sendBuxAmount').value, 10);
        const username = overlay.querySelector('#sendBuxName').textContent;
        if (!selectedUserId || !amount || amount < 1) return;

        const confirmOverlay = document.createElement('div');
        confirmOverlay.className = 'modal-overlay';
        confirmOverlay.style.cssText = 'z-index:10000;background:rgba(0,0,0,0.8);';
        confirmOverlay.innerHTML = `
          <div class="modal-content" style="max-width:400px;">
            <div class="modal-header">
              <h3 style="font-size:16px;margin:0;">Confirm Transfer</h3>
            </div>
            <div class="modal-body">
              <p style="color:#ccc;font-size:14px;line-height:1.5;margin:0 0 16px;">
                Are you sure you want to send <strong style="color:#4caf50;">${amount.toLocaleString()} BUX</strong>
                to <strong style="color:#fff;">${username}</strong>?
              </p>
              <div class="warning-box" style="margin:0;">
                This transfer is <strong>final</strong>. You will not be able to recover these BUX.
              </div>
            </div>
            <div class="modal-footer">
              <button class="modal-btn cancel" id="confirmCancelBtn">Cancel</button>
              <button class="modal-btn confirm" id="confirmYesBtn" style="background:rgba(244,67,54,0.8);">Yes, Send</button>
            </div>
          </div>`;
        document.body.appendChild(confirmOverlay);

        confirmOverlay.querySelector('#confirmCancelBtn').addEventListener('click', () => confirmOverlay.remove());
        confirmOverlay.querySelector('#confirmYesBtn').addEventListener('click', async () => {
          try {
            await updateDoc(doc(db, 'users', auth.currentUser.uid), { bux: increment(-amount) });
            await updateDoc(doc(db, 'users', selectedUserId), { bux: increment(amount) });

            const _sSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
            const _sData = _sSnap.data();
            const _rSnap = await getDoc(doc(db, 'users', selectedUserId));
            const _rData = _rSnap.data();
            await logTransaction(auth.currentUser.uid, -amount, _sData?.bux || 0, 'SendBux', `Sent ${amount.toLocaleString()} BUX to ${username}`);
            await logTransaction(selectedUserId, amount, _rData?.bux || 0, 'SendBux', `Received ${amount.toLocaleString()} BUX from ${_sData?.username || 'Someone'}`);

            confirmOverlay.remove();
            overlay.remove();
          } catch (err) {
            console.error(err);
            overlay.querySelector('#sendBuxErr').textContent = 'Transfer failed. Try again.';
            overlay.querySelector('#sendBuxErr').style.display = 'block';
            confirmOverlay.remove();
          }
        });
      });

      document.body.appendChild(overlay);

      const searchInput = overlay.querySelector('#sendBuxSearch');
      const resultsEl = overlay.querySelector('#sendBuxResults');
      const selectedEl = overlay.querySelector('#sendBuxSelected');
      const nameEl = overlay.querySelector('#sendBuxName');
      const avatarEl = overlay.querySelector('#sendBuxAvatar');
      const sendBtn = overlay.querySelector('#sendBuxSendBtn');

      let searchTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        const term = searchInput.value.trim().toLowerCase();
        if (!term) { resultsEl.style.display = 'none'; return; }
        searchTimer = setTimeout(async () => {
          try {
            const snap = await getDocs(query(collection(db, 'users'), where('username', '>=', term), where('username', '<', term + '\uf8ff'), limit(20)));
            const matches = snap.docs.filter(d => d.data().username?.toLowerCase().includes(term));
            if (matches.length === 0) {
              resultsEl.innerHTML = '<div class="empty-state">No users found</div>';
            } else {
              resultsEl.innerHTML = matches.map(f => `
                <div class="search-item" data-uid="${f.id}" data-name="${f.data().username}" data-avatar="${f.data().avatarPreview || ''}">
                  ${f.data().avatarPreview ? `<img src="${f.data().avatarPreview}" alt="" />` : `<div class="init-circle">${f.data().username.charAt(0).toUpperCase()}</div>`}
                  <span>${f.data().username}</span>
                </div>`).join('');
              resultsEl.querySelectorAll('.search-item').forEach(el => {
                el.addEventListener('click', () => {
                  selectedUserId = el.dataset.uid;
                  nameEl.textContent = el.dataset.name;
                  avatarEl.src = el.dataset.avatar || '';
                  selectedEl.style.display = 'block';
                  resultsEl.style.display = 'none';
                  searchInput.value = '';
                  sendBtn.disabled = false;
                  overlay.querySelector('#sendBuxErr').style.display = 'none';
                  overlay.querySelector('#sendBuxAmount').focus();
                });
              });
            }
            resultsEl.style.display = 'block';
          } catch (err) {
            console.error(err);
            resultsEl.innerHTML = '<div class="empty-state">Search error</div>';
          }
        }, 200);
      });

      document.addEventListener('click', (e) => {
        if (overlay.contains(e.target)) return;
        if (resultsEl.style.display === 'block') resultsEl.style.display = 'none';
      }, { once: true });
    };
  </script>
</body>

</html>
