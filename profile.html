<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Profile</title>
  <link rel="stylesheet" href="/src/auth.css" />
  <link rel="stylesheet" href="/src/main.css" />
  <style>
    .profile-page {
      max-width: 600px;
      width: 100%;
      padding: 24px;
      padding-top: 72px;
    }

    .profile-banner {
      background: linear-gradient(135deg, #0d69ac, #00b06f);
      border-radius: 12px;
      padding: 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .profile-avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a1c1e, #393b3d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      flex-shrink: 0;
      border: 3px solid rgba(255, 255, 255, 0.3);
    }

    .profile-info h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-info .profile-email {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .profile-stat-card {
      background-color: #393b3d;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .profile-stat-card .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #f2cd37;
    }

    .profile-stat-card .stat-label {
      font-size: 12px;
      color: #8a8c8e;
      margin-top: 4px;
    }

    .profile-section {
      background-color: #393b3d;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .profile-section h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .profile-section .empty {
      color: #8a8c8e;
      font-size: 13px;
      text-align: center;
      padding: 12px;
    }

    .profile-friends-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    .profile-friend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      transition: background-color 0.15s ease;
      cursor: pointer;
    }

    .profile-friend-item:hover {
      background-color: rgba(255, 255, 255, 0.06);
    }

    .profile-friend-item .friend-avatar-small {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0d69ac, #00b06f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .profile-friend-item .friend-name-small {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8a8c8e;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .profile-back:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='./index.html'">
        <div class="logo-icon"></div>
        <span class="logo-text">BloxVerse</span>
      </div>
    </div>
    <div class="nav-right" id="navRight"></div>
  </nav>

  <div class="profile-page" id="profilePage"></div>

  <script type="module">
    import { auth, db } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc, collection, getDocs, query, where } from 'firebase/firestore';

    const navRight = document.getElementById('navRight');
    const profilePage = document.getElementById('profilePage');
    const urlParams = new URLSearchParams(window.location.search);
    const profileUserId = urlParams.get('user');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = './auth.html';
        return;
      }

      const viewingUserId = profileUserId || user.uid;
      const isOwnProfile = viewingUserId === user.uid;

      const userDoc = await getDoc(doc(db, 'users', viewingUserId));
      if (!userDoc.exists()) {
        profilePage.innerHTML = '<p style="text-align:center;color:#8a8c8e;padding:48px;">User not found</p>';
        return;
      }

      const userData = userDoc.data();
      const username = userData.username || 'Unknown';
      const email = userData.email || '';
      const bux = userData.bux || 0;
      const friendIds = userData.friends || [];
      const createdAt = userData.createdAt ? new Date(userData.createdAt).toLocaleDateString() : 'Unknown';

      // Determine online status
      const statusDoc = await getDoc(doc(db, 'presence', viewingUserId));
      let status = 'offline';
      if (statusDoc.exists()) {
        const presence = statusDoc.data();
        status = presence.inGame ? 'in-game' : 'online';
      }

      const initial = username.charAt(0).toUpperCase();

      // Fetch friends
      let friendsList = [];
      for (const fid of friendIds.slice(0, 12)) {
        try {
          const fDoc = await getDoc(doc(db, 'users', fid));
          if (fDoc.exists()) {
            friendsList.push(fDoc.data());
          }
        } catch {}
      }

      profilePage.innerHTML = `
        <a href="${isOwnProfile ? '/index.html' : '/index.html'}" class="profile-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          ${isOwnProfile ? 'Back to home' : 'Back'}
        </a>

        <div class="profile-banner">
          <div class="avatar-with-status">
            <div class="profile-avatar-large">${initial}</div>
            <div class="status-dot ${status}"></div>
          </div>
          <div class="profile-info">
            <h1>${username}</h1>
            <div class="profile-email">${isOwnProfile ? email : ''}</div>
          </div>
        </div>

        <div class="profile-stats">
          <div class="profile-stat-card">
            <div class="stat-value">${bux.toLocaleString()}</div>
            <div class="stat-label">Bux</div>
          </div>
          <div class="profile-stat-card">
            <div class="stat-value">${friendIds.length}</div>
            <div class="stat-label">Friends</div>
          </div>
          <div class="profile-stat-card">
            <div class="stat-value">${createdAt}</div>
            <div class="stat-label">Joined</div>
          </div>
        </div>

        <div class="profile-section">
          <h2>Friends</h2>
          ${friendsList.length === 0 ? '<div class="empty">No friends yet</div>' : `
            <div class="profile-friends-grid">
              ${friendsList.map(f => `
                <div class="profile-friend-item" onclick="window.location.href='./profile.html?user=${f.id}'">
                  <div class="friend-avatar-small">${f.username.charAt(0).toUpperCase()}</div>
                  <span class="friend-name-small">${f.username}</span>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;

      // Nav
      const ownUserData = isOwnProfile ? userData : await getDoc(doc(db, 'users', user.uid)).then(d => d.exists() ? d.data() : {});
      const ownBux = ownUserData.bux || 0;
      const ownInitial = (ownUserData.username || 'P').charAt(0).toUpperCase();

      navRight.innerHTML = `
        <div class="user-info">
          <button class="bux-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
            </svg>
            <span>${ownBux.toLocaleString()}</span>
          </button>
          <div class="avatar-dropdown">
            <div class="avatar-circle">${ownInitial}</div>
            <div class="dropdown-menu">
              <div class="dropdown-header">
                <span class="dropdown-name">${ownUserData.username || 'Player'}</span>
                <span class="dropdown-email">${user.email}</span>
              </div>
              <button class="dropdown-item" onclick="window.location.href='./profile.html'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                Profile
              </button>
              <button class="dropdown-item" onclick="window._logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Log Out
              </button>
            </div>
          </div>
        </div>
      `;

      // Make dropdown clickable
      const avatarCircle = navRight.querySelector('.avatar-circle');
      const dropdown = navRight.querySelector('.avatar-dropdown');
      avatarCircle.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });

      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('open');
        }
      });
    });

    window._logout = async () => {
      await signOut(auth);
        window.location.href = './auth.html';
    };
  </script>
</body>

</html>
