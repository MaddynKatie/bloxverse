<html lang="en">

<head>

    "imports": {

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    
    .profile-page {
      max-width: 780px;
      width: 100%;
      padding: 0;
      padding-top: 52px;
      margin: 0 auto;
    }

    /* ── Banner + avatar ─────────────────────────── */
    .profile-banner {
      position: relative;
      width: auto;
      height: 260px;
      margin: 0 16px;
      background: var(--bg-banner);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 24px;
    }

    /* Centered avatar preview image */
    .profile-avatar-centered {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .profile-avatar-centered .profile-avatar-large {
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-primary);
      border-radius: 24px;
      overflow: hidden;
    }
    .profile-avatar-centered .profile-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* ── Header ─────────────────── */
    .profile-header {
      padding: 24px 16px;
      display: flex;
      align-items: center;
      gap: 20px;
      border: none;
      background: transparent;
      margin-bottom: 0;
    }

    .avatar-with-status {
      position: relative;
    }

    .profile-header-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--bg-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-primary);
      overflow: hidden;
    }
    .profile-header-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background: transparent;
    }

    .status-dot-blue {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      background: #1d72f2; /* Kept standard blue for online, or rely on .status-dot classes */
      border-radius: 50%;
      border: 4px solid var(--bg-primary);
    }

    .profile-header-info { min-width: 0; flex: 1; }
    .profile-header-info h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .inline-stats {
      display: flex;
      gap: 16px;
      font-size: 14px;
    }
    .inline-stats .stat-value {
      font-weight: 700;
      color: var(--text-primary);
    }
    .inline-stats .stat-label {
      color: var(--text-muted);
    }
    .profile-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .profile-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: var(--border);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .profile-btn:hover { background: var(--bg-secondary); }
    .profile-btn:disabled { opacity: 0.55; cursor: default; }
    .profile-btn-primary { background: var(--accent); border: none; }
    .profile-btn-primary:hover { background: var(--accent-hover); }
    .profile-btn-danger { background: rgba(255,68,68,0.15); color: #ff6666; }
    .profile-btn-danger:hover { background: rgba(255,68,68,0.25); }

    @media (max-width: 768px) {
      .profile-page { padding-top: 48px; }
      .profile-header { padding: 12px 16px; flex-wrap: wrap; }
      .profile-header-info h1 { font-size: 20px; }
      .profile-header-avatar { width: 90px; height: 90px; }
    }

    .settings-nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      background: none;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .settings-nav-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .settings-wrapper { position: relative; }
    .settings-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      min-width: 140px;
      z-index: 100;
      overflow: hidden;
      margin-top: 4px;
    }
    .settings-dropdown.open { display: block; }
    .settings-dropdown button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-dropdown button:hover { background: var(--bg-tertiary); color: var(--text-primary); }

    
    /* ── Content layout ────────────────────────── */
    .profile-content {
      padding: 0 16px;
    }

    /* ── Sections ──────────────────────────────── */
    .profile-section {
      background: var(--bg-secondary);
      border-radius: 12px;
      border: var(--border);
      padding: 24px;
      margin-bottom: 24px;
    }
    .profile-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: none;
      padding-bottom: 0;
    }
    .profile-section-header h2 {
      font-size: 12px;
      font-weight: 700;
      margin: 0;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Friends Section */
    .friends-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .friends-header-row h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }
    .friends-pagination {
      display: flex;
      gap: 6px;
    }
    .friends-pagination button {
      background: var(--bg-tertiary);
      border: var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .friends-pagination button:hover { background: var(--bg-secondary); color: var(--text-primary); }
    .friends-pagination button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .friends-pagination button:disabled:hover { background: var(--bg-tertiary); color: var(--text-muted); }
    .friends-carousel {
      overflow: hidden;
      margin-bottom: 24px;
    }
    .friends-list {
      display: flex;
      gap: 16px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .friends-list::-webkit-scrollbar { display: none; }
    .friend-card {
      width: 80px;
      flex-shrink: 0;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: none;
      padding: 0;
      border-radius: 0;
      transition: none;
    }
    .friend-card:hover {
      background: none;
    }
    .friend-avatar-wrapper {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #fff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .friend-avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .friend-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
      text-align: center;
      width: 100%;
    }
    .friend-status {
      font-size: 11px;
      color: var(--text-muted);
    }
    .friend-status.online { color: #0d69ac; }
    .friend-status.in-game { color: var(--accent); }

    /* Footer Stats Grid */
    .footer-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 40px;
    }
    .footer-stat-card {
      background: var(--bg-secondary);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: var(--border);
    }
    .footer-stat-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }
    .footer-stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* ── Bio ───────────────────────────────────── */
    .profile-bio { color: var(--text-secondary); font-size: 15px; line-height: 1.5; word-wrap: break-word; }
    .profile-bio-empty { color: var(--text-muted); }
    .bio-edit-btn {
      background: var(--bg-tertiary);
      border: var(--border-strong);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .bio-edit-btn:hover { background: var(--bg-secondary); color: var(--text-primary); }
    .bio-editor { margin-top: 8px; }
    .bio-textarea {
      width: 100%;
      background: var(--bg-surface);
      border: var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 13px;
      padding: 8px;
      resize: vertical;
      box-sizing: border-box;
      font-family: inherit;
    }
    .bio-textarea:focus { outline: none; border-color: rgba(88,101,242,0.6); }
    .bio-editor-actions { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .bio-char-count { font-size: 12px; color: var(--text-muted); }
    .bio-btn { padding: 6px 14px; border-radius: 6px; border: none; font-size: 13px; cursor: pointer; margin-left: 6px; }
    .bio-btn-cancel { background: var(--bg-tertiary); color: var(--text-secondary); }
    .bio-btn-cancel:hover { background: var(--bg-secondary); }
    .bio-btn-save { background: var(--accent); color: var(--text-primary); }
    .bio-btn-save:hover { background: var(--accent-hover); }

    /* ── Role badges ─────────────────────────────── */
    .role-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      margin-left: 2px;
      vertical-align: middle;
      position: relative;
      cursor: default;
    }
    .role-badge.developer { color: #44d9e6; }
    .role-badge.admin     { color: #ff4444; }
    .role-badge.mod       { color: #facc15; }
    .role-badge::after {
      content: attr(data-label);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-tertiary);
      border: var(--border);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 50;
    }
    .role-badge:hover::after { opacity: 1; }
  </style>

      <div class="logo" onclick="window.location.href='/bloxverse/'">
        <img src="assets/icons/bloxverseLogo.png" alt="" class="footer-logo-img" />

  <script type="module">
    import { auth, db, calculateAge, addTrustedFriend, removeTrustedFriend, getRoles, resolveProfileUser, assignUserIdNum, logTransaction, trackPresence, followUser, unfollowUser, getGameStats } from './src/firebase.js';
    import { sendFriendRequest, removeFriend } from './src/friends.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc, setDoc, onSnapshot, updateDoc, increment, collection, getDocs, query, where, limit } from 'firebase/firestore';

    const navRight = document.getElementById('navRight');
    const profilePage = document.getElementById('profilePage');
    const urlParams = new URLSearchParams(window.location.search);

    // Short-TTL cache (memory + localStorage) so repeat visits paint instantly
    // without waiting on the userIds lookup, user doc, or friend batches.
    const PROFILE_CACHE_TTL = 45000;
    const PROFILE_CACHE_PREFIX = 'bv:pc:';
    const profileCache = new Map();
    const _cacheSafe = (val) => {
      if (val === null || typeof val !== 'object') return val;
      if (typeof val.toDate === 'function' && typeof val.toMillis === 'function') return val.toMillis();
      if (Array.isArray(val)) return val.map(_cacheSafe);
      const out = {};
      for (const k in val) out[k] = _cacheSafe(val[k]);
      return out;
    };
    const profileCacheGet = (key) => {
      const mem = profileCache.get(key);
      if (mem) {
        if (Date.now() - mem.at > PROFILE_CACHE_TTL) profileCache.delete(key);
        else return mem.data;
      }
      try {
        const raw = localStorage.getItem(PROFILE_CACHE_PREFIX + key);
        if (!raw) return null;
        const entry = JSON.parse(raw);
        if (Date.now() - entry.at > PROFILE_CACHE_TTL) {
          localStorage.removeItem(PROFILE_CACHE_PREFIX + key);
          return null;
        }
        profileCache.set(key, { at: entry.at, data: entry.data });
        return entry.data;
      } catch { return null; }
    };
    const profileCacheSet = (key, data) => {
      profileCache.set(key, { at: Date.now(), data });
      try {
        const serialized = JSON.stringify({ at: Date.now(), data });
        if (serialized.length > 400000) return;
        localStorage.setItem(PROFILE_CACHE_PREFIX + key, serialized);
      } catch {}
    };

    const _escapeHtml = (str) => {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    };

    const ROLE_BADGE_CONFIG = {
      developer: { icon: 'fa-solid fa-code', color: '#44d9e6', label: 'Developer' },
      admin:     { icon: 'fa-solid fa-shield-halved', color: '#ff4444', label: 'Admin' },
      mod:       { icon: 'fa-solid fa-gavel', color: '#facc15', label: 'Moderator' },
    };
    const roleBadgeHtml = (r) => {
      const cfg = ROLE_BADGE_CONFIG[r];
      if (!cfg) return '';
      return `<span class="role-badge ${r}" data-label="${cfg.label}"><i class="${cfg.icon}"></i></span>`;
    };

    // Paint the profile page content straight from cache before auth resolves,
    // so the page is visible instantly on repeat visits. The onAuthStateChanged
    // render below replaces it with the full, fresh version (actions, privacy).
    function _paintFromCache() {
      const rawTarget = urlParams.get('user');
      let uid = null;
      if (rawTarget) {
        if (/^\d+$/.test(rawTarget)) {
          uid = profileCacheGet('num:' + rawTarget);
        } else {
          uid = rawTarget;
        }
      } else {
        uid = profileCacheGet('me');
      }
      if (!uid) return false;
      const page = profileCacheGet('page:' + uid);
      if (!page || !page.userData) return false;
      const userData = page.userData;
      const username = userData.username || 'Unknown';
      const bio = userData.bio || '';
      const friendIds = userData.friends || [];
      const followerIds = userData.followers || [];
      const followingIds = userData.following || [];
      const createdAt = userData.createdAt ? new Date(userData.createdAt).toLocaleDateString() : 'Unknown';
      const initial = username.charAt(0).toUpperCase();
      const _cb = Date.now();
      const friendsList = page.friendsList || [];
      const badgeHtml = (page.viewingRoles || []).map(roleBadgeHtml).join('');
      const renderAvatarThumb = (preview, initial) => preview
        ? `<img src="${preview}?_cb=${_cb}" alt="" loading="lazy" />`
        : `<div style="font-size: 32px; color: var(--text-secondary); font-weight: bold; line-height: 80px; text-align: center; background: #fff; width: 100%; height: 100%;">${initial}</div>`;

      profilePage.innerHTML = `
        <div class="profile-banner">
          <div class="profile-avatar-centered">
            ${userData.avatarPreview
              ? `<div class="profile-avatar-large"><img src="${userData.avatarPreview}?_cb=${_cb}" alt="" class="profile-avatar-img" /></div>`
              : `<div class="profile-avatar-large">${initial}</div>`}
          </div>
        </div>

        <div class="profile-header">
          <div class="avatar-with-status">
            <div class="profile-header-avatar">
              ${userData.avatarPreviewHead || userData.avatarPreview
                ? `<img src="${(userData.avatarPreviewHead || userData.avatarPreview)}?_cb=${_cb}" alt="" />`
                : `<span>${initial}</span>`}
            </div>
            <div class="status-dot-blue" id="profileStatusDotHeader"></div>
          </div>
          <div class="profile-header-info">
            <h1>${username}${badgeHtml}</h1>
            <div class="inline-stats">
              <div><span class="stat-value">${friendIds.length}</span> <span class="stat-label">Friends</span></div>
              <div><span class="stat-value" id="profileFollowerCount">${followerIds.length}</span> <span class="stat-label">Followers</span></div>
              <div><span class="stat-value">${followingIds.length}</span> <span class="stat-label">Following</span></div>
            </div>
          </div>
        </div>

        <div class="profile-content">
          <div class="profile-section">
            <div class="profile-section-header"><h2>ABOUT</h2></div>
            ${bio ? `<div class="profile-bio">${_escapeHtml(bio)}</div>` : `<div class="profile-bio profile-bio-empty">No bio yet.</div>`}
          </div>

          <div class="friends-header-row">
            <h2>Friends (${friendIds.length})</h2>
            <div class="friends-pagination" id="friendsPagination" style="visibility:hidden;"><button id="friendsPrev">&lt;</button><button id="friendsNext">&gt;</button></div>
          </div>
          <div class="friends-carousel">
            <div class="friends-list" id="friendsList">
              ${friendsList.length === 0 ? '<div style="color: #888; font-size: 13px;">No friends yet</div>' :
                friendsList.map(f => `
                  <div class="friend-card" onclick="window.location.href='/bloxverse/profile?user=${f.num}'" style="cursor:pointer;">
                    <div class="friend-avatar-wrapper">
                      ${renderAvatarThumb(f.avatarPreviewHead || f.avatarPreview, (f.username || 'U').charAt(0).toUpperCase())}
                    </div>
                    <div class="friend-name">${f.username}</div>
                    <div class="friend-status">Offline</div>
                  </div>
                `).join('')
              }
            </div>
          </div>

          <div class="footer-stats-grid">
            <div class="footer-stat-card"><div class="footer-stat-label">VISITS</div><div class="footer-stat-value" id="profileVisitCount">0</div></div>
            <div class="footer-stat-card"><div class="footer-stat-label">JOINED</div><div class="footer-stat-value">${createdAt}</div></div>
          </div>
        </div>
      `;

      if (page.visitTotal != null) {
        const el = document.getElementById('profileVisitCount');
        if (el) el.textContent = Number(page.visitTotal).toLocaleString();
      }
      return true;
    }

    _paintFromCache();

    onAuthStateChanged(auth, async (user) => {
      document.querySelectorAll('[data-needs-auth]').forEach(el => { el.style.display = user ? '' : 'none'; });

      if (user) {
        profileCacheSet('me', user.uid);

        trackPresence(user.uid, null, 'profile');

        // ── Real-time ban listener ────────────────────────────────────
        onSnapshot(doc(db, 'bans', user.uid), (snap) => {
          if (snap.exists() && snap.data().banned) {
            window.location.href = '/bloxverse/ban';
          }
        });
        // ──────────────────────────────────────────────────────────────
      }

      // Resolve profile view target: handle numeric userIdNum or UID.
      // Fire the resolve and the viewer's own doc read in parallel so the
      // profile paints as soon as the slowest of the two returns.
      const rawTarget = urlParams.get('user');
      const numKey = rawTarget && /^\d+$/.test(rawTarget) ? ('num:' + rawTarget) : null;
      const cachedUid = numKey ? profileCacheGet(numKey) : null;
      const resolvePromise = (rawTarget && !cachedUid)
        ? resolveProfileUser(rawTarget).then(uid => { if (uid && numKey) profileCacheSet(numKey, uid); return uid; })
        : Promise.resolve(cachedUid);
      const ownDocPromise = (user && rawTarget)
        ? Promise.resolve(profileCacheGet('user:' + user.uid) || getDoc(doc(db, 'users', user.uid)).then(d => d.exists() ? _cacheSafe(d.data()) : {}).catch(() => ({})))
        : Promise.resolve({});

      const [resolvedUid, readOwnUserData] = await Promise.all([resolvePromise, ownDocPromise]);
      if (rawTarget && !resolvedUid) {
        profilePage.innerHTML = '<p style="text-align:center;color:#8a8c8e;padding:48px;">User not found</p>';
        return;
      }
      const viewingUserId = resolvedUid || (user ? user.uid : null);
      if (!viewingUserId) {
        navRight.innerHTML = `<button class="login-btn" onclick="window.location.href='/bloxverse/auth'">Login / Sign Up</button>`;
        profilePage.innerHTML = '<div style="text-align:center;padding:64px 24px;"><h2 style="margin:0 0 8px;font-size:20px;color:var(--text-primary);">Welcome to BloxVerse</h2><p style="margin:0;color:var(--text-muted);font-size:14px;">Log in to view your profile.</p><button class="profile-btn profile-btn-primary" style="margin-top:20px;" onclick="window.location.href=\'/bloxverse/auth\'">Login / Sign Up</button></div>';
        return;
      }
      const isOwnProfile = user ? viewingUserId === user.uid : false;

      let userData = profileCacheGet('user:' + viewingUserId);
      if (!userData) {
        const userDoc = await getDoc(doc(db, 'users', viewingUserId));
        if (!userDoc.exists()) {
          profilePage.innerHTML = '<p style="text-align:center;color:#8a8c8e;padding:48px;">User not found</p>';
          return;
        }
        userData = _cacheSafe(userDoc.data());
        profileCacheSet('user:' + viewingUserId, userData);
      }
      const username = userData.username || 'Unknown';
      const email = userData.email || '';
      const bio = userData.bio || '';
      const bux = userData.bux || 0;
      const friendIds = userData.friends || [];
      const followerIds = userData.followers || [];
      const followingIds = userData.following || [];
      const createdAt = userData.createdAt ? new Date(userData.createdAt).toLocaleDateString() : 'Unknown';
      const birthday = userData.birthday || '';
      const userIdNum = userData.userIdNum;
      const hasUserIdNum = !!userIdNum;

      // Kick off the visits total immediately so it's ready by first paint.
      // Uses the memoized published+stats readers from games.js (shared with
      // the home page, cached 30s) instead of re-fetching full collections.
      const visitTotalPromise = (async () => {
        const cachedVisits = profileCacheGet('visits:' + viewingUserId);
        if (cachedVisits != null) return cachedVisits;
        const { getPublishedGames, getAllGames } = await import('./src/games.js');
        const published = await getPublishedGames();
        let total = 0;
        for (const g of published) {
          if (g.deleted) continue;
          if (g.authorId === viewingUserId) total += g.visits || 0;
        }
        if (userIdNum) {
          const sums = await Promise.all(getAllGames()
            .filter(g => g.creator === userIdNum)
            .map(g => getGameStats(g.id).then(s => s.visits || 0)));
          total += sums.reduce((a, b) => a + b, 0);
        }
        profileCacheSet('visits:' + viewingUserId, total);
        return total;
      })().catch(() => 0);

      // ── Privacy check: friends-only profiles ──────────────────────────
      let ownUserData = isOwnProfile ? userData : {};
      if (!isOwnProfile && user) {
        ownUserData = profileCacheGet('user:' + user.uid);
        if (!ownUserData) {
          ownUserData = _cacheSafe(readOwnUserData);
          if (ownUserData && Object.keys(ownUserData).length) profileCacheSet('user:' + user.uid, ownUserData);
        }
      }
      const ownBux = ownUserData.bux || 0;
      const ownNum = ownUserData.userIdNum;
      const ownProfileLink = ownNum ? `/bloxverse/profile?user=${ownNum}` : '/bloxverse/profile';
      const ownInitial = (ownUserData.username || 'P').charAt(0).toUpperCase();
      const ownPreview = ownUserData.avatarPreviewHead || ownUserData.avatarPreview || null;

      const _cb = Date.now();

      if (user) {
        navRight.innerHTML = `
        <div class="user-info">
          <div class="bux-wrapper" id="buxWrapper">
            <button class="bux-btn" id="buxBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
              </svg>
              <span id="ownBuxVal">${ownBux.toLocaleString()}</span>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
            </button>
            <div class="bux-dropdown">
              <div class="bux-dropdown-header">
                <span class="bux-dropdown-label">Balance</span>
                <span class="bux-dropdown-balance" id="buxDropdownBalance">${ownBux.toLocaleString()}</span>
              </div>
              <button class="bux-dropdown-item" onclick="window.openSendBuxModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-2 8-10V5l-8-3-8 3v7c0 8 8 10 8 10z"/></svg>
                Send Bux
              </button>
              <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Transactions
              </button>
            </div>
          </div>
          <div class="settings-wrapper">
            <button class="settings-nav-btn" id="navSettingsBtn" title="Settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
            <div class="settings-dropdown" id="navSettingsDropdown">
              <button onclick="window.location.href='/bloxverse/settings'">Settings</button>
              <button onclick="window._logout()">Log Out</button>
            </div>
          </div>
          ${ownPreview
            ? `<img src="${ownPreview}?_cb=${_cb}" alt="" class="avatar-circle-img" onclick="window.location.href='${ownProfileLink}'" data-initial="${ownInitial}" onerror="window.__handleBrokenAvatar(this, '${user.uid}')"/>`
            : `<div class="avatar-circle" onclick="window.location.href='${ownProfileLink}'">${ownInitial}</div>`}
        </div>
      `;
      } else {
        navRight.innerHTML = `<button class="login-btn" onclick="window.location.href='/bloxverse/auth'">Login / Sign Up</button>`;
      }

      if (!isOwnProfile && userData.profilePrivacy === 'friends' && !(user && friendIds.includes(user.uid))) {
        profilePage.innerHTML = '<div style="text-align:center;padding:64px 24px;"><div style="font-size:48px;margin-bottom:16px;">🔒</div><h2 style="margin:0 0 8px;font-size:20px;color:var(--text-primary);">Friends Only</h2><p style="margin:0;color:var(--text-muted);font-size:14px;">This profile is only visible to friends.</p></div>';
        return;
      }

      // Migration for existing users without a userIdNum
      if (isOwnProfile && !hasUserIdNum) {
        assignUserIdNum(user.uid).catch(() => {});
      }

      const initial = username.charAt(0).toUpperCase();
      const age = calculateAge(birthday);
      const isThirteenPlus = age >= 13;
      const trustedFriendIds = userData.trustedFriends || [];

      // Show Cloudinary preview image if available, otherwise initial letter
      window.__handleBrokenAvatar = async function(imgEl, uid) {
        try {
          const initial = imgEl.getAttribute('data-initial') || 'U';
          const letter = document.createElement('div');
          const parent = imgEl.parentElement;
          if (parent && parent.classList.contains('profile-header-avatar')) {
            letter.className = 'profile-header-avatar';
            letter.textContent = initial;
            imgEl.replaceWith(letter);
            return;
          } else if (imgEl.className.includes('profile-avatar-img')) {
            letter.className = 'profile-avatar-large';
          } else if (imgEl.className.includes('avatar-circle-img')) {
            letter.className = 'avatar-circle';
          } else {
            letter.className = 'profile-thumb-letter';
          }
          letter.textContent = initial;
          imgEl.replaceWith(letter);
          // If the broken avatar belongs to the currently signed-in user, clear avatarPreview so it can regenerate later
          try {
            if (window.auth && window.auth.currentUser && window.auth.currentUser.uid === uid) {
              await setDoc(doc(db, 'users', uid), { avatarPreview: null, avatarPreviewHead: null }, { merge: true });
              console.log('[Avatar] Cleared stale avatarPreview for current user to trigger regeneration');
            }
          } catch (e) {
            console.warn('[Avatar] Could not clear avatarPreview:', e);
          }
        } catch (e) {
          console.warn('[Avatar] error handling broken avatar:', e);
        }
      };

      const renderAvatarThumb = (preview, initial, uid) => {
        if (preview) {
          return `<img src="${preview}?_cb=${_cb}" alt="" loading="lazy" data-initial="${initial}" onerror="window.__handleBrokenAvatar(this, '${uid}')"/>`;
        }
        return `<div style="font-size: 32px; color: var(--text-secondary); font-weight: bold; line-height: 80px; text-align: center; background: #fff; width: 100%; height: 100%;">${initial}</div>`;
      };

      const _escapeHtml = (str) => {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      };

      window.saveBio = async function() {
        const textarea = document.getElementById('bioTextarea');
        const newBio = textarea.value.trim();
        try {
          await setDoc(doc(db, 'users', user.uid), { bio: newBio }, { merge: true });
          document.getElementById('bioEditor').style.display = 'none';
          document.querySelector('.bio-edit-btn').style.display = '';
          location.reload();
        } catch (e) {
          alert('Failed to save bio: ' + e.message);
        }
      };

      // Fetch all user data in parallel
      const fetchUsers = async (ids) => {
        const results = await Promise.all(ids.slice(0, 12).map(fid =>
          getDoc(doc(db, 'users', fid)).then(fDoc => {
            if (!fDoc.exists()) return null;
            const fData = fDoc.data();
            return { id: fid, num: fData.userIdNum, username: fData.username || 'Unknown', avatarColors: fData.avatarColors || null, avatarFace: fData.avatarFace || null, avatarPreview: fData.avatarPreview || null, avatarPreviewHead: fData.avatarPreviewHead || null };
          }).catch(() => null)
        ));
        return results.filter(Boolean);
      };

      const batchKey = 'batch:' + (user ? user.uid : 'anon') + ':' + viewingUserId;
      let batch = profileCacheGet(batchKey);
      if (!batch) {
        const [tf, fl, fol, roles, req] = await Promise.all([
          fetchUsers(trustedFriendIds),
          fetchUsers(friendIds),
          fetchUsers(followerIds),
          getRoles(viewingUserId),
          user ? getDocs(query(collection(db, 'friendRequests'), where('from', '==', user.uid))).then(snap =>
            snap.docs.some(d => d.data().status === 'pending' && d.data().to === viewingUserId)) : Promise.resolve(false),
        ]);
        batch = { trustedFriendsList: tf, friendsList: fl, followersList: fol, viewingRoles: roles, hasOutgoingRequest: req };
        profileCacheSet(batchKey, batch);
      }
      let trustedFriendsList = batch.trustedFriendsList;
      let friendsList = batch.friendsList;
      let followersList = batch.followersList;
      let viewingRoles = batch.viewingRoles;
      let hasOutgoingRequest = batch.hasOutgoingRequest;
      let areFriends = !isOwnProfile && (ownUserData.friends || []).includes(viewingUserId);
      let isFollowing = !isOwnProfile && (ownUserData.following || []).includes(viewingUserId);

      // Cache the viewer-agnostic page payload for the instant paint on the next visit.
      profileCacheSet('page:' + viewingUserId, { userData, friendsList, viewingRoles });

      const badgeHtml = viewingRoles.map(roleBadgeHtml).join(' ');

      profilePage.innerHTML = `
        <!-- Banner with centered avatar preview -->
        <div class="profile-banner">
          <div class="profile-avatar-centered">
            ${userData.avatarPreview
              ? `<div class="profile-avatar-large"><img src="${userData.avatarPreview}?_cb=${_cb}" alt="" class="profile-avatar-img" data-initial="${initial}" onerror="window.__handleBrokenAvatar(this,'${viewingUserId}')"/></div>`
              : `<div class="profile-avatar-large">${initial}</div>`}
          </div>
        </div>

        <div class="profile-header">
          <div class="avatar-with-status">
            <div class="profile-header-avatar">
              ${userData.avatarPreviewHead || userData.avatarPreview
                ? `<img src="${(userData.avatarPreviewHead || userData.avatarPreview)}?_cb=${_cb}" alt="" data-initial="${initial}" onerror="window.__handleBrokenAvatar(this,'${viewingUserId}')"/>`
                : `<span>${initial}</span>`}
            </div>
            <div class="status-dot-blue" id="profileStatusDotHeader"></div>
          </div>
          <div class="profile-header-info">
            <h1>${username}${badgeHtml}</h1>
            <div class="inline-stats">
              <div><span class="stat-value">${friendIds.length}</span> <span class="stat-label">Friends</span></div>
              <div><span class="stat-value" id="profileFollowerCount">${followerIds.length}</span> <span class="stat-label">Followers</span></div>
              <div><span class="stat-value">${followingIds.length}</span> <span class="stat-label">Following</span></div>
            </div>
            ${!isOwnProfile && user ? `
              <div class="profile-actions">
                <button class="profile-btn ${areFriends ? 'profile-btn-danger' : 'profile-btn-primary'}" id="btnFriendAction" ${hasOutgoingRequest ? 'disabled' : ''}>${areFriends ? 'Remove Friend' : hasOutgoingRequest ? 'Request Sent' : 'Add Friend'}</button>
                <button class="profile-btn" id="btnFollowAction">${isFollowing ? 'Following' : 'Follow'}</button>
              </div>
            ` : ''}
          </div>
        </div>

        <div class="profile-content">
          <div class="profile-section">
            <div class="profile-section-header">
              <h2>ABOUT</h2>
              ${isOwnProfile ? `<button class="bio-edit-btn" onclick="document.getElementById('bioEditor').style.display='block';this.style.display='none'">Edit</button>` : ''}
            </div>
            ${bio ? `<div class="profile-bio">${_escapeHtml(bio)}</div>` : `<div class="profile-bio profile-bio-empty">${isOwnProfile ? 'Tell people about yourself...' : 'No bio yet.'}</div>`}
            ${isOwnProfile ? `
              <div id="bioEditor" class="bio-editor" style="display:none">
                <textarea id="bioTextarea" maxlength="500" rows="3" class="bio-textarea">${_escapeHtml(bio)}</textarea>
                <div class="bio-editor-actions">
                  <span class="bio-char-count"><span id="bioCount">${bio.length}</span>/500</span>
                  <div>
                    <button class="bio-btn bio-btn-cancel" onclick="document.getElementById('bioEditor').style.display='none';document.querySelector('.bio-edit-btn').style.display=''">Cancel</button>
                    <button class="bio-btn bio-btn-save" onclick="saveBio()">Save</button>
                  </div>
                </div>
              </div>
            ` : ''}
          </div>

          <div class="friends-header-row">
            <h2>Friends (${friendIds.length})</h2>
            <div class="friends-pagination" id="friendsPagination">
              <button id="friendsPrev">&lt;</button>
              <button id="friendsNext">&gt;</button>
            </div>
          </div>
          <div class="friends-carousel">
            <div class="friends-list" id="friendsList">
              ${friendsList.length === 0 ? '<div style="color: #888; font-size: 13px;">No friends yet</div>' : 
                friendsList.map(f => `
                  <div class="friend-card" onclick="window.location.href='/bloxverse/profile?user=${f.num}'" style="cursor:pointer;">
                    <div class="friend-avatar-wrapper">
                      ${renderAvatarThumb(f.avatarPreviewHead || f.avatarPreview, (f.username || 'U').charAt(0).toUpperCase(), f.id)}
                    </div>
                    <div class="friend-name">${f.username}</div>
                    <div class="friend-status" data-uid="${f.id}">Offline</div>
                  </div>
                `).join('')
              }
            </div>
          </div>

          <div class="footer-stats-grid">
            <div class="footer-stat-card">
              <div class="footer-stat-label">VISITS</div>
              <div class="footer-stat-value" id="profileVisitCount">0</div>
            </div>
            <div class="footer-stat-card">
              <div class="footer-stat-label">JOINED</div>
              <div class="footer-stat-value">${createdAt}</div>
            </div>
          </div>

        </div>
      `;

      // Apply the visits total (computed in parallel above) once the panel exists
      visitTotalPromise.then(total => {
        const el = document.getElementById('profileVisitCount');
        if (el) el.textContent = total.toLocaleString();
        const prev = profileCacheGet('page:' + viewingUserId) || {};
        profileCacheSet('page:' + viewingUserId, { ...prev, visitTotal: total });
      });

      // Friends carousel: arrows reveal the next/previous set of friends.
      const friendsTrack = document.getElementById('friendsList');
      const friendsPrev = document.getElementById('friendsPrev');
      const friendsNext = document.getElementById('friendsNext');
      const friendsPagination = document.getElementById('friendsPagination');
      if (friendsTrack && friendsPrev && friendsNext && friendsPagination) {
        const updateFriendsArrows = () => {
          const viewport = friendsTrack.parentElement;
          const maxScroll = friendsTrack.scrollWidth - viewport.clientWidth;
          const canScroll = maxScroll > 1;
          friendsPagination.style.visibility = canScroll ? 'visible' : 'hidden';
          friendsPrev.disabled = !canScroll || friendsTrack.scrollLeft <= 1;
          friendsNext.disabled = !canScroll || friendsTrack.scrollLeft >= maxScroll - 1;
        };
        friendsPrev.addEventListener('click', () => {
          friendsTrack.scrollBy({ left: -friendsTrack.parentElement.clientWidth, behavior: 'smooth' });
        });
        friendsNext.addEventListener('click', () => {
          friendsTrack.scrollBy({ left: friendsTrack.parentElement.clientWidth, behavior: 'smooth' });
        });
        friendsTrack.addEventListener('scroll', updateFriendsArrows, { passive: true });
        window.addEventListener('resize', updateFriendsArrows);
        updateFriendsArrows();
      }

      // Trusted Friends button handlers
      if (isOwnProfile) {
        document.querySelectorAll('.trust-btn.add').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const friendId = btn.dataset.id;
            const friendName = btn.dataset.username;
            try {
              await addTrustedFriend(viewingUserId, friendId);
              btn.textContent = 'Added!';
              btn.style.background = 'rgba(34,197,94,0.4)';
              btn.disabled = true;
            } catch (e) {
              console.error('Error adding trusted friend:', e);
            }
          });
        });
        document.querySelectorAll('.trust-btn.remove').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            const friendId = btn.dataset.id;
            try {
              await removeTrustedFriend(viewingUserId, friendId);
              const item = btn.closest('.profile-friend-item');
              if (item) item.style.opacity = '0.3';
              btn.textContent = 'Removed';
              btn.disabled = true;
            } catch (e) {
              console.error('Error removing trusted friend:', e);
            }
          });
        });
      }

      // Profile actions for other users
      const btnFriendAction = document.getElementById('btnFriendAction');
      const btnFollowAction = document.getElementById('btnFollowAction');
      const followerCountEl = document.getElementById('profileFollowerCount');

      if (btnFriendAction) {
        btnFriendAction.addEventListener('click', async () => {
          if (areFriends) {
            await removeFriend(user.uid, viewingUserId);
            areFriends = false;
            btnFriendAction.textContent = 'Add Friend';
            btnFriendAction.classList.remove('profile-btn-danger');
          } else if (!hasOutgoingRequest) {
            btnFriendAction.disabled = true;
            btnFriendAction.textContent = 'Request Sent';
            try {
              await sendFriendRequest(user.uid, viewingUserId, username);
              hasOutgoingRequest = true;
            } catch (e) {
              console.error('Failed to send friend request:', e);
              btnFriendAction.disabled = false;
              btnFriendAction.textContent = 'Add Friend';
            }
          }
        });
      }

      if (btnFollowAction) {
        btnFollowAction.addEventListener('click', async () => {
          if (isFollowing) {
            await unfollowUser(user.uid, viewingUserId);
            isFollowing = false;
            btnFollowAction.textContent = 'Follow';
            if (followerCountEl) followerCountEl.textContent = String(Math.max(0, (parseInt(followerCountEl.textContent, 10) || 0) - 1));
          } else {
            await followUser(user.uid, viewingUserId);
            isFollowing = true;
            btnFollowAction.textContent = 'Following';
            if (followerCountEl) followerCountEl.textContent = String((parseInt(followerCountEl.textContent, 10) || 0) + 1);
          }
        });
      }

      // Bio textarea character counter
      const bioTextarea = document.getElementById('bioTextarea');
      if (bioTextarea) {
        bioTextarea.addEventListener('input', () => {
          document.getElementById('bioCount').textContent = bioTextarea.value.length;
        });
      }

      // Presence / Status listener
      const statusDotBanner = document.getElementById('profileStatusDotBanner');
      const statusDotHeader = document.getElementById('profileStatusDotHeader');
      const updateStatus = (status) => {
        if (statusDotHeader) { statusDotHeader.className = 'status-dot ' + status; }
      };
      updateStatus('offline');
      const presenceUnsub = onSnapshot(doc(db, 'presence', viewingUserId), (snap) => {
        let status = 'offline';
        if (snap.exists()) {
          const p = snap.data();
          const lastSeen = p.lastSeen?.toMillis?.() ?? p.lastSeen;
          const twoMinAgo = Date.now() - 120000;
          if (lastSeen && lastSeen < twoMinAgo) status = 'offline';
          else if (p.inGame) status = 'in-game';
          else if (p.online) status = 'online';
        }
        updateStatus(status);
      }, () => updateStatus('offline'));
      window.addEventListener('beforeunload', () => presenceUnsub?.());

      // Live friend presence
      const friendStatusEls = {};
      document.querySelectorAll('.friend-status[data-uid]').forEach(el => {
        friendStatusEls[el.dataset.uid] = el;
      });
      const friendPresenceUnsubs = [];
      Object.keys(friendStatusEls).forEach(fid => {
        const el = friendStatusEls[fid];
        const unsub = onSnapshot(doc(db, 'presence', fid), (snap) => {
          let text = 'Offline';
          if (snap.exists()) {
            const p = snap.data();
            const lastSeen = p.lastSeen?.toMillis?.() ?? p.lastSeen;
            const twoMinAgo = Date.now() - 120000;
            if (lastSeen && lastSeen < twoMinAgo) text = 'Offline';
            else if (p.inGame) text = 'In Game';
            else if (p.online) text = 'Online';
          }
          el.textContent = text;
          el.className = 'friend-status ' + (text === 'Online' ? 'online' : text === 'In Game' ? 'in-game' : 'offline');
        }, () => {
          el.textContent = 'Offline';
          el.className = 'friend-status offline';
        });
        friendPresenceUnsubs.push(unsub);
      });
      window.addEventListener('beforeunload', () => friendPresenceUnsubs.forEach(u => u?.()));

      // Bux dropdown toggle
      const buxWrapper = document.getElementById('buxWrapper');
      const buxBtn = document.getElementById('buxBtn');
      if (buxWrapper && buxBtn) {
        buxBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          buxWrapper.classList.toggle('open');
        });
      }

      // Settings dropdown toggles
      const closeSettings = () => {
        document.querySelectorAll('.settings-dropdown').forEach(d => d.classList.remove('open'));
      };
      ['#navSettingsBtn'].forEach(id => {
        const btn = document.querySelector(id);
        if (!btn) return;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeSettings();
          const dd = btn.closest('.settings-wrapper').querySelector('.settings-dropdown');
          if (dd) dd.classList.toggle('open');
        });
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.settings-wrapper')) {
          closeSettings();
        }
        if (buxWrapper && !buxWrapper.contains(e.target)) {
          buxWrapper.classList.remove('open');
        }
      });
    });

    // Hamburger menu toggle
    const hamburger = document.getElementById('navHamburger');
    const navLinks = document.getElementById('navLinks');
    if (hamburger && navLinks) {
      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.navbar')) navLinks.classList.remove('open');
      });
    }

    window._logout = async () => {
      await signOut(auth);
        window.location.href = '/bloxverse/auth';
    };

    // ── Send Bux ─────────────────────────────────────────────────────────
    window.openSendBuxModal = () => {
      if (!auth.currentUser) return;
      const bux = Number(String(document.getElementById('buxDropdownBalance')?.textContent || '0').replace(/,/g, '')) || 0;
      let selectedUserId = null;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-content" style="max-width:500px;">
          <div class="modal-header">
            <h2>Send Bux</h2>
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
          </div>
          <div class="modal-body">
            <div class="modal-field">
              <label>Recipient</label>
              <input type="text" id="sendBuxSearch" placeholder="Search username..." autocomplete="off" />
              <div id="sendBuxResults" class="search-list" style="display:none;"></div>
            </div>

            <div id="sendBuxSelected" style="display:none;">
              <div class="modal-field">
                <label>Selected User</label>
                <div class="selected-badge">
                  <img id="sendBuxAvatar" src="" class="selected-avatar" />
                  <span id="sendBuxName"></span>
                </div>
              </div>
            </div>

            <div class="modal-field">
              <label>Amount</label>
              <div class="amount-row">
                <input type="number" id="sendBuxAmount" placeholder="Enter amount…" min="1" max="${bux}" />
                <span class="bux-label">BUX</span>
              </div>
            </div>

            <div class="warning-box" style="margin:0;">
              <strong>Warning:</strong> Bux transfers are final and cannot be undone.
            </div>
            <div id="sendBuxErr" class="error-msg" style="display:none;"></div>
          </div>
          <div class="modal-footer">
            <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="modal-btn confirm" id="sendBuxSendBtn" disabled>Send</button>
          </div>
        </div>`;

      overlay.querySelector('#sendBuxSendBtn').addEventListener('click', () => {
        const amount = parseInt(overlay.querySelector('#sendBuxAmount').value, 10);
        const username = overlay.querySelector('#sendBuxName').textContent;
        if (!selectedUserId || !amount || amount < 1) return;

        const confirmOverlay = document.createElement('div');
        confirmOverlay.className = 'modal-overlay';
        confirmOverlay.style.cssText = 'z-index:10000;background:rgba(0,0,0,0.8);';
        confirmOverlay.innerHTML = `
          <div class="modal-content" style="max-width:400px;">
            <div class="modal-header">
              <h3 style="font-size:16px;margin:0;">Confirm Transfer</h3>
            </div>
            <div class="modal-body">
              <p style="color:var(--text-secondary);font-size:14px;line-height:1.5;margin:0 0 16px;">
                Are you sure you want to send <strong style="color:#4caf50;">${amount.toLocaleString()} BUX</strong>
                to <strong style="color:var(--text-primary);">${username}</strong>?
              </p>
              <div class="warning-box" style="margin:0;">
                This transfer is <strong>final</strong>. You will not be able to recover these BUX.
              </div>
            </div>
            <div class="modal-footer">
              <button class="modal-btn cancel" id="confirmCancelBtn">Cancel</button>
              <button class="modal-btn confirm" id="confirmYesBtn" style="background:rgba(244,67,54,0.8);">Yes, Send</button>
            </div>
          </div>`;
        document.body.appendChild(confirmOverlay);

        confirmOverlay.querySelector('#confirmCancelBtn').addEventListener('click', () => confirmOverlay.remove());
        confirmOverlay.querySelector('#confirmYesBtn').addEventListener('click', async () => {
          try {
            await updateDoc(doc(db, 'users', auth.currentUser.uid), { bux: increment(-amount) });
            await updateDoc(doc(db, 'users', selectedUserId), { bux: increment(amount) });

            const _sSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
            const _sData = _sSnap.data();
            const _rSnap = await getDoc(doc(db, 'users', selectedUserId));
            const _rData = _rSnap.data();
            await logTransaction(auth.currentUser.uid, -amount, _sData?.bux || 0, 'SendBux', `Sent ${amount.toLocaleString()} BUX to ${username}`);
            await logTransaction(selectedUserId, amount, _rData?.bux || 0, 'SendBux', `Received ${amount.toLocaleString()} BUX from ${_sData?.username || 'Someone'}`);

            confirmOverlay.remove();
            overlay.remove();
          } catch (err) {
            console.error(err);
            overlay.querySelector('#sendBuxErr').textContent = 'Transfer failed. Try again.';
            overlay.querySelector('#sendBuxErr').style.display = 'block';
            confirmOverlay.remove();
          }
        });
      });

      document.body.appendChild(overlay);

      const searchInput = overlay.querySelector('#sendBuxSearch');
      const resultsEl = overlay.querySelector('#sendBuxResults');
      const selectedEl = overlay.querySelector('#sendBuxSelected');
      const nameEl = overlay.querySelector('#sendBuxName');
      const avatarEl = overlay.querySelector('#sendBuxAvatar');
      const sendBtn = overlay.querySelector('#sendBuxSendBtn');

      let searchTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        const term = searchInput.value.trim().toLowerCase();
        if (!term) { resultsEl.style.display = 'none'; return; }
        searchTimer = setTimeout(async () => {
          try {
            const snap = await getDocs(query(collection(db, 'users'), where('username', '>=', term), where('username', '<', term + '\uf8ff'), limit(20)));
            const matches = snap.docs.filter(d => d.data().username?.toLowerCase().includes(term));
            if (matches.length === 0) {
              resultsEl.innerHTML = '<div class="empty-state">No users found</div>';
            } else {
              resultsEl.innerHTML = matches.map(f => `
                <div class="search-item" data-uid="${f.id}" data-name="${f.data().username}" data-avatar="${f.data().avatarPreviewHead || f.data().avatarPreview || ''}">
                  ${f.data().avatarPreviewHead || f.data().avatarPreview ? `<img src="${f.data().avatarPreviewHead || f.data().avatarPreview}" alt="" />` : `<div class="init-circle">${f.data().username.charAt(0).toUpperCase()}</div>`}
                  <span>${f.data().username}</span>
                </div>`).join('');
              resultsEl.querySelectorAll('.search-item').forEach(el => {
                el.addEventListener('click', () => {
                  selectedUserId = el.dataset.uid;
                  nameEl.textContent = el.dataset.name;
                  avatarEl.src = el.dataset.avatar || '';
                  selectedEl.style.display = 'block';
                  resultsEl.style.display = 'none';
                  searchInput.value = '';
                  sendBtn.disabled = false;
                  overlay.querySelector('#sendBuxErr').style.display = 'none';
                  overlay.querySelector('#sendBuxAmount').focus();
                });
              });
            }
            resultsEl.style.display = 'block';
          } catch (err) {
            console.error(err);
            resultsEl.innerHTML = '<div class="empty-state">Search error</div>';
          }
        }, 200);
      });

      document.addEventListener('click', (e) => {
        if (overlay.contains(e.target)) return;
        if (resultsEl.style.display === 'block') resultsEl.style.display = 'none';
      }, { once: true });
    };
  </script>
</body>

</html>
