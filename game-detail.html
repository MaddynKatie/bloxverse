<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/bloxverse/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Game</title>
  <style>
    .detail-header {
      position: relative;
      width: 100%;
      height: 320px;
      background: linear-gradient(135deg, #1a1c1e 0%, #2a2c2e 100%);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 32px;
    }

    .detail-header-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }

    .detail-header-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, rgba(35,37,39,0.95));
    }

    .detail-header-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 24px;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .detail-thumb {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .detail-info {
      flex: 1;
    }

    .detail-title {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .detail-category {
      font-size: 13px;
      color: #8a8c8e;
      margin-bottom: 12px;
    }

    .detail-stats {
      display: flex;
      gap: 24px;
    }

    .detail-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #babbbe;
    }

    .detail-stat svg {
      color: #00b06f;
    }

    .detail-play-btn {
      padding: 14px 40px;
      background: linear-gradient(135deg, #00b06f, #00d4aa);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .detail-play-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .detail-body {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .detail-body h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .detail-description {
      font-size: 15px;
      line-height: 1.6;
      color: #babbbe;
      margin-bottom: 32px;
    }

    .detail-section {
      margin-bottom: 32px;
    }

    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .detail-meta-card {
      background: #393b3d;
      border-radius: 10px;
      padding: 16px;
    }

    .detail-meta-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8a8c8e;
      margin-bottom: 4px;
    }

    .detail-meta-value {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8a8c8e;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 16px;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: #fff;
    }

    .author-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #00b06f;
    }

    @media (max-width: 768px) {
      .detail-header {
        height: auto;
        padding: 20px;
      }
      .detail-header-content {
        flex-direction: column;
        align-items: flex-start;
      }
      .detail-thumb {
        width: 80px;
        height: 80px;
      }
      .detail-title {
        font-size: 22px;
      }
      .detail-stats {
        flex-wrap: wrap;
        gap: 12px;
      }
      .detail-play-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
  <script type="module" crossorigin src="/bloxverse/assets/game-detail-BY-Zr8oP.js"></script>
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/modulepreload-polyfill-Ke7zwH0v.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/firebase-HvCPFqZQ.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/games-C_DoiMNO.js">
  <link rel="stylesheet" crossorigin href="/bloxverse/assets/main-C5c_W7U6.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        <div class="logo-icon"></div>
        <span class="logo-text">BloxVerse</span>
      </div>
    </div>
    <div class="nav-center"></div>
    <div class="nav-right" id="navRight"></div>
  </nav>

  <div class="detail-header" id="detailHeader">
    <div class="detail-header-content">
      <img class="detail-thumb" id="detailThumb" src="" alt="" />
      <div class="detail-info">
        <h1 class="detail-title" id="detailTitle">Loading...</h1>
        <div class="detail-category" id="detailCategory"></div>
        <div class="detail-stats">
          <div class="detail-stat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span id="detailActivePlayers">0</span> active
          </div>
          <div class="detail-stat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="detailVisits">0</span> visits
          </div>
        </div>
      </div>
      <button class="detail-play-btn" id="detailPlayBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play
      </button>
    </div>
  </div>

  <div class="detail-body">
    <a class="back-link" href="/bloxverse/">← Back to Games</a>

    <div class="detail-section">
      <h2>Description</h2>
      <p class="detail-description" id="detailDescription"></p>
    </div>

    <div class="detail-section">
      <h2>Details</h2>
      <div class="detail-meta-grid">
        <div class="detail-meta-card">
          <div class="detail-meta-label">Category</div>
          <div class="detail-meta-value" id="metaCategory">—</div>
        </div>
        <div class="detail-meta-card">
          <div class="detail-meta-label">Created</div>
          <div class="detail-meta-value" id="metaCreated">—</div>
        </div>
        <div class="detail-meta-card">
          <div class="detail-meta-label">Author</div>
          <div class="detail-meta-value" id="metaAuthor">BloxVerse</div>
        </div>
      </div>
      <div class="detail-actions" id="detailActions" style="display:none;margin-top:16px;text-align:center;gap:12px;justify-content:center;">
        <button class="detail-edit-btn" id="detailEditBtn" style="background:rgba(88,101,242,0.8);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px;">Edit Game</button>
        <button class="detail-delete-btn" id="detailDeleteBtn" style="background:rgba(244,67,54,0.8);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px;">Delete Game</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="background:#1a1f2e;border:1px solid rgba(88,101,242,0.4);border-radius:12px;width:440px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
      <div class="modal-header" style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);">
        <h2 style="font-size:18px;font-weight:600;">Edit Game</h2>
        <button class="modal-close" id="editModalClose" style="background:none;border:none;color:#888;font-size:22px;cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body" style="padding:20px;display:flex;flex-direction:column;gap:16px;">
        <div class="modal-field" style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;">Game Name</label>
          <input type="text" id="editName" style="background:#0f1419;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px 12px;color:#e0e0e0;font-family:inherit;font-size:14px;" maxlength="50" />
        </div>
        <div class="modal-field" style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;">Genre</label>
          <select id="editGenre" style="background:#0f1419;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px 12px;color:#e0e0e0;font-family:inherit;font-size:14px;">
            <option value="Sandbox">Sandbox</option>
            <option value="Exploration">Exploration</option>
            <option value="Sports">Sports</option>
            <option value="Fighting">Fighting</option>
            <option value="Racing">Racing</option>
            <option value="Adventure">Adventure</option>
            <option value="Simulation">Simulation</option>
            <option value="Puzzle">Puzzle</option>
            <option value="Horror">Horror</option>
            <option value="Comedy">Comedy</option>
            <option value="RPG">RPG</option>
            <option value="Strategy">Strategy</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="modal-field" style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;">Description</label>
          <textarea id="editDescription" style="background:#0f1419;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px 12px;color:#e0e0e0;font-family:inherit;font-size:14px;resize:vertical;min-height:80px;" rows="4" maxlength="1000"></textarea>
        </div>
        <div class="modal-field" style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;">Thumbnail</label>
          <div style="display:flex;gap:12px;align-items:center;">
            <img id="editThumbPreview" style="width:64px;height:64px;border-radius:6px;object-fit:cover;border:1px solid rgba(255,255,255,0.1);" />
            <button id="editUploadBtn" style="background:rgba(88,101,242,0.6);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;">Upload Image</button>
            <input type="file" id="editThumbInput" accept="image/*" style="display:none;" />
          </div>
        </div>
      </div>
      <div class="modal-footer" style="display:flex;gap:12px;justify-content:flex-end;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08);">
        <button id="editCancelBtn" style="background:rgba(255,255,255,0.08);color:#ccc;padding:8px 20px;border-radius:6px;border:none;font-family:inherit;font-size:14px;cursor:pointer;">Cancel</button>
        <button id="editConfirmBtn" style="background:rgba(76,175,80,0.8);color:#fff;padding:8px 20px;border-radius:6px;border:none;font-family:inherit;font-size:14px;cursor:pointer;">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</body>
</html>
