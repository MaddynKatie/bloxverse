<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

    <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Game</title>
  <link rel="stylesheet" href="src/main.css" />
  <style>
    .detail-header {
      position: relative;
      width: 100%;
      height: 320px;
      background: linear-gradient(135deg, #1a1c1e 0%, #2a2c2e 100%);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 32px;
    }

    .detail-header-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.4;
    }

    .detail-header-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, rgba(35,37,39,0.95));
    }

    .detail-header-content {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: flex-end;
      gap: 24px;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .detail-thumb {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .detail-info {
      flex: 1;
    }

    .detail-title {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
    }

    .detail-category {
      font-size: 13px;
      color: #8a8c8e;
      margin-bottom: 12px;
    }

    .detail-stats {
      display: flex;
      gap: 24px;
    }

    .detail-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #babbbe;
    }

    .detail-stat svg {
      color: #00b06f;
    }

    .detail-play-btn {
      padding: 14px 40px;
      background: linear-gradient(135deg, #00b06f, #00d4aa);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .detail-play-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .detail-body {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .detail-body h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .detail-description {
      font-size: 15px;
      line-height: 1.6;
      color: #babbbe;
      margin-bottom: 32px;
    }

    .detail-section {
      margin-bottom: 32px;
    }

    .detail-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .detail-meta-card {
      background: #393b3d;
      border-radius: 10px;
      padding: 16px;
    }

    .detail-meta-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8a8c8e;
      margin-bottom: 4px;
    }

    .detail-meta-value {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8a8c8e;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 16px;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: #fff;
    }

    .author-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #00b06f;
    }

    @media (max-width: 768px) {
      .detail-header {
        height: auto;
        padding: 20px;
      }
      .detail-header-content {
        flex-direction: column;
        align-items: flex-start;
      }
      .detail-thumb {
        width: 80px;
        height: 80px;
      }
      .detail-title {
        font-size: 22px;
        white-space: normal;
        overflow-wrap: break-word;
      }
      .detail-stats {
        flex-wrap: wrap;
        gap: 12px;
      }
      .detail-play-btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        <div class="logo-icon"></div>
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/create'">Create</button>
      </div>
    </div>
    <div class="nav-center"></div>
    <div class="nav-right" id="navRight"></div>
  </nav>

  <div class="detail-header" id="detailHeader">
    <div class="detail-header-content">
      <img class="detail-thumb" id="detailThumb" src="" alt="" />
      <div class="detail-info">
        <h1 class="detail-title" id="detailTitle">Loading...</h1>
        <div class="detail-category" id="detailCategory"></div>
        <div class="detail-stats">
          <div class="detail-stat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span id="detailActivePlayers">0</span> active
          </div>
          <div class="detail-stat">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="detailVisits">0</span> visits
          </div>
        </div>
      </div>
      <button class="detail-play-btn" id="detailPlayBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play
      </button>
    </div>
  </div>

  <div class="detail-body">
    <a class="back-link" href="/">← Back to Games</a>

    <div class="detail-section">
      <h2>Description</h2>
      <p class="detail-description" id="detailDescription"></p>
    </div>

    <div class="detail-section">
      <h2>Details</h2>
      <div class="detail-meta-grid">
        <div class="detail-meta-card">
          <div class="detail-meta-label">Category</div>
          <div class="detail-meta-value" id="metaCategory">—</div>
        </div>
        <div class="detail-meta-card">
          <div class="detail-meta-label">Created</div>
          <div class="detail-meta-value" id="metaCreated">—</div>
        </div>
        <div class="detail-meta-card">
          <div class="detail-meta-label">Author</div>
          <div class="detail-meta-value" id="metaAuthor">BloxVerse</div>
        </div>
      </div>
      <div class="detail-actions" id="detailActions" style="display:none;margin-top:16px;text-align:center;gap:12px;justify-content:center;">
        <button class="detail-edit-btn" id="detailEditBtn" style="background:rgba(88,101,242,0.8);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px;">Edit Game</button>
        <button class="detail-delete-btn" id="detailDeleteBtn" style="background:rgba(244,67,54,0.8);color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px;">Delete Game</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal-overlay" style="display:none;">
    <div class="modal-content" style="background:#1a1f2e;border:1px solid rgba(88,101,242,0.4);border-radius:12px;width:440px;max-width:90vw;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
      <div class="modal-header" style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.08);">
        <h2 style="font-size:18px;font-weight:600;">Edit Game</h2>
        <button class="modal-close" id="editModalClose" style="background:none;border:none;color:#888;font-size:22px;cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body" style="padding:20px;display:flex;flex-direction:column;gap:16px;">
        <div class="modal-field" style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;">Game Name</label>
          <input type="text" id="editName" style="background:#0f1419;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px 12px;color:#e0e0e0;font-family:inherit;font-size:14px;" maxlength="50" />
        </div>
        <div class="modal-field" style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;">Genre</label>
          <select id="editGenre" style="background:#0f1419;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px 12px;color:#e0e0e0;font-family:inherit;font-size:14px;">
            <option value="Sandbox">Sandbox</option>
            <option value="Exploration">Exploration</option>
            <option value="Sports">Sports</option>
            <option value="Fighting">Fighting</option>
            <option value="Racing">Racing</option>
            <option value="Adventure">Adventure</option>
            <option value="Simulation">Simulation</option>
            <option value="Puzzle">Puzzle</option>
            <option value="Horror">Horror</option>
            <option value="Comedy">Comedy</option>
            <option value="RPG">RPG</option>
            <option value="Strategy">Strategy</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="modal-field" style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;">Description</label>
          <textarea id="editDescription" style="background:#0f1419;border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px 12px;color:#e0e0e0;font-family:inherit;font-size:14px;resize:vertical;min-height:80px;" rows="4" maxlength="1000"></textarea>
        </div>
        <div class="modal-field" style="display:flex;flex-direction:column;gap:6px;">
          <label style="font-size:13px;color:#aaa;text-transform:uppercase;letter-spacing:0.5px;">Thumbnail</label>
          <div style="display:flex;gap:12px;align-items:center;">
            <img id="editThumbPreview" style="width:64px;height:64px;border-radius:6px;object-fit:cover;border:1px solid rgba(255,255,255,0.1);" />
            <button id="editUploadBtn" style="background:rgba(88,101,242,0.6);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px;">Upload Image</button>
            <input type="file" id="editThumbInput" accept="image/*" style="display:none;" />
          </div>
        </div>
      </div>
      <div class="modal-footer" style="display:flex;gap:12px;justify-content:flex-end;padding:16px 20px;border-top:1px solid rgba(255,255,255,0.08);">
        <button id="editCancelBtn" style="background:rgba(255,255,255,0.08);color:#ccc;padding:8px 20px;border-radius:6px;border:none;font-family:inherit;font-size:14px;cursor:pointer;">Cancel</button>
        <button id="editConfirmBtn" style="background:rgba(76,175,80,0.8);color:#fff;padding:8px 20px;border-radius:6px;border:none;font-family:inherit;font-size:14px;cursor:pointer;">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script type="module">
    import { games, findGameAsync } from './src/games.js';
    import { auth, trackPresence, deleteGame, updateGame, banGuard, db, doc, onSnapshot } from './src/firebase.js';
    import { onAuthStateChanged } from 'firebase/auth';

    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('id');

    const detailTitle = document.getElementById('detailTitle');
    const detailThumb = document.getElementById('detailThumb');
    const detailCategory = document.getElementById('detailCategory');
    const detailDescription = document.getElementById('detailDescription');
    const detailActivePlayers = document.getElementById('detailActivePlayers');
    const detailVisits = document.getElementById('detailVisits');
    const detailPlayBtn = document.getElementById('detailPlayBtn');
    const metaCategory = document.getElementById('metaCategory');
    const metaCreated = document.getElementById('metaCreated');
    const metaAuthor = document.getElementById('metaAuthor');
    const navRight = document.getElementById('navRight');

    async function init() {
      try {
      if (!gameId) {
        detailTitle.textContent = 'Game not found';
        return;
      }

      const game = await findGameAsync(gameId);
      if (!game) {
        detailTitle.textContent = 'Game not found';
        return;
      }

      function formatDate(dateStr) {
        if (!dateStr) return '\u2014';
        if (/^\d{4}\/\d{2}\/\d{2}$/.test(dateStr)) return dateStr;
        try { return new Date(dateStr).toLocaleDateString(); } catch { return dateStr; }
      }

      detailTitle.textContent = game.name;
      detailThumb.src = game.icon;
      detailThumb.alt = game.name;
      detailCategory.textContent = game.category || 'Game';
      detailDescription.textContent = game.description || 'No description available.';
      metaCategory.textContent = game.category || '—';
      metaCreated.textContent = game.createdAt ? formatDate(game.createdAt) : '—';
      if (game.authorName) {
        metaAuthor.textContent = game.authorName;
        metaAuthor.style.color = '#00b06f';
      }

      _gameAuthorId = game.authorId || null;
      _gameData = game;
      if (_gameAuthorId && auth.currentUser && auth.currentUser.uid === _gameAuthorId) {
        detailActions.style.display = 'flex';
      }

      detailActivePlayers.textContent = game.activePlayers || 0;
      detailVisits.textContent = (game.visits || 0).toLocaleString();

      if (game.deleted) {
        detailPlayBtn.style.display = 'none';
        const reviewMsg = document.createElement('div');
        reviewMsg.id = 'reviewMsg';
        reviewMsg.style.cssText = 'width:100%;text-align:center;padding:20px 16px;background:rgba(244,67,54,0.1);border:1px solid rgba(244,67,54,0.3);border-radius:8px;color:#e74c3c;font-size:14px;font-weight:500;';
        reviewMsg.textContent = 'Sorry, this place is currently under review. Try again later.';
        detailPlayBtn.parentNode.insertBefore(reviewMsg, detailPlayBtn);
      } else {
        detailPlayBtn.addEventListener('click', () => {
          window.location.href = '/bloxverse/game?game=' + gameId;
        });
      }

      // Update active players every 10 seconds
      setInterval(async () => {
        try {
          const fresh = await findGameAsync(gameId);
          if (fresh) {
            detailActivePlayers.textContent = fresh.activePlayers || 0;
          }
        } catch (_) {}
      }, 10000);
      } catch (e) {
        detailTitle.textContent = 'Game not found';
        console.warn('Could not load game:', e);
      }
    }

    let _gameAuthorId = null;
    let _gameData = null;
    let _uploadedIcon = null;
    const detailActions = document.getElementById('detailActions');
    const detailDeleteBtn = document.getElementById('detailDeleteBtn');
    const detailEditBtn = document.getElementById('detailEditBtn');
    const editModal = document.getElementById('editModal');
    const editName = document.getElementById('editName');
    const editGenre = document.getElementById('editGenre');
    const editDescription = document.getElementById('editDescription');
    const editThumbPreview = document.getElementById('editThumbPreview');
    const editThumbInput = document.getElementById('editThumbInput');
    const editUploadBtn = document.getElementById('editUploadBtn');
    const editConfirmBtn = document.getElementById('editConfirmBtn');
    const editCancelBtn = document.getElementById('editCancelBtn');
    const editModalClose = document.getElementById('editModalClose');

    function openEditModal() {
      editName.value = _gameData?.name || '';
      editGenre.value = _gameData?.category || 'Sandbox';
      editDescription.value = _gameData?.description || '';
      editThumbPreview.src = _gameData?.icon || './assets/icons/demo.png';
      _uploadedIcon = null;
      editModal.style.display = 'flex';
    }
    function closeEditModal() { editModal.style.display = 'none'; }

    editCancelBtn.addEventListener('click', closeEditModal);
    editModalClose.addEventListener('click', closeEditModal);
    editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEditModal(); });

    // Cloudinary upload for thumbnail
    function uploadThumbnail(file) {
      const CLOUD_NAME = 'dvkbiobph';
      const UPLOAD_PRESET = 'bloxverse_thumb'; // create this in Cloudinary Dashboard -> Settings -> Upload -> Add unsigned upload preset
      const formData = new FormData();
      formData.append('file', file);
      formData.append('upload_preset', UPLOAD_PRESET);
      return fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData,
      }).then(r => r.json()).then(data => {
        if (data.secure_url) return data.secure_url;
        throw new Error(data.error?.message || 'Upload failed');
      });
    }

    editUploadBtn.addEventListener('click', () => editThumbInput.click());
    editThumbInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      // Show preview
      editThumbPreview.src = URL.createObjectURL(file);
      editUploadBtn.textContent = 'Uploading...';
      editUploadBtn.disabled = true;
      try {
        const url = await uploadThumbnail(file);
        _uploadedIcon = url;
        editThumbPreview.src = url;
        editUploadBtn.textContent = 'Change Image';
      } catch (err) {
        alert('Upload failed: ' + err.message);
        editUploadBtn.textContent = 'Upload Image';
      }
      editUploadBtn.disabled = false;
    });

    editConfirmBtn.addEventListener('click', async () => {
      const name = editName.value.trim();
      if (!name) { editName.focus(); return; }
      const genre = editGenre.value;
      const desc = editDescription.value.trim();
      editConfirmBtn.disabled = true;
      editConfirmBtn.textContent = 'Saving...';
      try {
        const updates = { name, description: desc, category: genre };
        if (_uploadedIcon) updates.icon = _uploadedIcon;
        await updateGame(gameId, auth.currentUser.uid, updates);
        closeEditModal();
        // Reload page to show changes
        window.location.reload();
      } catch (err) {
        alert('Failed to save: ' + err.message);
      } finally {
        editConfirmBtn.disabled = false;
        editConfirmBtn.textContent = 'Save Changes';
      }
    });

    init();

    // Real-time listener for game delete/recover
    if (gameId) {
      onSnapshot(doc(db, 'publishedGames', gameId), (snap) => {
        if (snap.exists()) {
          const wasDeleted = window._gameDeleted;
          const isDeleted = snap.data().deleted === true;
          window._gameDeleted = isDeleted;
          if (wasDeleted !== undefined && wasDeleted !== isDeleted) {
            window.location.reload();
          }
        }
      });
    }

    detailDeleteBtn.addEventListener('click', async () => {
      if (!confirm('Delete this game permanently?')) return;
      try {
        await deleteGame(gameId, auth.currentUser.uid);
        alert('Game deleted.');
        window.location.href = '/bloxverse/';
      } catch (err) {
        alert('Failed to delete: ' + err.message);
      }
    });

    detailEditBtn.addEventListener('click', openEditModal);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        if (await banGuard(user.uid)) return;
        // ── Real-time ban listener ────────────────────────────────────
        onSnapshot(doc(db, 'bans', user.uid), (snap) => {
          if (snap.exists() && snap.data().banned) {
            window.location.href = '/bloxverse/ban';
          }
        });
        // ──────────────────────────────────────────────────────────────
        navRight.innerHTML = `
          <div class="user-info">
            <div class="avatar-circle">${(user.displayName || 'Player').charAt(0).toUpperCase()}</div>
          </div>
        `;
        if (_gameAuthorId && user.uid === _gameAuthorId) {
          detailActions.style.display = 'flex';
        }
      } else {
        navRight.innerHTML = `<button class="login-btn" onclick="window.location.href='/bloxverse/auth'">Login / Sign Up</button>`;
        detailActions.style.display = 'none';
      }
    });
  </script>
</body>
</html>
