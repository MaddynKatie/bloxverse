<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Play</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <!-- Top Left Tools -->
  <div class="top-bar">
    <button class="top-btn" id="btnSettings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button class="top-btn" id="btnChat" title="Chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
  </div>

  <!-- Chat Window -->
  <div id="chatContainer" class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Click or press / to chat" autocomplete="off" />
      <button id="btnSendChat">Send</button>
    </div>
  </div>

  <!-- Leaderboard -->
  <div class="leaderboard visible" id="leaderboard">
    <div class="leaderboard-header">
      <span>PLAYERS</span>
    </div>
    <div class="leaderboard-list" id="lbList">
      <div style="padding:8px 12px;color:#babbbe;font-size:12px;">Connecting...</div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button id="btnCloseSettings" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label>Camera Sensitivity</label>
          <div class="setting-control">
            <input type="range" id="sensSlider" min="0.1" max="3" step="0.1" value="1" />
            <span id="sensValue">1.0</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/bloxverse-engine.js"></script>
  <script type="module">
    import { games } from './src/games.js';
    import { auth, trackPresence } from './src/firebase.js';
    import { connectMultiplayer, sendLocalTransform, disconnectMultiplayer, sendChat } from './src/multiplayer.js';

    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('game');
    const game = games.find(g => g.id === gameId);

    // Chat UI logic
    const chatContainer = document.getElementById('chatContainer');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const btnSendChat = document.getElementById('btnSendChat');
    const btnChatToggle = document.getElementById('btnChat');

    btnChatToggle.addEventListener('click', () => {
      chatContainer.classList.toggle('visible');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== chatInput) {
        e.preventDefault();
        chatContainer.classList.add('visible');
        chatInput.focus();
      }
    });

    chatInput.addEventListener('focus', () => { window._chatFocused = true; });
    chatInput.addEventListener('blur', () => { window._chatFocused = false; });

    const NAME_COLORS = ['#60a5fa','#34d399','#f87171','#fbbf24','#a78bfa','#fb923c','#f472b6'];
    function nameColor(name) {
        let h = 0;
        for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xFFFF;
        return NAME_COLORS[h % NAME_COLORS.length];
    }

    function appendChatMessage(data) {
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-message';
      if (data.system) {
        msgEl.innerHTML = `<span class="chat-system"><i>${data.message}</i></span>`;
      } else {
        const userColor = nameColor(data.username);
        msgEl.innerHTML = `<span class="chat-username" style="color:${userColor}">${data.username}</span><span style="color:white"> : </span><span class="chat-text">${data.message}</span>`;
      }
      chatMessages.appendChild(msgEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function doSendChat() {
      const val = chatInput.value.trim();
      if (val) {
        sendChat(val, auth.currentUser?.displayName || 'Player');
        chatInput.value = '';
        chatInput.blur();
      }
    }

    btnSendChat.addEventListener('click', doSendChat);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSendChat(); });

    // Leaderboard UI
    const lbList = document.getElementById('lbList');

    function renderLeaderboard(players) {
      if (players.length === 0) {
        lbList.innerHTML = '<div style="padding:8px 12px;color:#babbbe;font-size:12px;">No players</div>';
        return;
      }
      lbList.innerHTML = players.map(p => `
        <div class="leaderboard-item">
          <span class="lb-name">${p.username}</span>
        </div>
      `).join('');
    }

    // Settings UI
    const btnSettings = document.getElementById('btnSettings');
    const settingsModal = document.getElementById('settingsModal');
    const btnCloseSettings = document.getElementById('btnCloseSettings');
    const sensSlider = document.getElementById('sensSlider');
    const sensValue = document.getElementById('sensValue');

    btnSettings.addEventListener('click', () => {
      settingsModal.style.display = 'flex';
      if (document.pointerLockElement) document.exitPointerLock();
    });

    btnCloseSettings.addEventListener('click', () => {
      settingsModal.style.display = 'none';
      if (window._bloxverse) window._bloxverse.requestLock();
    });

    sensSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      sensValue.textContent = val.toFixed(1);
      if (window._bloxverse) window._bloxverse.setSens(val);
    });

    // Load map
    if (game) {
      window.addEventListener('load', () => {
        const poll = setInterval(() => {
          if (window._bloxverse) {
            clearInterval(poll);
            if (game.mapPath) {
              const spawn = game.spawn || {};
              window._bloxverse.loadMap(game.mapPath, spawn.x ?? 0, 0, spawn.z ?? 0);
              window._bloxverse.setSens(parseFloat(sensSlider.value));
            }
          }
        }, 50);
      });
    }

    // Connect Multiplayer
    auth.onAuthStateChanged((user) => {
      if (user && gameId) {
        const presence = trackPresence(user.uid);
        presence.setInGame(true);

        const username = user.displayName || 'Player';

        connectMultiplayer(gameId, user.uid, username, 
          (id, x, y, z, ry, moving, grounded, climbState) => {
            if (window._bloxverse) window._bloxverse.updateOtherPlayer(id, x, y, z, ry, moving, grounded, climbState);
          }, 
          (id) => {
            if (window._bloxverse) window._bloxverse.removeOtherPlayer(id);
          },
          (players) => {
            renderLeaderboard(players);
          },
          (chatData) => {
            appendChatMessage(chatData);
          }
        );

        window._mpUpdate = (dt) => {
            window._mpTimer = (window._mpTimer || 0) + dt;
            if (window._mpTimer >= 0.1 && window._bloxverse) {
                window._mpTimer = 0;
                const loc = window._bloxverse.getLocalTransform();
                if (loc) sendLocalTransform(loc.x, loc.y, loc.z, loc.ry, loc.moving, loc.grounded, loc.climbState);
            }
        };

        window.addEventListener('beforeunload', () => {
          presence.goOffline();
          disconnectMultiplayer();
        });
      }
    });
  </script>
</body>

</html>
