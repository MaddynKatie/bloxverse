<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Play</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen" style="display:flex;">
    <div class="loading-content">
      <div class="logo-large"></div>
      <h2 id="loadingTitle">Loading experience...</h2>
      <div class="loading-bar">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
      </div>
    </div>
  </div>

  <!-- Top Left Tools -->
  <div class="top-bar">
    <button class="top-btn" id="btnSettings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button class="top-btn" id="btnChat" title="Chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
  </div>

  <!-- Chat Window -->
  <div id="chatContainer" class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Click or press / to chat" autocomplete="off" />
      <button id="btnSendChat">Send</button>
    </div>
  </div>

  <!-- Script GUI Layer -->
  <div id="scriptGuiContainer" style="position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden;"></div>

  <!-- Leaderboard -->
  <div class="leaderboard visible" id="leaderboard">
    <div class="leaderboard-header">
      <span>PLAYERS</span>
    </div>
    <div class="leaderboard-list" id="lbList">
      <div style="padding:8px 12px;color:#babbbe;font-size:12px;">Connecting...</div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button id="btnCloseSettings" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label>Camera Sensitivity</label>
          <div class="setting-control">
            <input type="range" id="sensSlider" min="0.1" max="3" step="0.1" value="1" />
            <span id="sensValue">1.0</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Shift Lock</label>
          <div class="setting-control">
            <label class="toggle-switch">
              <input type="checkbox" id="shiftlockToggle" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <div class="setting-row" id="profanitySettingRow" style="display: none;">
          <label>Chat Filter</label>
          <div class="setting-control">
            <label class="toggle-switch">
              <input type="checkbox" id="profanityToggle" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Player Profile Menu -->
  <div id="playerMenu" class="player-menu" style="display: none;">
    <div class="player-menu-content">
      <button class="player-menu-close">×</button>
      <div class="player-menu-username" id="playerMenuUsername"></div>
      <button class="player-menu-btn" id="btnViewProfile">View Profile</button>
      <button class="player-menu-btn" id="btnFriendRequest">Friend Request</button>
      <button class="player-menu-btn" id="btnFollow">Follow</button>
      <button class="player-menu-btn" id="btnTrust" style="display:none;">Trust</button>
    </div>
  </div>

  <div id="friendRequestToastContainer" class="friend-request-toast-container"></div>

  <script type="module" src="/src/bloxverse-engine.js"></script>
  <script type="module">
    import { games } from './src/games.js';
    import { auth, db, getDoc, doc, trackPresence, incrementGameVisits, getFollowing, followUser, unfollowUser, getUserProfile, calculateAge, addTrustedFriend, removeTrustedFriend } from './src/firebase.js';
    import { connectMultiplayer, sendLocalTransform, disconnectMultiplayer, sendChat, sendPhysicsState } from './src/multiplayer.js';
    import { sendFriendRequest as dbSendFriendRequest, acceptFriendRequest as dbAcceptFriendRequest, declineFriendRequest as dbDeclineFriendRequest, removeFriend, onFriendRequests } from './src/friends.js';
    import { loadScriptsFromStorage, executeScript } from './src/scriptRuntime.js';
    import { ProfanityFilter } from 'glin-profanity';
    const _profanityCheck = new ProfanityFilter({
      detectLeetspeak: true,
      leetspeakLevel: 'moderate',
      normalizeUnicode: true,
      allLanguages: true,
      wordBoundaries: true,
      allowObfuscatedMatch: true,
      fuzzyToleranceLevel: 0.8
    });

    const gameScriptModules = import.meta.glob('/assets/games/**/*.lua', { query: '?raw', import: 'default', eager: true });

    let _profanityFilterEnabled = true;

    function filterProfanity(text) {
      if (!_profanityFilterEnabled || !text) return text;
      const result = _profanityCheck.checkProfanity(text);
      if (!result.containsProfanity) return text;

      let cleaned = text;
      const leetMap = {
        'a': '[aA4@\u00C0-\u00C5\u0430\u03B1\u0250]', 
        'b': '[bB8\u03B2\u0299]', 
        'c': '[cC(<{\u00A2\u0441\u03C2\u03BF\u0254]',
        'd': '[dD|)]',
        'e': '[eE3\u00E8-\u00EB\u0435\u03B5\u01DD]',
        'g': '[gG69]',
        'h': '[hH#\u0445\u0265]',
        'i': '[iI1!|!\u00EC-\u00EF\u0456\u03B9\u0131]',
        'l': '[lL1|!|_]',
        'o': '[oO0\u00F2-\u00F6\u043E\u03BF\u03F5\u0251]',
        'p': '[pP\u00FE\u0440\u03C1]',
        's': '[sS5$]',
        't': '[tT7+\u2020\u0164\u0165\u0287]',
        'u': '[uUvV\u00F9-\u00FC\u0443\u03BC\u028C]',
        'x': '[xX%*]',
        'z': '[zZ2\u0240]'
      };

      result.profaneWords.forEach(word => {
        const pattern = word.split('').map(c => {
          const l = c.toLowerCase();
          return (leetMap[l] || l) + '[\\s._\\-*]*';
        }).join('');
        const regex = new RegExp(pattern, "gi");
        cleaned = cleaned.replace(regex, (m) => '*'.repeat(m.length));
      });
      return cleaned;
    }

    // ─── Real Loading Progress ──────────────────────────────────────────────
    const loadingScreen = document.getElementById('loadingScreen');
    const loadingBarFill = document.getElementById('loadingBarFill');
    const loadingTitle = document.getElementById('loadingTitle');
    let loadPct = 0;
    function setLoad(pct, text) {
      loadPct = Math.max(loadPct, Math.min(pct, 100));
      if (loadingBarFill) loadingBarFill.style.width = loadPct + '%';
      if (text && loadingTitle) loadingTitle.textContent = text;
    }
    setLoad(10, 'Loading modules...');

    const params = new URLSearchParams(window.location.search);
    const gameId = params.get('game');
    let game = games.find(g => g.id === gameId);

    // Fallback: load user-published game from Firestore
    if (!game && gameId) {
      const snap = await getDoc(doc(db, 'publishedGames', gameId)).catch(() => null);
      if (snap && snap.exists()) {
        const data = snap.data();
        data.id = gameId;
        if (data.mapUrl) {
          data.mapPath = data.mapUrl;
        }
        if (data.scripts && Object.keys(data.scripts).length) {
          window._publishedScripts = data.scripts;
        }
        game = data;
        setLoad(10, 'Loaded published game...');
      }
    }

    // Chat UI logic
    const chatContainer = document.getElementById('chatContainer');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const btnSendChat = document.getElementById('btnSendChat');
    const btnChatToggle = document.getElementById('btnChat');
    const settingsModal = document.getElementById('settingsModal');
    const friendRequestToastContainer = document.getElementById('friendRequestToastContainer');
    const activeFriendRequestToasts = new Map();
    let friendRequestUnsubscribe = null;
    let currentUserFriends = new Set();
    let currentUserTrustedFriends = new Set();
    let currentUserAge = 0;

    function exitPointerLockIfNeeded() {
      if (document.pointerLockElement) {
        document.exitPointerLock();
      }
    }

    btnChatToggle.addEventListener('click', () => {
      exitPointerLockIfNeeded();
      chatContainer.classList.toggle('visible');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== chatInput) {
        e.preventDefault();
        exitPointerLockIfNeeded();
        chatContainer.classList.add('visible');
        chatInput.focus();
      }
    });

    chatInput.addEventListener('focus', () => { window._chatFocused = true; });
    chatInput.addEventListener('blur', () => { window._chatFocused = false; });

    const NAME_COLORS = ['#60a5fa','#34d399','#f87171','#fbbf24','#a78bfa','#fb923c','#f472b6'];
    function nameColor(name) {
        let h = 0;
        for (const c of name) h = (h * 31 + c.charCodeAt(0)) & 0xFFFF;
        return NAME_COLORS[h % NAME_COLORS.length];
    }

    function appendChatMessage(data) {
      if (!data.system && data.message.startsWith('/resetparts')) {
        if (window._bloxverse) window._bloxverse.resetParts();
        return;
      }
      const msgEl = document.createElement('div');
      msgEl.className = 'chat-message';
      if (data.system) {
        msgEl.innerHTML = `<span class="chat-system"><i>${data.message}</i></span>`;
      } else {
        const userColor = nameColor(data.username);
        msgEl.innerHTML = `<span class="chat-username" style="color:${userColor}">${data.username}</span><span style="color:white"> : </span><span class="chat-text">${data.message}</span>`;
        // Show Roblox-style chat bubble above player
        if (window._bloxverse && data.userId) {
          window._bloxverse.showBubble(data.userId, data.message);
        }
      }
      chatMessages.appendChild(msgEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function doSendChat() {
      const val = chatInput.value.trim();
      if (val) {
        const userId = auth.currentUser?.uid;
        // Skip profanity filter if 13+ and has trusted friends in the game
        let shouldFilter = true;
        if (currentUserAge >= 13 && currentUserTrustedFriends.size > 0) {
          const players = getCurrentPlayers();
          const hasTrustedInGame = players.some(p => p.id && currentUserTrustedFriends.has(p.id));
          if (hasTrustedInGame) shouldFilter = false;
        }
        const profanityToggle = document.getElementById('profanityToggle');
        const filterEnabled = profanityToggle ? profanityToggle.checked : true;
        
        const filtered = shouldFilter || filterEnabled ? filterProfanity(val) : val;
        sendChat(filtered, auth.currentUser?.displayName || 'Player', userId, !shouldFilter && !filterEnabled);
        chatInput.value = '';
        chatInput.blur();
      }
    }

    btnSendChat.addEventListener('click', doSendChat);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') doSendChat(); });

    // Leaderboard UI
    const lbList = document.getElementById('lbList');
    const playerMenu = document.getElementById('playerMenu');
    const playerMenuUsername = document.getElementById('playerMenuUsername');
    const playerMenuClose = document.querySelector('.player-menu-close');
    const btnViewProfile = document.getElementById('btnViewProfile');
    const btnFriendRequest = document.getElementById('btnFriendRequest');
    const btnFollow = document.getElementById('btnFollow');
    const _playerUsernames = new Map(); // userId -> username
    let _selectedPlayerId = null;

    function renderLeaderboard(players) {
      if (players.length === 0) {
        lbList.innerHTML = '<div style="padding:8px 12px;color:#babbbe;font-size:12px;">No players</div>';
        return;
      }
      
      // Store usernames for use in player updates
      for (const p of players) {
        _playerUsernames.set(p.userId, p.username);
      }
      
      lbList.innerHTML = players.map(p => `
        <div class="leaderboard-item" data-user-id="${p.userId}">
          <span class="lb-name">${p.username}</span>
        </div>
      `).join('');
      
      // Add click handlers to leaderboard items
      lbList.querySelectorAll('.leaderboard-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          if (document.pointerLockElement) document.exitPointerLock();
          const userId = item.dataset.userId;
          const username = _playerUsernames.get(userId);
          showPlayerMenu(userId, username);
        });
      });
    }

    async function showPlayerMenu(userId, username) {
      _selectedPlayerId = userId;
      playerMenuUsername.textContent = username;
      playerMenu.style.display = 'block';
      
      // Reload friends list to ensure button state is correct
      await loadCurrentUserFriends(auth.currentUser?.uid);
      await checkFollowingStatus(userId);
      updateFriendRequestButton(userId);
      await checkTrustedStatus(userId);
    }

    function hidePlayerMenu() {
      playerMenu.style.display = 'none';
      _selectedPlayerId = null;
    }

    playerMenuClose.addEventListener('click', hidePlayerMenu);
    playerMenu.addEventListener('click', (e) => {
      if (e.target === playerMenu) hidePlayerMenu();
    });

    btnViewProfile.addEventListener('click', () => {
      if (_selectedPlayerId) {
        const username = _playerUsernames.get(_selectedPlayerId);
        window.open(`/bloxverse/profile.html?user=${encodeURIComponent(_selectedPlayerId)}`, '_blank');
        hidePlayerMenu();
      }
    });

    btnFriendRequest.addEventListener('click', async () => {
      if (!_selectedPlayerId || !auth.currentUser) return;
      const targetName = _playerUsernames.get(_selectedPlayerId) || 'Player';
      if (currentUserFriends.has(_selectedPlayerId)) {
        try {
          await removeFriend(auth.currentUser.uid, _selectedPlayerId);
          currentUserFriends.delete(_selectedPlayerId);
          appendChatMessage({ system: true, message: `You are no longer friends with ${targetName}.` });
        } catch (e) {
          console.error('Error removing friend', e);
          appendChatMessage({ system: true, message: `Unable to remove ${targetName} as friend.` });
        }
      } else {
        await sendFriendRequest(auth.currentUser.uid, _selectedPlayerId, targetName);
      }
      updateFriendRequestButton(_selectedPlayerId);
      hidePlayerMenu();
    });

    btnFollow.addEventListener('click', () => {
      if (_selectedPlayerId && auth.currentUser) {
        toggleFollowUser(auth.currentUser.uid, _selectedPlayerId);
        hidePlayerMenu();
      }
    });

    const uiClickContainers = [chatContainer, playerMenu, document.querySelector('.top-bar'), document.querySelector('.leaderboard'), settingsModal];
    uiClickContainers.forEach((container) => {
      if (!container) return;
      container.addEventListener('pointerdown', () => exitPointerLockIfNeeded());
      container.addEventListener('click', () => exitPointerLockIfNeeded());
    });

    document.addEventListener('mousedown', (e) => {
      if (!document.pointerLockElement) return;
      if (e.target.closest('.chat-container, .modal-overlay, .leaderboard, .player-menu, .top-bar')) {
        document.exitPointerLock();
      }
    });

    async function checkFollowingStatus(userId) {
      if (!auth.currentUser) return;
      try {
        const following = await getFollowing(auth.currentUser.uid);
        const isFollowing = following.includes(userId);
        btnFollow.classList.toggle('following', isFollowing);
        btnFollow.textContent = isFollowing ? 'Unfollow' : 'Follow';
      } catch (e) {
        console.error('Error checking following status', e);
      }
    }

    async function toggleFollowUser(currentUserId, targetUserId) {
      try {
        const following = await getFollowing(currentUserId);
        const isFollowing = following.includes(targetUserId);
        
        if (isFollowing) {
          await unfollowUser(currentUserId, targetUserId);
        } else {
          await followUser(currentUserId, targetUserId);
        }
        
        checkFollowingStatus(targetUserId);
      } catch (e) {
        console.error('Error toggling follow', e);
      }
    }

    async function loadCurrentUserFriends(userId) {
      try {
        const profile = await getUserProfile(userId);
        currentUserFriends = new Set(profile?.friends || []);
      } catch (e) {
        console.error('Error loading friends', e);
        currentUserFriends = new Set();
      }
    }

    const btnTrust = document.getElementById('btnTrust');

    async function checkTrustedStatus(userId) {
      if (!auth.currentUser) return;
      const isFriend = currentUserFriends.has(userId);
      const isAlreadyTrusted = currentUserTrustedFriends.has(userId);
      if (currentUserAge >= 13 && isFriend) {
        btnTrust.style.display = 'block';
        btnTrust.classList.toggle('trusted', isAlreadyTrusted);
        btnTrust.textContent = isAlreadyTrusted ? 'Trusted ✓' : 'Trust';
      } else {
        btnTrust.style.display = 'none';
      }
    }

    btnTrust.addEventListener('click', async () => {
      if (!_selectedPlayerId || !auth.currentUser) return;
      const isAlreadyTrusted = currentUserTrustedFriends.has(_selectedPlayerId);
      try {
        if (isAlreadyTrusted) {
          await removeTrustedFriend(auth.currentUser.uid, _selectedPlayerId);
          currentUserTrustedFriends.delete(_selectedPlayerId);
          appendChatMessage({ system: true, message: `Removed trusted status.` });
        } else {
          await addTrustedFriend(auth.currentUser.uid, _selectedPlayerId);
          currentUserTrustedFriends.add(_selectedPlayerId);
          appendChatMessage({ system: true, message: `Player added to trusted friends. Chats are now unfiltered.` });
        }
        checkTrustedStatus(_selectedPlayerId);
        hidePlayerMenu();
      } catch (e) {
        console.error('Error toggling trusted friend', e);
        appendChatMessage({ system: true, message: `Unable to update trusted status.` });
      }
    });

    function updateFriendRequestButton(userId) {
      if (!auth.currentUser) return;
      const isFriend = currentUserFriends.has(userId);
      btnFriendRequest.textContent = isFriend ? 'Unfriend' : 'Friend Request';
      btnFriendRequest.classList.toggle('unfriend', isFriend);
    }

    async function sendFriendRequest(fromUserId, toUserId, toUsername) {
      try {
        await dbSendFriendRequest(fromUserId, toUserId, toUsername);
        appendChatMessage({ system: true, message: `Friend request sent to ${toUsername}.` });
      } catch (e) {
        console.error('Error sending friend request', e);
        appendChatMessage({ system: true, message: `Unable to send friend request to ${toUsername}.` });
      }
    }

    function removeFriendRequestToast(requestId) {
      const toast = activeFriendRequestToasts.get(requestId);
      if (!toast) return;
      toast.remove();
      activeFriendRequestToasts.delete(requestId);
    }

    async function createFriendRequestToast(request) {
      const senderName = _playerUsernames.get(request.from) || (await getUserProfile(request.from))?.username || 'Unknown';
      const toast = document.createElement('div');
      toast.className = 'friend-request-toast slide-in';
      toast.innerHTML = `
        <div class="toast-header">
          <div class="toast-title">Friend Request</div>
          <div class="toast-from">${senderName}</div>
        </div>
        <div class="toast-actions">
          <button class="toast-accept">Accept</button>
          <button class="toast-decline">Decline</button>
        </div>
      `;

      toast.querySelector('.toast-accept').addEventListener('click', async () => {
        try {
          await dbAcceptFriendRequest(request.id, request.from, request.to);
        } catch (e) {
          console.error('Error accepting friend request', e);
        } finally {
          removeFriendRequestToast(request.id);
        }
      });

      toast.querySelector('.toast-decline').addEventListener('click', async () => {
        try {
          await dbDeclineFriendRequest(request.id);
        } catch (e) {
          console.error('Error declining friend request', e);
        } finally {
          removeFriendRequestToast(request.id);
        }
      });

      friendRequestToastContainer.appendChild(toast);
      activeFriendRequestToasts.set(request.id, toast);
    }

    function renderFriendRequestToasts(requests) {
      const currentIds = new Set(requests.map(r => r.id));
      for (const id of Array.from(activeFriendRequestToasts.keys())) {
        if (!currentIds.has(id)) removeFriendRequestToast(id);
      }
      for (const request of requests) {
        if (!activeFriendRequestToasts.has(request.id)) {
          createFriendRequestToast(request);
        }
      }
    }

    function startFriendRequestListener(userId) {
      if (!userId) return;
      return onFriendRequests(userId, renderFriendRequestToasts);
    }

    // Settings UI
    const btnSettings = document.getElementById('btnSettings');
    const btnCloseSettings = document.getElementById('btnCloseSettings');
    const sensSlider = document.getElementById('sensSlider');
    const sensValue = document.getElementById('sensValue');
    const shiftlockToggle = document.getElementById('shiftlockToggle');

    // Load saved settings
    try {
      const saved = JSON.parse(localStorage.getItem('bloxverse_settings') || '{}');
      if (saved.sensitivity != null) {
        sensSlider.value = saved.sensitivity;
        sensValue.textContent = Number(saved.sensitivity).toFixed(1);
        if (window._bloxverse) window._bloxverse.setSens(Number(saved.sensitivity));
      }
      if (saved.shiftLock != null) {
        shiftlockToggle.checked = saved.shiftLock;
      }
      if (saved.chatFilter != null) {
        const profToggle = document.getElementById('profanityToggle');
        if (profToggle) profToggle.checked = saved.chatFilter;
      }
    } catch (_) {}

    function saveSetting(key, val) {
      try {
        const data = JSON.parse(localStorage.getItem('bloxverse_settings') || '{}');
        data[key] = val;
        localStorage.setItem('bloxverse_settings', JSON.stringify(data));
      } catch (_) {}
    }

    const profanityToggle = document.getElementById('profanityToggle');
    profanityToggle?.addEventListener('change', () => {
      saveSetting('chatFilter', profanityToggle.checked);
    });

    btnSettings.addEventListener('click', () => {
      settingsModal.style.display = 'flex';
      if (document.pointerLockElement) document.exitPointerLock();
    });

    btnCloseSettings.addEventListener('click', () => {
      settingsModal.style.display = 'none';
      if (window._bloxverse) window._bloxverse.requestLock();
    });

    sensSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      sensValue.textContent = val.toFixed(1);
      if (window._bloxverse) window._bloxverse.setSens(val);
      saveSetting('sensitivity', val);
    });

    shiftlockToggle.addEventListener('change', () => {
      const enabled = shiftlockToggle.checked;
      saveSetting('shiftLock', enabled);
      if (window._bloxverse) {
        window._bloxverse.shiftLockEnabled = enabled;
        // If turning off while shiftlock is active, deactivate it
        if (!enabled) window._bloxverse._disableShiftLock?.();
      }
    });

    // Load map
    let scriptExports = [];
    let gameStarted = false;
    let gameProperties = {};
    let gameEventListeners = {};
    const _knownPlayerIds = new Set();
    const _playerPositions = new Map(); // userId -> { x, y, z }

    function startGame() {
        setLoad(15, 'Initializing engine...');
        const poll = setInterval(async () => {
          if (window._bloxverse) {
            clearInterval(poll);
              setLoad(30, 'Loading map...');
            if (game.mapPath) {
              const spawn = game.spawn || {};
              await window._bloxverse.loadMap(game.mapPath, spawn.x ?? 0, 0, spawn.z ?? 0);
              window._bloxverse.setSens(parseFloat(sensSlider.value));
              window._bloxverse.shiftLockEnabled = shiftlockToggle.checked;
            }
            // Increment visit counter
            incrementGameVisits(gameId).catch(err => console.error('Visit increment failed:', err));
            setLoad(60, 'Loading scripts...');

            const api = {
              game: makeGameAPI(),
              onOutput: (msg, type) => {
                const prefix = type === 'error' ? '⚠️' : type === 'warn' ? '⚡' : '📜';
                chatContainer.classList.add('visible');
                appendChatMessage({ system: true, message: `${prefix} ${msg}` });
              }
            };

            // Load and execute user scripts from localStorage
            const userScripts = loadScriptsFromStorage();
            for (const [name, script] of Object.entries(userScripts)) {
              try {
                const exports = executeScript(script.code, api);
                if (exports && Object.keys(exports).length > 0) {
                  scriptExports.push(exports);
                  console.log(`[Scripts] Loaded "${name}"`);
                }
              } catch (err) {
                console.error(`[Scripts] Error in "${name}":`, err);
              }
            }

            // Execute map scripts embedded in the map JSON
            if (window._mapScripts && window._mapScripts.length > 0) {
              for (const mapScript of window._mapScripts) {
                const code = mapScript.code || mapScript;
                try {
                  const exports = executeScript(code, api);
                  if (exports && Object.keys(exports).length > 0) {
                    scriptExports.push(exports);
                    console.log(`[Scripts] Loaded map script`);
                  }
                } catch (err) {
                  console.error(`[Scripts] Error in map script:`, err);
                }
              }
            }

            // Load and execute game scripts from scriptsPath directory
            if (game.scriptsPath) {
              const basePath = game.scriptsPath.replace(/^\./, '');
              const gameScriptKeys = Object.keys(gameScriptModules);
              let scriptIdx = 0;
              for (const [filePath, code] of Object.entries(gameScriptModules)) {
                // Normalize away any Vite base prefix (e.g. /bloxverse/) so the
                // path always starts with /assets/ — matching basePath in both
                // dev mode and production builds.
                const normalizedPath = filePath.replace(/^.*?(\/assets\/)/, '$1');
                if (normalizedPath.startsWith(basePath)) {
                  const scriptName = filePath.split('/').pop();
                  try {
                    const exports = executeScript(code, api);
                    // Always register the script; it may be a fire-and-forget
                    // script with a while-true loop that exports nothing.
                    scriptExports.push(exports || {});
                    console.log(`[Scripts] Loaded game script "${scriptName}"`);
                  } catch (err) {
                    console.error(`[Scripts] Error in game script "${scriptName}":`, err);
                  }
                }
                scriptIdx++;
                const scriptPct = 85 + (scriptIdx / gameScriptKeys.length) * 10;
                setLoad(scriptPct);
              }
            }

            // Load published game scripts from Firestore
            if (window._publishedScripts) {
              for (const [scriptName, code] of Object.entries(window._publishedScripts)) {
                try {
                  const exports = executeScript(code, api);
                  scriptExports.push(exports || {});
                  console.log(`[Scripts] Loaded published script "${scriptName}"`);
                } catch (err) {
                  console.error(`[Scripts] Error in published script "${scriptName}":`, err);
                }
              }
            }

            setLoad(100, 'Ready!');
            setTimeout(() => {
              loadingScreen.style.display = 'none';
            }, 400);
          }
        }, 50);
      }

    if (game) {
      if (document.readyState === 'complete') {
        startGame();
      } else {
        window.addEventListener('load', startGame);
      }
    }

    function createPartProxy(mesh) {
      if (!mesh || !mesh.isMesh) return mesh || null;
      const bv = window._bloxverse;
      const getEntry = () => bv._getPartEntry(mesh);
      const hs = mesh.userData.halfSize || { sw: 4, sh: 4, sd: 4 };
      const obj = {
        _mesh: mesh,
        get name() { return mesh.name; },
        set name(v) { mesh.name = v; if (mesh.userData) mesh.userData.partName = v; },
        get x() { return mesh.position.x; },
        set x(v) { bv._setPartPos(mesh, v, mesh.position.y, mesh.position.z); },
        get y() { return mesh.position.y; },
        set y(v) { bv._setPartPos(mesh, mesh.position.x, v, mesh.position.z); },
        get z() { return mesh.position.z; },
        set z(v) { bv._setPartPos(mesh, mesh.position.x, mesh.position.y, v); },
        get width() { return hs.sw; },
        get height() { return hs.sh; },
        get depth() { return hs.sd; },
        get color() { const c = Array.isArray(mesh.material) ? mesh.material[0].color : mesh.material.color; return '#' + c.getHexString(); },
        set color(v) { const hex = parseInt(String(v).replace('#', ''), 16); bv._setPartColor(mesh, hex); },
        get transparency() { const m = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material; return m.transparent ? 1 - m.opacity : 0; },
        set transparency(v) { bv._setPartTransparency(mesh, Number(v)); },
        get anchored() { return bv._getPartAnchored(mesh); },
        set anchored(v) { bv._setPartAnchored(mesh, !!v); },
        get mass() { return bv._getPartMass(mesh); },
        set mass(v) { bv._setPartMass(mesh, v); },
        get canCollide() { return true; },
        set canCollide(v) {},
        SetVelocity(vx, vy, vz) { bv._setPartVelocity(mesh, vx, vy, vz); },
        GetVelocity() { return bv._getPartVelocity(mesh); },
        SetPosition(x, y, z) { bv._setPartPos(mesh, x, y, z); },
        GetPosition() { return { x: mesh.position.x, y: mesh.position.y, z: mesh.position.z }; },
      };
      return obj;
    }

    // ─── GUI Scripting ──────────────────────────────────────────────────────
    const _guiElements = [];

    function _cleanupGui() {
      for (const el of _guiElements) { try { el.remove(); } catch (_) {} }
      _guiElements.length = 0;
    }

    function createGuiProxy(el) {
      const listeners = {};
      let _px = 0, _py = 0;
      function _updatePos() {
        const bothScale = _px >= 0 && _px <= 1 && _py >= 0 && _py <= 1;
        el.style.left = (_px >= 0 && _px <= 1 ? _px * 100 : _px) + (_px >= 0 && _px <= 1 ? '%' : 'px');
        el.style.top = (_py >= 0 && _py <= 1 ? _py * 100 : _py) + (_py >= 0 && _py <= 1 ? '%' : 'px');
        el.style.transform = bothScale ? 'translate(-50%,-50%)' : '';
      }
      const proxy = {
        _el: el,
        get Text() { return el.textContent; },
        set Text(v) { el.textContent = v; },
        get Visible() { return el.style.display !== 'none'; },
        set Visible(v) { el.style.display = v ? '' : 'none'; },
        get PositionX() { return _px; },
        set PositionX(v) { _px = Number(v); _updatePos(); },
        get PositionY() { return _py; },
        set PositionY(v) { _py = Number(v); _updatePos(); },
        get SizeX() { return parseFloat(el.style.width) || 0; },
        set SizeX(v) { el.style.width = (v >= 0 && v <= 1 ? v * 100 + '%' : v + 'px'); },
        get SizeY() { return parseFloat(el.style.height) || 0; },
        set SizeY(v) { el.style.height = (v >= 0 && v <= 1 ? v * 100 + '%' : v + 'px'); },
        get TextColor() { return el.style.color; },
        set TextColor(v) { el.style.color = v; },
        get BackgroundColor() { return el.style.backgroundColor; },
        set BackgroundColor(v) { el.style.backgroundColor = v; },
        get BackgroundTransparency() { return el.style.opacity === '' ? 0 : 1 - parseFloat(el.style.opacity); },
        set BackgroundTransparency(v) {
          const o = Math.max(0, Math.min(1, 1 - Number(v)));
          el.style.opacity = o < 1 ? String(o) : '';
        },
        get FontSize() { return parseFloat(el.style.fontSize) || 0; },
        set FontSize(v) { el.style.fontSize = v + 'px'; },
        get ZIndex() { return parseInt(el.style.zIndex) || 0; },
        set ZIndex(v) { el.style.zIndex = v; },
        Connect(event, callback) {
          const handler = (e) => callback(e);
          el.addEventListener(event, handler);
          if (!listeners[event]) listeners[event] = [];
          listeners[event].push(handler);
          return proxy;
        },
        Destroy() {
          el.remove();
          const idx = _guiElements.indexOf(el);
          if (idx >= 0) _guiElements.splice(idx, 1);
          for (const evt of Object.keys(listeners)) {
            for (const h of listeners[evt]) el.removeEventListener(evt, h);
          }
        },
      };
      return proxy;
    }

    const getCurrentPlayers = () => {
      const players = [];
      document.querySelectorAll('.leaderboard-item').forEach(el => {
        const id = el.dataset.userId;
        const name = el.querySelector('.lb-name')?.textContent;
        if (id && name) {
          players.push(makePlayerObj(id, name));
        }
      });
      return players;
    };

    const makePlayerObj = (id, name) => {
      const pos = _playerPositions.get(id) || { x: 0, y: 0, z: 0 };
      return {
      id, name,
      x: pos.x, y: pos.y, z: pos.z,
      health: 100,
      maxHealth: 100,
      _props: {},
      GetProperty: function(k) { return this._props[k]; },
      SetProperty: function(k, v) { this._props[k] = v; },
      Message: function(msg) {
        appendChatMessage({ system: true, message: `[${this.name}] ${msg}` });
      },
      Teleport: function(x, y, z) {
        if (auth.currentUser?.uid === this.id && window._bloxverse) {
          window._bloxverse.setSpawn(x, y, z, 0);
        }
      },
      Damage: function(amt) { this.health = Math.max(0, this.health - amt); },
      Heal: function(amt) { this.health = Math.min(this.maxHealth, this.health + amt); },
      Respawn: function() { this.health = this.maxHealth; }
    };
    }

    function makeGameAPI() {
      return {
        GetPlayers: () => getCurrentPlayers(),
        FindPlayer: (id) => getCurrentPlayers().find(p => p.id === id) || null,
        GetGameTime: () => {
          if (window._bloxverse && window._bloxverse.getGameTime) {
            return window._bloxverse.getGameTime();
          }
          return 0;
        },
        GetProperty: (k) => gameProperties[k],
        SetProperty: (k, v) => { gameProperties[k] = v; },
        Broadcast: (msg) => appendChatMessage({ system: true, message: msg }),
        Fire: (event, ...args) => {
          (gameEventListeners[event] || []).forEach(cb => cb(...args));
        },
        On: (event, cb) => {
          if (!gameEventListeners[event]) gameEventListeners[event] = [];
          gameEventListeners[event].push(cb);
        },
        GetPart: (name) => {
          const parts = window._mapParts || [];
          const found = parts.find(p => p.name === name);
          return found ? createPartProxy(found.mesh) : null;
        },
        GetAllParts: () => (window._mapParts || []).map(p => createPartProxy(p.mesh)),
        CreatePart: (name, x, y, z, w, h, d, color, transparency, anchored, mass) => {
          if (window._bloxverse && window._bloxverse.addStud) {
            const anchoredVal = anchored !== false;
            const massVal = mass === 'auto' || mass == null ? undefined : Number(mass);
            const mesh = window._bloxverse.addStud(w, h, d, color || 0x808080, x ?? 0, y ?? 0, z ?? 0, 0, 0, 0, anchoredVal, 'Block', massVal);
            if (mesh) {
              mesh.name = name;
              mesh.userData.partName = name;
              if (transparency != null) {
                window._bloxverse._setPartTransparency(mesh, Number(transparency));
              }
              const entry = window._mapParts.find(p => p.name === name);
              if (entry) entry.mesh = mesh;
              else window._mapParts.push({ name, mesh });
            }
            const proxy = createPartProxy(mesh || null);
            return proxy || { name, x: x ?? 0, y: y ?? 0, z: z ?? 0, width: w, height: h, depth: d };
          }
          return { name, x: x ?? 0, y: y ?? 0, z: z ?? 0, width: w, height: h, depth: d };
        },
        RemovePart: (name) => {
          if (window._bloxverse && window._bloxverse.removePart) {
            window._bloxverse.removePart(name);
          }
        },
        IsKeyDown: (code) => {
          return !!(window._bloxverse && window._bloxverse.keys && window._bloxverse.keys[code]);
        },
        SetWalkSpeed: (speed) => {
          if (window._bloxverse && window._bloxverse.setWalkSpeed) {
            window._bloxverse.setWalkSpeed(Number(speed));
          }
        },
        GetWalkSpeed: () => {
          if (window._bloxverse && window._bloxverse.getWalkSpeed) {
            return window._bloxverse.getWalkSpeed();
          }
          return 16;
        },
        CreateScreenGui: (name) => {
          const container = document.getElementById('scriptGuiContainer');
          if (!container) return null;
          const el = document.createElement('div');
          el.id = name || 'ScreenGui_' + Date.now();
          el.style.position = 'absolute';
          el.style.inset = '0';
          el.style.pointerEvents = 'none';
          container.appendChild(el);
          _guiElements.push(el);
          const proxy = createGuiProxy(el);
          proxy.CreateGui = (type, props) => {
            const child = document.createElement(type === 'TextButton' ? 'button' : type === 'TextLabel' ? 'div' : 'div');
            child.style.position = 'absolute';
            child.style.pointerEvents = 'auto';
            child.style.display = 'flex';
            child.style.alignItems = 'center';
            child.style.justifyContent = 'center';
            child.style.fontFamily = 'sans-serif';
            child.style.cursor = type === 'TextButton' ? 'pointer' : 'default';
            if (type === 'TextButton') {
              child.style.border = 'none';
              child.style.outline = 'none';
            }
            el.appendChild(child);
            _guiElements.push(child);
            const childProxy = createGuiProxy(child);
            if (props) {
              for (const [k, v] of Object.entries(props)) {
                childProxy[k] = v;
              }
            }
            return childProxy;
          };
          return proxy;
        },
        CleanupGui: () => _cleanupGui(),
      };
    }

    // Call script lifecycle hooks in the game loop
    window._scriptUpdate = (dt) => {
      if (!gameStarted) {
        gameStarted = true;
        for (const ex of scriptExports) {
          try { ex.onGameStart?.(); } catch (e) { console.error('[Script] onGameStart error:', e); }
        }
      }
      for (const ex of scriptExports) {
        try { ex.onUpdate?.(dt); } catch (e) { console.error('[Script] onUpdate error:', e); }
      }
    };

    // Connect Multiplayer
    auth.onAuthStateChanged(async (user) => {
      if (user && gameId) {
        const presence = trackPresence(user.uid, gameId);

        const username = user.displayName || 'Player';

        // Set current user ID for bubble positioning
        if (window._bloxverse) {
          window._bloxverse.setCurrentUserId(user.uid);
        }

        await loadCurrentUserFriends(user.uid);
        try {
          const profile = await getUserProfile(user.uid);
          if (profile) {
            if (typeof profile.profanityFilter === 'boolean') {
              _profanityFilterEnabled = profile.profanityFilter;
            }
            currentUserAge = calculateAge(profile.birthday);
            currentUserTrustedFriends = new Set(profile.trustedFriends || []);

            // Show profanity filter setting only for 13+ users
            const profRow = document.getElementById('profanitySettingRow');
            if (profRow && currentUserAge >= 13) {
              profRow.style.display = 'flex';
            }
          }
        } catch (e) {
          console.error('Error loading user settings', e);
        }

        friendRequestUnsubscribe?.();
        friendRequestUnsubscribe = startFriendRequestListener(user.uid);

        connectMultiplayer(gameId, user.uid, username, 
          (id, x, y, z, ry, moving, grounded, climbState) => {
            if (window._bloxverse) {
              const playerUsername = _playerUsernames.get(id);
              window._bloxverse.updateOtherPlayer(id, x, y, z, ry, moving, grounded, climbState, playerUsername);
            }
            _playerPositions.set(id, { x, y, z });
          }, 
          (id) => {
            if (window._bloxverse) window._bloxverse.removeOtherPlayer(id);
            _knownPlayerIds.delete(id);
            const playerObj = getCurrentPlayers().find(p => p.id === id) || makePlayerObj(id, _playerUsernames.get(id) || 'Player');
            for (const ex of scriptExports) {
              try { ex.onPlayerLeave?.(playerObj); } catch (e) { console.error('[Script] onPlayerLeave error:', e); }
            }
          },
          (players) => {
            renderLeaderboard(players);
            for (const p of players) {
              if (!_knownPlayerIds.has(p.userId)) {
                _knownPlayerIds.add(p.userId);
                const playerObj = makePlayerObj(p.userId, p.username);
                for (const ex of scriptExports) {
                  try { ex.onPlayerJoin?.(playerObj); } catch (e) { console.error('[Script] onPlayerJoin error:', e); }
                }
              }
            }
          },
          (chatData) => {
            // Per-recipient filtering: each client decides what to show
            if (chatData.unfiltered) {
              const isOwnMessage = chatData.userId === auth.currentUser?.uid;
              const receiverTrustsSender = currentUserAge >= 13 && currentUserTrustedFriends.has(chatData.userId);
              const profToggle = document.getElementById('profanityToggle');
              const filterAnyway = profToggle ? profToggle.checked : true;

              if (isOwnMessage || (receiverTrustsSender && !filterAnyway)) {
                appendChatMessage(chatData);
              } else {
                appendChatMessage({ ...chatData, message: filterProfanity(chatData.message) });
              }
            } else {
              appendChatMessage(chatData);
            }
          },
          (userId, bodies) => {
            if (window._bloxverse) window._bloxverse.applyPhysicsState(userId, bodies);
          }
        );

        window._mpUpdate = (dt) => {
            window._mpTimer = (window._mpTimer || 0) + dt;
            if (window._mpTimer >= 0.1 && window._bloxverse) {
                window._mpTimer = 0;
                const loc = window._bloxverse.getLocalTransform();
                if (loc) sendLocalTransform(loc.x, loc.y, loc.z, loc.ry, loc.moving, loc.grounded, loc.climbState);
                const phys = window._bloxverse.getPhysicsState();
                if (phys && phys.length > 0) sendPhysicsState(phys);
            }
        };

        window.addEventListener('beforeunload', () => {
          presence.goOffline();
          disconnectMultiplayer();
        });
      } else if (friendRequestUnsubscribe) {
        friendRequestUnsubscribe();
        friendRequestUnsubscribe = null;
      }
    });
  </script>
</body>
