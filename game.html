<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/bloxverse/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Play</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script type="module" crossorigin src="/bloxverse/assets/game-BKipZEUT.js"></script>
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/three.module-V6uBajPx.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/scriptRuntime-xBo1wuhU.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/modulepreload-polyfill-N-DOuI4P.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/player-CbBnpI80.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/firebase-XHjplP5n.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/friends-Bo4P1ful.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/games-Ba71Bj4Y.js">
  <link rel="stylesheet" crossorigin href="/bloxverse/assets/game-CLMm45vg.css">
</head>

<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen" style="display:flex;">
    <div class="loading-content">
      <div class="logo-large"></div>
      <h2 id="loadingTitle">Loading experience...</h2>
      <div class="loading-bar">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
      </div>
    </div>
  </div>

  <!-- Top Left Tools -->
  <div class="top-bar">
    <button class="top-btn" id="btnSettings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button class="top-btn" id="btnChat" title="Chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
  </div>

  <!-- Chat Window -->
  <div id="chatContainer" class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Click or press / to chat" autocomplete="off" />
      <button id="btnSendChat">Send</button>
    </div>
  </div>

  <!-- Script GUI Layer -->
  <div id="scriptGuiContainer" style="position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden;"></div>

  <!-- Leaderboard -->
  <div class="leaderboard visible" id="leaderboard">
    <div class="leaderboard-header">
      <span>PLAYERS</span>
    </div>
    <div class="leaderboard-list" id="lbList">
      <div style="padding:8px 12px;color:#babbbe;font-size:12px;">Connecting...</div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button id="btnCloseSettings" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label>Camera Sensitivity</label>
          <div class="setting-control">
            <input type="range" id="sensSlider" min="0.1" max="3" step="0.1" value="1" />
            <span id="sensValue">1.0</span>
          </div>
        </div>
        <div class="setting-row">
          <label>Shift Lock</label>
          <div class="setting-control">
            <label class="toggle-switch">
              <input type="checkbox" id="shiftlockToggle" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
        <div class="setting-row" id="profanitySettingRow" style="display: none;">
          <label>Chat Filter</label>
          <div class="setting-control">
            <label class="toggle-switch">
              <input type="checkbox" id="profanityToggle" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Player Profile Menu -->
  <div id="playerMenu" class="player-menu" style="display: none;">
    <div class="player-menu-content">
      <button class="player-menu-close">×</button>
      <div class="player-menu-username" id="playerMenuUsername"></div>
      <button class="player-menu-btn" id="btnViewProfile">View Profile</button>
      <button class="player-menu-btn" id="btnFriendRequest">Friend Request</button>
      <button class="player-menu-btn" id="btnFollow">Follow</button>
      <button class="player-menu-btn" id="btnTrust" style="display:none;">Trust</button>
    </div>
  </div>

  <div id="friendRequestToastContainer" class="friend-request-toast-container"></div>

</body>

</html>
