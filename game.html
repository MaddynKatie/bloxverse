<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/bloxverse/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Play</title>
  <script type="module" crossorigin src="/bloxverse/assets/game-BrLKsNEM.js"></script>
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/modulepreload-polyfill-CXK8biUa.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/firebase-BGgYK--4.js">
  <link rel="modulepreload" crossorigin href="/bloxverse/assets/games-BMmdm68D.js">
  <link rel="stylesheet" crossorigin href="/bloxverse/assets/game-BLCgOqlc.css">
</head>

<body>
  <!-- Top Left Tools -->
  <div class="top-bar">
    <button class="top-btn" id="btnSettings" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button class="top-btn" id="btnChat" title="Chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
  </div>

  <!-- Chat Window -->
  <div id="chatContainer" class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Click or press / to chat" autocomplete="off" />
      <button id="btnSendChat">Send</button>
    </div>
  </div>

  <!-- Leaderboard -->
  <div class="leaderboard visible" id="leaderboard">
    <div class="leaderboard-header">
      <span>PLAYERS</span>
    </div>
    <div class="leaderboard-list" id="lbList">
      <div style="padding:8px 12px;color:#babbbe;font-size:12px;">Connecting...</div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button id="btnCloseSettings" class="modal-close">×</button>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label>Camera Sensitivity</label>
          <div class="setting-control">
            <input type="range" id="sensSlider" min="0.1" max="3" step="0.1" value="1" />
            <span id="sensValue">1.0</span>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
