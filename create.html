<!DOCTYPE html>
<html lang="en">
<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png">
    <title>BloxVerse Script Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Cascadia Code', 'Courier New', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-nav);
            backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(0, 176, 111, 0.3);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background: rgba(0, 176, 111, 0.74);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        button:hover {
            background: rgba(0, 176, 111, 0.9);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .save-btn {
            background: rgba(76, 175, 80, 0.74);
        }

        .save-btn:hover {
            background: rgba(76, 175, 80, 0.9);
        }

        .save-btn.dirty {
            background: rgba(255, 193, 7, 0.74);
        }

        .save-btn.dirty:hover {
            background: rgba(255, 193, 7, 0.9);
        }

        .docs-link {
            color: rgba(0, 176, 111, 0.8);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid rgba(0, 176, 111, 0.3);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .docs-link:hover {
            color: rgba(0, 176, 111, 1);
            border-color: rgba(0, 176, 111, 0.6);
        }

        .editor-container {
            display: flex;
            flex: 1;
            gap: 0;
            overflow: hidden;
        }

        .sidebar {
            background: var(--bg-surface);
            border-right: 1px solid rgba(0, 176, 111, 0.2);
            width: 240px;
            padding: 16px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
            margin-top: 12px;
        }

        .sidebar h3:first-child {
            margin-top: 0;
        }

        .script-item {
            background: rgba(0, 176, 111, 0.15);
            border: 1px solid rgba(0, 176, 111, 0.3);
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .script-item:hover {
            background: rgba(0, 176, 111, 0.25);
            border-color: rgba(0, 176, 111, 0.5);
        }

        .script-item.active {
            background: rgba(0, 176, 111, 0.4);
            border-color: rgba(0, 176, 111, 0.7);
        }

        .script-item .script-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 2px 4px;
            border-radius: 2px;
        }

        .script-item .rename-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 176, 111, 0.6);
            color: #e0e0e0;
            padding: 4px 6px;
            border-radius: 2px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }

        .script-delete {
            background: none;
            border: none;
            color: rgba(200, 40, 40, 0.7);
            cursor: pointer;
            padding: 0;
            font-size: 16px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
        }

        .script-delete:hover {
            color: rgba(200, 40, 40, 1);
            background: rgba(200, 40, 40, 0.15);
            transform: none;
        }

        .editor-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-tabs {
            background: var(--bg-surface);
            border-bottom: 1px solid rgba(0, 176, 111, 0.2);
            display: flex;
            overflow-x: auto;
            padding: 8px 12px;
            gap: 4px;
        }

        .editor-tab {
            background: rgba(0, 176, 111, 0.15);
            border: 1px solid rgba(0, 176, 111, 0.3);
            border-bottom: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            font-size: 13px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .editor-tab:hover {
            background: rgba(0, 176, 111, 0.25);
        }

        .editor-tab.active {
            background: rgba(0, 176, 111, 0.4);
            border-color: rgba(0, 176, 111, 0.6);
        }

        .code-editor {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .line-numbers {
            background: rgba(0, 0, 0, 0.2);
            color: rgba(200, 200, 200, 0.5);
            padding: 12px 8px;
            text-align: right;
            font-size: 13px;
            line-height: 1.5;
            border-right: 1px solid rgba(0, 176, 111, 0.2);
            user-select: none;
            overflow: hidden;
            white-space: pre;
            flex-shrink: 0;
            max-width: 60px;
            min-width: 40px;
        }

        .editor-area {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        #codeEditor {
            font-family: 'Cascadia Code', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            padding: 12px 16px;
            white-space: pre;
            tab-size: 4;
            outline: none;
            min-height: 100%;
            color: #abb2bf;
            word-wrap: normal;
            letter-spacing: 0;
            word-spacing: 0;
            text-rendering: optimizeSpeed;
        }

        .bottom-panel {
            background: var(--bg-surface);
            border-top: 1px solid rgba(0, 176, 111, 0.2);
            padding: 12px 16px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            font-size: 12px;
        }

        .bottom-panel.active {
            display: block;
        }

        .output-line {
            padding: 2px 0;
            white-space: pre-wrap;
            word-break: break-all;
            font-size: 12px;
        }

        .output-error {
            color: rgba(244, 67, 54, 0.9);
        }

        .output-warn {
            color: rgba(255, 193, 7, 0.9);
        }

        .output-info {
            color: rgba(76, 175, 80, 0.9);
        }

        .new-script-input {
            background: rgba(0, 176, 111, 0.15);
            border: 1px solid rgba(0, 176, 111, 0.4);
            color: #e0e0e0;
            padding: 8px 10px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            width: 100%;
            margin-bottom: 8px;
        }

        .new-script-input:focus {
            outline: none;
            border-color: rgba(0, 176, 111, 0.8);
            background: rgba(0, 176, 111, 0.25);
        }

        .new-script-input::placeholder {
            color: rgba(200, 200, 200, 0.5);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .button-group button {
            flex: 1;
            padding: 6px 12px;
            font-size: 12px;
        }

        .error-mark {
            position: absolute;
            left: 0;
            width: 100%;
            height: 1.5em;
            background: rgba(244, 67, 54, 0.15);
            border-left: 3px solid rgba(244, 67, 54, 0.8);
            pointer-events: none;
            z-index: 3;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mode-tabs {
            display: flex;
            gap: 2px;
            background: var(--bg-surface);
            border-radius: 6px;
            padding: 2px;
        }

        .mode-tab {
            background: transparent;
            color: rgba(200, 200, 200, 0.6);
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .mode-tab:hover {
            color: rgba(200, 200, 200, 0.9);
            background: rgba(0, 176, 111, 0.15);
        }

        .mode-tab.active {
            background: rgba(0, 176, 111, 0.35);
            color: #fff;
        }

        .studio-viewport {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .studio-3d-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #1a1a2e;
        }

        .studio-3d-container canvas {
            display: block;
        }

        .studio-props-panel {
            width: 260px;
            background: var(--bg-surface);
            border-left: 1px solid rgba(0, 176, 111, 0.2);
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .studio-props-panel h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: rgba(0, 176, 111, 0.8);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .prop-row {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }

        .prop-label {
            font-size: 12px;
            color: rgba(200, 200, 200, 0.7);
            width: 80px;
            flex-shrink: 0;
        }

        .prop-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 176, 111, 0.2);
            color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .prop-input:focus {
            border-color: rgba(0, 176, 111, 0.6);
        }

        .prop-input[type="color"] {
            padding: 2px;
            height: 28px;
            cursor: pointer;
        }

        .prop-input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: rgba(0, 176, 111, 0.8);
        }

        .prop-delete-btn {
            width: 100%;
            margin-top: 12px;
            background: rgba(200, 40, 40, 0.6);
            font-size: 12px;
            padding: 6px 12px;
        }

        .prop-delete-btn:hover {
            background: rgba(200, 40, 40, 0.8);
        }

        .studio-explorer-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .studio-explorer-item {
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            color: rgba(200, 200, 200, 0.8);
            transition: all 0.15s;
            border: 1px solid transparent;
        }

        .studio-explorer-item:hover {
            background: rgba(0, 176, 111, 0.15);
            border-color: rgba(0, 176, 111, 0.2);
        }

        .studio-explorer-item.selected {
            background: rgba(0, 176, 111, 0.25);
            border-color: rgba(0, 176, 111, 0.4);
            color: #fff;
        }

        .studio-btn {
            font-size: 13px;
            padding: 7px 14px;
        }

        /* Dark scrollbar for studio */
        .studio-explorer-list::-webkit-scrollbar,
        .studio-props-panel::-webkit-scrollbar,
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .studio-explorer-list::-webkit-scrollbar-track,
        .studio-props-panel::-webkit-scrollbar-track,
        .sidebar::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        .studio-explorer-list::-webkit-scrollbar-thumb,
        .studio-props-panel::-webkit-scrollbar-thumb,
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(0, 176, 111, 0.3);
            border-radius: 3px;
        }

        .studio-explorer-list::-webkit-scrollbar-thumb:hover,
        .studio-props-panel::-webkit-scrollbar-thumb:hover,
        .sidebar::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 176, 111, 0.5);
        }

        .studio-viewport-toolbar {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 10;
            display: flex;
            gap: 2px;
            background: var(--bg-secondary);
            border-radius: 6px;
            padding: 2px;
            border: 1px solid var(--border-strong);
        }

        .studio-tool-btn {
            background: transparent;
            border: none;
            color: rgba(200, 200, 200, 0.6);
            width: 30px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .studio-tool-btn:hover {
            background: rgba(0, 176, 111, 0.15);
        }

        .studio-tool-btn.active {
            background: rgba(0, 176, 111, 0.35);
            color: #fff;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .editor-container {
                flex-direction: column;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-controls {
                width: 100%;
            }

            button, .docs-link {
                flex: 1;
            }
        }

        /* ── Publish Modal ────────────────────────────── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            width: 440px;
            max-width: 90vw;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
        }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }
        .modal-close:hover { color: #fff; }
        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .modal-field label {
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .modal-field input,
        .modal-field select,
        .modal-field textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 10px 12px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
        }
        .modal-field input:focus,
        .modal-field select:focus,
        .modal-field textarea:focus {
            outline: none;
            border-color: rgba(0,176,111,0.6);
        }
        .modal-field textarea {
            resize: vertical;
            min-height: 80px;
        }
        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding: 16px 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .modal-btn {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .modal-btn.cancel {
            background: rgba(255,255,255,0.08);
            color: #ccc;
        }
        .modal-btn.cancel:hover { background: rgba(255,255,255,0.15); }
        .modal-btn.confirm {
            background: rgba(76,175,80,0.8);
            color: #fff;
        }
        .modal-btn.confirm:hover { background: rgba(76,175,80,1); }

        .thumb-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .thumb-option {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.15s;
        }
        .thumb-option:hover { border-color: rgba(0,176,111,0.5); }
        .thumb-option.selected { border-color: var(--accent); }

        .sidebar-resize-handle {
            width: 4px;
            cursor: col-resize;
            background: transparent;
            flex-shrink: 0;
            transition: background 0.15s;
            position: relative;
        }
        .sidebar-resize-handle:hover,
        .sidebar-resize-handle:active {
            background: rgba(0,176,111,0.3);
        }
        .sidebar-resize-handle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 24px;
            background: rgba(255,255,255,0.15);
            border-radius: 1px;
        }
        .studio-props-panel {
            position: relative;
        }
        .studio-props-panel .sidebar-resize-handle {
            position: absolute;
            left: -2px;
            top: 0;
            bottom: 0;
            z-index: 5;
        }

        #shift-lock-indicator {
            position: fixed;
            left: 50%;
            top: 50%;
            width: 16px;
            height: 16px;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid rgba(255, 255, 255, 0.95);
            border-radius: 999px;
            background: transparent;
            pointer-events: none;
            opacity: 0;
            transition: opacity 120ms linear;
            z-index: 9999;
        }
        #shift-lock-indicator.visible {
            opacity: 1;
        }
    </style>

  <link rel="stylesheet" href="src/theme.css" />
  <script type="module" src="src/theme.js"></script>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <h1>BloxVerse Studio</h1>
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="script">Script</button>
                <button class="mode-tab" data-mode="studio">Studio</button>
            </div>
        </div>
        <div class="header-controls">
            <button id="studioNewBtn" class="studio-btn" style="display:none;">🆕 New</button>
            <button id="studioLoadBtn" class="studio-btn" style="display:none;">📂 Load JSON</button>
            <button id="studioExportBtn" class="studio-btn" style="display:none;">📦 Export JSON</button>
            <button id="studioPlayBtn" class="studio-btn" style="display:none; background: rgba(76, 175, 80, 0.74);">▶ Play</button>
            <button id="studioStopBtn" class="studio-btn" style="display:none; background: rgba(244, 67, 54, 0.74);">⏹ Stop</button>
            <button id="studioPublishBtn" class="studio-btn" style="display:none;">🚀 Publish</button>
            <button id="studioAddBtn" class="studio-btn" style="display:none;">+ Add Part</button>
            <button id="saveBtn" class="save-btn">💾 Save</button>
            <a id="docsLink" href="docs" target="_blank" class="docs-link">📚 Docs</a>
        </div>
    </div>

    <div class="editor-container">
        <div class="sidebar" id="scriptSidebar">
            <h3>📝 Scripts</h3>
            <div id="scriptList"></div>

            <div class="button-group">
                <button id="newScriptBtn" style="background: rgba(0, 176, 111, 0.5); flex: 1;">+ New Script</button>
            </div>

            <input type="text" class="new-script-input" id="newScriptInput" placeholder="Script name..." style="display: none;">
            <div class="button-group" id="newScriptActions" style="display: none;">
                <button id="confirmNewBtn" style="background: rgba(76, 175, 80, 0.5); flex: 1;">Create</button>
                <button id="cancelNewBtn" style="background: rgba(244, 67, 54, 0.5); flex: 1;">Cancel</button>
            </div>
        </div>

        <div class="sidebar" id="studioSidebar" style="display:none;">
            <h3>🔍 Explorer</h3>
            <div id="studioExplorerList" class="studio-explorer-list"></div>
        </div>

        <div class="editor-main">
            <div class="editor-tabs" id="editorTabs"></div>

            <div class="code-editor" id="codeEditorPanel">
                <div class="line-numbers" id="lineNumbers"></div>
                <div class="editor-area" id="editorArea">
                    <div id="codeEditor" contenteditable="true" spellcheck="false"></div>
                </div>
            </div>

            <div id="studioViewport" class="studio-viewport" style="display:none;">
                <div id="studio3DContainer" class="studio-3d-container"></div>
                <div class="studio-props-panel" id="studioPropsPanel">
                    <h3>Properties</h3>
                    <div id="studioPropsContent"></div>
                </div>
            </div>

            <div class="bottom-panel" id="bottomPanel">
                <div id="outputContainer"></div>
            </div>
        </div>
    </div>

    <input type="file" id="studioFileInput" accept=".json" style="display:none;">

    <!-- Publish Modal -->
    <div id="publishModal" class="modal-overlay" style="display:none;">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Publish Game</h2>
          <button class="modal-close" id="publishModalClose">&times;</button>
        </div>
        <div class="modal-body">
          <div class="modal-field">
            <label for="publishName">Game Name</label>
            <input type="text" id="publishName" placeholder="My Amazing Game" maxlength="50" />
          </div>
          <div class="modal-field">
            <label for="publishGenre">Genre</label>
            <select id="publishGenre">
              <option value="Sandbox">Sandbox</option>
              <option value="Exploration">Exploration</option>
              <option value="Sports">Sports</option>
              <option value="Fighting">Fighting</option>
              <option value="Racing">Racing</option>
              <option value="Adventure">Adventure</option>
              <option value="Simulation">Simulation</option>
              <option value="Puzzle">Puzzle</option>
              <option value="Horror">Horror</option>
              <option value="Comedy">Comedy</option>
              <option value="RPG">RPG</option>
              <option value="Strategy">Strategy</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="modal-field">
            <label for="publishDescription">Description</label>
            <textarea id="publishDescription" placeholder="Tell players about your game..." rows="4" maxlength="1000"></textarea>
          </div>
          <div class="modal-field">
            <label>Thumbnail</label>
            <div class="thumb-picker" id="publishThumbPicker"></div>
            <div style="display:flex;gap:12px;align-items:center;margin-top:4px;">
              <button id="publishUploadThumbBtn" class="modal-btn cancel" style="padding:6px 12px;font-size:12px;">Upload Image</button>
              <input type="file" id="publishThumbInput" accept="image/*" style="display:none;" />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="modal-btn cancel" id="publishCancelBtn">Cancel</button>
          <button class="modal-btn confirm" id="publishConfirmBtn">🚀 Publish</button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script type="module" src="src/create.js"></script>
</body>
</html>
