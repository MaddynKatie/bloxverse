<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Friends</title>
  <link rel="stylesheet" href="src/auth.css" />
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .friends-page {
      max-width: 640px;
      width: 100%;
      padding: 24px;
      padding-top: 76px;
      margin: 0 auto;
    }

    .friends-page h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .friends-page-subtitle {
      color: #8a8c8e;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* Tabs */
    .friends-tabs {
      display: flex;
      gap: 2px;
      background: #2a2b2d;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
    }

    .friends-tab {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: none;
      color: #8a8c8e;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      position: relative;
    }

    .friends-tab:hover {
      color: #babbbe;
      background: rgba(255,255,255,0.04);
    }

    .friends-tab.active {
      color: #fff;
      background: #393b3d;
    }

    .friends-tab .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #00b06f;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      padding: 0 5px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* Tab content */
    .tab-content {
      display: none;
    }

    .tab-content.visible {
      display: block;
    }

    /* Friend list items */
    .friend-list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #2a2b2d;
      border-radius: 8px;
      margin-bottom: 6px;
      transition: background 0.15s;
      cursor: pointer;
    }

    .friend-list-item:hover {
      background: #333537;
    }

    .friend-list-item .list-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0d69ac, #00b06f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .friend-list-item .list-info {
      flex: 1;
      min-width: 0;
    }

    .friend-list-item .list-name {
      font-size: 14px;
      font-weight: 500;
    }

    .friend-list-item .list-sub {
      font-size: 11px;
      color: #8a8c8e;
    }

    .friend-list-item .list-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .accept-btn {
      padding: 5px 14px;
      background: #00b06f;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .accept-btn:hover {
      background: #009b61;
    }

    .decline-btn {
      padding: 5px 14px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #8a8c8e;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .decline-btn:hover {
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }

    .remove-btn {
      padding: 5px 10px;
      background: rgba(239,68,68,0.15);
      border: none;
      border-radius: 6px;
      color: #ef4444;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .remove-btn:hover {
      background: rgba(239,68,68,0.25);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #8a8c8e;
    }

    .empty-state svg {
      margin-bottom: 12px;
      opacity: 0.4;
    }

    .empty-state p {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .empty-state .hint {
      font-size: 12px;
    }

    .friends-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #8a8c8e;
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .friends-back:hover { color: #fff; }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/create'">Create</button>
      </div>
    </div>
    <div class="nav-right" id="navRight"></div>
  </nav>

  <div class="friends-page" id="friendsPage"></div>

  <script type="module">
    import { auth, db, followUser, unfollowUser, logTransaction, assignUserIdNum, trackPresence } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc, setDoc, onSnapshot, updateDoc, increment, collection, getDocs, query, where, limit } from 'firebase/firestore';
    import { getFriends, getFriendRequests, acceptFriendRequest, declineFriendRequest, removeFriend, sendFriendRequest } from './src/friends.js';

    const navRight = document.getElementById('navRight');
    const friendsPage = document.getElementById('friendsPage');

    let currentUserId = null;
    let cachedFriends = [];
    let cachedRequests = [];
    let cachedFollowing = [];
    let cachedFollowers = [];
    let activeTab = 'requests';

    async function fetchUsers(ids) {
      const results = await Promise.all(ids.slice(0, 50).map(fid =>
        getDoc(doc(db, 'users', fid)).then(fDoc => {
          if (!fDoc.exists()) return null;
          const fData = fDoc.data();
          return { id: fid, num: fData.userIdNum, username: fData.username || 'Unknown' };
        }).catch(() => null)
      ));
      return results.filter(Boolean);
    }

    async function loadAllData() {
      if (!currentUserId) return;

      const userDoc = await getDoc(doc(db, 'users', currentUserId));
      if (!userDoc.exists()) return;
      const data = userDoc.data();

      const friendIds = data.friends || [];
      const followerIds = data.followers || [];
      const followingIds = data.following || [];

      const [friends, requests, following, followers] = await Promise.all([
        friendIds.length ? getFriends(currentUserId) : Promise.resolve([]),
        getFriendRequests(currentUserId),
        followingIds.length ? fetchUsers(followingIds) : Promise.resolve([]),
        followerIds.length ? fetchUsers(followerIds) : Promise.resolve([]),
      ]);

      cachedFriends = friends;
      cachedRequests = requests;
      cachedFollowing = following;
      cachedFollowers = followers;

      for (const r of cachedRequests) {
        try {
          const fromDoc = await getDoc(doc(db, 'users', r.from));
          r.fromUsername = fromDoc.exists() ? fromDoc.data().username : 'Unknown';
        } catch { r.fromUsername = 'Unknown'; }
      }

      renderPage();
    }

    function renderPage() {
      const badgeCount = cachedRequests.length > 0 ? cachedRequests.length : '';

      friendsPage.innerHTML = `
        <a href="/bloxverse/" class="friends-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          Back to Home
        </a>

        <h1>Friends</h1>
        <p class="friends-page-subtitle">Manage your friends and requests</p>

        <div class="friends-tabs">
          <button class="friends-tab ${activeTab === 'requests' ? 'active' : ''}" data-tab="requests">
            Requests${badgeCount ? `<span class="tab-badge">${badgeCount}</span>` : ''}
          </button>
          <button class="friends-tab ${activeTab === 'friends' ? 'active' : ''}" data-tab="friends">
            Friends (${cachedFriends.length})
          </button>
          <button class="friends-tab ${activeTab === 'following' ? 'active' : ''}" data-tab="following">
            Following (${cachedFollowing.length})
          </button>
          <button class="friends-tab ${activeTab === 'followers' ? 'active' : ''}" data-tab="followers">
            Followers (${cachedFollowers.length})
          </button>
        </div>

        <div class="tab-content ${activeTab === 'requests' ? 'visible' : ''}" id="tabRequests">
          ${renderRequests()}
        </div>

        <div class="tab-content ${activeTab === 'friends' ? 'visible' : ''}" id="tabFriends">
          ${renderFriends()}
        </div>

        <div class="tab-content ${activeTab === 'following' ? 'visible' : ''}" id="tabFollowing">
          ${renderFollowing()}
        </div>

        <div class="tab-content ${activeTab === 'followers' ? 'visible' : ''}" id="tabFollowers">
          ${renderFollowers()}
        </div>
      `;

      // Tab click handlers
      document.querySelectorAll('.friends-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          activeTab = tab.dataset.tab;
          loadAllData();
        });
      });

      // Request action handlers
      document.querySelectorAll('.accept-request').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const reqId = btn.dataset.reqid;
          const fromId = btn.dataset.fromid;
          const toId = btn.dataset.toid;
          try {
            await acceptFriendRequest(reqId, fromId, toId);
            loadAllData();
          } catch (e) {
            console.error('Accept error:', e);
          }
        });
      });

      document.querySelectorAll('.decline-request').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const reqId = btn.dataset.reqid;
          try {
            await declineFriendRequest(reqId);
            loadAllData();
          } catch (e) {
            console.error('Decline error:', e);
          }
        });
      });

      document.querySelectorAll('.remove-friend').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const friendId = btn.dataset.id;
          if (confirm('Remove this friend?')) {
            try {
              await removeFriend(currentUserId, friendId);
              loadAllData();
            } catch (e) {
              console.error('Remove error:', e);
            }
          }
        });
      });

      document.querySelectorAll('.unfollow-user').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const targetId = btn.dataset.id;
          try {
            await unfollowUser(currentUserId, targetId);
            loadAllData();
          } catch (e) {
            console.error('Unfollow error:', e);
          }
        });
      });
    }

    function renderRequests() {
      if (cachedRequests.length === 0) {
        return `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
          <p>No pending requests</p>
          <div class="hint">Search for players to send friend requests</div>
        </div>`;
      }

      return cachedRequests.map(r => `
        <div class="friend-list-item">
          <div class="list-avatar">${(r.fromUsername || '?').charAt(0).toUpperCase()}</div>
          <div class="list-info">
            <div class="list-name">${r.fromUsername || 'Unknown'}</div>
            <div class="list-sub">Wants to be friends</div>
          </div>
          <div class="list-actions">
            <button class="accept-btn accept-request" data-reqid="${r.id}" data-fromid="${r.from}" data-toid="${r.to}">Accept</button>
            <button class="decline-btn decline-request" data-reqid="${r.id}">Decline</button>
          </div>
        </div>
      `).join('');
    }

    function renderFriends() {
      if (cachedFriends.length === 0) {
        return `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <p>No friends yet</p>
          <div class="hint">Search for players to add friends</div>
        </div>`;
      }

      return cachedFriends.map(f => `
        <div class="friend-list-item" onclick="window.location.href='/bloxverse/profile?user=${f.num}'">
          <div class="list-avatar">${(f.username || 'U').charAt(0).toUpperCase()}</div>
          <div class="list-info">
            <div class="list-name">${f.username}</div>
            <div class="list-sub">Friend</div>
          </div>
          <div class="list-actions">
            <button class="remove-btn remove-friend" data-id="${f.id}">Remove</button>
          </div>
        </div>
      `).join('');
    }

    function renderFollowing() {
      if (cachedFollowing.length === 0) {
        return `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6"/><path d="M23 11h-6"/></svg>
          <p>Not following anyone yet</p>
          <div class="hint">Follow players to see their activity</div>
        </div>`;
      }

      return cachedFollowing.map(f => `
        <div class="friend-list-item" onclick="window.location.href='/bloxverse/profile?user=${f.num}'">
          <div class="list-avatar">${(f.username || 'U').charAt(0).toUpperCase()}</div>
          <div class="list-info">
            <div class="list-name">${f.username}</div>
            <div class="list-sub">Following</div>
          </div>
          <div class="list-actions">
            <button class="remove-btn unfollow-user" data-id="${f.id}">Unfollow</button>
          </div>
        </div>
      `).join('');
    }

    function renderFollowers() {
      if (cachedFollowers.length === 0) {
        return `<div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <p>No followers yet</p>
          <div class="hint">Followers will appear here</div>
        </div>`;
      }

      return cachedFollowers.map(f => `
        <div class="friend-list-item" onclick="window.location.href='/bloxverse/profile?user=${f.num}'">
          <div class="list-avatar">${(f.username || 'U').charAt(0).toUpperCase()}</div>
          <div class="list-info">
            <div class="list-name">${f.username}</div>
            <div class="list-sub">Follower</div>
          </div>
        </div>
      `).join('');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '/bloxverse/auth';
        return;
      }

      currentUserId = user.uid;
      assignUserIdNum(user.uid).catch(() => {});
      trackPresence(user.uid, null, 'friends');

      const userDoc = await getDoc(doc(db, 'users', user.uid));
      const userData = userDoc.exists() ? userDoc.data() : {};
      const ownNum = userData.userIdNum;
      const ownProfileLink = ownNum ? `/bloxverse/profile?user=${ownNum}` : '/bloxverse/profile';
      const ownInitial = (userData.username || 'P').charAt(0).toUpperCase();
      const ownPreview = userData.avatarPreview || null;
      const _cb = Date.now();
      const ownBux = userData.bux || 0;

      navRight.innerHTML = `
        <div class="user-info">
          <div class="bux-wrapper" id="buxWrapper">
            <button class="bux-btn" id="buxBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
              </svg>
              <span id="ownBuxVal">${ownBux.toLocaleString()}</span>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
            </button>
            <div class="bux-dropdown">
              <div class="bux-dropdown-header">
                <span class="bux-dropdown-label">Balance</span>
                <span class="bux-dropdown-balance" id="buxDropdownBalance">${ownBux.toLocaleString()}</span>
              </div>
              <button class="bux-dropdown-item" onclick="window.openSendBuxModal()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-2 8-10V5l-8-3-8 3v7c0 8 8 10 8 10z"/></svg>
                Send Bux
              </button>
              <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                Transactions
              </button>
            </div>
          </div>
          <button class="settings-nav-btn" onclick="window.location.href='/bloxverse/settings'" title="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
          <div class="avatar-dropdown">
            ${ownPreview ? `<img src="${ownPreview}?_cb=${_cb}" alt="" class="avatar-circle-img" data-initial="${ownInitial}" onerror="window.__handleBrokenAvatar(this, '${user.uid}')"/>` : `<div class="avatar-circle">${ownInitial}</div>`}
            <div class="dropdown-menu">
              <div class="dropdown-header">
                <span class="dropdown-name">${userData.username || 'Player'}</span>
                <span class="dropdown-email">${user.email}</span>
              </div>
              <button class="dropdown-item" onclick="window.location.href='${ownProfileLink}'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                </svg>
                Profile
              </button>
              <button class="dropdown-item" onclick="window.location.href='/bloxverse/avatar'">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                </svg>
                Avatar
              </button>
              <button class="dropdown-item" onclick="window._logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Log Out
              </button>
            </div>
          </div>
        </div>
      `;

      const buxWrapper = document.getElementById('buxWrapper');
      const buxBtn = document.getElementById('buxBtn');
      buxBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        buxWrapper.classList.toggle('open');
      });

      const avatarCircle = navRight.querySelector('.avatar-circle') || navRight.querySelector('.avatar-circle-img');
      const dropdown = navRight.querySelector('.avatar-dropdown');
      avatarCircle.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      });

      document.addEventListener('click', (e) => {
        if (!dropdown.contains(e.target)) {
          dropdown.classList.remove('open');
        }
        if (buxWrapper && !buxWrapper.contains(e.target)) {
          buxWrapper.classList.remove('open');
        }
      });

      await loadAllData();
    });

    window._logout = async () => {
      await signOut(auth);
      window.location.href = '/bloxverse/auth';
    };

    // ── Send Bux ─────────────────────────────────────────────────────────
    window.openSendBuxModal = () => {
      if (!auth.currentUser) return;
      const bux = Number(String(document.getElementById('buxDropdownBalance')?.textContent || '0').replace(/,/g, '')) || 0;
      let selectedUserId = null;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-content" style="max-width:500px;">
          <div class="modal-header">
            <h2>Send Bux</h2>
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
          </div>
          <div class="modal-body">
            <div class="modal-field">
              <label>Recipient</label>
              <input type="text" id="sendBuxSearch" placeholder="Search username..." autocomplete="off" />
              <div id="sendBuxResults" class="search-list" style="display:none;"></div>
            </div>

            <div id="sendBuxSelected" style="display:none;">
              <div class="modal-field">
                <label>Selected User</label>
                <div class="selected-badge">
                  <img id="sendBuxAvatar" src="" class="selected-avatar" />
                  <span id="sendBuxName"></span>
                </div>
              </div>
            </div>

            <div class="modal-field">
              <label>Amount</label>
              <div class="amount-row">
                <input type="number" id="sendBuxAmount" placeholder="Enter amount…" min="1" max="${bux}" />
                <span class="bux-label">BUX</span>
              </div>
            </div>

            <div class="warning-box" style="margin:0;">
              <strong>Warning:</strong> Bux transfers are final and cannot be undone.
            </div>
            <div id="sendBuxErr" class="error-msg" style="display:none;"></div>
          </div>
          <div class="modal-footer">
            <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="modal-btn confirm" id="sendBuxSendBtn" disabled>Send</button>
          </div>
        </div>`;

      overlay.querySelector('#sendBuxSendBtn').addEventListener('click', () => {
        const amount = parseInt(overlay.querySelector('#sendBuxAmount').value, 10);
        const username = overlay.querySelector('#sendBuxName').textContent;
        const errEl = overlay.querySelector('#sendBuxErr');
        if (!selectedUserId) return;
        if (isNaN(amount) || amount < 1) {
          errEl.textContent = 'Enter a valid positive amount.';
          errEl.style.display = 'block';
          return;
        }
        if (amount > bux) {
          errEl.textContent = 'You don\'t have enough BUX to send this amount.';
          errEl.style.display = 'block';
          return;
        }
        errEl.style.display = 'none';

        const confirmOverlay = document.createElement('div');
        confirmOverlay.className = 'modal-overlay';
        confirmOverlay.style.cssText = 'z-index:10000;background:rgba(0,0,0,0.8);';
        confirmOverlay.innerHTML = `
          <div class="modal-content" style="max-width:400px;">
            <div class="modal-header">
              <h3 style="font-size:16px;margin:0;">Confirm Transfer</h3>
            </div>
            <div class="modal-body">
              <p style="color:#ccc;font-size:14px;line-height:1.5;margin:0 0 16px;">
                Are you sure you want to send <strong style="color:#4caf50;">${amount.toLocaleString()} BUX</strong>
                to <strong style="color:#fff;">${username}</strong>?
              </p>
              <div class="warning-box" style="margin:0;">
                This transfer is <strong>final</strong>. You will not be able to recover these BUX.
              </div>
            </div>
            <div class="modal-footer">
              <button class="modal-btn cancel" id="confirmCancelBtn">Cancel</button>
              <button class="modal-btn confirm" id="confirmYesBtn" style="background:rgba(244,67,54,0.8);">Yes, Send</button>
            </div>
          </div>`;
        document.body.appendChild(confirmOverlay);

        confirmOverlay.querySelector('#confirmCancelBtn').addEventListener('click', () => confirmOverlay.remove());
        confirmOverlay.querySelector('#confirmYesBtn').addEventListener('click', async () => {
          try {
            await updateDoc(doc(db, 'users', auth.currentUser.uid), { bux: increment(-amount) });
            await updateDoc(doc(db, 'users', selectedUserId), { bux: increment(amount) });

            const _sSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
            const _sData = _sSnap.data();
            const _rSnap = await getDoc(doc(db, 'users', selectedUserId));
            const _rData = _rSnap.data();
            await logTransaction(auth.currentUser.uid, -amount, _sData?.bux || 0, 'SendBux', `Sent ${amount.toLocaleString()} BUX to ${username}`);
            await logTransaction(selectedUserId, amount, _rData?.bux || 0, 'SendBux', `Received ${amount.toLocaleString()} BUX from ${_sData?.username || 'Someone'}`);

            confirmOverlay.remove();
            overlay.remove();
          } catch (err) {
            console.error(err);
            overlay.querySelector('#sendBuxErr').textContent = 'Transfer failed. Try again.';
            overlay.querySelector('#sendBuxErr').style.display = 'block';
            confirmOverlay.remove();
          }
        });
      });

      document.body.appendChild(overlay);

      const searchInput = overlay.querySelector('#sendBuxSearch');
      const resultsEl = overlay.querySelector('#sendBuxResults');
      const selectedEl = overlay.querySelector('#sendBuxSelected');
      const nameEl = overlay.querySelector('#sendBuxName');
      const avatarEl = overlay.querySelector('#sendBuxAvatar');
      const sendBtn = overlay.querySelector('#sendBuxSendBtn');

      let _allUsersCache = null;
      let searchTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        const term = searchInput.value.trim().toLowerCase();
        if (!term) { resultsEl.style.display = 'none'; return; }
        searchTimer = setTimeout(async () => {
          try {
            if (!_allUsersCache) {
              const all = await getDocs(collection(db, 'users'));
              _allUsersCache = all.docs.map(d => ({ id: d.id, ...d.data() }));
            }
            const matches = _allUsersCache.filter(u => (u.username || '').toLowerCase().includes(term));
            if (matches.length === 0) {
              resultsEl.innerHTML = '<div class="empty-state">No users found</div>';
            } else {
              resultsEl.innerHTML = matches.slice(0, 50).map(f => `
                <div class="search-item" data-uid="${f.id}" data-name="${f.username || 'Unknown'}" data-avatar="${f.avatarPreview || ''}">
                  ${f.avatarPreview ? `<img src="${f.avatarPreview}" alt="" />` : `<div class="init-circle">${(f.username || 'U').charAt(0).toUpperCase()}</div>`}
                  <span>${f.username || 'Unknown'}</span>
                </div>`).join('');
              resultsEl.querySelectorAll('.search-item').forEach(el => {
                el.addEventListener('click', () => {
                  selectedUserId = el.dataset.uid;
                  nameEl.textContent = el.dataset.name;
                  avatarEl.src = el.dataset.avatar || '';
                  selectedEl.style.display = 'block';
                  resultsEl.style.display = 'none';
                  searchInput.value = '';
                  sendBtn.disabled = false;
                  overlay.querySelector('#sendBuxErr').style.display = 'none';
                  overlay.querySelector('#sendBuxAmount').focus();
                });
              });
            }
            resultsEl.style.display = 'block';
          } catch (err) {
            console.error(err);
            resultsEl.innerHTML = '<div class="empty-state">Search error</div>';
          }
        }, 200);
      });

      document.addEventListener('click', (e) => {
        if (overlay.contains(e.target)) return;
        if (resultsEl.style.display === 'block') resultsEl.style.display = 'none';
      }, { once: true });
    };

    window.__handleBrokenAvatar = async function(imgEl, uid) {
      try {
        const initial = imgEl.getAttribute('data-initial') || 'U';
        const letter = document.createElement('div');
        letter.className = 'friend-thumb-avatar';
        letter.textContent = initial;
        imgEl.replaceWith(letter);
        try {
          if (auth && auth.currentUser && auth.currentUser.uid === uid) {
            const { setDoc, doc } = await import('https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js');
            await setDoc(doc(db, 'users', uid), { avatarPreview: null }, { merge: true });
          }
        } catch (e) { console.warn('Could not clear avatarPreview:', e); }
      } catch (e) { console.warn('Broken avatar handler error:', e); }
    };
  </script>
</body>

</html>
