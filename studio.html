<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse Studio</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87CEEB;
    }
    canvas {
      display: block;
    }
    #viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      z-index: 20;
      user-select: none;
    }
    .toolbar button {
      background: #333;
      color: #ccc;
      border: none;
      width: 48px;
      height: 48px;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: 600;
    }
    .toolbar button:hover {
      background: #444;
      color: #fff;
    }
    .toolbar button.active {
      background: #555;
      color: #fff;
      outline: 1px solid #888;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-separator {
      width: 1px;
      align-self: stretch;
      margin: 10px 6px;
      background: #444;
    }
    #sidebar {
      position: fixed;
      top: 64px;
      right: 0;
      width: 280px;
      height: calc(100% - 64px);
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #333;
      z-index: 10;
    }
    #explorerSection {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-bottom: 1px solid #333;
    }
    #propertiesSection {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .panel-header {
      color: #ccc;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 13px;
      padding: 6px 10px;
      user-select: none;
    }
    #explorerList::-webkit-scrollbar,
    #propertiesContent::-webkit-scrollbar {
      width: 4px;
    }
    #explorerList::-webkit-scrollbar-track,
    #propertiesContent::-webkit-scrollbar-track {
      background: transparent;
    }
    #explorerList::-webkit-scrollbar-thumb,
    #propertiesContent::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 2px;
    }
    #explorerList::-webkit-scrollbar-thumb:hover,
    #propertiesContent::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
    #explorerList {
      flex: 1;
      overflow-y: auto;
      padding: 2px 0;
    }
    .explorer-section {
      display: flex;
      flex-direction: column;
    }
    .section-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
      color: #ccc;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .section-toggle:hover {
      color: #ccc;
    }
    .section-toggle .arrow {
      font-size: 8px;
      width: 12px;
      text-align: center;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .section-toggle.collapsed .arrow {
      transform: rotate(-90deg);
    }
    .section-children {
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .section-children::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 0;
      bottom: 12px;
      width: 1px;
      background: #444;
    }
    .section-toggle.collapsed + .section-children {
      display: none;
    }
    .explorer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 2px 10px 2px 16px;
      color: #ccc;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .explorer-item:hover {
      background: #2a2a2a;
    }
    .explorer-item.selected {
      background: #007acc;
      color: #fff;
    }
    .explorer-item .icon {
      display: none;
    }
    .explorer-item .icon-light {
      background: #ffd700;
      border-radius: 50%;
    }
    #propertiesContent {
      flex: 1;
      overflow-y: auto;
      color: #ccc;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
    }
    .prop-empty {
      color: #555;
      text-align: center;
      padding: 20px 10px;
      font-size: 12px;
    }
    .prop-section {
      display: flex;
      flex-direction: column;
    }
    .prop-section-title {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 2px;
      color: #ccc;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      background: #2a2a2a;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
    }
    .prop-section-title:hover {
      background: #333;
    }
    .prop-section-title .arrow {
      font-size: 8px;
      width: 12px;
      text-align: center;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .prop-section.collapsed .arrow {
      transform: rotate(-90deg);
    }
    .prop-grid {
      display: grid;
      grid-template-columns: 100px 1fr;
    }
    .prop-section.collapsed .prop-grid {
      display: none;
    }
    .prop-row-label {
      padding: 4px 8px;
      color: #aaa;
      border-bottom: 1px solid #333;
      border-right: 1px solid #333;
    }
    .prop-row-value {
      padding: 4px 8px;
      color: #ccc;
      border-bottom: 1px solid #333;
    }
    .prop-row-value input {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      color: #ccc;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      padding: 0;
    }
    .prop-row-value input:focus {
      color: #fff;
      background: #2a2a2a;
    }
    .prop-grid > div:nth-child(4n+3),
    .prop-grid > div:nth-child(4n+4) {
      background: #171717;
    }
  </style>
  <script src="js/sw-register.js" defer></script>
</head>

<body>
  <div id="viewport"></div>

  <div class="toolbar">
    <div class="toolbar-group">
      <button id="btnSelect" class="active">Select</button>
      <button id="btnMove">Move</button>
      <button id="btnRotate">Rotate</button>
      <button id="btnScale">Scale</button>
    </div>
    <div class="toolbar-separator"></div>
    <div class="toolbar-group">
      <button id="btnPart">Part</button>
    </div>
  </div>

  <div id="sidebar">
    <div id="explorerSection">
      <div class="panel-header">Explorer</div>
      <div id="explorerList"></div>
    </div>
    <div id="propertiesSection">
      <div class="panel-header">Properties</div>
      <div id="propertiesContent"><div class="prop-empty">Select a part</div></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const STUDS_PER_TILE = 4;

    // ─── Load stud / inlet textures ──────────────────────────────────────────
    const studUrl = new URL('assets/textures/stud.jpeg', import.meta.url).href;
    const inletUrl = new URL('assets/textures/inlet.jpg', import.meta.url).href;

    let _studBitmap = null;
    let _inletBitmap = null;

    async function loadTextures() {
      const [studBlob, inletBlob] = await Promise.all([
        fetch(studUrl).then(r => r.blob()),
        fetch(inletUrl).then(r => r.blob()),
      ]);
      _studBitmap = await createImageBitmap(studBlob);
      _inletBitmap = await createImageBitmap(inletBlob);
    }

    function studTex(rx, ry) {
      if (!_studBitmap) return null;
      const t = new THREE.Texture(_studBitmap);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.colorSpace = THREE.SRGBColorSpace;
      t.repeat.set(rx, ry);
      t.needsUpdate = true;
      return t;
    }

    function inletTex(rx, ry) {
      if (!_inletBitmap) return null;
      const t = new THREE.Texture(_inletBitmap);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.colorSpace = THREE.SRGBColorSpace;
      t.repeat.set(rx, ry);
      t.needsUpdate = true;
      return t;
    }

    function makeMats(sw, sh, sd, color, opacity = 1) {
      const t = (v) => v / STUDS_PER_TILE;
      const transparent = opacity < 1;
      return [
        new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, transparent, opacity }),
        new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, transparent, opacity }),
        new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, transparent, opacity, map: studTex(t(sw), t(sd)) }),
        new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, transparent, opacity, map: inletTex(t(sw), t(sd)) }),
        new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, transparent, opacity }),
        new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, transparent, opacity }),
      ];
    }

    // ─── Scene ───────────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x87CEEB, 280, 700);

    // ─── Camera ──────────────────────────────────────────────────────────────
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 3200);

    // ─── Renderer ────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setClearColor(0x87CEEB);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.getElementById('viewport').appendChild(renderer.domElement);

    // ─── Lights ──────────────────────────────────────────────────────────────
    const ambient = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(160, 320, 160);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.bias = -0.0002;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 960;
    sun.shadow.camera.left = -200;
    sun.shadow.camera.right = 200;
    sun.shadow.camera.top = 200;
    sun.shadow.camera.bottom = -200;
    sun.shadow.camera.updateProjectionMatrix();
    scene.add(sun);

    // ─── Gray Baseplate ──────────────────────────────────────────────────────
    const GR = 0xaaaaaa;
    const plateGeo = new THREE.BoxGeometry(320, 3.2, 320);
    const baseplate = new THREE.Mesh(plateGeo);
    baseplate.position.set(0, -1.6, 0);
    baseplate.receiveShadow = true;
    baseplate.castShadow = true;
    scene.add(baseplate);

    function applyBaseplateMats() {
      baseplate.material = makeMats(320, 3.2, 320, GR);
    }

    // ─── Explorer ─────────────────────────────────────────────────────────────
    const parts = [];
    let partCounter = 0;
    const explorerList = document.getElementById('explorerList');

    function makeSection(name) {
      const section = document.createElement('div');
      section.className = 'explorer-section';
      const toggle = document.createElement('div');
      toggle.className = 'section-toggle';
      toggle.innerHTML = '<span class="arrow">▼</span> ' + name;
      const children = document.createElement('div');
      children.className = 'section-children';
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('collapsed');
      });
      section.appendChild(toggle);
      section.appendChild(children);
      explorerList.appendChild(section);
      return children;
    }

    const workspaceSection = makeSection('Workspace');
    const lightingSection = makeSection('Lighting');

    function explorerItemFor(obj) {
      const items = explorerList.querySelectorAll('.explorer-item');
      for (const item of items) {
        if (item._obj === obj) return item;
      }
      return null;
    }

    function addExplorerItem(parent, obj, name, iconClass, selectable = true) {
      const div = document.createElement('div');
      div.className = 'explorer-item';
      div._obj = obj;
      div._selectable = selectable;

      const icon = document.createElement('span');
      icon.className = 'icon' + (iconClass ? ' ' + iconClass : '');
      if (!iconClass && obj.material) {
        const c = Array.isArray(obj.material) ? obj.material[0]?.color?.getHex() : obj.material?.color?.getHex();
        if (c != null) icon.style.background = '#' + c.toString(16).padStart(6, '0');
      }
      div.appendChild(icon);

      const label = document.createElement('span');
      label.textContent = name;
      div.appendChild(label);

      if (selectable) {
        div.addEventListener('click', () => {
          setSelection(obj);
        });
      }

      parent.appendChild(div);
    }

    // ─── Parts ────────────────────────────────────────────────────────────────
    function createPart(sw, sh, sd, color, x, y, z) {
      const geo = new THREE.BoxGeometry(sw, sh, sd);
      const mesh = new THREE.Mesh(geo, makeMats(sw, sh, sd, color, 1));
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.size = { sw, sh, sd };
      mesh.userData.originalColor = color;
      mesh.userData.opacity = 1;
      
      partCounter++;
      const name = `Part${partCounter}`;
      mesh.userData.explorerName = name;
      scene.add(mesh);
      parts.push(mesh);
      addExplorerItem(workspaceSection, mesh, name);
      return mesh;
    }

    // ─── Properties panel ─────────────────────────────────────────────────────
    const propsContent = document.getElementById('propertiesContent');
    let _propInputs = [];
    let _refreshProps = null;

    function createPropSection(title) {
      const section = document.createElement('div');
      section.className = 'prop-section';
      const header = document.createElement('div');
      header.className = 'prop-section-title';
      header.innerHTML = '<span class="arrow">▼</span> ' + title;
      header.addEventListener('click', () => section.classList.toggle('collapsed'));
      const grid = document.createElement('div');
      grid.className = 'prop-grid';
      section.appendChild(header);
      section.appendChild(grid);
      propsContent.appendChild(section);
      return grid;
    }

    function addPropRow(grid, label, valueEl) {
      const lbl = document.createElement('div');
      lbl.className = 'prop-row-label';
      lbl.textContent = label;
      const val = document.createElement('div');
      val.className = 'prop-row-value';
      if (typeof valueEl === 'string') {
        val.innerHTML = valueEl;
      } else {
        val.appendChild(valueEl);
      }
      grid.appendChild(lbl);
      grid.appendChild(val);
      return val;
    }

    function showProperties(mesh) {
      propsContent.innerHTML = '';
      _propInputs = [];

      const size = mesh.userData.size || { sw: 1, sh: 1, sd: 1 };
      const color = mesh.userData.originalColor ?? mesh.material[0]?.color?.getHex() ?? 0xcccccc;
      
      const r = (color >> 16) & 255;
      const g = (color >> 8) & 255;
      const b = color & 255;
      const colorStr = `${r}, ${g}, ${b}`;

      // ── Appearance ──
      const appGrid = createPropSection('Appearance');
      
      const colorInput = document.createElement('input');
      colorInput.type = 'text';
      colorInput.value = colorStr;
      
      colorInput.addEventListener('keydown', (e) => {
         if (e.key === 'Enter') colorInput.blur();
      });
      colorInput.addEventListener('input', () => {
         colorInput.value = colorInput.value.replace(/[^0-9., ]/g, '');
      });
      colorInput.addEventListener('change', () => {
         const parts = colorInput.value.replace(/[^0-9]/g, ' ').trim().split(/\s+/).map(s => parseInt(s));
         if (parts.length >= 3 && parts.every(p => !isNaN(p))) {
             const r = Math.min(255, Math.max(0, parts[0]));
             const g = Math.min(255, Math.max(0, parts[1]));
             const b = Math.min(255, Math.max(0, parts[2]));
             const newColor = (r << 16) | (g << 8) | b;
             mesh.userData.originalColor = newColor;
             const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
             mats.forEach(m => { if (m.color) m.color.setHex(newColor); });
             colorInput.value = `${r}, ${g}, ${b}`;
         } else {
             const c = mesh.userData.originalColor ?? mesh.material[0]?.color?.getHex() ?? 0xcccccc;
             colorInput.value = `${(c >> 16) & 255}, ${(c >> 8) & 255}, ${c & 255}`;
         }
      });
      addPropRow(appGrid, 'Color', colorInput);

      const transpInput = document.createElement('input');
      transpInput.type = 'text';
      transpInput.value = String(Number((1 - (mesh.userData.opacity ?? 1)).toFixed(2)));
      transpInput.addEventListener('keydown', (e) => {
         if (e.key === 'Enter') transpInput.blur();
      });
      transpInput.addEventListener('input', () => {
         transpInput.value = transpInput.value.replace(/[^0-9., ]/g, '');
      });
      transpInput.addEventListener('change', () => {
         const parts = transpInput.value.replace(/[^0-9.]/g, ' ').trim().split(/\s+/).map(s => parseFloat(s));
         if (parts.length >= 1 && !isNaN(parts[0])) {
             const t = Math.min(1, Math.max(0, parts[0]));
             mesh.userData.opacity = 1 - t;
             const mats = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
             mats.forEach(m => { m.transparent = t > 0; m.opacity = 1 - t; m.needsUpdate = true; });
             transpInput.value = String(Number(t.toFixed(2)));
         } else {
             transpInput.value = String(Number((1 - (mesh.userData.opacity ?? 1)).toFixed(2)));
         }
      });
      addPropRow(appGrid, 'Transparency', transpInput);

      // ── Transform ──
      const xfGrid = createPropSection('Transform');
      
      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = mesh.userData.explorerName || 'Part';
      nameInput.addEventListener('keydown', (e) => {
         if (e.key === 'Enter') nameInput.blur();
      });
      nameInput.addEventListener('input', () => {
        mesh.userData.explorerName = nameInput.value;
        const item = explorerItemFor(mesh);
        if (item) item.querySelector('span:last-child').textContent = nameInput.value;
      });
      addPropRow(xfGrid, 'Name', nameInput);

      function formatVec3(v, isAngle) {
        let x = v.x, y = v.y, z = v.z;
        if (isAngle) {
          x = THREE.MathUtils.radToDeg(x);
          y = THREE.MathUtils.radToDeg(y);
          z = THREE.MathUtils.radToDeg(z);
        }
        return `${Number(x.toFixed(3))}, ${Number(y.toFixed(3))}, ${Number(z.toFixed(3))}`;
      }

      function formatSize(size) {
        return `${Number(size.sw.toFixed(3))}, ${Number(size.sh.toFixed(3))}, ${Number(size.sd.toFixed(3))}`;
      }

      function makeVec3Input(initValue, onChange, formatBack) {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = initValue;
        
        inp.addEventListener('keydown', (e) => {
           if (e.key === 'Enter') inp.blur();
        });
        
        inp.addEventListener('input', () => {
           inp.value = inp.value.replace(/[^0-9., \-]/g, '');
        });
        
        inp.addEventListener('change', () => {
           const parts = inp.value.replace(/[^0-9.\-]/g, ' ').trim().split(/\s+/).map(s => parseFloat(s));
           if (parts.length >= 3 && parts.every(p => !isNaN(p))) {
               onChange(parts);
           }
           inp.value = formatBack();
        });
        return inp;
      }

      const posInput = makeVec3Input(formatVec3(mesh.position, false), (vals) => {
         mesh.position.set(vals[0], vals[1], vals[2]);
         updateSelectionOutline();
      }, () => formatVec3(mesh.position, false));
      addPropRow(xfGrid, 'Position', posInput);

      const rotInput = makeVec3Input(formatVec3(mesh.rotation, true), (vals) => {
         mesh.rotation.set(
           THREE.MathUtils.degToRad(vals[0]),
           THREE.MathUtils.degToRad(vals[1]),
           THREE.MathUtils.degToRad(vals[2])
         );
         updateSelectionOutline();
      }, () => formatVec3(mesh.rotation, true));
      addPropRow(xfGrid, 'Rotation', rotInput);

      const sizeInput = makeVec3Input(formatSize(size), (vals) => {
          const [sw, sh, sd] = vals.map(v => Math.max(v, 0.1));
          mesh.userData.size = { sw, sh, sd };
          const color = mesh.userData.originalColor ?? 0xcccccc;
          mesh.geometry.dispose();
          mesh.geometry = new THREE.BoxGeometry(sw, sh, sd);
          mesh.material = makeMats(sw, sh, sd, color, mesh.userData.opacity ?? 1);
          updateSelectionOutline(true);
      }, () => formatSize(mesh.userData.size));
      addPropRow(xfGrid, 'Size', sizeInput);

      _refreshProps = () => {
        posInput.value = formatVec3(mesh.position, false);
        rotInput.value = formatVec3(mesh.rotation, true);
        sizeInput.value = formatSize(mesh.userData.size);
        transpInput.value = String(Number((1 - (mesh.userData.opacity ?? 1)).toFixed(2)));
      };
    }

    // ─── Selection ────────────────────────────────────────────────────────────
    let selectedMesh = null;
    let selectionOutline = null;

    function updateSelectionOutline(recreateGeometry = false) {
      if (!selectedMesh || !selectionOutline) return;
      
      if (recreateGeometry) {
        selectionOutline.geometry.dispose();
        const s = selectedMesh.userData.size || { sw: 1, sh: 1, sd: 1 };
        const geo = new THREE.BoxGeometry(s.sw, s.sh, s.sd);
        selectionOutline.geometry = new THREE.EdgesGeometry(geo);
      }
      
      selectionOutline.position.copy(selectedMesh.position);
      selectionOutline.rotation.copy(selectedMesh.rotation);
    }

    function clearSelection() {
      if (selectionOutline) {
        scene.remove(selectionOutline);
        selectionOutline.geometry.dispose();
        selectionOutline.material.dispose();
        selectionOutline = null;
      }
      const prev = explorerItemFor(selectedMesh);
      if (prev) prev.classList.remove('selected');
      selectedMesh = null;
      propsContent.innerHTML = '<div class="prop-empty">Select a part</div>';
      updateGizmoVisibility();
    }

    function setSelection(mesh) {
      clearSelection();
      if (!mesh) return;
      selectedMesh = mesh;

      const item = explorerItemFor(mesh);
      if (item) item.classList.add('selected');

      const s = mesh.userData.size || { sw: 1, sh: 1, sd: 1 };
      const geo = new THREE.BoxGeometry(s.sw, s.sh, s.sd);
      const edges = new THREE.EdgesGeometry(geo);
      const mat = new THREE.LineBasicMaterial({ color: 0x00b4ff });
      selectionOutline = new THREE.LineSegments(edges, mat);
      
      updateSelectionOutline();
      
      scene.add(selectionOutline);

      showProperties(mesh);
      updateGizmoVisibility();
    }

    // ─── Tool state ──────────────────────────────────────────────────────────
    let currentTool = 'select';

    // ─── Roblox Studio Camera Controls ──────────────────────────────────────
    const MOVE_SPEED = 24;
    const SHIFT_DIV = 4;
    const MOUSE_SENS = 0.004;
    let mouseLook = false;
    let lastMX = 0, lastMY = 0;

    const keys = {};
    const camState = {
      pos: new THREE.Vector3(28, 24, 36),
      yaw: -Math.PI / 4,
      pitch: -Math.PI / 6,
    };

    document.addEventListener('keydown', (e) => { keys[e.code] = true; });
    document.addEventListener('keyup', (e) => { keys[e.code] = false; });

    document.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        mouseLook = true;
        lastMX = e.clientX;
        lastMY = e.clientY;
        e.preventDefault();
      }
    });
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    renderer.domElement.addEventListener('wheel', (e) => {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const allTargets = [baseplate, ...parts];
      const hits = raycaster.intersectObjects(allTargets, false);
      let targetPt;
      if (hits.length > 0) {
        targetPt = hits[0].point;
      } else {
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        targetPt = new THREE.Vector3();
        if (!raycaster.ray.intersectPlane(plane, targetPt)) {
          targetPt = raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(50));
        }
      }
      const dir = new THREE.Vector3().copy(targetPt).sub(camState.pos).normalize();
      camState.pos.add(dir.multiplyScalar(-e.deltaY * 0.08));
    }, { passive: true });

    function updateCamera(dt) {
      const yaw = camState.yaw;
      const pitch = camState.pitch;

      const fwd = new THREE.Vector3(
        -Math.sin(yaw) * Math.cos(pitch),
        -Math.sin(pitch),
        -Math.cos(yaw) * Math.cos(pitch),
      );
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const localUp = new THREE.Vector3().crossVectors(right, fwd).normalize();

      const shiftHeld = keys['ShiftLeft'] || keys['ShiftRight'];
      const speed = MOVE_SPEED * dt * (shiftHeld ? 1 / SHIFT_DIV : 1);

      if (keys['KeyW']) camState.pos.add(fwd.clone().multiplyScalar(speed));
      if (keys['KeyS']) camState.pos.add(fwd.clone().multiplyScalar(-speed));
      if (keys['KeyA']) camState.pos.add(right.clone().multiplyScalar(-speed));
      if (keys['KeyD']) camState.pos.add(right.clone().multiplyScalar(speed));
      if (keys['KeyQ']) camState.pos.add(localUp.clone().multiplyScalar(-speed));
      if (keys['KeyE']) camState.pos.add(localUp.clone().multiplyScalar(speed));

      camera.position.copy(camState.pos);
      camera.lookAt(camState.pos.clone().add(fwd));
    }

    // ─── Raycasting ───────────────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function getSelectableMeshes() {
      return parts;
    }

    function hitTest(mouseX, mouseY) {
      pointer.x = (mouseX / window.innerWidth) * 2 - 1;
      pointer.y = -(mouseY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(getSelectableMeshes(), false);
      return hits.length > 0 ? hits[0] : null;
    }

    // ─── Place part in front of camera ──────────────────────────────────────
    function placePartInFront() {
      const fwd = new THREE.Vector3(
        -Math.sin(camState.yaw) * Math.cos(camState.pitch),
        -Math.sin(camState.pitch),
        -Math.cos(camState.yaw) * Math.cos(camState.pitch),
      );
      const origin = camState.pos.clone();
      const end = origin.clone().add(fwd.clone().multiplyScalar(16));
      const px = Math.round(end.x);
      const py = Math.round(end.y);
      const pz = Math.round(end.z);
      createPart(1, 1, 1, 0xcccccc, px, py, pz);
    }

    // ─── Select ──────────────────────────────────────────────────────────────
    document.addEventListener('click', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('.toolbar')) return;
      if (e.target.closest('#sidebar')) return;

      if (currentTool !== 'select' && currentTool !== 'move' && currentTool !== 'rotate' && currentTool !== 'scale') return;
      if (_didDrag) { _didDrag = false; return; }
      const hit = hitTest(e.clientX, e.clientY);
      if (hit) {
        setSelection(hit.object);
      } else {
        clearSelection();
      }
    });

    // ─── Toolbar ─────────────────────────────────────────────────────────────
    const btnSelect = document.getElementById('btnSelect');
    const btnMove = document.getElementById('btnMove');
    const btnRotate = document.getElementById('btnRotate');
    const btnScale = document.getElementById('btnScale');
    const btnPart = document.getElementById('btnPart');

    function updateGizmoVisibility() {
      const hasGizmo = (currentTool === 'move' || currentTool === 'rotate' || currentTool === 'scale') && !!selectedMesh;
      gizmoGroup.visible = hasGizmo;
      moveGizmo.visible = currentTool === 'move';
      rotateGizmo.visible = currentTool === 'rotate';
      scaleGizmo.visible = currentTool === 'scale';
      if (!hasGizmo) setHover(null);
    }
    function setTool(tool) {
      currentTool = tool;
      btnSelect.classList.toggle('active', tool === 'select');
      btnMove.classList.toggle('active', tool === 'move');
      btnRotate.classList.toggle('active', tool === 'rotate');
      btnScale.classList.toggle('active', tool === 'scale');
      updateGizmoVisibility();
    }
    btnSelect.addEventListener('click', () => setTool('select'));
    btnMove.addEventListener('click', () => setTool('move'));
    btnRotate.addEventListener('click', () => setTool('rotate'));
    btnScale.addEventListener('click', () => setTool('scale'));
    btnPart.addEventListener('click', () => {
      placePartInFront();
    });

    // ─── Transform gizmos ─────────────────────────────────────────────────────
    const AXIS_DEFS = {
      x: { color: 0xff3b3b, dir: new THREE.Vector3(1, 0, 0) },
      y: { color: 0x37e877, dir: new THREE.Vector3(0, 1, 0) },
      z: { color: 0x3b82f6, dir: new THREE.Vector3(0, 0, 1) },
    };
    const HOVER_BRIGHTEN = 0.55;
    const ARROW_LEN = 2.6;
    const RING_RADIUS = 1.5;
    const HANDLE_DIST = 2.2;
    const ROT_SNAP = Math.PI / 12;
    const GIZMO_SCREEN_HALF = 70;
    const GIZMO_EXTENT = ARROW_LEN + 0.55;
    const GIZMO_GAP = 28 * GIZMO_EXTENT / GIZMO_SCREEN_HALF;

    function updateGizmoTransform() {
      if (!selectedMesh) return;
      gizmoGroup.position.copy(selectedMesh.position);
      const size = selectedMesh.userData.size || { sw: 1, sh: 1, sd: 1 };
      const halves = { x: size.sw / 2, y: size.sh / 2, z: size.sd / 2 };
      const vfov = THREE.MathUtils.degToRad(camera.fov);
      const pxPerUnit = renderer.domElement.clientHeight / (2 * Math.tan(vfov / 2));
      const s = (GIZMO_SCREEN_HALF / (GIZMO_EXTENT * pxPerUnit))
              * camera.position.distanceTo(selectedMesh.position);
      gizmoGroup.scale.setScalar(Math.max(0.3, s));
      const gap = GIZMO_GAP;

      (moveGizmo.userData.arrows || []).forEach((a) => {
        const d = halves[a.axis] / s + gap;
        a.group.position.set(0, 0, 0);
        a.group.position[a.axis] = a.sign * d;
      });
      (scaleGizmo.userData.handles || []).forEach((h) => {
        h.mesh.position.y = h.sign * (halves[h.axis] / s + gap);
      });
    }

    const gizmoGroup = new THREE.Group();
    scene.add(gizmoGroup);
    gizmoGroup.visible = false;

    const moveGizmo = new THREE.Group();
    const rotateGizmo = new THREE.Group();
    const scaleGizmo = new THREE.Group();
    gizmoGroup.add(moveGizmo);
    gizmoGroup.add(rotateGizmo);
    gizmoGroup.add(scaleGizmo);

    function activeGizmo() {
      if (currentTool === 'move') return moveGizmo;
      if (currentTool === 'rotate') return rotateGizmo;
      if (currentTool === 'scale') return scaleGizmo;
      return null;
    }

    function tagHandle(mesh, axis, baseColor) {
      mesh.userData.gizmoAxis = axis;
      mesh.userData.hoverTarget = { material: mesh.material, baseColor };
      return mesh;
    }

    // ── Move gizmo: separate floating arrows, one per side ──
    function buildSingleArrow(axis, sign, color) {
      const group = new THREE.Group();
      const mat = new THREE.MeshBasicMaterial({ color, depthTest: false, depthWrite: false });
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, ARROW_LEN, 10), mat);
      shaft.position.y = ARROW_LEN / 2;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.55, 16), mat);
      cone.position.y = ARROW_LEN + 0.275;
      group.add(shaft);
      group.add(cone);
      group.traverse((o) => {
        if (o.isMesh) {
          o.userData.gizmoAxis = axis;
          o.userData.gizmoSign = sign;
          o.userData.hoverTarget = { material: o.material, baseColor: color };
          o.renderOrder = 999;
        }
      });
      group.userData.gizmoAxis = axis;
      group.userData.gizmoSign = sign;
      if (axis === 'x') group.rotation.z = -sign * Math.PI / 2;
      else if (axis === 'y') group.rotation.x = sign === 1 ? 0 : Math.PI;
      else if (axis === 'z') group.rotation.x = sign * Math.PI / 2;
      return group;
    }
    moveGizmo.userData.arrows = [];
    Object.keys(AXIS_DEFS).forEach((axis) => {
      [1, -1].forEach((sign) => {
        const g = buildSingleArrow(axis, sign, AXIS_DEFS[axis].color);
        moveGizmo.add(g);
        moveGizmo.userData.arrows.push({ axis, sign, group: g });
      });
    });

    // ── Rotate gizmo: axis rings ──
    function buildRing(axis, color) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(RING_RADIUS, 0.07, 14, 72),
        new THREE.MeshBasicMaterial({ color, depthTest: false, depthWrite: false })
      );
      tagHandle(ring, axis, color);
      ring.renderOrder = 999;
      if (axis === 'y') ring.rotation.x = Math.PI / 2;
      else if (axis === 'x') ring.rotation.y = Math.PI / 2;
      return ring;
    }
    Object.keys(AXIS_DEFS).forEach((axis) => {
      rotateGizmo.add(buildRing(axis, AXIS_DEFS[axis].color));
    });

    // ── Scale gizmo: spheres floating outside each face, per side ──
    function buildScaleHandle(axis, color) {
      const group = new THREE.Group();
      const meshes = [];
      const mk = (sign) => {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.3, 16, 16),
          new THREE.MeshBasicMaterial({ color, depthTest: false, depthWrite: false })
        );
        tagHandle(mesh, axis, color).userData.gizmoSign = sign;
        mesh.renderOrder = 999;
        group.add(mesh);
        meshes.push({ axis, sign, mesh });
      };
      mk(1);
      mk(-1);
      if (axis === 'x') group.rotation.z = -Math.PI / 2;
      else if (axis === 'z') group.rotation.x = Math.PI / 2;
      return { group, meshes };
    }
    scaleGizmo.userData.handles = [];
    Object.keys(AXIS_DEFS).forEach((axis) => {
      const { group, meshes } = buildScaleHandle(axis, AXIS_DEFS[axis].color);
      scaleGizmo.add(group);
      scaleGizmo.userData.handles.push(...meshes);
    });

    let hoverMesh = null;
    const _hoverWhite = new THREE.Color(0xffffff);
    function setHover(mesh) {
      if (hoverMesh === mesh) return;
      if (hoverMesh) {
        const t = hoverMesh.userData.hoverTarget;
        t.material.color.setHex(t.baseColor);
      }
      hoverMesh = mesh;
      if (mesh) {
        const t = mesh.userData.hoverTarget;
        t.material.color.copy(new THREE.Color(t.baseColor).lerp(_hoverWhite, HOVER_BRIGHTEN));
      }
      renderer.domElement.style.cursor = mesh ? 'grab' : '';
    }

    let dragState = null;
    let _didDrag = false;

    function moveRay(mouseX, mouseY) {
      pointer.x = (mouseX / window.innerWidth) * 2 - 1;
      pointer.y = -(mouseY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      return raycaster.ray;
    }
    function pointOnPlane(ray, normal, point) {
      const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, point);
      const out = new THREE.Vector3();
      return ray.intersectPlane(plane, out) ? out : null;
    }
    function gizmoHitTest(mouseX, mouseY) {
      const g = activeGizmo();
      if (!gizmoGroup.visible || !g) return null;
      const meshes = [];
      g.traverse((o) => { if (o.isMesh) meshes.push(o); });
      moveRay(mouseX, mouseY);
      const hits = raycaster.intersectObjects(meshes, false);
      return hits.length > 0 ? hits[0] : null;
    }

    // ─── Drag collision (Roblox Studio style: slide flush against blocked parts) ─
    function partHalfSize(p) {
      const s = p.userData.size || { sw: 1, sh: 1, sd: 1 };
      return { x: s.sw / 2, y: s.sh / 2, z: s.sd / 2 };
    }
    function applyMovePlane(startPos, delta) {
      const size = selectedMesh.userData.size || { sw: 1, sh: 1, sd: 1 };
      const hs = { x: size.sw / 2, y: size.sh / 2, z: size.sd / 2 };
      const others = parts.filter((p) => p !== selectedMesh);
      const pos = startPos.clone();
      const axes = ['x', 'y', 'z'];
      for (const a of axes) {
        pos[a] += delta[a];
        for (const o of others) {
          const oh = partHalfSize(o);
          if (Math.abs(pos.x - o.position.x) < hs.x + oh.x &&
              Math.abs(pos.y - o.position.y) < hs.y + oh.y &&
              Math.abs(pos.z - o.position.z) < hs.z + oh.z) {
            const gap = hs[a] + oh[a];
            if (delta[a] > 1e-9) pos[a] = o.position[a] - gap;
            else if (delta[a] < -1e-9) pos[a] = o.position[a] + gap;
            else pos[a] = pos[a] >= o.position[a] ? o.position[a] + gap : o.position[a] - gap;
          }
        }
      }
      selectedMesh.position.set(
        Math.round(pos.x),
        Math.round(pos.y),
        Math.round(pos.z)
      );
      updateSelectionOutline();
      if (_refreshProps) _refreshProps();
    }
    function applyMoveAxis(startPos, amount) {
      const np = startPos.clone().add(dragState.axis.clone().multiplyScalar(amount));
      selectedMesh.position.set(
        Math.round(np.x),
        Math.round(np.y),
        Math.round(np.z)
      );
      updateSelectionOutline();
      if (_refreshProps) _refreshProps();
    }
    function applyScale(size, axis, side) {
      const sw = Math.max(Math.round(size.sw), 0.1);
      const sh = Math.max(Math.round(size.sh), 0.1);
      const sd = Math.max(Math.round(size.sd), 0.1);
      selectedMesh.userData.size = { sw, sh, sd };
      selectedMesh.geometry.dispose();
      selectedMesh.geometry = new THREE.BoxGeometry(sw, sh, sd);
      selectedMesh.material = makeMats(sw, sh, sd, selectedMesh.userData.originalColor ?? 0xcccccc, selectedMesh.userData.opacity ?? 1);
      if (axis && side) {
        const a = axis.x ? 'x' : axis.y ? 'y' : 'z';
        const old = dragState.startSize;
        const h0 = (a === 'x' ? old.sw : a === 'y' ? old.sh : old.sd) / 2;
        const f = (a === 'x' ? sw : a === 'y' ? sh : sd) / (a === 'x' ? old.sw : a === 'y' ? old.sh : old.sd);
        selectedMesh.position[a] = dragState.startPos[a] + side * h0 * (f - 1);
      }
      updateSelectionOutline(true);
      if (_refreshProps) _refreshProps();
    }

    function startMoveDrag(mode, axis, mouseX, mouseY) {
      const startPos = selectedMesh.position.clone();
      const planeNormal = new THREE.Vector3().subVectors(camera.position, startPos).normalize();
      const startPoint = pointOnPlane(moveRay(mouseX, mouseY), planeNormal, startPos) || startPos.clone();
      dragState = { tool: 'move', mode, axis, startPos, startPoint, planeNormal };
    }
    function startRotateDrag(axisDir, mouseX, mouseY) {
      const startPos = selectedMesh.position.clone();
      const ref = Math.abs(axisDir.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const u = new THREE.Vector3().crossVectors(axisDir, ref).normalize();
      const v = new THREE.Vector3().crossVectors(axisDir, u).normalize();
      const pt = pointOnPlane(moveRay(mouseX, mouseY), axisDir, startPos);
      let startAngle = 0;
      if (pt) {
        const rel = pt.sub(startPos);
        startAngle = Math.atan2(rel.dot(v), rel.dot(u));
      }
      dragState = { tool: 'rotate', axis: axisDir, u, v, startPos, startAngle, applied: 0 };
    }
    function startScaleDrag(uniform, axisDir, side, mouseX, mouseY) {
      const startPos = selectedMesh.position.clone();
      const planeNormal = new THREE.Vector3().subVectors(camera.position, startPos).normalize();
      const startPoint = pointOnPlane(moveRay(mouseX, mouseY), planeNormal, startPos) || startPos.clone();
      const startSize = { ...(selectedMesh.userData.size || { sw: 1, sh: 1, sd: 1 }) };
      dragState = { tool: 'scale', uniform, axis: axisDir, side, startPos, startPoint, planeNormal, startSize };
    }

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (e.target.closest('.toolbar') || e.target.closest('#sidebar')) return;
      if (!selectedMesh) return;
      if (currentTool !== 'move' && currentTool !== 'rotate' && currentTool !== 'scale') return;
      _didDrag = false;

      const gizmoHit = gizmoHitTest(e.clientX, e.clientY);
      if (gizmoHit) {
        const axis = gizmoHit.object.userData.gizmoAxis;
        if (currentTool === 'move') {
          startMoveDrag(axis === 'center' ? 'plane' : 'axis', axis === 'center' ? null : AXIS_DEFS[axis].dir, e.clientX, e.clientY);
        } else if (currentTool === 'rotate') {
          startRotateDrag(AXIS_DEFS[axis].dir, e.clientX, e.clientY);
        } else {
          startScaleDrag(axis === 'center', axis === 'center' ? null : AXIS_DEFS[axis].dir, gizmoHit.object.userData.gizmoSign || 1, e.clientX, e.clientY);
        }
        e.preventDefault();
        return;
      }

      if (currentTool === 'move') {
        const hit = hitTest(e.clientX, e.clientY);
        if (hit && hit.object === selectedMesh) {
          startMoveDrag('plane', null, e.clientX, e.clientY);
          e.preventDefault();
        }
      }
    });
    document.addEventListener('mouseup', (e) => {
      if (e.button === 0) dragState = null;
      if (e.button === 2) mouseLook = false;
    });
    document.addEventListener('mousemove', (e) => {
      if (dragState && !mouseLook) {
        _didDrag = true;
        if (dragState.tool === 'move') {
          const pt = pointOnPlane(moveRay(e.clientX, e.clientY), dragState.planeNormal, dragState.startPos);
          if (pt) {
            if (dragState.mode === 'axis') {
              const amount = pt.sub(dragState.startPoint).dot(dragState.axis);
              applyMoveAxis(dragState.startPos, amount);
            } else {
              applyMovePlane(dragState.startPos, pt.sub(dragState.startPoint));
            }
          }
        } else if (dragState.tool === 'rotate') {
          const pt = pointOnPlane(moveRay(e.clientX, e.clientY), dragState.axis, dragState.startPos);
          if (pt) {
            const rel = pt.sub(dragState.startPos);
            const angle = Math.atan2(rel.dot(dragState.v), rel.dot(dragState.u));
            const snapped = Math.round((angle - dragState.startAngle) / ROT_SNAP) * ROT_SNAP;
            const delta = snapped - dragState.applied;
            dragState.applied = snapped;
            if (delta !== 0) {
              selectedMesh.rotateOnWorldAxis(dragState.axis, delta);
              updateSelectionOutline();
              if (_refreshProps) _refreshProps();
            }
          }
        } else {
          const pt = pointOnPlane(moveRay(e.clientX, e.clientY), dragState.planeNormal, dragState.startPos);
          if (pt) {
            if (dragState.uniform) {
              const d0 = dragState.startPoint.clone().sub(dragState.startPos).length() || HANDLE_DIST;
              const d1 = pt.clone().sub(dragState.startPos).length();
              const f = Math.max(0.1, d1 / d0);
              applyScale({
                sw: dragState.startSize.sw * f,
                sh: dragState.startSize.sh * f,
                sd: dragState.startSize.sd * f,
              });
            } else {
              const proj0 = dragState.startPoint.clone().sub(dragState.startPos).dot(dragState.axis) || HANDLE_DIST;
              const proj = pt.clone().sub(dragState.startPos).dot(dragState.axis);
              const f = Math.max(0.1, proj / proj0);
              const dim = dragState.axis.x ? 'sw' : dragState.axis.y ? 'sh' : 'sd';
              const ns = { sw: dragState.startSize.sw, sh: dragState.startSize.sh, sd: dragState.startSize.sd };
              ns[dim] = dragState.startSize[dim] * f;
              applyScale(ns, dragState.axis, dragState.side);
            }
          }
        }
        return;
      }
      if (!mouseLook && (currentTool === 'move' || currentTool === 'rotate' || currentTool === 'scale')) {
        const hit = gizmoHitTest(e.clientX, e.clientY);
        setHover(hit ? hit.object : null);
      }
      if (!mouseLook) return;
      const dx = e.clientX - lastMX;
      const dy = e.clientY - lastMY;
      lastMX = e.clientX;
      lastMY = e.clientY;
      camState.yaw -= dx * MOUSE_SENS;
      camState.pitch += dy * MOUSE_SENS;
      camState.pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, camState.pitch));
    });

    // ─── Resize ──────────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─── Init ────────────────────────────────────────────────────────────────
    loadTextures().then(() => {
      applyBaseplateMats();
    });

    // Populate explorer with baseplate and lights
    addExplorerItem(workspaceSection, baseplate, 'Baseplate', 'icon-baseplate', false);
    addExplorerItem(lightingSection, ambient, 'Ambient', 'icon-light', false);
    addExplorerItem(lightingSection, sun, 'Sun', 'icon-light', false);

    // ─── Loop ────────────────────────────────────────────────────────────────
    let prevTime = performance.now();

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - prevTime) / 1000, 0.05);
      prevTime = now;

      updateCamera(dt);
      if (gizmoGroup.visible && selectedMesh) updateGizmoTransform();
      renderer.render(scene, camera);
    }
    loop();

    // ─── Dev ─────────────────────────────────────────────────────────────────
    window.studioScene = scene;
    window.studioCamera = camera;
  </script>
</body>

</html>
