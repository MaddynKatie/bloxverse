<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">

    <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Transactions</title>
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .tx-page {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      padding-top: 72px;
    }
    .tx-page h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .tx-balance-card {
      background: #2b2d31;
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .tx-balance-card .bux-icon {
      width: 40px;
      height: 40px;
      background: #5865f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .tx-balance-card .balance-label {
      font-size: 13px;
      color: #949ba4;
    }
    .tx-balance-card .balance-amount {
      font-size: 26px;
      font-weight: 700;
    }
    .tx-table-wrap {
      background: #2b2d31;
      border-radius: 10px;
      overflow: hidden;
    }
    .tx-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .tx-table th {
      text-align: left;
      padding: 12px 16px;
      background: #1e1f22;
      color: #949ba4;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tx-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #1e1f22;
    }
    .tx-table tr:last-child td {
      border-bottom: none;
    }
    .tx-table .tx-amount {
      font-weight: 700;
      white-space: nowrap;
    }
    .tx-table .tx-amount.positive { color: #4ade80; }
    .tx-table .tx-amount.negative { color: #f87171; }
    .tx-table .tx-source {
      color: #5865f2;
    }
    .tx-table .tx-time {
      color: #949ba4;
      font-size: 12px;
      white-space: nowrap;
    }
    .tx-table .tx-desc {
      color: #dbdee1;
    }
    .tx-empty {
      text-align: center;
      padding: 48px 24px;
      color: #949ba4;
    }
    .tx-empty h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: #dbdee1;
    }
    .tx-loading {
      text-align: center;
      padding: 48px;
      color: #949ba4;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        <div class="logo-icon"></div>
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/create'">Create</button>
      </div>
    </div>
    <div class="nav-center" id="navCenter"></div>
    <div class="nav-right" id="navRight">
      <button class="login-btn" onclick="window.location.href='/bloxverse/auth'">Login / Sign Up</button>
    </div>
  </nav>

  <div class="tx-page">
    <h1>My Transactions</h1>
    <div class="tx-balance-card" id="balanceCard">
      <div class="bux-icon">B</div>
      <div>
        <div class="balance-label">Current Balance</div>
        <div class="balance-amount" id="balanceAmount">0</div>
      </div>
    </div>
    <div class="tx-table-wrap">
      <table class="tx-table">
        <thead>
          <tr>
            <th>Date &amp; Time</th>
            <th>Source</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Balance</th>
          </tr>
        </thead>
        <tbody id="txBody">
        </tbody>
      </table>
      <div class="tx-loading" id="txLoading">Loading transactions...</div>
    </div>
  </div>

  <script type="module">
    import { auth, db, getTransactions, listenBux, banGuard } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc } from 'firebase/firestore';

    const navRight = document.getElementById('navRight');
    const tbody = document.getElementById('txBody');
    const loading = document.getElementById('txLoading');
    const balanceEl = document.getElementById('balanceAmount');

    let buxUnsub = null;

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    onAuthStateChanged(auth, async (user) => {
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }

      if (user) {
        if (await banGuard(user.uid)) return;

        let username = user.displayName || 'Player';
        let bux = 0;
        let userNum = null;
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            username = data.username || username;
            bux = data.bux || 0;
            userNum = data.userIdNum;
          }
        } catch {}

        const initial = username.charAt(0).toUpperCase();
        const ownProfileLink = userNum ? `/bloxverse/profile?user=${userNum}` : '/bloxverse/profile';
        navRight.innerHTML = `
          <div class="user-info">
            <div class="bux-wrapper" id="buxWrapper">
              <button class="bux-btn" id="buxBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
                </svg>
                <span id="txBuxVal">${bux.toLocaleString()}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
              </button>
              <div class="bux-dropdown">
                <div class="bux-dropdown-header">
                  <span class="bux-dropdown-label">Balance</span>
                  <span class="bux-dropdown-balance" id="buxDropdownBalance">${bux.toLocaleString()}</span>
                </div>
                <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                  Transactions
                </button>
              </div>
            </div>
            <div class="avatar-dropdown" id="userDropdown">
              <div class="avatar-circle">${initial}</div>
              <div class="dropdown-menu">
                <div class="dropdown-header">
                  <span class="dropdown-name">${username}</span>
                  <span class="dropdown-email">${user.email}</span>
                </div>
                <button class="dropdown-item" onclick="window.location.href='${ownProfileLink}'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                  Profile
                </button>
                <button class="dropdown-item" onclick="window.location.href='/bloxverse/avatar'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                  Avatar
                </button>
                <button class="dropdown-item" onclick="window._logout()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                  Log Out
                </button>
              </div>
            </div>
          </div>
        `;

        // Bux dropdown toggle
        document.getElementById('buxBtn').addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('buxWrapper').classList.toggle('open');
        });

        // Avatar dropdown toggle
        document.querySelector('#userDropdown .avatar-circle').addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('userDropdown').classList.toggle('open');
        });

        // Close dropdowns on outside click
        document.addEventListener('click', (e) => {
          const ud = document.getElementById('userDropdown');
          if (ud && !ud.contains(e.target)) ud.classList.remove('open');
          const bw = document.getElementById('buxWrapper');
          if (bw && !bw.contains(e.target)) bw.classList.remove('open');
        });

        // Listen for real-time bux updates
        buxUnsub = listenBux(user.uid, (buxAmount) => {
          const el = document.getElementById('txBuxVal');
          if (el) el.textContent = buxAmount.toLocaleString();
          const balEl = document.getElementById('buxDropdownBalance');
          if (balEl) balEl.textContent = buxAmount.toLocaleString();
          balanceEl.textContent = buxAmount.toLocaleString();
        }, username, user.email);

        // Load transactions
        const txns = await getTransactions(user.uid);
        loading.style.display = 'none';

        if (txns.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5">
                <div class="tx-empty">
                  <h3>No transactions yet</h3>
                  <p>Earn bux by logging in daily or having players visit your places!</p>
                </div>
              </td>
            </tr>
          `;
        } else {
          tbody.innerHTML = txns.map(tx => {
            const amountClass = tx.amount >= 0 ? 'positive' : 'negative';
            const amountSign = tx.amount >= 0 ? '+' : '';
            return `
              <tr>
                <td class="tx-time">${formatDate(tx.createdAt)}</td>
                <td class="tx-source">${escHtml(tx.source || '—')}</td>
                <td class="tx-desc">${escHtml(tx.description || '')}</td>
                <td class="tx-amount ${amountClass}">${amountSign}${tx.amount}</td>
                <td>${(tx.balance ?? '—').toLocaleString()}</td>
              </tr>
            `;
          }).join('');
        }
      }
    });

    window._logout = async () => {
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }
      await signOut(auth);
      window.location.href = '/bloxverse/';
    };

    function escHtml(s) {
      if (!s) return '';
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>

</html>
