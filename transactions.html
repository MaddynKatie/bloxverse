<!DOCTYPE html>
<html lang="en">

<head>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.184.0",
      "three/": "https://esm.sh/three@0.184.0/",
      "firebase/app": "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0",
      "glin-profanity": "https://esm.sh/glin-profanity@3.3.0"
    }
  }
  </script>
  <base href="/bloxverse/">
  <link rel="preconnect" href="https://esm.sh" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

    <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="assets/icons/bloxverseLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BloxVerse - Transactions</title>
  <link rel="stylesheet" href="src/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    .tx-page {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      padding-top: 72px;
    }
    .tx-page h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .tx-balance-card {
      background: var(--bg-secondary);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .tx-balance-card .bux-icon {
      width: 40px;
      height: 40px;
      background: #5865f2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      flex-shrink: 0;
    }
    .tx-balance-card .balance-label {
      font-size: 13px;
      color: var(--text-muted);
    }
    .tx-balance-card .balance-amount {
      font-size: 26px;
      font-weight: 700;
    }
    .tx-table-wrap {
      background: var(--bg-secondary);
      border-radius: 10px;
      overflow-x: auto;
    }
    .tx-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .tx-table th {
      text-align: left;
      padding: 12px 16px;
      background: var(--bg-surface);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tx-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .tx-table tr:last-child td {
      border-bottom: none;
    }
    .tx-table .tx-amount {
      font-weight: 700;
      white-space: nowrap;
    }
    .tx-table .tx-amount.positive { color: #4ade80; }
    .tx-table .tx-amount.negative { color: #f87171; }
    .tx-table .tx-source {
      color: #5865f2;
    }
    .tx-table .tx-time {
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .tx-table .tx-desc {
      color: var(--text-primary);
    }
    .tx-empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }
    .tx-empty h3 {
      font-size: 18px;
      margin-bottom: 8px;
      color: var(--text-primary);
    }
    .tx-loading {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .tx-page { padding: 12px; padding-top: 60px; }
      .tx-page h1 { font-size: 20px; }
      .tx-balance-card { padding: 14px 16px; }
      .tx-balance-card .balance-amount { font-size: 22px; }
      .tx-table th, .tx-table td { padding: 8px 10px; font-size: 12px; }
      .tx-table .tx-time { font-size: 10px; }
    }
    @media (max-width: 480px) {
      .tx-table th, .tx-table td { padding: 6px 8px; font-size: 11px; }
      .tx-table .tx-desc { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    }

    .settings-wrapper {
      position: relative;
    }
    .settings-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      min-width: 140px;
      z-index: 100;
      overflow: hidden;
      margin-top: 4px;
    }
    .settings-dropdown.open { display: block; }
    .settings-dropdown button {
      display: block;
      width: 100%;
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .settings-dropdown button:hover { background: var(--bg-tertiary); color: var(--text-primary); }
  </style>

  <link rel="stylesheet" href="src/theme.css" />
  <script type="module" src="src/theme.js"></script>
  <script src="js/sw-register.js" defer></script>
</head>

<body>
  <nav class="navbar">
    <div class="nav-left">
      <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="logo" onclick="window.location.href='/bloxverse/'">
        
        <span class="logo-text">BloxVerse</span>
      </div>
      <div class="nav-links" id="navLinks">
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/marketplace'">Marketplace</button>
        <button class="nav-link-btn" data-needs-auth onclick="window.location.href='/bloxverse/avatar'">Avatar</button>
        <button class="nav-link-btn" onclick="window.location.href='/bloxverse/download'" style="display:flex;align-items:center;gap:5px;">
          <i class="fa-solid fa-download" style="font-size:12px;"></i> Download
        </button>
        <button class="nav-link-btn" data-open-studio>Studio</button>
        <script type="module" src="src/studio.js"></script>
      </div>
    </div>
    <div class="nav-center" id="navCenter"></div>
    <div class="nav-right" id="navRight">
      <button class="login-btn" onclick="window.location.href='/bloxverse/auth'">Login / Sign Up</button>
    </div>
  </nav>

  <div class="tx-page">
    <h1>My Transactions</h1>
    <div class="tx-balance-card" id="balanceCard">
      <div class="bux-icon">B</div>
      <div>
        <div class="balance-label">Current Balance</div>
        <div class="balance-amount" id="balanceAmount">0</div>
      </div>
    </div>
    <div class="tx-table-wrap">
      <table class="tx-table">
        <thead>
          <tr>
            <th>Date &amp; Time</th>
            <th>Source</th>
            <th>Description</th>
            <th>Amount</th>
            <th>Balance</th>
          </tr>
        </thead>
        <tbody id="txBody">
        </tbody>
      </table>
      <div class="tx-loading" id="txLoading">Loading transactions...</div>
    </div>
  </div>

  <script type="module">
    import { auth, db, getTransactions, listenBux, banGuard, logTransaction, assignUserIdNum, trackPresence } from './src/firebase.js';
    import { onAuthStateChanged, signOut } from 'firebase/auth';
    import { doc, getDoc, updateDoc, increment, collection, getDocs, query, where, limit } from 'firebase/firestore';

    const navRight = document.getElementById('navRight');
    const tbody = document.getElementById('txBody');
    const loading = document.getElementById('txLoading');
    const balanceEl = document.getElementById('balanceAmount');

    let buxUnsub = null;

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    onAuthStateChanged(auth, async (user) => {
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }
      document.querySelectorAll('[data-needs-auth]').forEach(el => { el.style.display = user ? '' : 'none'; });

      if (user) {
        if (await banGuard(user.uid)) return;

        assignUserIdNum(user.uid).catch(() => {});
        trackPresence(user.uid, null, 'transactions');

        let username = 'Player';
        let bux = 0;
        let userNum = null;
        let ownPreview = null;
        try {
          const userDoc = await getDoc(doc(db, 'users', user.uid));
          if (userDoc.exists()) {
            const data = userDoc.data();
            username = data.username || username;
            bux = data.bux || 0;
            userNum = data.userIdNum;
            ownPreview = data.avatarPreviewHead || data.avatarPreview || null;
          }
        } catch {}

        const initial = username.charAt(0).toUpperCase();
        const _cb = Date.now();
        const ownProfileLink = userNum ? `/bloxverse/profile?user=${userNum}` : '/bloxverse/profile';
        navRight.innerHTML = `
          <div class="user-info">
            <div class="bux-wrapper" id="buxWrapper">
              <button class="bux-btn" id="buxBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="bold">B</text>
                </svg>
                <span id="txBuxVal">${bux.toLocaleString()}</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:4px;"><path d="M7 10l5 5 5-5z"/></svg>
              </button>
              <div class="bux-dropdown">
                <div class="bux-dropdown-header">
                  <span class="bux-dropdown-label">Balance</span>
                  <span class="bux-dropdown-balance" id="buxDropdownBalance">${bux.toLocaleString()}</span>
                </div>
                <button class="bux-dropdown-item" onclick="window.openSendBuxModal()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-2 8-10V5l-8-3-8 3v7c0 8 8 10 8 10z"/></svg>
                  Send Bux
                </button>
                <button class="bux-dropdown-item" onclick="window.location.href='/bloxverse/transactions'">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                  Transactions
                </button>
              </div>
            </div>
          <div class="settings-wrapper">
            <button class="settings-nav-btn" id="navSettingsBtn" title="Settings">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>
            <div class="settings-dropdown" id="navSettingsDropdown">
              <button onclick="window.location.href='/bloxverse/settings'">Settings</button>
              <button onclick="window._logout()">Log Out</button>
            </div>
          </div>
          ${ownPreview
            ? `<img src="${ownPreview}?_cb=${_cb}" alt="" class="avatar-circle-img" onclick="window.location.href='${ownProfileLink}'" data-initial="${initial}" onerror="window.__handleBrokenAvatar(this, '${user.uid}')"/>`
            : `<div class="avatar-circle" onclick="window.location.href='${ownProfileLink}'">${initial}</div>`}
          </div>
        `;

        // Bux dropdown toggle
        document.getElementById('buxBtn').addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('buxWrapper').classList.toggle('open');
        });

        // Settings dropdown toggle
        const closeSettings = () => {
          document.querySelectorAll('.settings-dropdown').forEach(d => d.classList.remove('open'));
        };
        const navSettingsBtn = document.getElementById('navSettingsBtn');
        if (navSettingsBtn) {
          navSettingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeSettings();
            const dd = document.getElementById('navSettingsDropdown');
            if (dd) dd.classList.toggle('open');
          });
        }

        document.addEventListener('click', (e) => {
          if (!e.target.closest('.settings-wrapper')) {
            closeSettings();
          }
          const bw = document.getElementById('buxWrapper');
          if (bw && !bw.contains(e.target)) bw.classList.remove('open');
        });

        // Listen for real-time bux updates
        buxUnsub = listenBux(user.uid, (buxAmount) => {
          const el = document.getElementById('txBuxVal');
          if (el) el.textContent = buxAmount.toLocaleString();
          const balEl = document.getElementById('buxDropdownBalance');
          if (balEl) balEl.textContent = buxAmount.toLocaleString();
          balanceEl.textContent = buxAmount.toLocaleString();
        }, username, user.email);

        // Load transactions
        const txns = await getTransactions(user.uid);
        loading.style.display = 'none';

        if (txns.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5">
                <div class="tx-empty">
                  <h3>No transactions yet</h3>
                  <p>Earn bux by logging in daily or having players visit your places!</p>
                </div>
              </td>
            </tr>
          `;
        } else {
          tbody.innerHTML = txns.map(tx => {
            const amountClass = tx.amount >= 0 ? 'positive' : 'negative';
            const amountSign = tx.amount >= 0 ? '+' : '';
            return `
              <tr>
                <td class="tx-time">${formatDate(tx.createdAt)}</td>
                <td class="tx-source">${escHtml(tx.source || '—')}</td>
                <td class="tx-desc">${escHtml(tx.description || '')}</td>
                <td class="tx-amount ${amountClass}">${amountSign}${tx.amount}</td>
                <td>${(tx.balance ?? '—').toLocaleString()}</td>
              </tr>
            `;
          }).join('');
        }
      }
    });

    window._logout = async () => {
      if (buxUnsub) { buxUnsub(); buxUnsub = null; }
      await signOut(auth);
      window.location.href = '/bloxverse/';
    };

    function escHtml(s) {
      if (!s) return '';
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Send Bux ─────────────────────────────────────────────────────────
    window.openSendBuxModal = () => {
      if (!auth.currentUser) return;
      const bux = Number(String(document.getElementById('buxDropdownBalance')?.textContent || '0').replace(/,/g, '')) || 0;
      let selectedUserId = null;

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-content" style="max-width:500px;">
          <div class="modal-header">
            <h2>Send Bux</h2>
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
          </div>
          <div class="modal-body">
            <div class="modal-field">
              <label>Recipient</label>
              <input type="text" id="sendBuxSearch" placeholder="Search username..." autocomplete="off" />
              <div id="sendBuxResults" class="search-list" style="display:none;"></div>
            </div>

            <div id="sendBuxSelected" style="display:none;">
              <div class="modal-field">
                <label>Selected User</label>
                <div class="selected-badge">
                  <img id="sendBuxAvatar" src="" class="selected-avatar" />
                  <span id="sendBuxName"></span>
                </div>
              </div>
            </div>

            <div class="modal-field">
              <label>Amount</label>
              <div class="amount-row">
                <input type="number" id="sendBuxAmount" placeholder="Enter amount…" min="1" max="${bux}" />
                <span class="bux-label">BUX</span>
              </div>
            </div>

            <div class="warning-box" style="margin:0;">
              <strong>Warning:</strong> Bux transfers are final and cannot be undone.
            </div>
            <div id="sendBuxErr" class="error-msg" style="display:none;"></div>
          </div>
          <div class="modal-footer">
            <button class="modal-btn cancel" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
            <button class="modal-btn confirm" id="sendBuxSendBtn" disabled>Send</button>
          </div>
        </div>`;

      overlay.querySelector('#sendBuxSendBtn').addEventListener('click', () => {
        const amount = parseInt(overlay.querySelector('#sendBuxAmount').value, 10);
        const username = overlay.querySelector('#sendBuxName').textContent;
        if (!selectedUserId || !amount || amount < 1) return;

        const confirmOverlay = document.createElement('div');
        confirmOverlay.className = 'modal-overlay';
        confirmOverlay.style.cssText = 'z-index:10000;background:rgba(0,0,0,0.8);';
        confirmOverlay.innerHTML = `
          <div class="modal-content" style="max-width:400px;">
            <div class="modal-header">
              <h3 style="font-size:16px;margin:0;">Confirm Transfer</h3>
            </div>
            <div class="modal-body">
              <p style="color:var(--text-secondary);font-size:14px;line-height:1.5;margin:0 0 16px;">
                Are you sure you want to send <strong style="color:#4caf50;">${amount.toLocaleString()} BUX</strong>
                to <strong style="color:var(--text-primary);">${username}</strong>?
              </p>
              <div class="warning-box" style="margin:0;">
                This transfer is <strong>final</strong>. You will not be able to recover these BUX.
              </div>
            </div>
            <div class="modal-footer">
              <button class="modal-btn cancel" id="confirmCancelBtn">Cancel</button>
              <button class="modal-btn confirm" id="confirmYesBtn" style="background:rgba(244,67,54,0.8);">Yes, Send</button>
            </div>
          </div>`;
        document.body.appendChild(confirmOverlay);

        confirmOverlay.querySelector('#confirmCancelBtn').addEventListener('click', () => confirmOverlay.remove());
        confirmOverlay.querySelector('#confirmYesBtn').addEventListener('click', async () => {
          try {
            await updateDoc(doc(db, 'users', auth.currentUser.uid), { bux: increment(-amount) });
            await updateDoc(doc(db, 'users', selectedUserId), { bux: increment(amount) });

            const _sSnap = await getDoc(doc(db, 'users', auth.currentUser.uid));
            const _sData = _sSnap.data();
            const _rSnap = await getDoc(doc(db, 'users', selectedUserId));
            const _rData = _rSnap.data();
            await logTransaction(auth.currentUser.uid, -amount, _sData?.bux || 0, 'SendBux', `Sent ${amount.toLocaleString()} BUX to ${username}`);
            await logTransaction(selectedUserId, amount, _rData?.bux || 0, 'SendBux', `Received ${amount.toLocaleString()} BUX from ${_sData?.username || 'Someone'}`);

            confirmOverlay.remove();
            overlay.remove();
          } catch (err) {
            console.error(err);
            overlay.querySelector('#sendBuxErr').textContent = 'Transfer failed. Try again.';
            overlay.querySelector('#sendBuxErr').style.display = 'block';
            confirmOverlay.remove();
          }
        });
      });

      document.body.appendChild(overlay);

      const searchInput = overlay.querySelector('#sendBuxSearch');
      const resultsEl = overlay.querySelector('#sendBuxResults');
      const selectedEl = overlay.querySelector('#sendBuxSelected');
      const nameEl = overlay.querySelector('#sendBuxName');
      const avatarEl = overlay.querySelector('#sendBuxAvatar');
      const sendBtn = overlay.querySelector('#sendBuxSendBtn');

      let searchTimer;
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        const term = searchInput.value.trim().toLowerCase();
        if (!term) { resultsEl.style.display = 'none'; return; }
        searchTimer = setTimeout(async () => {
          try {
            const snap = await getDocs(query(collection(db, 'users'), where('username', '>=', term), where('username', '<', term + '\uf8ff'), limit(20)));
            const matches = snap.docs.filter(d => d.data().username?.toLowerCase().includes(term));
            if (matches.length === 0) {
              resultsEl.innerHTML = '<div class="empty-state">No users found</div>';
            } else {
              resultsEl.innerHTML = matches.map(f => `
                <div class="search-item" data-uid="${f.id}" data-name="${f.data().username}" data-avatar="${f.data().avatarPreviewHead || f.data().avatarPreview || ''}">
                  ${f.data().avatarPreviewHead || f.data().avatarPreview ? `<img src="${f.data().avatarPreviewHead || f.data().avatarPreview}" alt="" />` : `<div class="init-circle">${f.data().username.charAt(0).toUpperCase()}</div>`}
                  <span>${f.data().username}</span>
                </div>`).join('');
              resultsEl.querySelectorAll('.search-item').forEach(el => {
                el.addEventListener('click', () => {
                  selectedUserId = el.dataset.uid;
                  nameEl.textContent = el.dataset.name;
                  avatarEl.src = el.dataset.avatar || '';
                  selectedEl.style.display = 'block';
                  resultsEl.style.display = 'none';
                  searchInput.value = '';
                  sendBtn.disabled = false;
                  overlay.querySelector('#sendBuxErr').style.display = 'none';
                  overlay.querySelector('#sendBuxAmount').focus();
                });
              });
            }
            resultsEl.style.display = 'block';
          } catch (err) {
            console.error(err);
            resultsEl.innerHTML = '<div class="empty-state">Search error</div>';
          }
        }, 200);
      });

      document.addEventListener('click', (e) => {
        if (overlay.contains(e.target)) return;
        if (resultsEl.style.display === 'block') resultsEl.style.display = 'none';
      }, { once: true });
    };

    // Hamburger menu toggle
    const _hamburger = document.getElementById('navHamburger');
    const _navLinks = document.getElementById('navLinks');
    if (_hamburger && _navLinks) {
      _hamburger.addEventListener('click', () => {
        _navLinks.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.navbar')) _navLinks.classList.remove('open');
      });
    }

    window.__handleBrokenAvatar = async function(imgEl, uid) {
      try {
        const initial = imgEl.getAttribute('data-initial') || 'U';
        const letter = document.createElement('div');
        letter.className = 'friend-thumb-avatar';
        letter.textContent = initial;
        imgEl.replaceWith(letter);
        try {
          if (auth && auth.currentUser && auth.currentUser.uid === uid) {
            const { setDoc, doc } = await import('https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js');
            await setDoc(doc(db, 'users', uid), { avatarPreview: null, avatarPreviewHead: null }, { merge: true });
          }
        } catch (e) { console.warn('Could not clear avatarPreview:', e); }
